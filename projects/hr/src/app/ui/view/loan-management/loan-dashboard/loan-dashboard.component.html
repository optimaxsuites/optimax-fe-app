<!-- loan-dashboard.component.html -->
<div class="loan-dashboard-container">
    <!-- Loading state -->
    <div *ngIf="isLoading" class="loading-container">
        <p>Loading dashboard...</p>
    </div>

    <div *ngIf="!isLoading">
        <header class="dashboard-header">
            <h1>Loan Dashboard</h1>
            <div class="search-box">
                <input type="text"
                placeholder="Search loans..."
                (keyup)="searchLoans($event)"
                [(ngModel)]="searchTerm">
            </div>
        </header>

        <!-- Quick Actions -->
        <section class="quick-actions">
            <h2>Quick Actions</h2>
            <div class="action-buttons">
                <button class="btn-primary" (click)="applyForLoan()">
                    Apply for Loan
                </button>
                <button class="btn-primary" (click)="approveLoan()">
                    See Loan Requests
                </button>
                <button class="btn-primary" (click)="navigateTo('reports')">
                    Generate Reports
                </button>
            </div>
        </section>

        <!-- Stats Cards -->
        <section class="stats-section">
            <div class="stat-card">
                <h3>Active Loans</h3> 
                <p class="stat-value">{{ dashboardStats.activeLoans }}</p>
            </div>
            <div class="stat-card">
                <h3>Pending Applications</h3>  
                <p class="stat-value">{{ dashboardStats.pendingApplications }}</p>
            </div>
            <div class="stat-card">
                <h3>Total Balance</h3>  
                <p class="stat-value"><span>₦</span>{{ dashboardStats.totalBalance | number:'1.2-2' }}</p>
            </div>
        </section>

        <div class="dashboard-content">
            <!-- Recent Loans Table -->
            <section class="card recent-loans">
                <h2>Recent Loan Applications</h2>

                <div *ngIf="recentLoans.length === 0" class="empty-state">
                    <p>No loan applications found.</p>
                    <button class="btn-primary" (click)="applyForLoan()">Apply for your first loan</button>
                </div>

                <app-table
                    *ngIf="recentLoans.length > 0"
                    [columns]="recentLoanColumns"
                    [rows]="recentLoans"
                    [actions]="recentLoanActions"
                    (actionClick)="handleRecentLoanAction($event)"
                ></app-table>
            </section>

            <!-- Status Tracking (Right Sidebar) -->
            <section class="card status-sidebar" *ngIf="selectedLoan">
                <app-status-tracking 
                    [loan]="selectedLoan"
                    [statusHistory]="selectedLoan.statusHistory"
                    [canChangeStatus]="true">
                </app-status-tracking>
            </section>
        </div>
    </div>
</div>
