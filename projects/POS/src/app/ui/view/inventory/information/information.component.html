<button (click)="goBack()" class="p-5 text-2xl">
    <i class="fa-solid fa-arrow-left"></i>
  </button>


  
  
<div class="flex  justify-center  w-full ">
    
   <div class="  w-full  max-w-7xl p-6 pl-10 bg-white border border-gray-200 rounded-lg shadow-lg dark:bg-gray-800 dark:border-gray-700 dark:hover:bg-gray-700 mb-10 ml-4 mt-10" *ngIf="productHistory && productHistory.length">
   <h1 class="text-2xl mb-7 mt-3 font-semibold text-center">Product Information</h1>
   <div class="field ">
    <label class="text-lg font-semibold" for="name">Product Name</label>
    <input class="border border-gray-300 rounded-lg p-3 w-full bg-gray-100 text-gray-800  mb-4 "  id="name" [value]="activeItem.name" readonly />
   </div>

   <div  class="field ">
    <label class="text-lg font-semibold" for="sku">SKU</label>
    <input class="border border-gray-300 rounded-lg p-3 w-full bg-gray-100 text-gray-800 mb-4"   id="sku" [value]="activeItem.sku" readonly />
  </div>


    <div class="field ">
      <label for="code" class="block font-semibold text-lg">Product Code</label>
      <input class="border border-gray-300 rounded-lg p-3 w-full bg-gray-100 text-gray-800 mb-4 "   id="code" [value]="activeItem.code" readonly />
    </div>
      
  <div class="field ">
    <label for="category" class="block font-semibold text-lg ">Category</label>
    <input class="border border-gray-300 rounded-lg p-3 w-full bg-gray-100 text-gray-800  "  [value]="activeItem.productCategory.name" readonly />
  </div>



<div class="mt-9" >
<!-- <div *ngIf="supplier"  class="  w-full  max-w-7xl p-6 pl-10 bg-white border border-gray-200 rounded-lg shadow-lg dark:bg-gray-800 dark:border-gray-700 dark:hover:bg-gray-700 mb-10  mt-10"> -->
<h1 class="text-2xl font-semibold text-center"> Suppliers Details</h1>
<label for="category" class="block font-semibold text-lg ">Suppliers Name</label>
<input id="category" type="text" class="border border-gray-300 rounded-lg p-3 w-full bg-gray-100 text-gray-800 mb-4" [value]="supplier.name" readonly>
<label for="category" class="block font-semibold text-lg   ">Contact Person </label>
<input id="category" type="text" class="border border-gray-300 rounded-lg p-3 w-full bg-gray-100 text-gray-800 mb-4" [value]="supplier.contactPerson" readonly>
<label for="category" class="block font-semibold text-lg ">Email</label>
<input id="category" type="text" class="border border-gray-300 rounded-lg p-3 w-full bg-gray-100 text-gray-800 mb-4" [value]="supplier.email" readonly>
<label for="category" class="block font-semibold text-lg ">Phone Number </label>
<input id="category" type="text" class="border border-gray-300 rounded-lg p-3 w-full bg-gray-100 text-gray-800 mb-4" [value]="supplier.phoneNumber" readonly>
<label for="category" class="block font-semibold text-lg ">Address </label>
<input id="category" type="text" class="border border-gray-300 rounded-lg p-3 w-full bg-gray-100 text-gray-800 mb-4" [value]="supplier.address" readonly>
</div>

<h1 class="text-2xl font-semibold text-center mt-8">Pricing and Quantity Information</h1>

    <label class="block font-semibold text-lg ">Available Quantity</label>
    <input type="text" class="border border-gray-300 rounded-lg p-3 w-full bg-gray-100 text-gray-800 mb-4" [value]="pricingQuantity[0]?.availableQuantity" readonly>

    <label class="block font-semibold text-lg ">Restocked Quantity</label>
    <input type="text" class="border border-gray-300 rounded-lg p-3 w-full bg-gray-100 text-gray-800 mb-4" [value]="pricingQuantity[0]?.restockedQuantity" readonly>

    <label class="block font-semibold text-lg ">Current Quantity</label>
    <input type="text" class="border border-gray-300 rounded-lg p-3 w-full bg-gray-100 text-gray-800 mb-4" [value]="pricingQuantity[0]?.currentQuantity" readonly>

    <label class="block font-semibold text-lg ">Current Purchase Price</label>
    <input type="text" class="border border-gray-300 rounded-lg p-3 w-full bg-gray-100 text-gray-800 mb-4" [value]="pricingQuantity[0]?.currentPrice" readonly>

    <label class="block font-semibold text-lg ">Current Selling Price</label>
    <input type="text" class="border border-gray-300 rounded-lg p-3 w-full bg-gray-100 text-gray-800 " [value]="pricingQuantity[0]?.currentSellingPrice" readonly>


      <h2 class="text-2xl font-semibold  text-center mt-8 mb-5">Variants Details</h2>
  
    
    
      <div *ngFor="let entry of selectedHistory.historyEntries" class="bg-gray-50 p-4 rounded-lg shadow-sm mb-4">
        <div class="mb-4">
          <label class="block font-semibold text-lg text-gray-700 ">Variant Name</label>
          <input type="text" class="border border-gray-300 rounded-lg p-3 w-full bg-gray-100 text-gray-800" [value]="entry.variantName" readonly>
        </div>
    
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block font-semibold text-lg text-gray-700 ">Current Price</label>
            <input type="text" class="border border-gray-300 rounded-lg p-3 w-full bg-gray-100 text-gray-800" [value]="entry.currentPrice" readonly>
          </div>
          
          <div>
            <label class="block font-semibold text-lg text-gray-700 ">Current Quantity</label>
            <input type="text" class="border border-gray-300 rounded-lg p-3 w-full bg-gray-100 text-gray-800" [value]="entry.currentQuantity" readonly>
          </div>
        </div>
    
        <div class="grid grid-cols-2 gap-4 mt-4">
          <div>
            <label class="block font-semibold text-lg text-gray-700 ">New Price</label>
            <input type="text" class="border border-gray-300 rounded-lg p-3 w-full bg-gray-100 text-gray-800" [value]="entry.newPrice" readonly>
          </div>
          
          <div>
            <label class="block font-semibold text-lg text-gray-700 ">New Quantity</label>
            <input type="text" class="border border-gray-300 rounded-lg p-3 w-full bg-gray-100 text-gray-800" [value]="entry.newQuantity" readonly>
          </div>
        </div>
    
      
        
      </div>
      <label class="block font-semibold text-xl text-gray-800 bg-gray-100 p-4 rounded-lg shadow-md flex items-center justify-between">
        <span class="text-gray-700">Date:</span> 
        <span class="text-blue-600">{{ Month }}</span> 
        <span class="text-purple-600">{{ Day }}</span>
        <span class="text-green-600">{{ Time }}</span>
      </label>
      

    </div>
    
    

    <hr class="my-6 border-t border-gray-300">



  </div>


<!-- If no supplier is found -->
<ng-template #noSupplier>
  <p>No supplier selected.</p>
</ng-template>
