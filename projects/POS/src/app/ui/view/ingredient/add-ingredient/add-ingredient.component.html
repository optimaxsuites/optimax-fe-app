<div class="form-footer" >
    <p class="back" (click)="navigateToPrevious()">
      <i class="fa-solid fa-arrow-left"></i> Back
    </p>
    <button   (click)="onSubmit()">Add Ingredient</button>
  </div>
  
  

  <div class="form-container ">
    <h2 class="text-2xl font-semibold mb-4 text-gray-800">Add Ingredient</h2>

    <!-- Use ngModel for two-way data binding -->
    <form (ngSubmit)="onSubmit()" novalidate [formGroup]="ingredientForm" >
        <!-- Ingredient Name -->
        <div class="form">
            <label for="default-input" class="block mb-2 text-[13px]  text-gray-900 dark:text-white text-left">Ingredient Name</label>
            <input formControlName="ingredientName" type="text" id="default-input" class="bg-gray-50 border  border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full " />
        </div>

        <!-- SKU -->

       <!-- SKU -->
<div class="form">
  <label for="sku" class="block mb-2 text-[13px] text-gray-900 dark:text-white text-left">SKU</label>
  <div class="relative flex items-center">
    <input
      type="text"
      id="sku"
      formControlName="sku"
      name="sku"
      class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full pr-10"
      required
    />
    <button
      type="button"
      class="absolute right-0 top--3 h-full flex items-center  bg-gray-200  hover:bg-gray-300 focus:outline-none "
      (click)="generateRandomSku()"
      style="    border-top-left-radius: 0 !important;
      border-bottom-left-radius: 0 !important;
      border-top-right-radius: 8px !important;
      border-bottom-right-radius: 8px !important;"
    >
      <i class="fa-solid fa-arrows-rotate "></i>
    </button>
  </div>
</div>



        <!-- Code -->
<!-- Code -->
<div class="form">
  <label for="code" class="block mb-2 text-[13px] text-gray-900 dark:text-white text-left">Code</label>
  <div class="relative flex items-center">
  <input id="code" type="text" formControlName="code" name="code" class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full" />

  <button
    type="button"
    (click)="generateRandomCode()"
    class="absolute right-0 top--3 h-full flex items-center  bg-gray-200  hover:bg-gray-300 focus:outline-none "
    style="    border-top-left-radius: 0 !important;
    border-bottom-left-radius: 0 !important;
    border-top-right-radius: 8px !important;
    border-bottom-right-radius: 8px !important;"
  >
    <i class="fa-solid fa-arrows-rotate"></i>
  </button>
</div>
</div>


        <!-- Category -->
        <div class="form">
            <label for="category" class="block mb-2 text-[13px]  text-gray-900 dark:text-white text-left">Category</label>
            <select id="category" formControlName="category" name="category" class="bg-gray-50 border  border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full  text-xl" required>
                <option value="">Select Category</option>
                <option value="Dairy">Dairy</option>
                <option value="Vegetables">Vegetables</option>
                <option value="Spices">Spices</option>
                <option value="Fruits">Fruits</option>
                <option value="Grains">Grains</option>
                <option value="Proteins">Proteins</option>
                <option value="Seafood">Seafood</option>
            </select>
        </div>

      <div class="w-full ">

        <p-inputGroup class="relative flex items-center border rounded-md overflow-hidden bg-gray-100 mb-7">

          <select
            id="dropdown"
            class="text-gray-600 bg-gray-100 text-[14px] w-full outline-none p-2 "

            <option value="0">-- Select a supplier --</option>
          <option *ngFor="let supplier of suppliers" [ngValue]="supplier.id">
            {{ supplier.name}}
          </select>
        
        <p-inputGroupAddon 
          class="bg-customGreen text-white text-[14px] px-3 cursor-pointer"
