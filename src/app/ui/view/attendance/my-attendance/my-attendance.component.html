<div class="p-6 space-y-8  mx-auto">
  <!-- Header -->
  <!-- <div class="flex flex-col items-center space-y-2">
    <h2 class="text-2xl font-semibold">My Attendance</h2>
    <p class="text-gray-500">Today is {{ currentTime | date:'fullDate' }}</p>
  </div> -->

  <!-- Clock In Section -->
  <div class="bg-white rounded-2xl shadow p-6 text-center space-y-4">
    <div class="text-5xl font-mono text-gray-800">{{ currentTime }}</div>
    <div class="text-gray-500">
      Status:
      <span class="font-semibold"
        [class.text-green-600]="currentRecord"
        [class.text-gray-400]="!currentRecord">
        {{ currentRecord ? 'Clocked In' : 'Clocked Out' }}
      </span>
    </div>

    <button
      class="px-6 py-3 rounded-lg font-medium text-white transition"
      [class.bg-green-600]="!currentRecord"
      [class.bg-red-600]="currentRecord"
      (click)="currentRecord ? clockOut() : clockIn()">
      {{ currentRecord ? 'Clock Out' : 'Clock In' }}
    </button>
  </div>

  <!-- History Table -->
  <div class="bg-white rounded-2xl shadow p-6">
    <h3 class="text-lg font-semibold mb-4">Clock-In History</h3>
    <app-table
      [columns]="historyColumns"
      [rows]="history"
    ></app-table>
  </div>
</div>


<p-confirmDialog></p-confirmDialog>
