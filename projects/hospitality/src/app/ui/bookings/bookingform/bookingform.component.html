<div
  class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl p-6 my-8"
>
  <h2 class="text-2xl font-bold text-gray-800 mb-6">Room Booking Form</h2>

  <form class="space-y-4">
    <!-- Room Information -->
    <div class="bg-gray-50 p-4 rounded-lg">
      <h3 class="font-semibold text-lg text-gray-700 mb-2">Selected Room</h3>
      <div class="flex items-center space-x-4">
        <div class="flex-shrink-0">
          <img
            class="h-16 w-16 rounded-md object-cover"
            [src]="roomImage"
            alt="Room image"
          />
        </div>
        <div>
          <p class="text-gray-800 font-medium">{{ roomName }}</p>
          <p class="text-gray-600 text-sm">{{ roomType }}</p>
          <p class="text-gray-800 font-semibold">{{ roomPrice }}/night</p>
        </div>
      </div>
    </div>

    <!-- Guest Information -->
    <div class="space-y-4">
      <h3 class="font-semibold text-lg text-gray-700">Guest Information</h3>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label for="firstName" class="block text-sm font-medium text-gray-700"
            >First Name</label
          >
          <input
            type="text"
            id="firstName"
            name="firstName"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"
          />
        </div>

        <div>
          <label for="lastName" class="block text-sm font-medium text-gray-700"
            >Last Name</label
          >
          <input
            type="text"
            id="lastName"
            name="lastName"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"
          />
        </div>
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700"
          >Email</label
        >
        <input
          type="email"
          id="email"
          name="email"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"
        />
      </div>

      <div>
        <label for="phone" class="block text-sm font-medium text-gray-700"
          >Phone Number</label
        >
        <input
          type="tel"
          id="phone"
          name="phone"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"
        />
      </div>
    </div>

    <!-- Booking Dates -->
    <div class="space-y-4">
      <h3 class="font-semibold text-lg text-gray-700">Booking Dates</h3>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label for="checkIn" class="block text-sm font-medium text-gray-700"
            >Check-in Date</label
          >
          <input
            type="date"
            id="checkIn"
            name="checkIn"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"
          />
        </div>

        <div>
          <label for="checkOut" class="block text-sm font-medium text-gray-700"
            >Check-out Date</label
          >
          <input
            type="date"
            id="checkOut"
            name="checkOut"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"
          />
        </div>
      </div>

      <div>
        <label for="guests" class="block text-sm font-medium text-gray-700"
          >Number of Guests</label
        >
        <select
          id="guests"
          name="guests"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"
        >
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5+">5+</option>
        </select>
      </div>
    </div>

    <!-- Special Requests -->
    <div>
      <label for="requests" class="block text-sm font-medium text-gray-700"
        >Special Requests</label
      >
      <textarea
        id="requests"
        name="requests"
        rows="3"
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"
      ></textarea>
    </div>

    <!-- Payment Information -->
    <div class="space-y-4">
      <h3 class="font-semibold text-lg text-gray-700">Payment Information</h3>

      <div>
        <label for="cardName" class="block text-sm font-medium text-gray-700"
          >Name on Card</label
        >
        <input
          type="text"
          id="cardName"
          name="cardName"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"
        />
      </div>

      <div>
        <label for="cardNumber" class="block text-sm font-medium text-gray-700"
          >Card Number</label
        >
        <input
          type="text"
          id="cardNumber"
          name="cardNumber"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"
        />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="expiry" class="block text-sm font-medium text-gray-700"
            >Expiry Date</label
          >
          <input
            type="text"
            id="expiry"
            name="expiry"
            placeholder="MM/YY"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"
          />
        </div>

        <div>
          <label for="cvv" class="block text-sm font-medium text-gray-700"
            >CVV</label
          >
          <input
            type="text"
            id="cvv"
            name="cvv"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"
          />
        </div>
      </div>
    </div>

    <!-- Terms and Submit -->
    <div class="flex items-center">
      <input
        id="terms"
        name="terms"
        type="checkbox"
        class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500"
      />
      <label for="terms" class="ml-2 block text-sm text-gray-700">
        I agree to the
        <a href="#" class="text-indigo-600 hover:text-indigo-500"
          >terms and conditions</a
        >
      </label>
    </div>

    <button
      type="submit"
      class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
    >
      Confirm Booking
    </button>
  </form>
</div>
