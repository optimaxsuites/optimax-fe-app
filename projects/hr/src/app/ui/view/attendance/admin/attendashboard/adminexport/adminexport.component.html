<div class="export-card">
  <button class="action-btn import-btn" (click)="openImportModal()">
    <i class="fa-solid fa-file-import"></i>
    Import
  </button>

  <div class="export-dropdown">
    <button class="action-btn export-btn" (click)="toggleExportDropdown()">
      <i class="fa-solid fa-file-export"></i>
      Export ▾
    </button>
    <div class="export-menu" *ngIf="exportDropdownOpen">
      <button class="export-option" (click)="exportExcel(); closeExportDropdown()">
        <i class="fa-solid fa-file-excel"></i>
        Export Excel
      </button>
      <button class="export-option" (click)="exportCSV(); closeExportDropdown()">
        <i class="fa-solid fa-file-csv"></i>
        Export CSV
      </button>
      <button class="export-option" (click)="exportPDF(); closeExportDropdown()">
        <i class="fa-solid fa-file-pdf"></i>
        Export PDF
      </button>
    </div>
  </div>
</div>

<!-- BACKDROP -->
<div class="import-backdrop" *ngIf="importModalOpen"></div>

<!-- MODAL -->
<div class="import-modal" *ngIf="importModalOpen">
  <div class="modal-header">
    <h3>
      <i class="fa-solid fa-file-arrow-up"></i>
      Import Attendance</h3>
    <button class="close-btn" (click)="closeImportModal()">×</button>
  </div>

  <p class="modal-text">Download template, fill it, then upload:</p>

  <button class="template-btn" (click)="downloadTemplate()">
    <i class="fa-solid fa-download"></i>
    Download Template
  </button>

  <div class="file-upload">
    <input type="file" #fileInput accept=".xlsx" />
    <p class="file-name" *ngIf="fileInput.files?.length">
      Selected: {{ fileInput.files?.[0]?.name }}
    </p>
  </div>
  <div>
    <p class="remind-text">Don't forget to remove the initial mock data before importing</p>
  </div>
  

  <div class="actions">
    <button class="cancel-btn" (click)="closeImportModal()">
      <i class="fa-solid fa-xmark"></i>
      Cancel</button>
    <button class="import-btn" (click)="importNow()">
      <i class="fa-solid fa-upload"></i>
      Import Now</button>
  </div>
</div>
