<div
  class="border rounded-xl px-2 pt-3 cursor-pointer h-96 product-card relative"
  (click)="onAddToCart()"
  [class.inCart]="amountOfProductInCart"
>
  @if (amountOfProductInCart) {

  <div class="product-quantity absolute">{{ amountOfProductInCart }}</div>
  }
  <!-- TODO: Is it alright to load images like this? -->
  <img
    [src]="imageUrl"
    alt="product image"
    class="w-full h-2/3 object-contain"
  />
  <div class="flex flex-col w-full mt-4 px-2 h-[10rem]">
    <!-- <p>Nivea lotion - Even glow</p>
        <p>#5000</p> -->

    <p class="mb-4 text-ellipsis overflow-hidden">{{ product.name }}</p>
    <p class="mb-4">{{ product.effectivePrice | currency: '₦' }}</p>
  </div>
</div>
