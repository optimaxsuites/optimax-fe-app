<div class="report-tabs">
  <a
    class="report-tab"
    [class.active]="isFinancialStatementActive()"
    (click)="goToFinancialStatement($event)"
    href="#financial-statement-section"
  >
    Financial Statement
  </a>
  
  <a class="report-tab" routerLink="/admin/reports/balance-sheet" routerLinkActive="active">Balance Sheet</a>
  <a class="report-tab" routerLink="/admin/reports/income-statement" routerLinkActive="active">Income Statement</a>
  <a class="report-tab" routerLink="/admin/reports/cash-flow" routerLinkActive="active">Cash Flow</a>
  <a class="report-tab" routerLink="/admin/reports/tax-summary" routerLinkActive="active">Tax Summary</a>
</div>
