<app-back-button></app-back-button>
<div class="add-per-diem">
  <h2>Add Per Diem</h2>
  <form [formGroup]="perDiemForm" (ngSubmit)="submitPerDiem()">
    <div class="radio-buttons">
      <label>
        <input type="radio" formControlName="perDiemType" value="trip"> Trip
      </label>
      <label>
        <input type="radio" formControlName="perDiemType" value="individual"> Individual Day
      </label>
    </div>

    <!-- Trip input fields -->
    <div *ngIf="perDiemForm.get('perDiemType')?.value === 'trip'" class="trip-inputs">
      <div class="input-row">
        <div class="input-group">
          <label for="from">From:</label>
          <input type="text" id="from" formControlName="tripFrom">
        </div>
        <div class="input-group">
          <label for="startDate">Start Date:</label>
          <input type="date" id="startDate" formControlName="tripStartDate">
        </div>
        <div class="input-group">
          <label for="startTime">Time:</label>
          <input type="time" id="startTime" formControlName="tripStartTime">
        </div>
      </div>

      <div class="input-row">
        <div class="input-group">
          <label for="to">To:</label>
          <input type="text" id="to" formControlName="tripTo">
        </div>
        <div class="input-group">
          <label for="endDate">End Date:</label>
          <input type="date" id="endDate" formControlName="tripEndDate">
        </div>
        <div class="input-group">
          <label for="endTime">Time:</label>
          <input type="time" id="endTime" formControlName="tripEndTime">
        </div>
      </div>
    </div>

    <!-- Destination fields -->
    <div class="destinations">
      <div *ngFor="let destination of destinations?.controls; let i = index" [formGroupName]="i" class="destination">
        <div class="input-row">
          <div class="input-group">
            <label for="to">To:</label>
            <input type="text" id="to" placeholder="Destination" formControlName="name">
          </div>
          <div class="input-group">
            <label for="endDate">End Date:</label>
            <input type="date" id="endDate" formControlName="endDate">
          </div>
          <div class="input-group">
            <label for="time">Time:</label>
            <input type="time" id="time" formControlName="time">
          </div>
          <span class="remove-destination" (click)="removeDestination(i)">&#x2715;</span> <!-- X icon -->
        </div>
      </div>
      <button type="button" class="add-destination" (click)="addDestination()">&#43; Add Destination</button>
    </div>


    <div class="additional-fields">
        <div class="input-group">
            <label for="category">Category (optional):</label>
            <select id="category" formControlName="category">
                <option value="">Select a category</option>
                <!-- Add options here -->
            </select>
        </div>
    
        <div class="input-group">
            <label for="project">Project (optional):</label>
            <select id="project" formControlName="project">
                <option value="">Select a project</option>
                <!-- Add options here -->
            </select>
        </div>
    
        <div class="input-group">
            <label for="comment">Comment (optional):</label>
            <textarea id="comment" formControlName="comment"></textarea>
        </div>
    </div>

    <div class="form-actions">
        <button type="submit" class="calculate-per-diem">Calculate Per Diems</button>
        <button type="button" class="cancel">Cancel</button>
    </div>
    

    <!-- Individual Day input fields -->
    <div *ngIf="perDiemForm.get('perDiemType')?.value === 'individual'" class="individual-day-inputs">
      <label for="dayDate">Date:</label>
      <!-- <input type="date" id="dayDate" formControlName="dayDate"> -->
      <label for="dayAmount">Amount:</label>
      <!-- <input type="number" id="dayAmount" formControlName="dayAmount"> -->
    </div>
  </form>
</div>
