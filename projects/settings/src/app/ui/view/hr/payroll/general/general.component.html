<form [formGroup]="form" *ngIf="!loading" (ngSubmit)="save()" class="space-y-8 w-full mt-5">
  <div class="grid grid-cols-1 gap-x-6 gap-y-4 sm:grid-cols-2">
    
    <div>
      <label class="block  font-medium text-gray-700 mb-1">Payroll Frequency</label>
      <select formControlName="payrollFrequency" 
              class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:">
        <option *ngFor="let f of frequencies" [ngValue]="f.value">{{ f.label }}</option>
      </select>
    </div>

    <div>
      <label class="block  font-medium text-gray-700 mb-1">Currency</label>
      <select formControlName="currency" 
              class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:">
        <option *ngFor="let c of currencies" [ngValue]="c.value">{{ c.label }}</option>
      </select>
    </div>

    <div>
      <label class="block  font-medium text-gray-700 mb-1">Pay Period Start Day</label>
      <input type="number" formControlName="payPeriodStartDay" 
             class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:">
    </div>

    <div>
      <label class="block  font-medium text-gray-700 mb-1">Default Payment Day</label>
      <input type="number" formControlName="paymentDay" 
             class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:">
    </div>

    <div>
      <label class="block  font-medium text-gray-700 mb-1">Payroll Cut-off Day</label>
      <input type="number" formControlName="cutoffDay" 
             class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:">
    </div>

    <div>
      <label class="block  font-medium text-gray-700 mb-1">Fiscal Year Start Month</label>
      <input type="number" formControlName="fiscalYearStartMonth" min="1" max="12" 
             class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:">
    </div>

    <div>
      <label class="block  font-medium text-gray-700 mb-1">Working Days per Period</label>
      <input type="number" formControlName="workingDaysPerPeriod" 
             class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:">
    </div>

    <div>
      <label class="block  font-medium text-gray-700 mb-1">Standard Hours per Day</label>
      <input type="number" formControlName="hoursPerDay" 
             class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:">
    </div>

    <div>
      <label class="block  font-medium text-gray-700 mb-1">Proration Rule</label>
      <select formControlName="prorationRule" 
              class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:">
        <option *ngFor="let p of prorationRules" [ngValue]="p.value">{{ p.label }}</option>
      </select>
    </div>

    <div>
      <label class="block  font-medium text-gray-700 mb-1">Rounding Rule</label>
      <select formControlName="roundingRule" 
              class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:">
        <option *ngFor="let r of roundingRules" [ngValue]="r.value">{{ r.label }}</option>
      </select>
    </div>

    <div class="sm:col-span-2">
      <label class="block  font-medium text-gray-700 mb-1">Payslip Number Prefix</label>
      <input type="text" formControlName="payslipPrefix" 
             class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:">
    </div>

    <div class="sm:col-span-2 flex items-center gap-3 py-2">
      <input type="checkbox" formControlName="overtimeEnabled"
             class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
      <label class=" font-medium text-gray-700">Enable Overtime</label>
    </div>

    <!-- Salary Input Mode -->
    <div class="sm:col-span-2 pt-2">
      <label class="block font-medium text-gray-700 mb-1">Salary Input Mode</label>
      <p class="text-xs text-gray-500 mb-3">
        How salary figures are entered in the system. HR letters always show annual totals; payroll always disburses monthly.
      </p>
      <div class="flex gap-3">
        <button type="button"
          (click)="salaryInputMode = 'monthly'"
          [class.bg-customBlue]="salaryInputMode === 'monthly'"
          [class.text-white]="salaryInputMode === 'monthly'"
          [class.border-customBlue]="salaryInputMode === 'monthly'"
          [class.bg-white]="salaryInputMode !== 'monthly'"
          [class.text-gray-700]="salaryInputMode !== 'monthly'"
          class="flex-1 rounded-md border px-4 py-3 text-sm font-medium transition-colors text-left">
          <div class="flex items-center gap-2 mb-0.5">
            <i class="fas fa-calendar-day text-[13px]"></i>
            <span>Monthly Input</span>
          </div>
          <div class="text-xs opacity-70">Figures entered per month — ×12 in HR letters, used as-is in payroll</div>
        </button>
        <button type="button"
          (click)="salaryInputMode = 'yearly'"
          [class.bg-customBlue]="salaryInputMode === 'yearly'"
          [class.text-white]="salaryInputMode === 'yearly'"
          [class.border-customBlue]="salaryInputMode === 'yearly'"
          [class.bg-white]="salaryInputMode !== 'yearly'"
          [class.text-gray-700]="salaryInputMode !== 'yearly'"
          class="flex-1 rounded-md border px-4 py-3 text-sm font-medium transition-colors text-left">
          <div class="flex items-center gap-2 mb-0.5">
            <i class="fas fa-calendar-alt text-[13px]"></i>
            <span>Annual Input</span>
          </div>
          <div class="text-xs opacity-70">Figures entered per year — shown as-is in HR letters, ÷12 in payroll</div>
        </button>
      </div>
    </div>
  </div>

  <div class="pt-4 flex items-center justify-end gap-3">
    <span *ngIf="saved" class="text-sm text-green-600 flex items-center gap-1">
      <i class="fas fa-check-circle"></i> Saved
    </span>
    <button type="submit" [disabled]="saving"
            class="inline-flex justify-center items-center gap-2 rounded-md border border-transparent bg-customBlue py-2 px-4 font-medium text-white shadow-sm hover:bg-customBlueHover focus:outline-none focus:ring-2 focus:ring-customBlue focus:ring-offset-2 disabled:opacity-60">
      <i class="fas" [class.fa-save]="!saving" [class.fa-spinner]="saving" [class.fa-spin]="saving"></i>
      {{ saving ? 'Saving…' : 'Save Settings' }}
    </button>
  </div>
</form>

<div *ngIf="loading" class="flex items-center justify-center h-64">
  <svg class="animate-spin h-10 w-10 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
  </svg>
</div>
