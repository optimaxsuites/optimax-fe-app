<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=stat_minus_1" />

<div class="createVendor"  >
    <div class="flex justify-between items-center mt-4">
    <p class="back" style="cursor: pointer;" (click)="closeEdit()"><i class="fa-solid fa-arrow-left"></i> Back</p>
    <button  class="btn create-invoice-btn p-4" (click) =" saveProduct()">Update Product</button>
  </div>
  <div *ngIf="notificationMessage" class="notificationMessage">
    {{ notificationMessage }}
  </div>
   
    <div class="details">
     
      <div class="permissionDiv text-gray-700 flex flex-col gap-9 stl bg-white rounded-2xl border" style="padding-left: 25px; padding-right: 25px; padding-top: 20px; padding-bottom: 20px;"> 
        <p class="text-3xl text-gray-700 font-semibold pb-0  mb-0 text-center">Inventory</p>
        <hr>
        <div class="field">
          <label class="text-2xl font-medium" for="name">Product Name</label>
          <input class="name editInput bg-gray-100 text-xl " style= " padding: 10px;" id="name" [value]="activeItem.name" readonly />
        </div>
  
  
        <div  class="field">
          <label class="text-2xl" for="sku">SKU</label>
          <input class="editInput  bg-gray-100  text-xl"  style= " padding: 10px;" id="sku" [value]="activeItem.sku" readonly />
        </div>
  
  
          <div class="field">
            <label for="code" class="block font-medium text-2xl">Product Code</label>
            <input class="editInput w-full text-xl  bg-gray-100"  style= " padding: 10px;" id="code" [value]="activeItem.code" readonly />
          </div>
            
        <div class="field">
          <label for="category" class="block font-medium text-2xl ">Category</label>
          <input class="editInput w-full text-xl  bg-gray-100" id="category"  style= " padding: 10px;"  [value]="activeItem.productCategory.name" readonly />
        </div>
    
  
  
            
          
          <!-- Dropdown1 -->
          
          <div class="flex space-x-4">
            <!-- Event Category Dropdown -->
            <div class="w-1/2 ">
              <label for="dropdown" class="block font-medium text-2xl">Change-type <span class="text-red-500">*
  
  
                    <!-- Delete Icon (Only Shows When an Option is Selected) -->
                    <span 
                    *ngIf="selectedOption" 
                    (click)="deleteSelectedOption()" 
                    title="Delete selected option" 
                    class="cursor-pointer text-red-600 text-2xl pl-2"
                  >
                    <i class="fas fa-trash"></i>
                  </span>
  
  
              </span>  
            
            </label>
            
            <div class="relative flex items-center border rounded-md overflow-hidden bg-gray-100 ">
              <!-- Select Dropdown -->
              <select
                id="dropdown"
                class=" px-4 py text-gray-600 bg-gray-100 text-2xl rounded-2xl" 
                style="padding: 10px;" 
                [(ngModel)]="selectedOption"
                (change)="updateSelectedOption()"
              >
                <option value="" disabled selected>Select a change-type</option>    
                <option *ngFor="let option of options">{{ option }}</option>
              </select>
            
              <!-- Fake Dropdown Icon -->
              <span class=" material-symbols-outlined absolute right-10 top-1/2 transform -translate-y-1/2 text-gray-500 text-xl pointer-events-none">
                stat_minus_1
              </span>
              <!-- Button Inside the Dropdown Box -->
              <button 
                class="absolute right-0.5 top-1/2 transform -translate-y-1/2 bg-green-600 text-white px-4 py-4 hover:bg-green-700 rounded"
                (click)="toggleInput()"
              >
                +
              </button>
            </div>
            
          </div>
  
  
  
          
        
  
  
  
  
  
  
          <!-- Dropdown2 -->
          <div class="w-1/2 ">
            <label for="dropdown" class="block font-medium text-2xl">Source <span class="text-red-500">*</span>
            
              <span 
              *ngIf="selectedSupplier" 
              (click)="removeSelectedSupplier()" 
              title="Delete selected supplier" 
              class="cursor-pointer text-red-600 text-2xl pl-3"
            >
              <i class="fas fa-trash"></i>
            </span>
            
            </label>
               
            <div class="relative flex items-center border rounded-md overflow-hidden bg-gray-100">
              <select
                id="dropdown"
                class="w-full px-4 py-2 text-gray-600 bg-gray-100 focus:outline-none appearance-none text-2xl" style= " padding: 10px;"
                (change)="changeSelectedSupplier($event)"
              >
              <option value="" disabled selected>Select a supplier</option>
              <option *ngFor="let supplier of suppliers" [value]="supplier.supplierName">   {{ supplier.supplierName }}</option>
              </select>
              <!-- Dropdown Arrow -->
              <span class=" material-symbols-outlined absolute right-10 top-1/2 transform -translate-y-1/2 text-gray-500 text-xl pointer-events-none">
                stat_minus_1
              </span>
              <!-- Add (+) Button -->
               
              <button  class="absolute right-0.5 top-1/2 transform -translate-y-1/2 bg-green-600 text-white px-4 py-4 hover:bg-green-700 rounded" style= " padding: 10px;"  (click)="openModal()"  >+</button>
        
  
            </div>
          </div>
          
        </div>
        

      <!-- adding a dropdown1 add new -->
  
      <div *ngIf="showInput"  class="mt-2 border rounded-md overflow-hidden bg-gray-100 w-1/2">
        <input 
        type="text" 
        [(ngModel)]="newOption" 
        placeholder="Enter new option" 
        class="w-full px-4 py-3 text-gray-600 bg-gray-100 focus:outline-none text-2xl border"
      >
      <button 
      class="w-full bg-green-600 text-white px-4 py-2 hover:bg-green-700" 
      (click)="addOption()">
      Save
    </button>
      </div>
  




  
   <div class="flex space-x-4">
        <!-- Headquarters Dropdown -->
    <div class="w-1/2">
      <label for="headquartersDropdown" class="block font-medium text-2xl">
        Branches <span class="text-red-500">*</span>
  
        <!-- Delete Icon (Only Shows When an Option is Selected) -->
        <span 
          *ngIf="selectedHeadquarters" 
          (click)="deleteSelectedHeadquarters()" 
          title="Delete selected option" 
          class="cursor-pointer text-red-600 text-2xl pl-2"
        >
          <i class="fas fa-trash"></i>
        </span>
      </label>
  
      <div class="relative flex items-center border rounded-md overflow-hidden bg-gray-100">
        
        <select
          id="headquartersDropdown"
          class="w-full px-4 py-2 text-gray-600 bg-gray-100 focus:outline-none appearance-none text-2xl"
          style="padding: 10px;"
          [(ngModel)]="selectedHeadquarters"
        >
          <option value="" disabled  >Select a Branch</option>    
          <option *ngFor="let hq of headquartersOptions"placeholder="Select a source" [value]="hq">{{ hq }}</option>

        </select>
   <!-- Dropdown Arrow -->
   <span class=" material-symbols-outlined absolute right-10 top-1/2 transform -translate-y-1/2 text-gray-500 text-xl pointer-events-none">
    stat_minus_1
  </span>
  <!-- Add (+) Button -->
   
  <button  class="absolute right-0.5 top-1/2 transform -translate-y-1/2 bg-green-600 text-white px-4 py-4 hover:bg-green-700 rounded" style= " padding: 10px;"  (click)="toggleHeadquartersInput()"  >+</button>


      </div>
    </div>
  


    <div class="w-1/2">
      <label for="dateInput" class="block  text-2xl text-gray-700">Select Date <span class="text-red-500">*</span></label>
      <input
        id="dateInput"
        type="date"
        class=" text-2xl border-gray-300 border-2 rounded-md  bg-gray-100  w-full px-4 py-2.5 focus:outline-none focus:ring focus:border-blue-300"
        [(ngModel)]="selectedDate"
        (change)="saveDate()"
      />
    </div>
  
  </div>
  
  
  
  
        
      
  
  
  
  <!-- Modal Backdrop dropdown2 -->
  <!-- Overlay -->
  <div *ngIf="isOpen" class="fixed inset-0 bg-black bg-opacity-50 z-50" (click)="closeModal()"></div>
  
  <!-- Side Modal -->
  <div *ngIf="isOpen" class="fixed top-0 right-0 w-1/3 h-full bg-white shadow-xl p-6 z-50 rounded-l-3xl">
    <h2 class="text-2xl font-bold my-5 text-center">Add New Supplier</h2>
  
    <div class="bg-white shadow-2xl rounded-lg p-6 mt-14">
      <form (ngSubmit)="submitForm()">
        <div class="mb-4">
          <label class="block text-gray-700 text-2xl">Supplier Name</label>
          <input type="text" [(ngModel)]="supplierName" name="supplierName" class="w-full p-3  bg-gray-200"  style="border: 1px solid gray; border-radius: 4px;" required />
        </div>
  
        <div class="mb-4">
          <label class="block text-gray-700 text-2xl">Contact Person</label>
          <input type="text" [(ngModel)]="contactPerson" name="contactPerson" class="w-full p-2  bg-gray-200"  style="border: 1px solid gray; border-radius: 4px;"required />
        </div>
  
        <div class="mb-4">
          <label class="block text-gray-700 text-2xl">Email Address</label>
          <input type="email" [(ngModel)]="email" name="email" class="w-full p-2  bg-gray-200"style="border: 1px solid gray; border-radius: 4px;" required />
        </div>
  
        <div class="mb-4">
          <label class="block text-gray-700 text-2xl">Phone Number</label>
          <input type="tel" [(ngModel)]="phone" name="phone" class="w-full p-2  bg-gray-200"style="border: 1px solid gray; border-radius: 4px;" required />
        </div>
  
        <div class="mb-4">
          <label class="block text-gray-700 text-2xl">Business Address</label>
          <input type="text" [(ngModel)]="address" name="address" class="w-full p-2  bg-gray-200" style="border: 1px solid gray; border-radius: 4px;" />
        </div>
  
        <!-- Additional Information -->
        <label class="block text-gray-700 font-medium mb-2 text-2xl">Products/Services Provided</label>
        <textarea [(ngModel)]="products" name="products" class="w-full p-3 bg-gray-200 focus:ring-2 focus:ring-green-400 mb-4" placeholder="List the products or services offered" style="border: 1px solid gray; border-radius: 4px;"></textarea>
  
        <label class="block text-gray-700 font-medium mb-2 text-2xl">Notes</label>
        <textarea [(ngModel)]="notes" name="notes" class="w-full p-3  bg-gray-200 focus:ring-2 focus:ring-green-400 mb-4" placeholder="Any special instructions or comments " style="border: 1px solid gray; border-radius: 4px;"></textarea>
  
        <!-- Terms & Conditions -->
        <div class="mb-4 flex items-center">
          <input type="checkbox" [(ngModel)]="agreeTerms" name="agreeTerms" class="mr-2" />
          <label for="agreeTerms" class="text-2xl">
            I agree to the 
            <a href="/terms-and-conditions" target="_blank" class="text-blue-600 underline">Terms & Conditions</a>
          </label>
        </div>
      
  
        <!-- Buttons -->
        <div class="flex justify-end">
          <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">Save</button>
          <button type="button" class="ml-2 text-gray-600" (click)="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
