<div class="flex flex-col bg-[#f9fbfc] border border-[#e2e8ed] rounded-2xl overflow-hidden transition-all
  focus-within:border-[#2e6276]/50 focus-within:shadow-[0_0_0_3px_rgba(46,98,118,0.08)]">

  <textarea
    [(ngModel)]="value"
    [placeholder]="placeholder"
    (keydown.enter)="onEnter($event)"
    rows="2"
    class="border-0 outline-none text-[13px] text-[#1a2733] bg-transparent px-4 pt-3.5 pb-2 resize-none placeholder-[#c0cdd6] leading-relaxed">
  </textarea>

  <div class="flex items-center justify-between px-3 pb-2.5 pt-1 border-t border-[#eef2f5]">

    <!-- Left: format toggles + tone toggle -->
    <div class="flex items-center gap-1">
      <button *ngFor="let f of formatOptions"
        (click)="formatChanged.emit(f.key)"
        class="flex items-center gap-1 px-2 py-1 rounded-md text-[10.5px] font-semibold transition-all cursor-pointer border"
        [ngClass]="responseFormat === f.key
          ? 'bg-[#eaf2f6] border-[#2e6276]/30 text-[#2e6276]'
          : 'bg-transparent border-transparent text-[#a0b0bc] hover:bg-[#f4f8fa]'"
        [innerHTML]="f.label">
      </button>

      <div class="w-px h-3 bg-[#e2e8ed] mx-1"></div>

      <button (click)="toneChanged.emit(tone === 'business' ? 'casual' : 'business')"
        class="flex items-center gap-1 px-2 py-1 rounded-md text-[10.5px] font-semibold transition-all cursor-pointer border bg-[#f0f4f7] border-[#e2e8ed] text-[#6b8898] hover:border-[#2e6276]/30 hover:text-[#2e6276]">
        {{ tone === 'business' ? 'Business' : 'Casual' }}
      </button>
    </div>

    <!-- Right: send button -->
    <button (click)="send()"
      class="w-7 h-7 rounded-lg flex items-center justify-center border-0 cursor-pointer transition-all"
      [ngClass]="value.trim().length > 0
        ? 'bg-[#2e6276] text-white hover:bg-[#255264]'
        : 'bg-[#eef2f5] text-[#c0cdd6]'">
      <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
      </svg>
    </button>

  </div>
</div>
