<link
  href="https://fonts.googleapis.com/icon?family=Material+Icons"
  rel="stylesheet"
/>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=visibility"
/>


<!-- Search and Categories Section -->
<div *ngIf="tableSection" class="flex flex-col w-full gap-14 p-4">
  <div class="gap-3 w-full flex justify-between items-center">
    <ng-select
      [items]="categories"
      bindLabel="name"
      [(ngModel)]="selectedCategory"
      (ngModelChange)="filterIngredientsByCategory()"
      placeholder="Select Category"
    >
    </ng-select>

    <div class="w-1/3 flex justify-end">
      <div class="search-container">
        <input
          type="text"
          class="Search-input"
          placeholder="Search..."
          [(ngModel)]="searchTerm"
          (input)="filterIngredientsBySearch()"
        />
        <i class="fas fa-search"></i>
      </div>
    </div>
  </div>

  <p-toolbar styleClass=" gap-2 justify-end">
    <ng-template pTemplate="right">
      <app-button 
        text="Add Ingredient" 
        class="btn-navigate "
        (click)="navigateToAddIngredient()">
      </app-button>
    </ng-template>
  </p-toolbar>

  <p-table
    [value]="ingredients"
    [value]="filteredIngredients"
    [paginator]="true"
    dataKey="sku"
    responsiveLayout="stack"
    [rows]="10"
    styleClass="p-datatable-striped"
  >
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 4rem"><p-tableHeaderCheckbox /></th>
        <th class="table-item">SKU</th>
        <th class="table-item">Code</th>
        <th class="table-item">Name</th>
        <th class="table-item">Price</th>
        <th class="table-item">Quantity</th>
        <th class="table-item">Category</th>
        <th class="table-item">Action</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-item>
      <tr (click)="loadIngredients()">
        <td><p-tableCheckbox [value]="item" class="custom-checkbox" /></td>
        <td>{{ item.sku }}</td>
        <td>{{ item.code }}</td>
        <td>{{ item.name }}</td>
        <td>{{ item.purchasePrice | number : "1.2-2" }}</td>
        <td>{{ item.currentStock }}</td>
        <td>{{ item.category }}</td>

        <div class="dropdown">
          <span>
            <i class="material-icons">more_vert</i>
          </span>
          <ul
            class="absolute bg-white border shadow-lg rounded-lg py-2 z-50"
            *ngIf="item.showMenu"
          >
            <li
              class="flex items-center px-4 py-2 hover:bg-gray-100 cursor-pointer"
            >
              <i class="pi pi-eye pr-2 text-2xl"></i> View History
            </li>
            <li
              class="flex items-center px-4 py-2 hover:bg-gray-100 cursor-pointer"
            >
              <i class="pi pi-pen-to-square pr-2 text-2xl"></i> Edit Ingredient
            </li>
          </ul>
        </div>
      </tr>
    </ng-template>
  </p-table>
  <div
    *ngIf="filteredIngredients.length === 0"
    style="text-align: center; margin-top: 10px"
  >
    No ingredients found.
  </div>
</div>
