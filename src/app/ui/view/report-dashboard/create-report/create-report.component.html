<div class="max-w-4xl mx-auto mt-10 p-6 bg-white shadow-md rounded-md">
  <form [formGroup]="reportForm" (ngSubmit)="onSubmit()">
    <!-- Report Name -->
    <div class="mb-4">
      <label class="block text-gray-700 font-semibold mb-2" for="reportName">
        Report Name
      </label>
      <input
        id="reportName"
        type="text"
        formControlName="reportName"
        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-green-500"
        placeholder="Enter report name"
      />
    </div>

    <!-- Additional Information -->
    <div class="mb-4">
      <label
        class="block text-gray-700 font-semibold mb-2"
        for="additionalInfo"
      >
        Additional Information
      </label>
      <textarea
        id="additionalInfo"
        formControlName="additionalInfo"
        rows="4"
        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-green-500"
        placeholder="Enter any additional details"
      ></textarea>
    </div>

    <!-- Sub-section for Creating Charts -->
    <div class="mb-4">
      <label class="block text-gray-700 font-semibold mb-2">
        Charts (up to 5)
      </label>

      <!-- Wrap the FormArray controls with formArrayName -->
      <div formArrayName="charts">
        <!-- Existing Charts -->
        <div
          *ngFor="let chart of charts.controls; let i = index"
          [formGroupName]="i"
          class="mb-2"
        >
          <div
            class="flex flex-col md:flex-row md:items-center space-y-2 md:space-y-0 md:space-x-2"
          >
            <span class="font-semibold">Chart {{ i + 1 }}:</span>

            <!-- Chart Type -->
            <select
              formControlName="chartType"
              class="w-full md:w-1/4 border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-green-500"
            >
              <option value="" disabled>Select Chart Type</option>
              <option *ngFor="let cType of chartTypes" [value]="cType">
                {{ cType }}
              </option>
            </select>

            <!-- Timeframe -->
            <select
              formControlName="chartStyle"
              class="w-full md:w-1/4 border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-green-500"
            >
              <option value="" disabled>Select Style</option>
              <option *ngFor="let style of chartStyles" [value]="style">
                {{ style }}
              </option>
            </select>

            <!-- Timeframe -->
            <select
              formControlName="timeframe"
              class="w-full md:w-1/4 border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-green-500"
            >
              <option value="" disabled>Select Timeframe</option>
              <option *ngFor="let timeframe of timeFrames" [value]="timeframe">
                {{ timeframe }}
              </option>
            </select>

            <!-- Remove Chart Button -->
            <button
              type="button"
              (click)="removeChart(i)"
              class="text-red-600 hover:text-red-800 font-bold text-xl"
              title="Remove this chart"
            >
              &times;
            </button>
          </div>
        </div>
      </div>

      <!-- Add Chart Button -->
      <button
        type="button"
        class="mt-2 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
        (click)="addChart()"
        [disabled]="charts.length >= 5"
      >
        Add Chart
      </button>
    </div>

    <!-- Submit Button -->
    <div class="text-right">
      <button
        type="submit"
        class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700"
      >
        Create Report
      </button>
    </div>
  </form>
</div>
