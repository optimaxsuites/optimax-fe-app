<div class="vp-page">
  <div class="vp-card">
    <div class="vp-icon"><i class="fas fa-hourglass-half"></i></div>
    <h1 class="vp-title">Awaiting Admin Approval</h1>
    <p class="vp-message">
      Your email has been verified and your vendor account is registered.
      An administrator will review your details and enable your portal access.
    </p>
    <div class="vp-steps">
      <div class="vp-step vp-step--done">
        <i class="fas fa-check-circle"></i>
        <span>Account created</span>
      </div>
      <div class="vp-step vp-step--done">
        <i class="fas fa-check-circle"></i>
        <span>Email verified</span>
      </div>
      <div class="vp-step vp-step--pending">
        <i class="fas fa-clock"></i>
        <span>Admin approval</span>
      </div>
      <div class="vp-step vp-step--locked">
        <i class="fas fa-lock"></i>
        <span>Vendor Portal access</span>
      </div>
    </div>
    <p class="vp-contact">
      Questions? Contact <a href="mailto:support@optimaxsuites.com">support&#64;optimaxsuites.com</a>
    </p>
    <button type="button" class="vp-logout-btn" (click)="logout()">
      <i class="fas fa-sign-out-alt"></i> Sign Out
    </button>
  </div>
</div>
