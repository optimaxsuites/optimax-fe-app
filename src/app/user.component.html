<div class="max-h-screen h-screen min-h-screen">
    <app-modal *ngIf="register.length > 0" (close)="register = ''" [header]="register === 'open' ? 'Open Register' : 'Close Register'">
  
        <div class="flex items-center gap-3 p-3 my-3 mx-2 border bg-white/50 rounded-xl w-[30vw]">
            <label for="orderName" class=" font-semibold">{{register === 'open' ? 'Open Register' : 'Close Register'}}</label>
            <input class="outline-none text-gray-600" type="text" id="orderName" [(ngModel)]="amount" placeholder="Type here">
        </div>
            <div class="modalBtn mt-5 flex-end">
                <button class="btn create-invoice-btn" (click)="register = ''" >
                Cancel
                </button>
        
                <button class="btn create-invoice-btn"  (click)="register = ''">
                Save
                </button>
              </div>
        
    </app-modal>
    <router-outlet></router-outlet>

</div>
