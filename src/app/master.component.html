
<div class="master-container d-flex" >
    <div class="sidebar-container relative" [ngClass]="{'w-[12%]': !sidebarHidden}" >
        <app-sidebar2 [sidebarHidden]="sidebarHidden"></app-sidebar2>
        <div class="absolute  -right-4 top-0 z-50" >
            <button class=" text-3xl p-1 bg-customGreen/50 rounded-full text-white" (click)="toggleSidebar()">
              <i *ngIf="sidebarHidden" class="pi pi-angle-right text-xl"></i>
              <i *ngIf="!sidebarHidden" class="pi pi-angle-left text-xl"></i> 
              <!-- <i *ngIf="!sidebarHidden" class="pi pi-times"></i>  -->
            </button>
          </div>
      
    </div>
  
    <div class="main-container">
        <div class="navbar-container">
            <app-navbar [sidebarHidden]="sidebarHidden" (toggleSidebar)="toggleSidebar()"></app-navbar>
        </div>
        <div class="main">
            <router-outlet></router-outlet>
        </div>
        <app-dashboard-footer></app-dashboard-footer>
    </div>
</div>
