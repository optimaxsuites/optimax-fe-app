<div class="admin-corrections-card">
  <h2>Correction Requests (Admin)</h2>

  <app-table
    [columns]="adminCorrectionColumns"
    [rows]="requests"
  >
    <ng-template appTableBody let-row>
      <td>{{ row.employeeName || 'Employee' }}</td>
      <td>{{ row.date }}</td>
      <td>{{ row.issueType }}</td>
      <td>{{ row.status }}</td>
      <td>
        <button 
          *ngIf="row.status === 'PENDING'" 
          (click)="approve(row)">
          Approve
        </button>

        <div *ngIf="row.status === 'PENDING'" class="reject-box">
          <input 
            type="text" 
            placeholder="Reason for rejection"
            [(ngModel)]="rejectReason[row.id]" />
          <button (click)="reject(row)">Reject</button>
        </div>
      </td>
    </ng-template>
  </app-table>
</div>
