<div class="modal-overlay" (click)="closeModal()">
  <div class="modal" (click)="$event.stopPropagation()">
    <h2>Register Closeout</h2>

    <!-- Error Message Section -->
    <div *ngIf="errorMessage" class="error-message">
      <p class="text-red-500">{{ errorMessage }}</p>
    </div>

    <div class="balance-summary">
      <p>Opening Balance: <span>₦{{ openingAmount | number }}</span></p>
      <p>Sales Total: <span>₦{{ salesTotal | number }}</span></p>
      <p>
        <label for="closeAmount">Close Amount:</label>
        <input
          id="closeAmount"
          name="closeAmount"
          type="number"
          [(ngModel)]="closeAmount"
          min="0"
          placeholder="Enter Close Amount"
        />
      </p>
    </div>
    <br />

    <div class="cash-count-section">
      <h3>Cash Count</h3>
      <br />
      <div class="denomination-grid">
        <div class="denomination-row" *ngFor="let denom of denominations; let i = index">
          <label [for]="'denom-' + i">₦{{ denom }}:</label>
          <input
            [id]="'denom-' + i"
            [name]="'denom-' + i"
            type="number"
            [(ngModel)]="denominationCounts[denom]"
            min="0"
            placeholder="Enter Count"
          />
          <span class="denom-total">
            ₦{{ (denominationCounts[denom] || 0) * denom | number }}
          </span>
        </div>
      </div>
      <div class="total-row">
        <strong>Cash Count Total:</strong>
        <span> ₦{{ cashCountTotal | number }}</span>
      </div>
    </div>

    <div class="modal-actions">
      <button
        class="confirm-btn"
        (click)="validateDenominations()"
        [ngClass]="{ 'confirmed': isDenominationsConfirmed }"
      >
        {{ isDenominationsConfirmed ? '✓ Confirmed' : 'Confirm Denominations' }}
      </button>
      <button
        class="finalize-btn"
        (click)="finalizeRegister()"
        [disabled]="!canFinalize"
      >
        Finalize Register
      </button>
    </div>
  </div>
</div>
