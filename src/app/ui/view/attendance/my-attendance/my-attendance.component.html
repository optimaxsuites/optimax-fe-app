<app-side-modal *ngIf="isModalOpen" (close)="closeModal()" class="action-buttons mt-4">
  <div class="modal-content bg-white rounded-lg shadow-lg p-6 w-[80%] mx-auto">
    <button class="close-btn font-semibold text-xs bg-red-500 text-white rounded px-1 py-0.5" (click)="closeModal()">Close</button>
    <h2 class="text-xl font-bold mb-4">{{ modalTitle }}</h2>

    <ng-container *ngIf="modalType === 'todo'">
      <table class="w-full table-auto border-collapse border border-gray-800">
        <thead>
          <tr>
            <th class="border border-gray-300 px-4 py-2">Task</th>
            <th class="border border-gray-300 px-4 py-2">Due Date</th>
            <th class="border border-gray-300 px-4 py-2">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let task of todoTasks">
            <td class="border border-gray-300 px-4 py-2">{{ task.name }}</td>
            <td class="border border-gray-300 px-4 py-2">{{ task.dueDate }}</td>
            <td class="border border-gray-300 px-4 py-2">{{ task.status }}</td>
          </tr>
        </tbody>
      </table>
    </ng-container>

    <ng-container *ngIf="modalType === 'review'">
      <table class="w-full table-auto border-collapse border border-gray-800 mt-4">
        <thead>
          <tr>
            <th class="border border-gray-300 px-4 py-2">Review Title</th>
            <th class="border border-gray-300 px-4 py-2">Employee</th>
            <th class="border border-gray-300 px-4 py-2">Date</th>
            <th class="border border-gray-300 px-4 py-2">Comments</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let review of reviewData">
            <td class="border border-gray-300 px-4 py-2">{{ review.title }}</td>
            <td class="border border-gray-300 px-4 py-2">{{ review.employee }}</td>
            <td class="border border-gray-300 px-4 py-2">{{ review.date }}</td>
            <td class="border border-gray-300 px-4 py-2">{{ review.comments }}</td>
          </tr>
        </tbody>
      </table>
    </ng-container>

    <ng-container *ngIf="modalType === 'addEvent'">
      <table class="w-full table-auto border-collapse border border-gray-800 mt-4">
        <thead>
          <tr>
            <th class="border border-gray-300 px-4 py-2">Event Name</th>
            <th class="border border-gray-300 px-4 py-2">Date</th>
            <th class="border border-gray-300 px-4 py-2">Location</th>
            <th class="border border-gray-300 px-4 py-2">Notes</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let event of events">
            <td class="border border-gray-300 px-4 py-2">{{ event.name }}</td>
            <td class="border border-gray-300 px-4 py-2">{{ event.date }}</td>
            <td class="border border-gray-300 px-4 py-2">{{ event.location }}</td>
            <td class="border border-gray-300 px-4 py-2">{{ event.notes }}</td>
          </tr>
        </tbody>
      </table>
    </ng-container>
  </div>
</app-side-modal>

<div class="p-6 space-y-8  mx-auto">
  <!-- Header -->
  <!-- <div class="flex flex-col items-center space-y-2">
    <h2 class="text-2xl font-semibold">My Attendance</h2>
    <p class="text-gray-500">Today is {{ currentTime | date:'fullDate' }}</p>
  </div> -->

  <!-- Clock In Section -->
  <div class="bg-white rounded-2xl shadow p-6 text-center space-y-4">
    <div class="text-5xl font-mono text-gray-800">{{ currentTime }}</div>
    <div class="text-gray-500">
      Status:
      <span class="font-semibold"
        [class.text-green-600]="currentRecord"
        [class.text-gray-400]="!currentRecord">
        {{ currentRecord ? 'Clocked In' : 'Clocked Out' }}
      </span>
    </div>

    <button
      class="px-6 py-3 rounded-lg font-medium text-white transition"
      [class.bg-green-600]="!currentRecord"
      [class.bg-red-600]="currentRecord"
      (click)="currentRecord ? clockOut() : clockIn()">
      {{ currentRecord ? 'Clock Out' : 'Clock In' }}
    </button>
  </div>

  <!-- History Table -->
  <div class="bg-white rounded-2xl shadow p-6">
    <h3 class="text-lg font-semibold mb-4">Clock-In History</h3>
    <table class="min-w-full border-collapse">
      <thead>
        <tr class="text-left border-b text-sm text-gray-600">
          <th class="py-2">Date</th>
          <th class="py-2">Clock In</th>
          <th class="py-2">Clock Out</th>
          <th class="py-2">Duration</th>
          <th class="py-2">Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let rec of history" class="border-b text-sm">
          <td class="py-2">{{ rec.date }}</td>
          <td class="py-2">{{ rec.clockIn || '-' }}</td>
          <td class="py-2">{{ rec.clockOut || '-' }}</td>
          <td class="py-2">{{ rec.duration || '-' }}</td>
          <td class="py-2">
            <span
              class="px-2 py-1 rounded-full text-xs font-medium"
              [ngClass]="{
                'bg-green-100 text-green-700': rec.status === 'On Time',
                'bg-yellow-100 text-yellow-700': rec.status === 'Late',
                'bg-gray-100 text-gray-500': rec.status === 'Absent',
                'bg-blue-100 text-blue-700': rec.status === 'Present'
              }">
              {{ rec.status }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
