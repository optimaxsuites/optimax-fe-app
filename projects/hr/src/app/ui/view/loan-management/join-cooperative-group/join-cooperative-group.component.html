<div class="join-cooperative-group-modal">
  <div class="modal-header">
    <h2>Join a Cooperative Group</h2>
    <button class="close-btn" (click)="onClose()">&times;</button>
  </div>
  <div class="modal-body">
    <ul class="group-list">
      <li *ngFor="let group of availableGroups">
        <div class="group-info">
          <strong>{{ group.name }}</strong>
          <span>{{ group.description }}</span>
        </div>
        <button class="apply-btn" 
                [disabled]="!eligibleGroupIds.includes(group.id)"
                (click)="onApply(group.id)">
          {{ eligibleGroupIds.includes(group.id) ? 'Apply' : 'Not Eligible' }}
        </button>
      </li>
    </ul>
  </div>
</div>
