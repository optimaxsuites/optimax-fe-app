<div class="parent-container">
  <app-back-button></app-back-button>
  <div class="add-expense-container">
      <div class="expense-form">
          <div class="form-left">
              <div class="form-group">
                  <label for="amount">Amount</label>
                  <input type="number" id="amount" name="amount" placeholder="Enter amount">
              </div>
              <div class="form-group">
                  <label for="merchant">Merchant</label>
                  <input type="text" id="merchant" name="merchant" placeholder="Enter merchant">
              </div>
              <div class="form-group">
                  <label for="expense-date">Expense Date</label>
                  <input type="date" id="expense-date" name="expense-date">
              </div>
              <div class="form-group">
                  <label for="category">Category</label>
                  <select id="category" name="category">
                      <option value="travel">Travel</option>
                      <option value="food">Food</option>
                      <option value="accommodation">Accommodation</option>
                      <option value="other">Other</option>
                  </select>
              </div>
              <div class="form-group">
                  <label for="tax-rate">Tax Rate</label>
                  <select id="tax-rate" name="tax-rate">
                      <option value="standard">Standard</option>
                      <option value="reduced">Reduced</option>
                      <option value="zero">Zero</option>
                  </select>
              </div>
              <div class="form-group">
                  <label for="tax-percentage">Tax Percentage (%)</label>
                  <input type="number" id="tax-percentage" name="tax-percentage" placeholder="Enter tax percentage">
              </div>
              <div class="form-group">
                  <label for="tax-amount">Tax Amount (NGN)</label>
                  <input type="number" id="tax-amount" name="tax-amount" placeholder="Enter tax amount">
              </div>
              <hr>
              <div class="form-group">
                  <label for="pay-method">Payment method</label>
                  <select id="pay-method" name="pay-method">
                      <option value="standard">Cash</option>
                  </select>
              </div>
              <div class="form-group">
                  <label for="project">Project</label>
                  <select id="project" name="project">
                      <option value="standard">Cash</option>
                  </select>
              </div>
              <hr>
              <div class="form-group">
                  <label for="comment">Comment</label>
                  <textarea id="comments" name="comments" rows="4" cols="50" placeholder="Enter your comments here..."></textarea>
              </div>
          </div>
          <div class="form-right">
              <div class="upload-container">
                  <input type="file" id="upload-receipt" name="upload-receipt" class="upload-input">
                  <p>Click or drag file to to upload</p>
              </div>
          </div>
      </div>
</div>
