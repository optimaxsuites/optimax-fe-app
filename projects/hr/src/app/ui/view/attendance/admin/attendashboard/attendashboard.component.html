<div class="dashboard-container">
  <!-- Header Section -->
  <div class="dashboard-header">
    <div class="header-content">
      <div class="header-text">
        <h1>Attendance Overview</h1>
        <p>Monitor and manage employee attendance</p>
      </div>
      <div class="header-actions">
        <app-adminexport
          [data]="filteredAttendance"
          [filters]="currentFilters">
        </app-adminexport>
      </div>
    </div>
  </div>

  <!-- Summary Cards -->
  <div class="summary-cards">
    <div class="summary-card present">
      <div class="card-label">
        <i class="fa-solid fa-check-circle"></i>
        <span>Present</span>
      </div>
      <div class="card-value">{{ presentCount }}</div>
    </div>

    <div class="summary-card late">
      <div class="card-label">
        <i class="fa-solid fa-clock"></i>
        <span>Late</span>
      </div>
      <div class="card-value">{{ lateCount }}</div>
    </div>

    <div class="summary-card absent">
      <div class="card-label">
        <i class="fa-solid fa-user-slash"></i>
        <span>Absent</span>
      </div>
      <div class="card-value">{{ absentCount }}</div>
    </div>

    <div class="summary-card pending">
      <div class="card-label">
        <i class="fa-solid fa-hourglass-end"></i>
        <span>Pending Review</span>
      </div>
      <div class="card-value">{{ pendingCorrectionsCount }}</div>
    </div>
  </div>

  <!-- Attendance Table -->
  <app-attendancetable (dataChange)="onDataChange($event)"></app-attendancetable>
</div>
