

<div class="xll">
    <div class="container">
        <form class="user-info-form">
            <h1>User Information</h1>

            <div class="panel">
                <span class="d-flex justify-content-between" (click)="togglePanel1()">
                    <h2>Personal Details</h2>
                    <i class="pi" [ngClass]="isOpen1 ? 'pi-chevron-up' : 'pi-chevron-down'" style="font-size: 1em;"></i>
                </span>

                <p-divider></p-divider>

                <div class="panel-content" *ngIf="isOpen1">
                    <div class="input-wrapper">
                        <div class="input-width-1">
                            <label for="first-name">First Name</label><br>
                            <input type="text" id="first-name" name="first-name" required>
                        </div>
                    
                        <div class="input-width-1">
                            <label for="last-name">Last Name</label><br>
                            <input type="text" id="last-name" name="last-name" required>
                        </div>
                    </div>
                    
                    <div class="input-wrapper">
                        <div class="input-width-1">
                            <label for="gender">Gender</label>
                            <select id="gender" name="gender" required>
                                <option value="" disabled selected>Select your gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        
                        <div class="input-width-1">
                            <label for="dob">Date of Birth</label>
                            <input type="date" id="dob" name="dob" required>
                        </div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <span class="d-flex justify-content-between" (click)="togglePanel2()">
                    <h2>Contact Information</h2>
                    <i class="pi" [ngClass]="isOpen2 ? 'pi-chevron-up' : 'pi-chevron-down'" style="font-size: 1em;"></i>
                </span>

                <p-divider></p-divider>

                <div class="panel-content" *ngIf="isOpen2">
                    <div class="input-wrapper">
                        <div class="input-width-1">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="input-width-1">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required>
                        </div>
                    </div>
                    
                    <label for="address">Address</label>
                    <textarea id="address" name="address" rows="4" required></textarea>
                </div>
            </div>

            <div class="panel">
                <span class="d-flex justify-content-between" (click)="togglePanel3()">
                    <h2>Other Details</h2>
                    <i class="pi" [ngClass]="isOpen3 ? 'pi-chevron-up' : 'pi-chevron-down'" style="font-size: 1em;"></i>
                </span>

                <p-divider></p-divider>

                <div class="panel-content" *ngIf="isOpen3">
                    <div class="input-wrapper">
                        <div class="input-width-1">
                            <label for="occupation">Occupation</label>
                            <input type="text" id="occupation" name="occupation" required>
                        </div>
                        <div class="input-width-1">
                            <label for="company">Company</label>
                            <input type="text" id="company" name="company">
                        </div>
                    </div>
                    
                    <label for="bio">Bio</label>
                    <textarea id="bio" name="bio" rows="4"></textarea>
                </div>
            </div>

            
            <button type="submit">Add information</button>

        </form>
    </div>
</div>
