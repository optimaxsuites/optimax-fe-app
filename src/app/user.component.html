<div class="max-h-screen h-screen min-h-screen">
    <app-modal *ngIf="register.length > 0" (close)="registerButton()" [header]="register === 'open' ? 'Open Register' : 'Close Register'">
            <div *ngIf="openingAmount.length > 0" class="py-3 font-semibold ">Your opening amount was: ₦{{openingAmount}}</div>
        <div class="flex items-center gap-3 p-3 my-3 mx-2 border bg-white/50 rounded-xl w-[30vw]">
            <label for="orderName" class=" font-semibold">{{register === 'open' ? 'Opening Amount' : 'Closing Amount'}}</label>
            <input class="outline-none text-gray-600" type="text" id="orderName" [(ngModel)]="inputValue" placeholder="Type here">
        </div>
            <div class="modalBtn mt-5 flex-end">
                <button class="btn create-invoice-btn" (click)="registerButton()" >
                Cancel
                </button>

                <button class="btn create-invoice-btn"  (click)="handleRegister()">
                Save
                </button>
              </div>

    </app-modal>
    <router-outlet></router-outlet>

</div>

<p-toast position="top-right" key="tf" />
