<div class="membership-applications">
  <h2>Pending Cooperative Membership Applications</h2>
  <div *ngIf="actionMessage" class="action-message">{{ actionMessage }}</div>
  <table *ngIf="pendingApplications.length > 0" class="pending-table">
    <thead>
      <tr>
        <th>Applicant Name</th>
        <th>Employee ID</th>
        <th>Requested Tier</th>
        <th>Applied On</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let application of pendingApplications">
        <td>{{ application.fullName }}</td>
        <td>{{ application.employeeId }}</td>
        <td>{{ application.requestedTier }}</td>
        <td>{{ application.requestDate | date:'medium' }}</td>
        <td>
          <button class="approve-btn" (click)="approveApplication(application.id)">Approve</button>
          <button class="reject-btn" (click)="rejectApplication(application.id)">Reject</button>
        </td>
      </tr>
    </tbody>
  </table>
  <div *ngIf="pendingApplications.length === 0" class="empty-state">
    No pending membership applications.
  </div>
</div>
