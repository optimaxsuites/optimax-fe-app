<div  class="w-full bg-white/90 my-3 rounded-2xl  p-8 text-gray-800">

  <hr>

  <div class=" flex gap-28 mb-5 items-center">
    <div class="flex gap-2 justify-center items-center">
      <!-- Search bar on the left -->


      <!-- User profile info (username and avatar) in the center -->
      <div class="flex gap-2 justify-center flex-col text-center">
        <img src="https://cdn.vectorstock.com/i/500p/53/42/user-member-avatar-face-profile-icon-vector-22965342.jpg" alt="" class="w-72 h-72"/>
        <p class="font-bold text-gray-700 text-[18px] capitalize">{{ userRegData.fullname }}</p>
      </div>
    </div>

    <!-- Existing layout for total days, regular time, and overtime -->
    <div class="flex gap-12 items-center">
      <div class="flex flex-col justify-center text-center bg-customBlue px-5 py-4 rounded-xl text-white">
        <p>Total Days</p>
        <p class="text-[24px] pt-4 font-semibold">7.00 Day(s)</p>
      </div>

      <div class="flex flex-col justify-center text-center bg-customBlue px-5 py-4 rounded-xl text-white">
        <p>Regular Time</p>
        <p class="text-[24px] pt-4 font-semibold">8.00 Hr(s)</p>
      </div>

      <div class="flex flex-col justify-center text-center bg-customBlue px-5 py-4 rounded-xl text-white">
        <p>Over Time</p>
        <p class="text-[24px] pt-4 font-semibold">21.00 Hr(s)</p>
      </div>
    </div>




  </div>

  <hr>
  <div class="my-5 justify-between gap-6 flex w-full">
    <!-- Left side content -->
    <div class="w-[58%] flex flex-col gap-4">
      <div class="label-value" style="display: flex; align-items: center; margin-bottom: 10px;">
        <label style="flex: 0 0 120px; font-weight: bold;">Clocked In Time:</label>
        <p style="flex: 1 0 auto;">{{ clockedInTime }}</p>
      </div>
      <div class="label-value" style="display: flex; align-items: center; margin-bottom: 10px;">
        <label style="flex: 0 0 120px; font-weight: bold;">Date:</label>
        <p style="flex: 1 0 auto;">{{ currentDate }}</p>
      </div>
      <div class="label-value" style="display: flex; align-items: center; margin-bottom: 10px;">
        <label style="flex: 0 0 120px; font-weight: bold;">Time:</label>
        <p style="flex: 1 0 auto;">{{ currentTime }}</p>
      </div>
    </div>

    <!-- Right side content (textarea) -->
    <div class="w-[40%]">
      <textarea [(ngModel)]="note" placeholder="Enter note"
                style="width: 100%; height: 100px; border: 1px solid #ccc; padding: 10px; resize: none;"></textarea>
    </div>
  </div>


  <div class="flex items-center justify-end mb-6">
    <button (click)="toggleClockInOut()" style="padding: 10px 20px; background-color: #2f6276; color: #fff; border: none; border-radius: 5px; cursor: pointer;">{{ isClockedIn ? 'Clock Out' : 'Clock In' }}</button>

    </div>

    <div class="flex justify-end mb-6">
      <div class="search-bar w-[40%]">
        <input
          type="text"
          placeholder="Search by Period"
          [(ngModel)]="searchTerm"
          (ngModelChange)="filterCandidates()"
          class="editInput w-full"
        />
      </div>
    </div>








</div>
