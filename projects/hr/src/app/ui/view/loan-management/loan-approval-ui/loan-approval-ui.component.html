<div class="loan-approval-container">
    <p-messages [(value)]="messages" [enableService]="false"></p-messages>

    <!-- Add loading indicator -->
    <div *ngIf="isLoading" class="loading">
        Loading applications...
    </div>

    <div *ngIf="!isLoading">
        <header class="approval-header lm-header-card">
            <div class="header-left">
                <app-back-button (click)="goBack()"></app-back-button>
                <h1>Loan Applications</h1>
            </div>
            <div class="search-box">
                <input type="text"
                       placeholder="Search by employee name or ID..."
                       (keyup)="onSearch($event)"
                       [(ngModel)]="searchTerm">
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card" [class.active-filter]="filters.status === 'PENDING'" (click)="applyStatusFromCard('PENDING')">
                <div class="stat-icon pending-icon"><i class="fas fa-hourglass-half"></i></div>
                <div class="stat-content">
                    <span class="stat-label">Pending</span>
                    <span class="stat-value">{{ statusCounts.pending }}</span>
                </div>
            </div>
            <div class="stat-card" [class.active-filter]="filters.status === 'APPROVED'" (click)="applyStatusFromCard('APPROVED')">
                <div class="stat-icon approved-icon"><i class="fas fa-check-circle"></i></div>
                <div class="stat-content">
                    <span class="stat-label">Approved</span>
                    <span class="stat-value">{{ statusCounts.approved }}</span>
                </div>
            </div>
            <div class="stat-card" [class.active-filter]="filters.status === 'REJECTED'" (click)="applyStatusFromCard('REJECTED')">
                <div class="stat-icon rejected-icon"><i class="fas fa-ban"></i></div>
                <div class="stat-content">
                    <span class="stat-label">Rejected</span>
                    <span class="stat-value">{{ statusCounts.rejected }}</span>
                </div>
            </div>
            <div class="stat-card" [class.active-filter]="filters.status === ''" (click)="applyStatusFromCard('')">
                <div class="stat-icon total-icon"><i class="fas fa-file-invoice"></i></div>
                <div class="stat-content">
                    <span class="stat-label">Total Applications</span>
                    <span class="stat-value">{{ statusCounts.total }}</span>
                </div>
            </div>
        </div>

        <!-- Filters Section -->
        <div class="loan-filters">
            <!-- Employee ID Filter -->
            <div class="filter-group">
                <label for="employeeIdFilter">Employee ID:</label>
                <input type="text"
                       id="employeeIdFilter"
                       [(ngModel)]="filters.employeeId"
                       (ngModelChange)="applyFilters()"
                       placeholder="EMP-001">
            </div>

            <!-- Department Dropdown Filter -->
            <div class="filter-group">
                <label for="departmentFilter">Department:</label>
                <select id="departmentFilter"
                        [(ngModel)]="filters.department"
                        (ngModelChange)="applyFilters()">
                    <option value="">All Departments</option>
                    <option value="Finance">Finance</option>
                    <option value="HR">HR</option>
                    <option value="IT">IT</option>
                    <option value="Sales">Sales</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Operations">Operations</option>
                </select>
            </div>

            <!-- Status Filter -->
            <div class="filter-group">
                <label for="statusFilter">Status:</label>
                <select id="statusFilter"
                        [(ngModel)]="filters.status"
                        (ngModelChange)="applyFilters()">
                    <option value="">All Status</option>
                    <option value="PENDING">PENDING</option>
                    <option value="APPROVED">APPROVED</option>
                    <option value="REJECTED">REJECTED</option>
                </select>
            </div>

            <!-- Refresh Button -->
            <button class="refresh-btn" (click)="loadApplications()">Refresh</button>
            
            <!-- Reset Button -->
            <button class="reset-btn" (click)="resetFilters()">Reset Filters</button>
        </div>

        <!-- Results Count -->
        <div class="results-count">
            Showing {{ filteredLoans.length }} of {{ loanApplications.length }} applications
        </div>

        <!-- Table Section -->
        <div class="approval-table-container">
            <app-table
                [columns]="loanColumns"
                [rows]="filteredLoans"
                [actions]="loanActions"
                [emptyMessage]="'No loan applications found matching your filters'"
                (actionClick)="handleLoanAction($event)"
            ></app-table>
        </div>
    </div>
</div>
