<div class="modal-backdrop" (click)="cancel()"></div>

<section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="correction-form-title">
  <div class="modal-header">
    <div class="header-icon"><i class="fas fa-clock-rotate-left"></i></div>
    <div class="header-copy">
      <h3 id="correction-form-title">New Correction Request</h3>
      <p>Share the attendance detail that needs to be corrected.</p>
    </div>
    <button type="button" class="close-btn" (click)="cancel()" aria-label="Close correction request form">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="modal-body">
      <div class="form-row">
      <div class="form-group">
        <label for="correction-date">Date of incident <span class="required">*</span></label>
        <input id="correction-date" type="date" formControlName="date" [max]="today" required />
      </div>

      <div class="form-group">
        <label for="correction-issue">Issue type <span class="required">*</span></label>
        <select id="correction-issue" formControlName="issueType" (change)="onIssueTypeChange($event)">
          <option value="" disabled>Select issue type</option>
          <option *ngFor="let type of issueTypes" [value]="type.value">
            {{ type.label }}
          </option>
          <option value="ADD_NEW" style="color: #10b981; font-weight: 600;">+ Add New Issue Type</option>
        </select>
      </div>
      </div>

      <div class="form-row" *ngIf="showClockIn || showClockOut">
        <div class="form-group" *ngIf="showClockIn">
          <label for="correction-clock-in">Correct clock-in time</label>
          <input id="correction-clock-in" type="time" formControlName="requestedClockIn" />
        </div>
        <div class="form-group" *ngIf="showClockOut">
          <label for="correction-clock-out">Correct clock-out time</label>
          <input id="correction-clock-out" type="time" formControlName="requestedClockOut" />
        </div>
      </div>
      <p *ngIf="timeError" class="required">{{ timeError }}</p>

      <div class="form-group">
        <label for="correction-description">Description <span class="required">*</span></label>
        <textarea
          id="correction-description"
          rows="3"
          formControlName="description"
          placeholder="Explain the missing punch or incorrect time">
        </textarea>
      </div>

      <div class="form-group evidence-group">
        <label for="correction-evidence">Evidence <span class="optional-label">Optional</span></label>
        <div class="evidence-container">
          <textarea
            id="correction-evidence"
            rows="3"
            formControlName="evidence"
            placeholder="Add supporting details, document references, or manager notes">
          </textarea>
          <div class="evidence-upload">
            <label for="evidence-file" class="file-upload-btn">
              <i class="fa-solid fa-paperclip"></i> Attach image
            </label>
            <input
              type="file"
              id="evidence-file"
              accept="image/*"
              (change)="onEvidenceFileSelected($event)"
              style="display: none;">
            <span *ngIf="evidenceFileName" class="file-info">
              <i class="fas fa-image"></i> {{ evidenceFileName }}
            </span>
          </div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="cancel-btn" (click)="cancel()">Cancel</button>
      <button type="submit" class="submit-btn" [disabled]="form.invalid">
        <i class="fas fa-paper-plane"></i> Submit Request
      </button>
    </div>
  </form>

  <!-- Add New Issue Type Modal -->
  <div class="modal-backdrop-inner" *ngIf="showAddIssueModal" (click)="closeAddIssueModal()"></div>
  <div class="add-issue-modal" *ngIf="showAddIssueModal">
    <div class="modal-header-inner">
      <h4>Add New Issue Type</h4>
      <button type="button" class="close-btn-inner" (click)="closeAddIssueModal()">x</button>
    </div>
    <div class="modal-content-inner">
      <input
        type="text"
        [(ngModel)]="newIssueTypeLabel"
        placeholder="Enter issue type name"
        (keyup.enter)="addNewIssueType()">
    </div>
    <div class="modal-actions-inner">
      <button type="button" class="cancel-btn" (click)="closeAddIssueModal()">Cancel</button>
      <button type="button" class="submit-btn" (click)="addNewIssueType()" [disabled]="!newIssueTypeLabel.trim()">Add</button>
    </div>
  </div>
</section>
