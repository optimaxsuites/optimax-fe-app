<div class="heatmap">
  <ng-container *ngIf="departments.length > 0; else noData">
    <div
      class="heatmap-row"
      *ngFor="let dept of departments"
      [style.background]="getHeatColor(dept.attendance)"
    >
      <span>{{ dept.department }}</span>
      <span>{{ dept.attendance }}%</span>
    </div>
  </ng-container>

  <ng-template #noData>
    <p>No data for selected period :P</p>
  </ng-template>
</div>
