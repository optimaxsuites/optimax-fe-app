<div class="body">
    <div class="form-container">
        <h2>Add New Client</h2>
        <form>
            <div class="form-group-lg">
                <div class="upload-logo">
                    <p>Upload Logo</p>
                    <p>JPG or PNG, Dimensions 1080x1080px and file size up to 20MB</p>
                </div>
            </div>
            <div class="d-flex">
                <div class="form-group">
                    <label for="business-name">Business Name <span style="color: red;">*</span></label>
                    <input type="text" id="business-name" name="business-name" class="form-control-opti" required>
                </div>
                <div class="form-group">
                    <label for="client-industry">Client Industry</label>
                    <select id="client-industry" name="client-industry">
                        <option value="">-Select an Industry-</option>
                        <!-- Add more options as needed -->
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="street-address">Street Address</label>
                <input type="text" id="street-address" name="street-address">
            </div>

            <div class="d-flex">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                    <!-- <input type="checkbox" id="show-email-in-invoice" name="show-email-in-invoice">
                    <label for="show-email-in-invoice">Show Email in Invoice</label> -->
                </div>
                <div class="form-group">
                    <label for="phone-number">Phone Number</label>
                    <input type="tel" id="phone-number" name="phone-number" placeholder="+234">
                    <!-- <input type="checkbox" id="show-phone-in-invoice" name="show-phone-in-invoice">
                    <label for="show-phone-in-invoice">Show Phone in Invoice</label> -->
                </div>
            </div>

            

            <div class="d-flex">
                <div class="form-group">
                    <label for="country">Select Country <span style="color: red;">*</span></label>
                    <select id="country" name="country" required>
                        <option value="Nigeria">Nigeria</option>
                        <!-- Add more options as needed -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city">
                </div>
            </div>

            <div class="d-flex">
                <div class="form-group">
                    <label for="state">State / Province</label>
                    <select id="state" name="state">
                        Add state options as needed
                    </select>
                </div>
                <div class="form-group">
                    <label for="postal-code">Postal Code</label>
                    <input type="text" id="postal-code" name="postal-code">
                </div>
            </div>

            <div class="d-flex">
                <div class="form-group">
                    <label for="vat-number">VAT Number <span class="optional">(optional)</span></label>
                    <input type="text" id="vat-number" name="vat-number">
                </div>
                <div class="form-group">
                    <label for="unique-key">Unique Key</label>
                    <input type="text" id="unique-key" name="unique-key">
                </div>
            </div>

            
            
            
            
            <!-- <div class="form-group">
                <label for="business-alias">Business Alias (Nick Name) <span class="optional">(optional)</span></label>
                <input type="text" id="business-alias" name="business-alias">
            </div> -->
            
            
            <div class="form-actions">
                <button type="submit">Save</button>
            </div>
        </form>
    </div>
</div>
