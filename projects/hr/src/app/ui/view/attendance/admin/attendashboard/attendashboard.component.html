<div class="dashboard-container">
  <!-- Header Section -->
  <div class="dashboard-header">
    <div class="header-content">
      <div class="header-text">
        <h1>Attendance Overview</h1>
        <p>Monitor and manage employee attendance</p>
      </div>
      <div class="header-actions">
        <button
          class="mark-attendance-btn"
          [disabled]="markingAttendance"
          (click)="markAttendance()">
          <i class="fa-solid fa-user-check"></i>
          {{ markingAttendance ? 'Marking...' : 'Mark Attendance' }}
        </button>
        <app-adminexport
          [data]="filteredAttendance"
          [filters]="currentFilters">
        </app-adminexport>
      </div>
    </div>
    <p class="mark-attendance-message" *ngIf="markAttendanceMessage">{{ markAttendanceMessage }}</p>
  </div>

  <!-- Summary Cards - Clickable Quick Filters, sourced from GET attendance/stats/today -->
  <app-stats-cards
    [stats]="todayStats"
    [activeCard]="activeCard"
    [pendingApprovals]="pendingApprovalsCount"
    [crossBranchCount]="crossBranchCount"
    [correctionRequestsCount]="correctionRequestsCount"
    (statusClick)="filterByStatus($event)"
    (pendingClick)="filterByPendingApproval()">
  </app-stats-cards>

  <!-- Live lists from GET attendance/late/today and GET attendance/absent/today -->
  <div class="dashboard-lists">
    <app-late-arrivals [lateArrivals]="lateArrivals"></app-late-arrivals>
    <app-absent-list [absentees]="absentees"></app-absent-list>
  </div>

  <!-- Attendance Table -->
  <app-attendancetable
    (dataChange)="onDataChange($event)"
    [externalFilters]="filteredAttendance">
  </app-attendancetable>
</div>
