<app-table
  [columns]="columns"
  [rows]="vendors"
  [actions]="actions"
  [paginator]="true"
  [rowsPerPage]="10"
  [rowClickable]="true"
  dataKey="id"
  (rowClick)="reviewVendor($event)"
  (actionClick)="onAction($event)"
></app-table>

<p-dialog
  [(visible)]="actionDialog"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  header="Vendor Action"
  [style]="{ width: '520px' }"
>
  <div class="space-y-3">
    <div class="text-sm text-slate-700">
      <div class="font-semibold text-slate-900">
        {{ selected?.legalName }}
      </div>
      <div class="text-slate-500">{{ selected?.email }}</div>
    </div>

    <div class="rounded-xl border border-slate-200 bg-slate-50 p-3 text-sm">
      <div class="font-medium text-slate-700">
        Action: <span class="text-slate-900">{{ action }}</span>
      </div>
      <div class="text-xs text-slate-500 mt-1">
        Add an optional note for audit and communication.
      </div>
    </div>

    <textarea
      rows="4"
      pInputTextarea
      fclass="w-full"
      [(ngModel)]="reason"
      placeholder="Reason / note (optional)"
    ></textarea>
  </div>

  <ng-template pTemplate="footer">
    <button
      pButton
      class="p-button-text"
      label="Cancel"
      (click)="actionDialog = false"
    ></button>
    <button pButton label="Submit" (click)="submitAction()"></button>
  </ng-template>
</p-dialog>

<app-large-side-modal
  *ngIf="displayVendorDialog"
  [header]="'Vendor Details'"
  [subheader]="
    'Supplier master data, onboarding submission, AI validation and compliance documents.'
  "
  (close)="displayVendorDialog = false"
>
  <app-vendor-details [vendor]="selectedVendor"></app-vendor-details>
</app-large-side-modal>
