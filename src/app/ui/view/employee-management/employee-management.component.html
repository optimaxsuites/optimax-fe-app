<div class="flex w-full justify-between gap-4 px-3 my-2 table-item">
  <div class="flex gap-4 items-center">
    <div class="w-full">
      <ng-select
        [items]="uniqueLevels"
        bindLabel="position"
        [multiple]="true"
        placeholder="Filter by level type"
        [(ngModel)]="selectedEmployeeType"
        (ngModelChange)="filterBySelectedEmployeeType()">
      </ng-select>
    </div>

    <div class="w-full">
      <ng-select
        [items]="uniquePositions"
        bindLabel="position"
        [multiple]="true"
        placeholder="Filter by position"
        [(ngModel)]="selectedPosition"
        (ngModelChange)="filterBySelectedPosition()"
        >
      </ng-select>
    </div>
    <input
    type="text"
    placeholder="Search"
    [(ngModel)]="searchTerm"
    (ngModelChange)="applyFilters()"
    class="editInput bg-gray-50 w-full outline-none"
  />
  </div>
  <div class="flex items-end">
      <Button  class="bg-customBlue hover:bg-customBlueHover text-white rounded-xl  p-3" (click)="openAddForm = true">Add new employee</Button>
     </div>
</div>

<div class="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-8 p-8" >
    <div *ngFor="let employee of filteredEmployees; let i = index" class=" bg-gray-50 transition ease-linear hover:scale-105 hover:border-2 text-customBlue text-center rounded-xl cursor-pointer flex flex-col  items-center  justify-center w-[20rem] p-2 relative"  (click)="viewThisEmployee(employee)">
      <p class="font-bold text-customBlue/70 absolute right-0 top-0"><i class="fa-solid fa-circle mr-2"  [ngClass]="{ 'text-customGreen animate-pulse': i % 2 === 0, 'text-yellow-600': i % 2 !== 0 }"></i></p>
         <img [src]="employee.profileImage || 'https://media.istockphoto.com/id/1223671392/vector/default-profile-picture-avatar-photo-placeholder-vector-illustration.jpg?s=612x612&w=0&k=20&c=s0aTdmT5aU6b8ot7VKm11DeID6NctRCpB755rA1BIP0='" alt="" class="rounded-full w-36 h-36">
        <p class="text-[15px] font-bold mt-3 capitalize mb-2">{{employee.lastName}}{{' '}}{{employee.firstName}}</p>
        <p class="text-[14px] capitalize">{{employee.jobTitle}}</p>
    </div>
</div>

<app-large-side-modal *ngIf="viewEmployee" (close)="viewEmployee = false" class="flex flex-col gap-8 table-item">
<app-nav-tab [tabsConfig]="tabsConfig"></app-nav-tab> 
</app-large-side-modal>

<app-large-side-modal *ngIf="openAddForm" (close)="closeAddForm()">
  <!-- <app-add-employee-form [close]="closeAddForm.bind(this)" [admin]="true"></app-add-employee-form> -->
   <app-admin-creation-form></app-admin-creation-form>
</app-large-side-modal>
