<section>
  <div class="first-container01">
    <div class="vendorCategory">
      <span>Name</span>
      <br />
      <input
        [(ngModel)]="categoryName"
        class="inputField"
        type="text"
        placeholder=" Name" (keydown)="onKeydown($event)"
      />
    </div>
    <div class="vendorCategory">
      <span>Code</span>
      <br />
      <input
        [(ngModel)]="categoryCode"
        class="inputField"
        type="text"
        placeholder="Code" (keydown)="onKeydown($event)"
      />
    </div>
    <div class="vendorCategory">
      <span>Description</span>
      <br />
        <textarea 
        [(ngModel)]="categoryDesc" cols="54" rows="15" placeholder="Description" class="descText" (keydown)="onKeydown($event)" ></textarea>
    </div>
  </div>

  <div class="btn-wrapper">
    <button (click)="saveCategory()" class="saveButton">Save & Continue</button>
  </div>
</section>

<form class="createVendor">
  <div class="inputFlex">
    <div class="vendorCategory">
      <span>Vendor Name</span>
      <br />
      <input
        [(ngModel)]="vendorName"
        class="inputField"
        type="text"
        placeholder="Name"
      />
    </div>
    <div class="vendorCategory">
      <span>Vendor Type</span>
      <br />
      <select name="" id="" class="smallInput">
        <option value="" disabled selected hidden>Choose Type</option>
        <option value="individual">Individual
        </option>
        <option value="Company">Company</option>
      </select>
      
      <!-- <input
        [(ngModel)]="vendorCACNum"
        class="smallInput"
        type="text"
        placeholder="CAC Number"
      /> -->
    </div>
  </div>

  <div class="inputFlex">
    <div class="vendorCategory">
      <span>Vendor Address</span>
      <br />
      <input
        [(ngModel)]="vendorAddress"
        class="inputField"
        type="text"
        placeholder="Address"
      />
    </div>
    <div class="vendorCategory">
      <span>Industry</span>
      <br />
      <input
        [(ngModel)]="vendorPhoneNumber"
        class="smallInput"
        type="text"
        placeholder="Industry"
      />
    </div>
    </div>

    <div class="inputFlex">
    <div class="vendorCategory">
      <span>Vendor Email</span>
      <br />
      <input
        [(ngModel)]="vendorEmail"
        class="inputField"
        type="text"
        placeholder="Email"
      />
    </div>
    <div class="vendorCategory">
      <span>Category</span>
      <br />
      <input
        [(ngModel)]="vendorServices"
        class="smallInput"
        type="text"
        placeholder="Category"
      />
    </div>
  </div>

    <div class="inputFlex">
    <div class="vendorCategory">
      <span>Contact Person</span>
      <br />
      <input

    </div>
    <div class="vendorCategory">
      <span>Phone Number</span>
      <br />
      <input
        [(ngModel)]="vendorServices"

        type="text"
        placeholder="Phone Number"
      />
    </div>
  </div>

    <div class="inputFlex">

      <br />
      <input

      <input
        [(ngModel)]="vendorEmail"

        type="text"
        placeholder="Website Link"
      />
    </div>
  </div>

    <div class="inputFlex">
    
   
    <div class="vendorCategory">
      <span>Country</span>
      <br />
      <input
        [(ngModel)]="vendorEmail"
        class="inputField"
        type="text"
        placeholder="Country"
      />
    </div>
    <div class="vendorCategory">
      <span>Street Address</span>
      <br />
      <input
        [(ngModel)]="vendorServices"
        class="smallInput"
        type="text"
        placeholder="Street Address"
      />
    </div>
  </div>

    <div class="inputFlex">
      <div class="vendorCategory">
      <span>State</span>
      <br />
