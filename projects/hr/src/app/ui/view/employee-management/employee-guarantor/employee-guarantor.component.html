<div *ngIf="onboardingStatus == 'inProgress'" class="flex justify-center items-center h-[80vh]">
    <div class="flex flex-col gap-4 justify-center items-center h-full text-customBlue">
        <i class="fa-solid fa-lock text-5xl"></i>
        <p class="text-3xl font-bold text-center text-customBlue">Employee has not completed their onboarding process, click <span routerLink="/user/onboarding/{{employeeInView.id}}/uthedhk45678j" class="text-customGreen font-bold cursor-pointer">here</span> to continue the process</p>
    </div>
</div>
<div *ngIf="onboardingStatus == 'completed'" class="grid grid-cols-2 gap-3">
    <div *ngFor="let kin of employeeInView.guarantor; let i =index"  class="flex flex-col gap-2 bg-white shadow-sm rounded-xl">
        <p class="text-gray-50 font-semibold text-lg text-center py-2 bg-customBlue w-36 rounded-tl-xl rounded-br-xl">Guarantor {{i+1}}</p>
        <p *ngFor="let key of getKeys(kin)" class="ml-1 font-normal text-customBlue pt-2 px-3">
          <strong >{{ toTitleCaseWithSpace(key) | titlecase }}:</strong>
          <ng-container *ngIf="isFile(kin[key]); else textField">
            <button (click)="previewFile(kin[key])" class="text-customGreen  text-nowrap text-[12px] ml-2">
              View
            </button>
            <a [href]="kin[key]" download="{{employeeInView.firstName}}-guarantor-{{i+1}}-{{key}}.png" class="text-customGreen no-underline text-nowrap text-[12px] ml-2">
              Download
            </a>
          </ng-container>
          
          <ng-template #textField class="font-bold text-customBlue/70">
            {{ kin[key] }}
          </ng-template>
        </p>
      </div>


      <app-modal *ngIf="showModal" (close)="closeModal()"  class="fixed top-0 left-0 w-full h-[100vh] bg-black/50 flex justify-center items-center">
        <img [src]="fileDataUrl" class="w-full max-h-[80vh]"/>
    </app-modal>
</div>
