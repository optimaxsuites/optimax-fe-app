<h1 class="text-3xl  text-center"> Suppliers Details</h1>
<label for="category" class="block font-medium text-2xl ">Suppliers Name</label>
<input id="category" type="text" class="border rounded-lg p-4 w-full  bg-gray-100  text-xl mb-4" [value]="supplier.supplierName" readonly>
<label for="category" class="block font-medium text-2xl   ">Contact Person </label>
<input id="category" type="text" class="border rounded-lg p-4 w-full  bg-gray-100  text-xl mb-4" [value]="supplier.contactPerson" readonly>
<label for="category" class="block font-medium text-2xl ">Email</label>
<input id="category" type="text" class="border rounded-lg p-4 w-full  bg-gray-100  text-xl mb-4" [value]="supplier.email" readonly>
<label for="category" class="block font-medium text-2xl ">Phone Number </label>
<input id="category" type="text" class="border rounded-lg p-4 w-full  bg-gray-100  text-xl mb-4" [value]="supplier.phone" readonly>
<label for="category" class="block font-medium text-2xl ">Address </label>
<input id="category" type="text" class="border rounded-lg p-4 w-full  bg-gray-100  text-xl mb-4" [value]="supplier.address" readonly>
<label for="category" class="block font-medium text-2xl ">Products </label>
<input id="category" type="text" class="border rounded-lg p-4 w-full  bg-gray-100  text-xl mb-4" [value]="supplier.products" readonly>
<label for="category" class="block font-medium text-2xl ">Date: {{ Date }} , {{Time}} </label>
</div>
  </div>
</div>
