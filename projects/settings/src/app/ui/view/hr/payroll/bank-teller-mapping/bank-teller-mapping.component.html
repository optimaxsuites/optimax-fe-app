<div class="space-y-6">
  <p-table 
    [value]="template?.columns || []" 
    styleClass="p-datatable-sm"
    class="block border border-gray-100 rounded-lg overflow-hidden">
    
    <ng-template pTemplate="header">
      <tr class="bg-gray-50/50">
        <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider border-b border-gray-100">
          Bank Column
        </th>
        <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider border-b border-gray-100">
          System Field
        </th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-col>
      <tr class=" hover:bg-gray-50/80 transition-colors">
        <td class="px-3 py-2 border-b border-gray-100 border-r-dashed">
          <input
            type="text"
            pInputText
            [(ngModel)]="col.header"
            placeholder="Enter column name"
            class="w-full p-inputtext-sm border-transparent bg-transparent hover:border-gray-300 focus:bg-white transition-all editInput"
          />
        </td>
        <td class="px-3 py-2 border-b border-gray-100">
          <p-dropdown
            [options]="systemFields"
            [(ngModel)]="col.field"
            optionLabel="label"
            optionValue="value"
            scrollHeight="200px"
            appendTo="body"
            placeholder="Select Field"
            styleClass="w-full p-dropdown-sm border-0 bg-transparent"
          ></p-dropdown>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <div class="flex justify-end pt-2">
    <button
      pButton
      label="Save Template"
      icon="pi pi-check"
      (click)="saveTemplate()"
      class="bg-customBlue px-6 py-3 text-white text-sm font-medium rounded-md shadow-sm"
    ></button>
  </div>
</div>
