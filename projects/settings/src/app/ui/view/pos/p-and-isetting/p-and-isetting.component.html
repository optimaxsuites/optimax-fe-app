<div class="px-6 bg-gray-50 min-h-screen">
  
  <div class="flex gap-4 items-center mb-6">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-customBlue" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
    </svg>
    <div>
        <p class="text-customBlue/60 text-base">E-Commerce</p>
        <p class="text-customBlue font-semibold text-xl">E-Store Configuration</p>
    </div>
  </div>
  <header class="relative mb-4">
    
    <nav class="border-b border-gray-200">
      <ul class="flex space-x-6 -mb-px text-lg">
        <li>
          <a
            (click)="setActiveTab('payment')"
            [ngClass]="{
              'border-b-4 border-customBlue  text-gray-900 font-bold': activeTab === 'payment',
              'text-gray-700 hover:text-gray-900': activeTab !== 'payment'
            }"
            class="inline-block py-2 px-1 cursor-pointer transition duration-150 ease-in-out"
          >
            Payment Setup
          </a>
        </li>
        <li>
          <a
            (click)="setActiveTab('delivery')"
            [ngClass]="{
              'border-b-4 border-customBlue text-gray-900 font-bold': activeTab === 'delivery',
              'text-gray-700 hover:text-gray-900': activeTab !== 'delivery'
            }"
            class="inline-block py-2 px-1 cursor-pointer transition duration-150 ease-in-out"
          >
            Delivery Settings
          </a>
        </li>
      </ul>
    </nav>
   
  </header>

  <div class="mt-2">
    
    <ng-container *ngIf="activeTab === 'payment'">
     
      <div class="p-6 bg-gray-50 min-h-screen">

     <div class=" text-customBlue bg-blue-50  border border-blue-200 p-3 rounded-lg mb-4">
          <p class="font-bold">INSTRUCTION & SECURITY NOTE:</p> 
          <p>You only need to paste your <b>Public Key</b>  here. <b>Do not</b> paste your Secret Key (which starts with 'sk_...').
        </div>
  <app-paykeys></app-paykeys>
  </div>
    </ng-container>
    <ng-container *ngIf="activeTab === 'delivery'">
      <app-delvery></app-delvery>
    </ng-container>
    </div>
</div>
