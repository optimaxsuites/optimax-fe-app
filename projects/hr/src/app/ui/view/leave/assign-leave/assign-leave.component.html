<div class="w-full bg-white/90 my-3 rounded-2xl p-8 text-gray-800 table-item">
  <h2 class="font-bold text-gray-700">Assign leave</h2>
  <hr />

  <div class="w-[60%] flex mt-5 flex-col gap-4">
    <div>
      <p>Employee*</p>
      <div class="w-full">
        <ng-select
          [items]="employees"
          bindLabel="fullname"
          bindValue="fullname"
          [multiple]="true"
          placeholder="Select employee"
          [(ngModel)]="selectedEmployee"
          class="custom-ng-select h-full"
        >
        </ng-select>
      </div>
    </div>

    <div class="flex w-full items-center gap-5">
      <div class="flex flex-col gap-3 w-1/2">
        <label for="from">From*</label>
        <input
          type="date"
          name="from"
          id="from"
          class="editInput"
          [(ngModel)]="fromDate"
        />
      </div>
      <div class="flex flex-col w-1/2 gap-3">
        <label for="to">To*</label>
        <input
          type="date"
          name="to"
          id="to"
          class="editInput"
          [(ngModel)]="toDate"
        />
      </div>
    </div>

    <div>
      <p>Leave Type*</p>
      <div class="w-full">
        <ng-select
          [items]="leaveTypes"
          bindLabel="name"
          [multiple]="false"
          placeholder="Select leave type"
          [(ngModel)]="selectedLeaveType"
          class="custom-ng-select h-full"
        >
        </ng-select>
      </div>
    </div>

    <div>
      <p>Comments</p>
      <textarea
        name="comment"
        id="comment"
        class="w-full rounded-xl outline-none bg-transparent p-3 border border-blak"
        placeholder="Enter comment here "
        rows="7"
        [(ngModel)]="comment"
      ></textarea>
    </div>
  </div>

  <div class="flex items-center justify-end">
    <button
      class="hover:bg-customBlueHover font-bold bg-customBlue text-white rounded-xl p-4 disabled:opacity-50"
      (click)="assignLeave()"
      [disabled]="submitting"
    >
      {{ submitting ? 'Assigning…' : 'Assign' }}
    </button>
  </div>
</div>

<p-toast position="top-right" key="tl" />
