<div class="flex justify-between items-center mb-6">
  <div class="flex flex-wrap gap-3 mb-4">
    <input
      type="text"
      [(ngModel)]="searchTerm"
      (input)="filterProjects()"
      placeholder="Search by name..."
      class="border p-2 rounded-lg"
    />
    <select [(ngModel)]="statusFilter" (change)="filterProjects()" class="border p-2 rounded-lg">
      <option value="">All Status</option>
      <option value="Ongoing">Ongoing</option>
      <option value="Completed">Completed</option>
      <option value="Pending">Pending</option>
    </select>
    <input
      type="date"
      [(ngModel)]="dateFilter"
      (change)="filterProjects()"
      class="border p-2 rounded-lg"
    />
  </div>
    <!-- <h2 class="text-2xl font-semibold">All Projects</h2> -->
    <button
      (click)="createNewProject()"
      class="bg-customBlue text-white px-4 py-2 rounded-lg hover:bg-customBlue"
    >
      + New Project
    </button>
  </div>
  
 
  
  <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
    <div
      *ngFor="let project of filteredProjects"
      class="border rounded-lg p-4 shadow-sm hover:shadow-lg bg-white transition"
    >
      <div class="flex justify-between items-center mb-2">
        <h3 class="font-semibold text-lg">{{ project.name }}</h3>
        <span
          class="text-xs px-2 py-1 rounded-full"
          [ngClass]="{
            'bg-green-100 text-green-700': project.status === 'Ongoing',
            'bg-blue-100 text-blue-700': project.status === 'Completed',
            'bg-yellow-100 text-yellow-700': project.status === 'Pending'
          }"
        >
          {{ project.status }}
        </span>
      </div>
  
      <p class="text-sm text-gray-600 mb-2">{{ project.description }}</p>
      <p class="text-xs text-gray-500">📅 {{ project.startDate }} → {{ project.endDate }}</p>
      <p class="text-xs text-gray-500">👥 {{ project.assignedTo.join(', ') }}</p>
  
      <button
        (click)="viewProject(project)"
        class="mt-3 bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-900"
      >
        View Details
      </button>
    </div>
  </div>

  
  <app-large-side-modal *ngIf="viewDetail" (close)="viewDetail = !viewDetail">
    <app-project-detail [selectedProjectId]="selectedProject"></app-project-detail>
  </app-large-side-modal>

  <app-side-modal *ngIf="openCreateForm" (close)="createNewProject()">
    <!-- <app-project-detail [selectedProjectId]="selectedProject"></app-project-detail> -->
     <app-create-project></app-create-project>
  </app-side-modal>
