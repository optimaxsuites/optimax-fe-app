<div class="flex mx-auto gap-4 items-center">
  <i class="pi pi-briefcase text-4xl text-customBlue"></i>
  <div>
    <p class="text-customBlue/60">POS</p>
    <p class="text-customBlue font-semibold text-[17px]">Business Settings</p>
  </div>
</div>
<hr />

<div class="p-8 max-w-2xl mx-2">
  <p-toast></p-toast>

  <form
    [formGroup]="settingsForm"
    (ngSubmit)="saveSettings()"
    class="space-y-8"
  >
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-3">
        Upload Business Logo <span class="text-red-500">*</span>
      </label>

      <div class="flex items-center space-x-6">
        <div
          class="w-32 h-32 bg-gray-50 border-2 border-dashed border-gray-300 rounded-xl flex items-center justify-center overflow-hidden relative transition-all"
          [ngClass]="{
            'hover:border-indigo-400': true,
            'border-red-500': !imagePreview && isLogoRequired
          }"
        >
          <img
            *ngIf="imagePreview"
            [src]="imagePreview"
            alt="Business Logo Preview"
            class="object-cover w-full h-full"
          />

          <div
            *ngIf="!imagePreview"
            class="text-center text-gray-400 text-sm p-2"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-8 w-8 mx-auto mb-2 text-gray-400"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
              />
            </svg>
            <span>No logo uploaded</span>
          </div>

          <button
            *ngIf="imagePreview"
            type="button"
            class="absolute top-2 right-2 p-1.5 bg-white rounded-full shadow-md hover:bg-gray-50 transition"
            (click)="clearLogo()"
            aria-label="Remove logo"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4 text-gray-600"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <div>
          <input
            type="file"
            id="logo"
            accept="image/*"
            class="hidden"
            (change)="onLogoChange($event)"
            #fileInput
          />

          <button
            type="button"
            class="px-8 py-2.5 bg-customBlue text-white rounded-lg hover:bg-customBlueHover transition-all text-sm focus:outline-none focus:ring-2 focus:ring-green-700 focus:ring-offset-2"
            (click)="fileInput.click()"
          >
            Choose File
          </button>

          <p class="text-xs text-gray-500 mt-2">
            Recommended: 200x200px, Max: 1MB
          </p>

          <p *ngIf="errorMessage" class="text-xs text-red-500 mt-2">
            {{ errorMessage }}
          </p>

          <p
            *ngIf="!imagePreview && isLogoRequired"
            class="text-xs text-red-500 mt-2"
          >
            Business logo is required
          </p>
        </div>
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">
        Select Currency <span class="text-red-500">*</span>
      </label>
      <select
        formControlName="currency"
        class="w-full p-3 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all"
      >
        <option value="" disabled selected hidden>Select currency</option>
        <option *ngFor="let curr of currencies" [value]="curr.code">
          {{ curr.name }} ({{ curr.code }})
        </option>
      </select>
      <div
        *ngIf="
          settingsForm.get('currency')?.invalid &&
          settingsForm.get('currency')?.touched
        "
        class="text-red-500 text-xs mt-1"
      >
        Please select a currency.
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">
        Default Markup Percentage (%) <span class="text-red-500">*</span>
      </label>
      <input
        type="number"
        formControlName="defaultMarkupPercentage"
        class="w-full p-3 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all"
        placeholder="Enter percentage (0-100)"
      />
      <div
        *ngIf="
          settingsForm.get('defaultMarkupPercentage')?.invalid &&
          settingsForm.get('defaultMarkupPercentage')?.touched
        "
        class="text-red-500 text-xs mt-1"
      >
        <span
          *ngIf="settingsForm.get('defaultMarkupPercentage')?.errors?.['required']"
          >This field is required.</span
        >
        <span
          *ngIf="settingsForm.get('defaultMarkupPercentage')?.errors?.['min'] || settingsForm.get('defaultMarkupPercentage')?.errors?.['max']"
          >Value must be between 0 and 100.</span
        >
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">
        Low Stock Threshold <span class="text-red-500">*</span>
      </label>
      <input
        type="number"
        formControlName="lowStockThreshold"
        class="w-full p-3 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all"
        placeholder="Enter threshold (min: 1)"
      />
      <div
        *ngIf="
          settingsForm.get('lowStockThreshold')?.invalid &&
          settingsForm.get('lowStockThreshold')?.touched
        "
        class="text-red-500 text-xs mt-1"
      >
        <span
          *ngIf="settingsForm.get('lowStockThreshold')?.errors?.['required']"
          >This field is required.</span
        >
        <span *ngIf="settingsForm.get('lowStockThreshold')?.errors?.['min']"
          >Value must be at least 1.</span
        >
      </div>
    </div>

    <div class="space-y-4">
      <div class="flex items-center">
        <input
          type="checkbox"
          id="allowMultiplePaymentMethods"
          formControlName="allowMultiplePaymentMethods"
          class="w-4 h-4 text-green-300 border-gray-300 rounded focus:ring-green-500"
        />
        <label
          for="allowMultiplePaymentMethods"
          class="ml-3 text-sm text-gray-700"
        >
          Allow Multiple Payment Methods
        </label>
      </div>

      <div class="flex items-center">
        <input
          type="checkbox"
          id="autoRestockNotification"
          formControlName="autoRestockNotification"
          class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500"
        />
        <label for="autoRestockNotification" class="ml-3 text-sm text-gray-700">
          Enable Auto Restock Notifications
        </label>
      </div>
    </div>

    <div class="mt-6 flex justify-end space-x-4">
      <button
        type="button"
        (click)="resetForm()"
        class="px-6 py-2.5 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-all focus:outline-none focus:ring-2 focus:ring-gray-500"
      >
        Reset
      </button>
      <button
        type="submit"
        class="px-6 py-2.5 bg-customGreen text-white rounded-lg hover:bg-customGreenHover transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500"
        [disabled]="!isFormValid()"
        [ngClass]="{ 'opacity-50 cursor-not-allowed': !isFormValid() }"
      >
        Save Changes
      </button>
    </div>
  </form>
</div>
