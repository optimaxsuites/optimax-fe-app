    <div class="details">
     
      <div class="w-[60%] shadow bg-gray-50 text-gray-700 flex flex-col gap-9 space-y-5 stl p-5 rounded-2xl border" > 
        <p class="text-3xl text-gray-700 font-semibold pb-0  mb-0 text-center">Add-Inventory</p>
        <hr>
        <div class="field">
          <label class="text-2xl font-medium" for="name">Product Name</label>
          <input class="name editInput bg-gray-100 text-xl p-2.5 " style= " padding: 10px;" id="name" [value]="activeItem.name" disabled />
        </div>
  
  
        <div  class="field">
          <label class="text-2xl" for="sku">SKU</label>
          <input class="editInput  bg-gray-100  text-xl"  style= " padding: 10px;" id="sku" [value]="activeItem.sku" readonly />
        </div>
  
  
          <div class="field">
            <label for="code" class="block font-medium text-2xl">Product Code</label>
            <input class="editInput w-full text-xl  bg-gray-100"  style= " padding: 10px;" id="code" [value]="activeItem.code" readonly />
          </div>
            
        <div class="field">
          <label for="category" class="block font-medium text-2xl ">Category</label>
          <input class="editInput w-full text-xl  bg-gray-100" id="category"  style= " padding: 10px;"  [value]="activeItem.productCategory.name" readonly />
        </div>
    
  
  
          
          <!-- Dropdown1 -->
          
          <div class="flex gap-4">
            <!-- Event Category Dropdown -->
            <div class="w-1/2 ">
              <label for="dropdown" class="block font-medium text-2xl">Change-type <span class="text-red-500">*
  
              </span>  
            
            </label>
            
           
            
            <input class="editInput w-full bg-gray-100 py-4 text-2xl" value="Restock" readonly />

                  

            
          </div>

            <label for="dropdown" class="block font-medium text-2xl">Source <span class="text-red-500">*</span>

              (click)="removeSelectedSupplier()" 
              title="Delete selected supplier" 
              class="cursor-pointer text-red-600 text-2xl pl-3"
            >
              <i class="fas fa-trash"></i>
            </span>
            
            </label>

              <select
              id="dropdown"
              class=" px-4 py text-gray-600 bg-gray-100 text-2xl w-full" 
              style="padding: 10px;" 
              (change)="changeSelectedSupplier($event)"
              [(ngModel)]="selectedSupplier"
            >
             <option value="" disabled selected>Select a Supplier</option>
            <option *ngFor="let supplier of suppliers" [value]="supplier.supplierName">   {{ supplier.supplierName }}</option>
            </select>
                <p-inputGroupAddon class="bg-customGreen text-white font-2xl px-2 cursor-pointer"    (click)="openModal()">
                  <i class="fas fa-plus px-2"></i>
                </p-inputGroupAddon>
              </p-inputGroup>
    
        </div>
          
        </div>

  <p class="text-lg text-gray-700 font-semibold pb-0 mb-0 mt-2">

        name="lastQuantity"

    <div class="field w-1/2">

        name="currentQuantity"
        class="editInput w-full bg-gray-100 p-2"
        required
      />
    </div>
  </div>
  

  <div class="flex gap-4">
    <div class="field w-1/2">
      <label for="restockedQuantity" class="block font-medium text-2xl">Restocked Quantity</label>

        id="restockedQuantity" 
        name="restockedQuantity"
        class="editInput w-full bg-gray-100 p-2"
        required
      />
    </div>
  
    <div class="field w-1/2">
      <label for="currentQuantity" class="block font-medium text-2xl">Current Quantity</label>
      <input 
        type="number" 
        id="currentQuantity" 
        name="currentQuantity"
        class="editInput w-full bg-gray-100 p-2"
        required
      />
    </div>
</div>




  <p class="text-lg text-gray-700 font-semibold pb-0 mb-0 mt-2">
    Pricing
  </p>
  <div class="flex gap-4">
    <div class="field w-1/2">
      <label for="lastPrice" class="block font-medium text-2xl">Last Purchase Price</label>
      <input 
        type="number" 
        id="lastPrice" 
        name="lastPrice"
        class="editInput w-full bg-gray-100 p-2"
     
        required
   
      />
    </div>  
  
    <div class="field w-1/2">
      <label for="currentPrice" class="block font-medium text-2xl">Current Purchase Price</label>
      <input 
        type="number" 
        id="currentPrice" 
        name="currentPrice"
        class="editInput w-full bg-gray-100 p-2"
        required
      />
    </div>  
  </div>

  




  <!-- New Fields for Selling Price -->
<div class="flex gap-4 mt-4">
  <div class="field w-1/2">
    <label for="lastSellingPrice" class="block font-medium text-2xl">Last Selling Price</label>
    <input 
      type="number" 
      id="lastSellingPrice" 
      name="lastSellingPrice"
      class="editInput w-full bg-gray-100 p-2"
      [(ngModel)] = "activeItem.effectivePrice"
      readonly
    />
  </div>  

  <div class="field w-1/2 relative">
    <label for="currentSellingPrice" class="block font-medium text-2xl">
        Current Selling Price
    </label>
    <div class="relative">
        <input 
            type="number" 
            id="currentSellingPrice" 
            name="currentSellingPrice"
            class="editInput w-full bg-gray-100 p-2 pr-20"
            required
        />
        <p 
            class="absolute right-3 top-6 -translate-y-1/2 text-customGreen cursor-pointer"
            (click)="openPriceChange = !openPriceChange"
        >
            + Price Change
        </p>
    </div>
</div>

</div>
<!-- Show Base Price, Tax, Effective Price, and Discount When Price Change is Clicked -->
<div class="flex flex-col gap-4 items-center w-full" *ngIf="openPriceChange">
  <div class="flex gap-4 w-full">
    <div class="detailDiv w-1/2">
      <label for="base-price">Base Price <span style="color: red">*</span></label>
      <input class="name editInput w-full" type="text" id="base-price" formControlName="initialPrice" placeholder="Base Price" />
    </div>
  
    <div class="detailDiv w-1/2">
      <label for="tax">Tax Percentage (%) <span style="color: red">*</span></label>
      <input class="name editInput w-full" type="text" id="tax" formControlName="tax" placeholder="Tax Percentage" />
    </div>
  </div>  


<!-- Discount Section -->
<div class="detailDiv w-full  flex items-center gap-4">
  <label for="discount">Discount</label>

  <select id="discount" formControlName="discount" class="editInput w-full">
    <option [value]="0">No Discount</option>
    <option [value]="5">5% Off</option>
    <option [value]="10">10% Off</option>
    <option [value]="15">15% Off</option>
  </select>


  <button class="btn create-invoice-btn mt-2" type="button" (click)="openAddDiscount = true">
    Add
  </button>


 </div> 


  <div class="detailDiv w-full">
    <label for="e-price">Effective Price <span style="color: red">*</span></label>
    <input class="name editInput" type="text" id="e-price" formControlName="effectivePrice" placeholder="Effective Price"  />
  </div>


 



</div>

        >
          {{ isEditing ? 'Update Branch' : 'Save' }}
        </button>
      
        </div>

        <app-side-modal *ngIf="isOpen" (close)="closeModal()">
          <h2 class="text-2xl font-bold my-5 text-center">Add New Supplier</h2>
        
          <div class="bg-white shadow-2xl rounded-lg p-6 mt-14">
            <form (ngSubmit)="submitForm()">
              <div class="mb-4">
                <label class="block text-gray-700 text-2xl">Supplier Name</label>
                <input type="text" [(ngModel)]="supplierName" name="supplierName" class="w-full p-3  bg-gray-200"  style="border: 1px solid gray; border-radius: 4px;" required />
              </div>
        
              <div class="mb-4">
                <label class="block text-gray-700 text-2xl">Contact Person</label>
                <input type="text" [(ngModel)]="contactPerson" name="contactPerson" class="w-full p-2  bg-gray-200"  style="border: 1px solid gray; border-radius: 4px;"required />
              </div>
        
              <div class="mb-4">
                <label class="block text-gray-700 text-2xl">Email Address</label>
                <input type="email" [(ngModel)]="email" name="email" class="w-full p-2  bg-gray-200 "  #emailInput="ngModel" style="border: 1px solid gray; border-radius: 4px;" required />
              </div>
        
              <div class="mb-4">
                <label class="block text-gray-700 text-2xl">Phone Number</label>
                <input type="tel" [(ngModel)]="phone" name="phone"     [(ngModel)]="phone" class="w-full p-2  bg-gray-200"style="border: 1px solid gray; border-radius: 4px;" required />
              </div>
        
              <div class="mb-4">
                <label class="block text-gray-700 text-2xl">Business Address</label>
                <input type="text" [(ngModel)]="address" name="address" class="w-full p-2  bg-gray-200" style="border: 1px solid gray; border-radius: 4px;" />
              </div>
        
              <!-- Additional Information -->
              <label class="block text-gray-700 font-medium mb-2 text-2xl">Products/Services Provided</label>
              <textarea [(ngModel)]="products" name="products" class="w-full p-3 bg-gray-200 focus:ring-2 focus:ring-green-400 mb-4" placeholder="List the products or services offered" style="border: 1px solid gray; border-radius: 4px;"></textarea>
        
              <label class="block text-gray-700 font-medium mb-2 text-2xl">Notes</label>
              <textarea [(ngModel)]="notes" name="notes" class="w-full p-3  bg-gray-200 focus:ring-2 focus:ring-green-400 mb-4" placeholder="Any special instructions or comments " style="border: 1px solid gray; border-radius: 4px;"></textarea>
        
              <!-- Terms & Conditions -->
              <!-- <div class="mb-4 flex items-center">
                <input type="checkbox" [(ngModel)]="agreeTerms" name="agreeTerms" class="mr-2" />
                <label for="agreeTerms" class="text-2xl">
                  I agree to the 
                  <a href="/terms-and-conditions" target="_blank" class="text-blue-600 underline">Terms & Conditions</a>
                </label>
              </div> -->
            
        
              <!-- Buttons -->
              <div class="flex justify-end">
                <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">Save</button>
                <button type="button" class="ml-2 text-gray-600" (click)="closeModal()">Cancel</button>
              </div>
            </form>
          </div>
      
        </app-side-modal>
