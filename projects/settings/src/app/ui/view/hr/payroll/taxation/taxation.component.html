<form [formGroup]="form" (ngSubmit)="save()" class="space-y-10">

  <section formGroupName="paye" class="space-y-6">
    <div class="border-b border-gray-200 pb-2">
      <h3 class="text-lg font-semibold text-gray-800">PAYE (Income Tax)</h3>
    </div>

    <div class="flex flex-wrap gap-6">
      <div class="flex items-center gap-2">
        <input type="checkbox" formControlName="enabled" id="paye-enabled"
               class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
        <label for="paye-enabled" class="font-medium text-gray-700">Enable PAYE</label>
      </div>
    </div>

    <div *ngIf="form.get('paye.enabled')?.value" class="space-y-6 animate-in fade-in duration-300">
      
      <div class="flex items-center gap-2">
        <input type="checkbox" formControlName="annualization" id="annualize"
               class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
        <label for="annualize" class="font-medium text-gray-700">Annualize Income</label>
      </div>

      <div class="max-w-md">
        <label class="block font-medium text-gray-700 mb-1">Bonus Tax Method</label>
        <select formControlName="bonusTaxMethod"
                class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
          <option>Standard</option>
          <option>Separate</option>
        </select>
      </div>

      <div formGroupName="reliefs" class="space-y-4 py-4 border-t border-gray-100">
        <h4 class="text-md font-semibold text-gray-700">Reliefs (Consolidated Relief Allowance)</h4>
        
        <div class="flex items-center gap-3">
            <input type="checkbox" formControlName="enableCRA" id="enable-cra" class="h-4 w-4 rounded text-indigo-600">
            <label for="enable-cra" class="font-medium text-gray-700">Enable CRA</label>
        </div>

        <div *ngIf="form.get('paye.reliefs.enableCRA')?.value" class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
            <div>
                <label class="block font-medium text-gray-600 mb-1">Fixed Relief Amount (₦)</label>
                <input type="number" formControlName="fixedAmount" class="w-full rounded-md border-gray-300 shadow-sm sm:text-sm" />
            </div>
            <div>
                <label class="block font-medium text-gray-600 mb-1">Percentage of Gross (%)</label>
                <input type="number" formControlName="percentOfIncome" class="w-full rounded-md border-gray-300 shadow-sm sm:text-sm" />
            </div>
            <div>
                <label class="block font-medium text-gray-600 mb-1">Minimum Relief (₦)</label>
                <input type="number" formControlName="minimumRelief" class="w-full rounded-md border-gray-300 shadow-sm sm:text-sm" />
            </div>
            <div class="flex items-end pb-2">
                <div class="flex items-center gap-3">
                    <input type="checkbox" formControlName="applyAnnually" class="h-4 w-4 rounded text-indigo-600">
                    <label class="text-gray-700">Apply Annually</label>
                </div>
            </div>
        </div>
      </div>

      <div class="space-y-4 border-t border-gray-100 pt-4">
        <label class="block font-medium text-gray-700">Tax Bands</label>
        <div formArrayName="bands" class="space-y-3">
            <div class="hidden sm:grid grid-cols-12 gap-4 px-1  font-semibold text-gray-500 uppercase">
                <div class="col-span-4">Min Amount</div>
                <div class="col-span-4">Max Amount</div>
                <div class="col-span-3">Rate %</div>
                <div class="col-span-1"></div>
            </div>

            <div *ngFor="let band of bands.controls; let i = index" [formGroupName]="i"
                 class="grid grid-cols-1 sm:grid-cols-12 gap-3 items-center bg-gray-50 sm:bg-transparent p-3 sm:p-0 rounded-lg">
                <div class="col-span-4">
                    <input type="number" formControlName="min" class="block w-full rounded-md border-gray-300 sm:text-sm">
                </div>
                <div class="col-span-4">
                    <input type="number" formControlName="max" class="block w-full rounded-md border-gray-300 sm:text-sm">
                </div>
                <div class="col-span-3 relative">
                    <input type="number" formControlName="rate" class="block w-full rounded-md border-gray-300 sm:pr-8">
                    <span class="absolute right-3 top-2 text-gray-400 text-sm">%</span>
                </div>
                <div class="col-span-1 flex justify-end">
                    <button type="button" (click)="removeBand(i)" class="text-gray-400 hover:text-red-600">
                        <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20"><path d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" /></svg>
                    </button>
                </div>
            </div>

            <button type="button" (click)="addBand()" class="font-medium text-customBlue hover:text-customBlueHover flex items-center gap-1">
                + Add Tax Band
            </button>
        </div>
      </div>
    </div>
  </section>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-10">
    
    <section formGroupName="pension" class="space-y-4">
      <div class="border-b border-gray-200 pb-2 flex justify-between items-center">
        <h3 class="text-lg font-semibold text-gray-800">Pension (RSA)</h3>
        <input type="checkbox" formControlName="enabled" class="h-4 w-4 rounded text-indigo-600 focus:ring-indigo-500">
      </div>

      <div *ngIf="form.get('pension.enabled')?.value" class="space-y-4 animate-in slide-in-from-top-1 duration-200">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block  font-medium text-gray-500 uppercase mb-1">Employee Rate %</label>
            <input type="number" formControlName="employeeRate" class="block w-full rounded-md border-gray-300 sm:text-sm">
          </div>
          <div>
            <label class="block  font-medium text-gray-500 uppercase mb-1">Employer Rate %</label>
            <input type="number" formControlName="employerRate" class="block w-full rounded-md border-gray-300 sm:text-sm">
          </div>
        </div>
        <div>
          <label class="block  font-medium text-gray-500 uppercase mb-1">Contribution Base</label>
          <input type="text" formControlName="base" placeholder="e.g. Basic, Housing, Transport" class="block w-full rounded-md border-gray-300 sm:text-sm">
        </div>
      </div>
    </section>

    <section formGroupName="nhf" class="space-y-4">
      <div class="border-b border-gray-200 pb-2 flex justify-between items-center">
        <h3 class="text-lg font-semibold text-gray-800">National Housing Fund</h3>
        <input type="checkbox" formControlName="enabled" class="h-4 w-4 rounded text-indigo-600 focus:ring-indigo-500">
      </div>

      <div *ngIf="form.get('nhf.enabled')?.value" class="space-y-4 animate-in slide-in-from-top-1 duration-200">
        <div>
          <label class="block  font-medium text-gray-500 uppercase mb-1">Employee Rate %</label>
          <input type="number" formControlName="employeeRate" class="block w-full rounded-md border-gray-300 sm:text-sm">
        </div>
        <div>
          <label class="block  font-medium text-gray-500 uppercase mb-1">Contribution Base</label>
          <input type="text" formControlName="base" class="block w-full rounded-md border-gray-300 sm:text-sm">
        </div>
      </div>
    </section>

    <section formGroupName="health" class="space-y-4">
      <div class="border-b border-gray-200 pb-2 flex justify-between items-center">
        <h3 class="text-lg font-semibold text-gray-800">Health Insurance</h3>
        <input type="checkbox" formControlName="enabled" class="h-4 w-4 rounded text-indigo-600 focus:ring-indigo-500">
      </div>

      <div *ngIf="form.get('health.enabled')?.value" class="grid grid-cols-2 gap-4 animate-in slide-in-from-top-1 duration-200">
        <div>
          <label class="block  font-medium text-gray-500 uppercase mb-1">Employee Rate %</label>
          <input type="number" formControlName="employeeRate" class="block w-full rounded-md border-gray-300 sm:text-sm">
        </div>
        <div>
          <label class="block  font-medium text-gray-500 uppercase mb-1">Employer Rate %</label>
          <input type="number" formControlName="employerRate" class="block w-full rounded-md border-gray-300 sm:text-sm">
        </div>
      </div>
    </section>

    <section formGroupName="employerContributions" class="space-y-4">
      <div class="border-b border-gray-200 pb-2">
        <h3 class="text-lg font-semibold text-gray-800">Other Contributions</h3>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block  font-medium text-gray-500 uppercase mb-1">NSITF Rate %</label>
          <input type="number" formControlName="nsitfRate" class="block w-full rounded-md border-gray-300 sm:text-sm">
        </div>
        <div>
          <label class="block  font-medium text-gray-500 uppercase mb-1">ITF Rate %</label>
          <input type="number" formControlName="itfRate" class="block w-full rounded-md border-gray-300 sm:text-sm">
        </div>
      </div>
    </section>
  </div>

  <div class="flex justify-end pt-8 border-t border-gray-200">
    <button type="submit"
            class="inline-flex justify-center rounded-md border border-transparent bg-customBlue py-2.5 px-8 font-semibold text-white shadow-sm hover:bg-customBlueHover transition-all">
      Save Configuration
    </button>
  </div>
</form>
