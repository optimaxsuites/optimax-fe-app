<!-- notes-modal.component.html -->
<div
  class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50"
  *ngIf="isNotesModalOpen"
>
  <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-2xl">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Add Notes</h2>
    <form>
      <div class="mb-6" style="font-size: 1.5rem">
        <label for="orderNotes" class="block text-lg font-medium text-gray-700"
          >Notes</label
        >
        <textarea
          id="orderNotes"
          rows="8"
          placeholder="Enter detailed notes for the order..."
          class="w-full mt-2 border border-gray-300 rounded-lg shadow-sm p-4 text-base focus:ring-green-500 focus:border-green-500"
        ></textarea>
      </div>
      <div class="flex justify-end gap-6">
        <button
          type="button"
          class="px-6 py-3 bg-gray-300 text-gray-800 rounded-lg hover:bg-gray-400 text-lg"
          (click)="closeNotesModal()"
        >
          Cancel
        </button>
        <button
          type="button"
          class="px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 text-lg"
        >
          Save
        </button>
      </div>
    </form>
  </div>
</div>
