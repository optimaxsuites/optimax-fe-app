<app-roomshero></app-roomshero>

<div class="min-h-screen bg-gray-50 pt-20">
  <div class="max-w-7xl mx-auto px-6 py-12">
    <!-- Header Section -->
    <div class="flex flex-col md:flex-row md:items-end justify-between mb-12 gap-6">
      <div class="space-y-2">
        <h2 class="text-3xl md:text-4xl font-bold text-gray-900 tracking-tight">Recommended for you</h2>
        <p class="text-gray-500 text-lg">Based on your preferences and location</p>
      </div>
      <div class="flex items-center space-x-4">
        <span class="text-gray-900 font-semibold">{{ filteredRooms.length }} results found</span>
        <select
          class="bg-white border border-gray-200 rounded-xl px-4 py-2 text-sm font-medium focus:ring-0 focus:border-emerald-500 transition-all cursor-pointer">
          <option>Sort by: Popularity</option>
          <option>Sort by: Rating</option>
          <option>Price: Low to High</option>
          <option>Price: High to Low</option>
        </select>
      </div>
    </div>

    <!-- Room Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div *ngFor="let room of filteredRooms"
        class="group bg-white rounded-3xl overflow-hidden border border-gray-100 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300">
        <!-- Image Container -->
        <div class="relative h-64 overflow-hidden">
          <img [src]="room.imageUrl" [alt]="room.name"
            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">

          <!-- Favorite Button -->
          <button
            class="absolute top-4 right-4 w-10 h-10 bg-white/80 backdrop-blur-md rounded-full flex items-center justify-center text-gray-900 hover:text-rose-500 transition-colors shadow-lg">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
            </svg>
          </button>

          <!-- Rating Badge -->
          <div
            class="absolute bottom-4 left-4 px-3 py-1.5 bg-white/90 backdrop-blur-md rounded-lg flex items-center space-x-1 shadow-md">
            <span class="text-amber-500">★</span>
            <span class="text-sm font-bold text-gray-900">{{ room.rating }}</span>
          </div>
        </div>

        <!-- Room Body -->
        <div class="p-6 space-y-4">
          <div class="space-y-1">
            <h3 class="text-xl font-bold text-gray-900 group-hover:text-emerald-700 transition-colors">{{ room.name }}
            </h3>
            <div class="flex items-center text-gray-500 text-sm">
              <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              Lagos, Nigeria
            </div>
          </div>

          <p class="text-gray-600 text-sm line-clamp-2 leading-relaxed">
            {{ room.description }}
          </p>

          <div class="flex items-center justify-between pt-4 border-t border-gray-50">
            <div class="flex flex-col">
              <span class="text-2xl font-bold text-gray-900">₦{{ room.price | number }}</span>
              <span class="text-xs text-gray-500 font-medium">per night</span>
            </div>
            <button (click)="viewRoomDetails(room)"
              class="bg-gray-900 hover:bg-emerald-600 text-white font-bold py-3 px-6 rounded-2xl transition-all duration-300">
              View Details
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<app-roomfooter></app-roomfooter>
