<div class="main-dashboard-wrapper">
  <div class="dashboard-toggle">
    <label class="toggle-label">Dashboards</label>
    <div class="dashboard-switch" role="tablist" aria-label="Dashboard selector">
      <button
        type="button"
        class="switch-btn"
        [class.active]="selectedDashboard === 'welfare'"
        (click)="onDashboardChange('welfare')"
        role="tab"
        [attr.aria-selected]="selectedDashboard === 'welfare'">
        Welfare Dashboard
      </button>
      <button
        type="button"
        class="switch-btn"
        [class.active]="selectedDashboard === 'cooperative'"
        (click)="onDashboardChange('cooperative')"
        role="tab"
        [attr.aria-selected]="selectedDashboard === 'cooperative'">
        Cooperative Dashboard
      </button>
    </div>
  </div>

  <div class="dashboard-content" *ngIf="selectedDashboard === 'welfare'">
    <app-loan-dashboard></app-loan-dashboard>
  </div>

  <div class="dashboard-content" *ngIf="selectedDashboard === 'cooperative'">
    <app-cooperative-dashboard></app-cooperative-dashboard>
  </div>
</div>
