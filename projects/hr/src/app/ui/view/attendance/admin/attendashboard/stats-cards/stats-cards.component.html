<div class="stats-grid" *ngIf="stats; else noData">

  <div class="stat-card present">
    <h3>Present</h3>
    <p>{{ stats.present }}%</p>
  </div>

  <div class="stat-card absent">
    <h3>Absent</h3>
    <p>{{ stats.absent }}%</p>
  </div>

  <div class="stat-card late">
    <h3>Late</h3>
    <p>{{ stats.late }}%</p>
  </div>

  <div class="stat-card leave">
    <h3>On Leave</h3>
    <p>{{ stats.onLeave }}%</p>
  </div>

  <div class="stat-card pending-approvals" [class.has-pending]="pendingApprovals > 0">
    <h3>🔔 Pending Review</h3>
    <p>{{ pendingApprovals }}</p>
    <div class="approval-breakdown" *ngIf="pendingApprovals > 0">
      <span *ngIf="crossBranchCount > 0" class="breakdown-item">
        <i class="fa-solid fa-code-branch"></i> {{ crossBranchCount }} Cross-Branch
      </span>
      <span *ngIf="correctionRequestsCount > 0" class="breakdown-item">
        <i class="fa-solid fa-pencil"></i> {{ correctionRequestsCount }} Corrections
      </span>
    </div>
  </div>

</div>
<ng-template #noData>
  <p>No data for selected period :P</p>
</ng-template>
