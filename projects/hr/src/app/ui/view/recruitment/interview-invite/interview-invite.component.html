<p-toast class="table-item"></p-toast>
<div class="card">
    <div class="move-back">
        <app-back-button class="table-item" (click)="goBack()"></app-back-button>
    </div>

    <div class="invite-main table-item">
        <div class="invite-header">
            <div class="d-flex gap-4 my-2">
                <div class="input-container-50">
                    <label for="name"><strong>Name:</strong> </label>
                    <span>  {{ getCandidateName() }}</span>
                    <!-- <input type="text" id="name" name="name" [(ngModel)]="candidate.candidate" class="editInput" disabled> -->
                </div>
                <div class="input-container-50">
                    <label for="phone-number"><strong>Phone Number:</strong> </label>
                    <span>  {{ getCandidatePhone() }}</span>
                    <!-- <input type="text" id="phone-number" name="phone-number" [(ngModel)]="candidate.contactNo" class="editInput" disabled appNumberOnly> -->
                </div>
            </div>
            <div class="d-flex gap-4 my-2">
                <div class="input-container-50">
                    <label for="email"><strong>Email:</strong></label>
                    <span>  {{candidate.email}}</span>
                    <!-- <input type="text" id="email" name="email" [(ngModel)]="candidate.email" class="editInput" disabled> -->
                </div>
                <div class="input-container-50">
                    <label for="position"><strong>Position:</strong></label>
                    <span>  {{ getCandidatePosition() }}</span>
                    <!-- <input type="" id="position" name="position" [(ngModel)]="candidate.position" class="editInput" disabled appNumberOnly> -->
                </div>
            </div>
        </div>
        <div class="d-flex gap-4 my-2">
            <div class="input-container-50">
                <div class="invite-template-wrapper">
                    <h3><strong>Template</strong></h3>
                    <div class="invite-template">
                        <div class="template-card" *ngFor="let template of templates; let i = index" (click)="setTemplate(i)" [ngClass]="{'active': activeTemplateIndex === i}" >{{ getTemplateName(i) }}</div>
                    </div>
                </div>
            </div>
            <div class="input-container-50">
                <label for="interview-type">Interview Type <span style="color: red;">*</span></label>
                <ng-select 
                    [items]="interviewType || []"
                    bindLabel="type"
                    bindValue="type"
                    placeholder="Select Invite Type"
                    [(ngModel)]="selectedInterviewType"
                    (change)="interviewTypeChange()">
                </ng-select>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4">
                    <div>
                        <label for="scheduledDate">Interview Date <span style="color: red;">*</span></label>
                        <input id="scheduledDate" type="date" class="editInput" [(ngModel)]="inviteDraft.scheduledDate">
                    </div>
                    <div>
                        <label for="scheduledTime">Interview Time <span style="color: red;">*</span></label>
                        <input id="scheduledTime" type="time" class="editInput" [(ngModel)]="inviteDraft.scheduledTime">
                    </div>
                </div>

                <div class="mt-3">
                    <label for="location">Meeting Location / Link <span style="color: red;">*</span></label>
                    <input id="location" type="text" class="editInput" [(ngModel)]="inviteDraft.location" placeholder="Board room or meeting link">
                </div>

                <div class="mt-3">
                    <label for="notes">Interview Notes</label>
                    <textarea id="notes" rows="3" class="editInput" [(ngModel)]="inviteDraft.notes" placeholder="Agenda, prep, instructions"></textarea>
                </div>

                <div class="add-attachment mt-4">
                    <!-- File upload input -->
                    <input type="file" class="editInput" (change)="onFileSelected($event)" />

                    <!-- Display attachments -->
                    <div *ngIf="attachments?.length">
                        <h4><strong>Attachement(s)</strong></h4>
                            <span *ngFor="let attachment of attachments">
                                <a [href]="attachment.url" target="_blank">{{ attachment.name }}</a><br>
                            </span>
                    </div>
                </div>
            </div>
        </div>

        <div class="invite-template-wrapper mt-4">
            <div class="flex justify-between items-center mb-2">
                <h3><strong>Interview Panel</strong> <span style="color: red;">*</span></h3>
                <button type="button" class="btn-secondary" (click)="addPanelMember()" [disabled]="panelUsersLoading || !availablePanelUsers.length">Add Panel Member</button>
            </div>
            <p *ngIf="panelUsersLoading" class="text-sm text-slate-500 mb-2">Loading users for interview panel...</p>
            <p *ngIf="!panelUsersLoading && !availablePanelUsers.length" class="text-sm text-red-500 mb-2">No users available for panel assignment yet.</p>
            <div *ngFor="let member of inviteDraft.panelMembers; let i = index" class="grid grid-cols-1 md:grid-cols-[1.2fr_1fr_1.2fr_auto] gap-3 mb-3 items-end">
                <div>
                    <label>User</label>
                    <ng-select
                        [items]="getPanelUserOptions(member.userId)"
                        bindLabel="label"
                        bindValue="id"
                        [clearable]="true"
                        [searchable]="true"
                        [placeholder]="'Select interviewer'"
                        [(ngModel)]="member.userId"
                        (ngModelChange)="onPanelUserSelected(i, $event)">
                    </ng-select>
                </div>
                <div>
                    <label>Role</label>
                    <input type="text" class="editInput" [(ngModel)]="member.role" placeholder="Hiring Manager">
                </div>
                <div>
                    <label>Email</label>
                    <input type="email" class="editInput" [ngModel]="member.email" placeholder="panel@company.com" readonly>
                </div>
                <button type="button" class="btn-secondary" (click)="removePanelMember(i)" [disabled]="inviteDraft.panelMembers.length === 1">Remove</button>
            </div>
        </div>

        <div class="invite-template-wrapper">
            <h3><strong>Interview Invite</strong>  <span style="color: red;">*</span></h3>
            <!-- <textarea name="invite" id="invite" class="invite editInput" [(ngModel)]="processedTemplate" (input)="onTemplateEdit(processedTemplate!)"></textarea> -->
            <p-editor [(ngModel)]="processedTemplate" (input)="onTemplateEdit(processedTemplate!)" [style]="{ height: '400px' }" />
        </div>
        <div class="btn-wrapper">
            <app-button text="Send Invite" class="btn-save" (click)="handleSendInvite()" ></app-button>
        </div>
    </div>
</div>
