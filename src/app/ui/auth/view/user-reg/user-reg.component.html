
<div class="xll">
    <div class="user-info-container">

            <h1>Personal Details</h1>

            <div class="panel-content flex justify-between w-full items-center" >
                
                <div class="w-2/3 flex flex-col gap-6">
                    <div class="w-full" >
                        <label for="fullname">Full Name</label><br>
                        <input  class="editInput"  type="text" id="fullname" pInputText [(ngModel)]="userInfoData.fullName" />
                    </div>
                    <div class="w-full">
                        <label for="username">Username</label>
                        <input type="text" class="editInput" id="username" pInputText [(ngModel)]="userInfoData.username" />
                    </div>
                </div>

                <div class="flex flex-col justify-center items-center gap-4 pr-24">
                    <img class="w-[200px] h-[200px] bg-transparent object-contain border rounded-full"  [src]="userInfoData.image ? userInfoData.image : 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTr3jhpAFYpzxx39DRuXIYxNPXc0zI5F6IiMQ&s'" alt="placeholder">
                     <label for="image"  class="btn create-invoice-btn p-4">Upload profile image</label>
                     <input type="file" id="image" (change)="onImageUpload($event)" [(ngModel)]="userInfoData.image" hidden>
                  </div> 
            </div>


    </div>

    <div class="user-info-container">
 
            <h1>Contact Information</h1>
      

            <div class="panel-content" >
                <div class="input-wrapper">
                    <div class="input-width-1">
                        <label for="email">Email</label>
                        <input class="editInput" type="email" id="email" pInputText [(ngModel)]="userInfoData.email">
                    </div>
                    <div class="input-width-1">
                        <label for="phone">Phone Number</label>
                        <input class="editInput" type="tel" id="phone" pattern="[0-9]{10}" pInputText [(ngModel)]="userInfoData.phoneNumber" >
                    </div>
                </div>

                <div class="input-wrapper">
                    <div class="input-width-1">
                        <label for="address">Address</label>
                        <input class="editInput" id="address" pInputText [(ngModel)]="userInfoData.address">
                    </div>
                    <div class="input-width-1">
                        <label for="country">Country</label>
                        <select class="editInput" id="country" name="country" pInputText [(ngModel)]="userInfoData.selectedCountry" (change)="onCountryChange()">
                          <option value="" disabled selected>Select your country</option>
                          <option *ngFor="let country of countries" [value]="country.name">{{country.name}}</option>
                        </select>
                      </div>                        
                </div>

                <div></div>

                <div class="input-wrapper">
                    <div class="input-width-1">
                        <label for="state">State</label>
                 
                        <ng-select 
                        [items]="states"
                        bindLabel="label"
                        bindValue="value"
                        [(ngModel)]="userInfoData.selectedState"
                        placeholder="Select your state"
                        (change)="onStateChange()">
                      </ng-select> 
                      </div>
                      <div class="input-width-1">
                        <label for="city">City</label>
                 
                        <ng-select 
                        [items]="filteredCities"
                        bindLabel="label"
                        bindValue="value"
                        [(ngModel)]="userInfoData.selectedCity"
                        placeholder="Select your city"
                        [disabled]="!userInfoData.selectedState">
                      </ng-select> 
                      </div>
                </div>

                <div class="input-wrapper">                        
                    <div class="input-width-1">
                        <label for="postal-code">Postal Code</label>
                        <input class="editInput" id="postal-code" id="postal-code" pInputText [(ngModel)]="userInfoData.postalCode">
                    </div>
                </div>
            </div>

    </div>
    
    <div class="user-info-container">
        <div class="user-info-form">
          
                <div class="btn-wrapper">
                    <div type="submit"></div>
                    <!-- <button (click)="togglePanel2()" type="submit">Next</button> -->
                </div>
            <!-- </div> -->

         

     <h1>Other Details</h1>
          

                <div class="panel-content" >
                    <div class="input-wrapper gap-3">
                        <div class="input-width-1">
                            <label for="industry">Industry</label>
                            <input class="editInput" type="text" id="industry" pInputText [(ngModel)]="userInfoData.industry">
                        </div>
                        <div class="input-width-1">
                            <label for="company">Company Name</label>
                            <input class="editInput" type="text" id="company" pInputText [(ngModel)]="userInfoData.company">
                        </div>
                        <div class="input-width-1">
                            <label for="clientType">Client type</label>
                            <select class="editInput" type="text" id="clientType" pInputText [(ngModel)]="userInfoData.clientType">
                                <option value=""></option>
                                <option value="company">Company</option>

                            </select>
                        </div>
                    </div>
                    
                    <label for="bio">Bio</label>
                    <textarea class="editInput" id="bio" rows="4" pInputText [(ngModel)]="userInfoData.bio"></textarea>
                </div>

                <div class="flex justify-end items-center mt-5">
              <button type="submit" (click)="saveUserInfo()">Save</button>
                </div>


            
        </div>
        
    </div>
</div>

<p-toast position="top-right" key="tl" />
