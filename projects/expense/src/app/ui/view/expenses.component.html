<div class="flex pl-4 mt-2">
  <button
    class="px-4 py-2 text-2xl font-medium"
    [ngClass]="{
      'border-b-4 border-green-500 text-green-600': selectedTab === 'expenses',
      'text-gray-600': selectedTab !== 'expenses'
    }"
    (click)="selectedTab = 'expenses'"
  >
    Expenses
  </button>

  <button
    class="px-4 py-2 text-2xl font-medium"
    [ngClass]="{
      'border-b-4 border-green-500 text-green-600': selectedTab === 'reports',
      'text-gray-600': selectedTab !== 'reports'
    }"
    (click)="selectedTab = 'reports'"
  >
    Approval Reports
  </button>
</div>

<!-- Tab Content -->
<div class="mt-4">
  <app-expense-table *ngIf="selectedTab === 'expenses'"></app-expense-table>
  <app-approval-reports *ngIf="selectedTab === 'reports'"></app-approval-reports>
</div>
