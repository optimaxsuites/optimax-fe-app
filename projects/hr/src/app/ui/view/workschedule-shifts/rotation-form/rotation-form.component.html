<form [formGroup]="rotationForm">

  <div class="form-group">
    <label>Rotation Name</label>
    <input type="text" formControlName="name">
  </div>

  <div class="form-group">
    <label>Cycle Length</label>
    <input type="number" formControlName="cycleLength">
  </div>

</form>

<div class="rotation-preview">
  <h4>Rotation Preview</h4>

  <div *ngFor="let item of rotationPreview">
    {{ item }}
  </div>
</div>
