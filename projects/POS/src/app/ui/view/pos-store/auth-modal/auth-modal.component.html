<div class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4" (click)="closeModal()">
  <div class="bg-white rounded-lg w-full max-w-md" (click)="$event.stopPropagation()">
    <!-- Modal Header -->
    <div class="flex justify-between items-center p-4 border-b">
      <h2 class="text-xl font-semibold text-gray-800">
        {{ isLoginMode ? 'Sign In' : 'Create Account' }}
      </h2>
      <button class="text-gray-400 hover:text-gray-600" (click)="closeModal()">
        <i class="fa-solid fa-times text-xl"></i>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="p-6">
      <!-- Toggle between Login and Signup -->
      <div class="flex mb-6 bg-gray-100 rounded-lg p-1">
        <button 
          class="flex-1 py-2 px-4 rounded-md text-sm font-medium transition-colors"
          [class.bg-white]="isLoginMode"
          [class.text-gray-800]="isLoginMode"
          [class.text-gray-500]="!isLoginMode"
          (click)="toggleMode(true)"
        >
          Sign In
        </button>
        <button 
          class="flex-1 py-2 px-4 rounded-md text-sm font-medium transition-colors"
          [class.bg-white]="!isLoginMode"
          [class.text-gray-800]="!isLoginMode"
          [class.text-gray-500]="isLoginMode"
          (click)="toggleMode(false)"
        >
          Create Account
        </button>
      </div>

      <!-- Login Form -->
      <form *ngIf="isLoginMode" (ngSubmit)="onLogin()" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-customGreen"
            placeholder="Enter your email"
            required
          >
        </div>
        
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              name="password"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-customGreen"
              placeholder="Enter your password"
              required
            >
            <button 
              type="button" 
              class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500"
              (click)="togglePasswordVisibility()"
            >
              <i class="fa-solid" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
            </button>
          </div>
        </div>
        
        <button
          type="submit"
          class="w-full bg-customGreen text-white py-2 px-4 rounded-md hover:bg-green-600 transition-colors"
        >
          Sign In
        </button>
      </form>

      <!-- Signup Form -->
      <form *ngIf="!isLoginMode" (ngSubmit)="onSignup()" class="space-y-4">
        <div>
          <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-customGreen"
            placeholder="Enter your full name"
            required
          >
        </div>
        
        <div>
          <label for="signupEmail" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input
            type="email"
            id="signupEmail"
            name="email"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-customGreen"
            placeholder="Enter your email"
            required
          >
        </div>
        
        <div>
          <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-customGreen"
            placeholder="Enter your phone number"
            required
          >
        </div>
        
        <div>
          <label for="signupPassword" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="signupPassword"
              name="password"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-customGreen"
              placeholder="Create a password"
              required
            >
            <button 
              type="button" 
              class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500"
              (click)="togglePasswordVisibility()"
            >
              <i class="fa-solid" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
            </button>
          </div>
        </div>
        
        <button
          type="submit"
          class="w-full bg-customGreen text-white py-2 px-4 rounded-md hover:bg-green-600 transition-colors"
        >
          Create Account
        </button>
      </form>

      <!-- Continue as Guest -->
      <div class="mt-6 text-center">
        <button 
          class="text-customGreen hover:underline"
          (click)="continueAsGuest()"
        >
          Continue as Guest
        </button>
      </div>
    </div>
  </div>
</div>
