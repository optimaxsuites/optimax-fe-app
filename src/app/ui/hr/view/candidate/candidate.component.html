

<div *ngIf="showCandidate">
  <div class="card">
    <!-- <app-back-button></app-back-button> -->

    <p-toolbar styleClass="mb-4 gap-2">
      <ng-template pTemplate="left">
        <app-button text="Delete" class="btn-delete"></app-button>
      </ng-template>

      <ng-template pTemplate="right">
        <div>
          <ng-select 
            [items]="positions"
            class="table-item"
            bindLabel="position"
            [multiple]="true"
            placeholder="Filter by position"
            [(ngModel)]="selectedPositions"
            (ngModelChange)="filterCandidatesByPosition()">
          </ng-select>
        </div>
        <!-- <app-button text="Add New" class="btn-navigate gap-2"></app-button> -->
        <!-- <app-button text="Import" class="btn-export"></app-button> -->
      </ng-template>
    </p-toolbar>

    <div class="search-bar">
      <input 
        type="text" 
        placeholder="Search" 
        class="editInput"
      />
    </div>

    <p-table 
        [value]="filteredCandidates" 
        [paginator]="true" 
        styleClass="p-datatable-striped" 
        [tableStyle]="{'min-height': 'fit-content', 'max-height': '650px'}"
        [rows]="15"
        >
        
        <ng-template pTemplate="header">
        <tr>
            <th style="width: 4rem"><p-tableHeaderCheckbox /></th>
            <th class="table-item" pSortableColumn="candidate">Candidate</th>
            <th class="table-item" pSortableColumn="email">Email</th>
            <th class="table-item" pSortableColumn="contactNumber">Contact Number</th>
            <th class="table-item" pSortableColumn="contactNumber">Position</th>
            <th class="table-item" pSortableColumn="dateApplied">Date Applied</th>
            <th class="table-item" pSortableColumn="stage">Stage</th>
            <th class="table-item"></th>
        </tr>
        </ng-template>

        <ng-template pTemplate="body" let-candidate let-i="rowIndex">
        <tr class="p-table-row">
            <td><p-tableCheckbox [value]="candidate" /></td>
            <td class="table-item">{{ candidate.candidate }}</td>
            <td class="table-item">{{ candidate.email }}</td>
            <td class="table-item">{{ candidate.contactNo }}</td>
            <td class="table-item">{{ candidate.position }}</td>
            <td class="table-item">{{ candidate.dateApplied }}</td>
            <td class="table-item">
                <ng-select 
                    [items]="stages"
                    [(ngModel)]="candidate.stage"
                    (ngModelChange)="updateStage(candidate, $event)"
                    class="custom-ng-select"
                    dropdownPosition="auto"
                    appendTo="body"
                    [clearable]="false"
                    [disabled]="candidate.stage === 'Hired'">
                    <ng-option class="table-item" *ngFor="let stage of stages" [value]="stage">{{ stage }}</ng-option>
                </ng-select>
            </td>
            <td class="actions">
            <i class="pi pi-ellipsis-v table-item"(click)="op.toggle($event)" ></i>
            <p-overlayPanel #op ngClass="padding: 0;">
                    <div>
                        <!-- <li class="table-item-panel"> <i class="pi pi-user-plus table-item me-2"></i> Add as Employee</li> -->
                        <li class="table-item-panel" (click)="openViewModal(candidate, op)"> <i class="pi pi-eye table-item me-2"></i> View</li>
                        <li class="table-item-panel"> <i class="pi pi-download table-item me-2"></i> Download Resume</li>
                        <li class="table-item-panel" (click)="openInterviewInvite()"> <i class="pi pi-send table-item me-2"></i> Send Invite</li>
                        <!-- <li class="table-item-panel"> <i class="pi pi-users table-item me-2"></i> Compare with Other Candidates </li> -->
                        <li class="table-item-panel"> <i class="pi pi-trash table-item me-2"></i> Delete</li>
                    </div>
                  </p-overlayPanel>
            </td>
        </tr>
        </ng-template>
    </p-table>
  
  </div>
</div>


<div *ngIf="showInterviewInvite">
  <app-interview-invite (back)="closeInterviewInvite()"></app-interview-invite>
</div>

<app-modal 
  *ngIf="viewModal"
  [header]="'Viewing ' + activeItem.candidate + ' information'"
  [title]="'Cancel'"
  (close)="closeViewModal()">
  <!-- <app-view></app-view> -->
     <div class="view-wrapper">
      <div class="d-flex gap-4 my-2">
        <div class="input-container-50">
            <label for="name">Name </label>
            <input type="text" id="name" name="name" class="editInput" required>
        </div>
        <div class="input-container-50">
            <label for="phone-number">Phone Number </label>
            <input type="text" id="phone-number" name="phone-number" class="editInput" required appNumberOnly>
        </div>
      </div>
      <div class="d-flex gap-4 my-2">
        <div class="input-container-50">
            <label for="email">Email</label>
            <input type="text" id="email" name="email" class="editInput" required>
        </div>
        <div class="input-container-50">
            <label for="position">Position</label>
            <input type="" id="position" name="position" class="editInput" required appNumberOnly>
        </div>
      </div>
      <div class="d-flex gap-4 my-2">
        <div class="input-container-50">
            <label for="date">Date Applied</label>
            <input type="text" id="date" name="date" class="editInput" required>
        </div>
        <div class="input-container-50">
