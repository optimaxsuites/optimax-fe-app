<div class="modal-backdrop" (click)="closeModal()"></div>
<div class="modal-content " data-aos="fade-left" (click)="$event.stopPropagation()" [ngClass]="class"
  [ngStyle]="style">
  <!-- Header -->
  <div class="px-5 py-4 border-b border-slate-200/70">
    <div class="flex items-start justify-between gap-4">
      <div class="min-w-0">
        <h2 class="text-base sm:text-lg font-semibold text-slate-900 truncate">
          {{ header }}
        </h2>

        <p
          *ngIf="subheader"
          class="mt-1 text-xs sm:text-sm text-slate-500 leading-snug"
        >
          {{ subheader }}
        </p>
      </div>

      <button
        type="button"
        class="shrink-0 inline-flex items-center justify-center
               h-9 w-9 rounded-full
               text-slate-500 hover:text-slate-900
               hover:bg-slate-100 active:bg-slate-200
               transition"
        (click)="closeModal()"
        aria-label="Close"
        title="Close"
      >
        <span class="text-lg leading-none">✕</span>
      </button>
    </div>
  </div>
  <ng-content></ng-content>
</div>
