    <div class="detailDiv w-full">
      <label for="e-price">Name</label>
      <input
        class="name editInput"
        type="text"
        id="e-price"
        [(ngModel)]="supplierData.name"
        placeholder="Supplier name"
      />
    </div>

    <div class="detailDiv w-full">
      <label for="email">Email</label>
      <input
        id="email"
        [(ngModel)]="supplierData.email"
        class="name editInput"
        placeholder="Supplier value"
      />
    </div>

    <div class="detailDiv w-full">
      <label for="tel">Phone Number</label>
      <input
        id="tel"
        type="tel"
        [(ngModel)]="supplierData.phoneNumber"
        class="name editInput"
        placeholder="Supplier Phone Number"
      />
    </div>

    <!-- <div  *ngIf="productData.discount.discountType.includes(2)"> -->
    <div  class="detailDiv w-full">
      <label for="contact">Name of Contact Person</label>
      <input
        id="contact"
        type="text"
        [(ngModel)]="supplierData.contactPerson"
        class="name editInput"
        placeholder="Contact Person"
      />
    </div>

    <!-- <div *ngIf="productData.discount.discountType.includes(3)"> -->
    <div class="detailDiv w-full">
      <label for="address">Supplier's Address</label>
      <textarea
        id="address"
        type="text"
        [(ngModel)]="supplierData.address"
        class="name editInput"
        placeholder="Supplier's Address"
      ></textarea>
    </div>

      <div class="flex justify-end mt-4">
        <button
          class="px-6 py-2 bg-customBlue text-white rounded-lg hover:bg-customBlue transition flex items-center gap-2"
          (click)="addSupplier()">
          <i class="fa-solid fa-plus"></i> Add Supplier
        </button>
      </div>

    </div>


   <div class="bg-white rounded-lg shadow-sm border border-gray-200 py-5 px-4">
      <h3 class="text-md font-medium text-gray-700 mb-4 pb-2 border-b">
        Existing Suppliers
      </h3>

      <div *ngIf="suppliers.length === 0" class="text-center py-4 text-gray-500">
        No suppliers found. Create your first supplier above.
      </div>

      <ul *ngIf="suppliers.length > 0" class="divide-y divide-gray-200">
        <li *ngFor="let supplier of suppliers" class="py-3 flex justify-between items-center">
          <div class="flex items-center">
            <div class="h-8 w-8 bg-customBlue/50 text-customBlue rounded-full flex items-center justify-center mr-3">
              <i class="fa-solid fa-folder"></i>
            </div>
            <span class="font-medium text-gray-700">{{ supplier.name }}</span>
          </div>
          <button class="text-red-500 hover:text-red-700 transition" (click)="removeSupplier(supplier.id)">
            <i class="fa-solid fa-trash"></i>
          </button>
        </li>
      </ul>
    </div>


  </div>
