  <form #expenseForm="ngForm" (ngSubmit)="submitExpense(expenseForm)">
  <div class="add-expense-container">
    <div class="expense-form">
      <div class="form-left">
         <div class="floating-box form-subsection">
          <div class="form-group">
          <label for="name">Expense Name</label>
          <input
            type="text"
            id="name"
            name="name"
            [(ngModel)]="expenseSummary.name"
            required
            placeholder="Enter name"
          />
            <p class="error-message" *ngIf="expenseForm.submitted && !expenseSummary.name">
              Name is required.
            </p>
          
        </div>
    

        <div class="form-group">
          <label for="amount">Amount</label>
          <input
            type="text"
            id="amount"
            name="amount"
            [value]="formatAmount(expenseSummary.amount)"
            (input)="updateAmount($event)"
            required
            placeholder="Enter amount"
          />
          <p class="error-message" *ngIf="expenseForm.submitted && !expenseSummary.amount">
            Amount is required.
        </div>

        <div class="form-group">
          <label for="merchant">Supplier</label>
          <input
            type="text"
            id="merchant"
            name="merchant"
            [(ngModel)]="expenseSummary.merchant"
            required
            placeholder="Enter merchant"
          />
          <p class="error-message" *ngIf="expenseForm.submitted && !expenseSummary.merchant">
            Merchant is required.
        </div>

        <!-- <div class="form-group">
          <label for="expense-date">Expense Date</label>
          <input
            type="date"
            id="expense-date"
            name="expense-date"
            [(ngModel)]="expenseSummary.expenseDate"
          />
        </div> -->

        <div class="form-group">
          <label for="category">Category</label>
          <ng-select
            [items]="categories"
            bindLabel="name"
            bindValue="name"
            [(ngModel)]="expenseSummary.category"
            name="category"
            required
            placeholder="Select a category"
            class="w-full mt-3"
          >
          </ng-select>
          <p class="error-message" *ngIf="expenseForm.submitted && !expenseSummary.category">
            Category is required.
        </div>

        <div class="form-group">
          <label for="category">Quantity</label>
          <ng-select
            [items]="Quantity"
            bindLabel="name"
            bindValue="name"
            [(ngModel)]="expenseSummary.quantity"
            name="quantity"
            required
            placeholder="Select a quantity"
            class="w-full mt-3"
          >
          </ng-select>
          <p class="error-message" *ngIf="expenseForm.submitted && !expenseSummary.quantity">
            Quantity is required.
        </div>

        <div class="form-group">
          <label for="tax-percentage">Tax Percentage (%)</label>
          <input
            type="number"
            id="tax-percentage"
            name="taxPercentage"
            [(ngModel)]="expenseSummary.taxPercentage"
            placeholder="Enter tax percentage"
          />
        </div>

        <div class="form-group">
          <label for="event-date">Event Date</label>
          <input
            type="date"
            id="event-date"
            name="eventDate"
            [(ngModel)]="expenseSummary.eventDate"
            required
          />
          <p class="error-message" *ngIf="expenseForm.submitted && !expenseSummary.eventDate">
            Event Date is required.
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea
            id="description"
            name="description"
            rows="4"
            cols="50"
            [(ngModel)]="expenseSummary.description"
            required
            placeholder="Enter description"
          ></textarea>
          <p class="error-message" *ngIf="expenseForm.submitted && !expenseSummary.description">
            Description is required.
        </div>

      <div class="form-right">
        <div
          class="upload-container"
          (click)="fileInput.click()"
          (dragover)="onDragOver($event)"
          (drop)="onFileDrop($event, 'receipt')"
        >
          <input
            type="file"
            #fileInput
            class="file-input"
            (change)="onFileSelect($event, 'receipt')"
          />
          <p *ngIf="!receiptFile">Click or drag and drop to upload Document</p>
          <p *ngIf="receiptFile">Receipt: {{ receiptFile.name }}</p>
        </div>
