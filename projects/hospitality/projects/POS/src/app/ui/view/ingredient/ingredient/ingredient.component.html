<link
  href="https://fonts.googleapis.com/icon?family=Material+Icons"
  rel="stylesheet"
/>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=visibility"
/>


<!-- Search and Categories Section -->
<div *ngIf="tableSection" class="flex flex-col w-full  p-4">
  <div class="gap-3 w-full flex justify-between items-center">
    <ng-select
    [items]="categories"
    bindLabel="name"
    [(ngModel)]="selectedCategories"
    (ngModelChange)="filterIngredientsByCategories($event)"
    placeholder="Select Category"
  ></ng-select>
  
<div class="w-1/3 flex justify-end">
  <div class="search-container ">
    <input
      type="text"
      class="Search-input"
      placeholder="Search by Name..."
      [(ngModel)]="searchTerm"
      (ngModelChange)="filterIngredientsBySearch($event)"
    />
    <i class="fas fa-search"></i>
  </div>
</div>

  
  </div>
 

  <p-toolbar styleClass=" gap-2 justify-end" class="mb-8 mt-28">
    <ng-template pTemplate="right">
      <app-button 
        text="Add Ingredient" 
        class="btn-navigate "
        (click)="navigateToAddIngredient()">
      </app-button>

      <app-button 
      text="  Delete" 
      class="btn-navigate "
      (click)="  deleteSelectedIngredients()">
    </app-button>
    </ng-template>
  </p-toolbar>


  <p-table [value]="filteredIngredients" [paginator]="true" dataKey="sku" responsiveLayout="stack" [rows]="10" styleClass="p-datatable-striped"   [(selection)]="selectedIngredients">
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 4rem"><p-tableHeaderCheckbox /></th>
        <th class="table-item">SKU</th>
        <th class="table-item">Code</th>
        <th class="table-item">Name</th>
        <th class="table-item">Price</th>
        <th class="table-item">Quantity</th>
        <th class="table-item">Category</th>
        <th class="table-item">Action</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-item>
      <tr let item   >
        <td><p-tableCheckbox [value]="item" class="custom-checkbox" ></p-tableCheckbox></td>
        <td>{{ item.sku }}</td>
        <td>{{ item.code }}</td>
        <td>{{ item.ingredientName }}</td>
        <td>{{ item.purchasePrice }}</td>
        <td>{{ item.currentStock }}</td>
        <td>{{ item.category }}</td>

        <div class="menu-container pl-12 pt-4">
          <button class="menu-button" (click)="toggleMenu($event)">
            <i class="pi pi-ellipsis-v"></i>
          </button>

          <ul class="custom-menu" [ngClass]="{ 'show': isMenuOpen }">
            <li >
              <i class="pi pi-eye"></i> View
            </li>
            <li >
              <i class="pi pi-plus"></i> Add Ingredient
            </li>
          
          </ul>

        </div>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="8" style="text-align: center; padding: 20px;">
          No ingredients found.
        </td>
      </tr>
    </ng-template>
  </p-table>
  <!-- <div
    *ngIf="filteredIngredients.length === 0"
    style="text-align: center; margin-top: 10px"
  >
    No ingredients found.
  </div> -->
</div>
