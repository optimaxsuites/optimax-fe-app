<div class="update-stock-container">
  <div class="form-header">
    <p class="back-button" (click)="navigateToPrevious()">
      <i class="fa-solid fa-arrow-left"></i> Back
    </p>
  </div>

  <div class="main-form-content">
    <div class="form-section left-section">
      <h3 class="section-title">Store Item Details</h3>

      <div class="form-field-group">
        <label for="product-select">Select Ingredient</label>
        <p-dropdown id="product-select"
          [options]="ingredients"
          [(ngModel)]="selectedIngredient"
          (onChange)="onIngredientSelect()"
          optionLabel="name"
          placeholder="Select an ingredient">
        </p-dropdown>
      </div>

      <div class="form-row">
        <div class="form-field-group">
          <label for="sku">SKU</label>
          <input id="sku" type="text" [(ngModel)]="ingredientDetails.sku" disabled class="disabled-input">
        </div>
        <div class="form-field-group">
          <label for="code">Code</label>
          <input id="code" type="text" [(ngModel)]="ingredientDetails.code" disabled class="disabled-input">
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-field-group">
          <label for="purchase-price">Purchase Price</label>
          <input id="purchase-price" type="text" [(ngModel)]="ingredientDetails.purchasePrice" disabled class="disabled-input">
        </div>
        <div class="form-field-group">
          <label for="current-stock">Current Stock</label>
          <input id="current-stock" type="text" [(ngModel)]="ingredientDetails.currentStock" disabled class="disabled-input">
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-field-group">
          <label for="reorder-threshold">Reorder Threshold</label>
          <input id="reorder-threshold" type="text" [(ngModel)]="ingredientDetails.reorderThreshold" disabled class="disabled-input">
        </div>
        <div class="form-field-group">
          <label for="measurement-unit">Measurement Unit</label>
          <input id="measurement-unit" type="text" [(ngModel)]="ingredientDetails.measurementUnit" disabled class="disabled-input">
        </div>
      </div>
      
      <div class="form-field-group">
        <label for="supplier-name">Supplier</label>
        <input id="supplier-name" type="text" [(ngModel)]="ingredientDetails.supplier.name" disabled class="disabled-input">
      </div>
      
      <div class="form-field-group">
        <label for="branches">Branch</label>
        <input id="branches" type="text" [value]="getBranchNames()" disabled class="disabled-input">
      </div>
    </div>

    <div class="form-section right-section">
      <h3 class="section-title">Stock Movement</h3>
      <form [formGroup]="stockMovementForm" (ngSubmit)="onSubmit()">
        <div class="form-field-group">
          <label for="movement-type">Movement Type</label>
          <p-dropdown id="movement-type"
            [options]="['Incoming', 'Outgoing']"
            formControlName="movementType"
            placeholder="Select Movement Type"
            (onChange)="onMovementTypeChange()">
          </p-dropdown>
        </div>

        <div class="form-field-group">
          <label for="movement-date">Movement Date</label>
          <input id="movement-date" type="date" formControlName="movementDate">
        </div>
        
        <div class="form-field-group">
          <label for="reference">Reference</label>
          <input id="reference" type="text" formControlName="reference" placeholder="Enter reference (optional)">
        </div>

        <div class="form-field-group">
          <label for="quantity">Quantity</label>
          <input id="quantity" type="number" formControlName="quantity">
        </div>

        <div class="form-field-group" *ngIf="stockMovementForm.get('movementType')?.value === 'Incoming'">
          <label for="supplier-select">Supplier</label>
          <p-dropdown id="supplier-select"
            [options]="suppliers"
            formControlName="supplierId"
            optionLabel="name"
            placeholder="Select supplier">
          </p-dropdown>
          <button type="button" class="add-button">+</button>
        </div>

        <div class="form-field-group" *ngIf="stockMovementForm.get('movementType')?.value === 'Incoming'">
          <label for="purchase-price-movement">Purchase Price</label>
          <input id="purchase-price-movement" type="number" formControlName="purchasePrice">
        </div>
        
        <div class="form-field-group" *ngIf="stockMovementForm.get('movementType')?.value === 'Incoming'">
          <label for="selling-price-movement">Base Selling Price</label>
          <input id="selling-price-movement" type="number" formControlName="sellingPrice">
        </div>
        
        <div class="submit-button-container">
          <button type="submit" class="record-movement-button">Record Movement</button>
        </div>
      </form>
    </div>
  </div>
</div>
