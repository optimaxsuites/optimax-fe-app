<div class="table-with-filters w-full max-w-9xl mx-auto px-4">

  <div class="filter-panel">


 <div class="filter-left">
          <button
            class="btn btn-danger"
            [disabled]="!selectedRequests.length"
            (click)="deleteSelected()"
          >
            <span class="material-icons btn-icon">delete</span>
            Delete
          </button>
        </div>

      <!-- <div class="toolbar-left">
        <app-button text="Delete" class="btn-delete" [disabled]="!selectedRequests?.length" (click)="deleteSelected()"></app-button>
      </div> -->

      <div class="filter-right">
        <div class="filter-group">
        <button class="btn btn-success"
        [disabled]="!selectedRequests.length"
        (click)="bulkApprove()"
        >
          <span class="material-icons btn-icon">check_circle</span>
          Accept
        </button>

      </div>
      
        <div class="filter-group">
        <button class="btn btn-danger"
        [disabled]="!selectedRequests.length"
        (click)="bulkReject()"
        >
          <span class="material-icons btn-icon">cancel</span>
          Reject
        </button>

        </div>

      </div>

        <app-button text="Reject" class="btn-delete" [disabled]="!selectedRequests?.length" (click)="bulkReject()"></app-button>

    </div>


    
    <div class="table-wrapper">
    <p-table [value]="requests"[(selection)]="selectedRequests" [paginator]="true" styleClass="p-datatable-striped" [rows]="15"  >
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 4rem"><p-tableHeaderCheckbox /></th>
          <th class="table-item">Date</th>
          <th class="table-item">Expense</th>
          <th class="table-item">Merchant</th>
          <th class="table-item">Category</th>
          <th class="table-item">Amount</th>
          <th class="table-item">Submitted By</th>
          <th class="table-item">Status</th>
          <th class="table-item">Actions</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-request let-i="rowIndex">
        <tr>
          <td><p-tableCheckbox [value]="request" /></td>
          <td class="table-item">{{ request.eventDate }}</td>
          <td class="table-item">{{ request.name }}</td>
          <td class="table-item">{{ request.merchant }}</td>
          <td class="table-item">{{ request.category }}</td>
          <td class="table-item">{{ request.amount }}</td>
          <td class="table-item">{{ request.id }}</td>
          <td class="table-item">
            <div class="flex items-center">
            <span *ngIf="request.status === 'Pending'" class="material-symbols-outlined status-icon pending-icon">
              schedule
            </span>
            <span *ngIf="request.status === 'Approved'" class="material-symbols-outlined status-icon approved-icon">
              check
            </span>
            <span *ngIf="request.status === 'Rejected'" class="material-symbols-outlined status-icon rejected-icon">
              close
            </span>
          
            <span class="status-text" [ngClass]="{
              'pending-icon': request.status === 'Pending',
              'approved-icon': request.status === 'Approved',
              'rejected-icon': request.status === 'Rejected'
              }">  
              {{ request.status }}
            </span>
            </div>
          </td>          
          
            

          
          <td class="dropdown-container">
            <span class="material-symbols-outlined action-icon">more_vert</span>
            <div class="dropdown-content">
              <a (click)="approve(request)">
                <span class="material-symbols-outlined">check_circle</span> Accept
              </a>
              <a (click)="reject(request)">
                <span class="material-symbols-outlined">cancel</span> Reject
              </a>
            </div>
          </td>
          
        </tr>
      </ng-template>
    </p-table>

    
    </div>
  </div>

 </div>

  <div class="arrow-left">
    <div></div>
