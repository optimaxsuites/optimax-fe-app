<section *ngIf="formType === 'category'">
  <div class="first-container01">
    <div class="vendorCategory">
      <span>Name</span>
      <br />
      <input
        [(ngModel)]="categoryName"
        class="inputField"
        type="text"
        placeholder=" Name" (keydown)="onKeydown($event)"
      />
    </div>
    <div class="vendorCategory">
      <span>Code</span>
      <br />
      <input
        [(ngModel)]="categoryCode"
        class="inputField"
        type="text"
        placeholder="Code" (keydown)="onKeydown($event)"
      />
    </div>
    <div class="vendorCategory">
      <span>Description</span>
      <br />
        <textarea 
        [(ngModel)]="categoryDesc" cols="40" rows="10" placeholder="Description" class="descText" (keydown)="onKeydown($event)" ></textarea>
    </div>
  </div>

  <div class="btn-wrapper">
    <button (click)="saveCategory()" class="saveButton">Save & Continue</button>
  </div>
</section>

<section class="createVendor" *ngIf="formType === 'individual'">
  <div class="inputFlex">
    <div class="vendorCategory">
      <span>Vendor Name</span>
      <br />
      <input
        [(ngModel)]="vendorName"
        class="inputField"
        type="text"
        placeholder="Name"
      />
    </div>
    <div class="vendorCategory">
      <span>Vendor CAC Number</span>
      <br />
      <input
        [(ngModel)]="vendorCACNum"
        
        type="text"
        placeholder="CAC Number"
      />
    </div>
  </div>

    <div class="vendorCategory">
      <span>Vendor Address</span>
      <br />
      <input
        [(ngModel)]="vendorAddress"
        class="inputField"
        type="text"
        placeholder="Address"
      />
    </div>
    <div class="vendorCategory">
      <span>Vendor Phone Number</span>
      <br />
      <input
        [(ngModel)]="vendorPhoneNumber"
        class="inputField"
        type="text"
        placeholder="Phone"
      />
    </div>

    <div class="vendorCategory">
      <span>Vendor Email</span>
      <br />
      <input
        [(ngModel)]="vendorEmail"
        class="inputField"
        type="text"
        placeholder="Email"
      />
    </div>
    <div class="vendorCategory">
      <span>Vendor Services</span>
      <br />
      <input
        [(ngModel)]="vendorServices"
        class="inputField"
        type="text"
        placeholder="Services"
      />
    </div>
  

  <div class="btn-wrapper">
    <button (click)="saveVendor()" class="saveButton">Save & Continue</button>
  </div>
</section>
