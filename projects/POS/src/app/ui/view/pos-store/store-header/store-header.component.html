<!-- store-header.component.html -->
<header class="bg-white shadow-sm border-b border-gray-200 px-4 py-3">
  <div class="flex w-full items-center justify-between">
    <!-- Logo -->
    <div class="flex items-center">
      <img src="assets/Logo-green.png" alt="Store Logo" class="h-36 w-auto">
    </div>

    <!-- Centered Filters + Search -->
    <div class="flex flex-1 justify-center">
      <div class="flex items-center gap-3 w-full max-w-4xl">
        
        <!-- Location Selector -->
        <div class="relative flex-shrink-0">
          <button 
            class="flex items-center text-gray-700 hover:text-gray-900 text-left capitalize"
            (click)="toggleBranchDropdown()"
          >
            <i class="fa-solid fa-location-dot text-2xl mr-2"></i>
            <span class="truncate">{{ selectedBranch?.name || 'Select Location' }}</span>
            <i class="fa-solid fa-chevron-down ml-2 text-xs"></i>
          </button>

          @if (isBranchDropdownOpen) {
            <div class="absolute top-full left-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50 border border-gray-200">
              @for (branch of branches; track branch.id) {
                <button 
                  (click)="selectBranch(branch)"
                  class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 w-full text-left"
                >
                  {{ branch.name }}
                </button>
              }
            </div>
          }
        </div>

        <!-- Category Dropdown -->
        <select
          class="w-40 bg-white border border-gray-300 rounded-lg px-3 py-2 text-gray-700 focus:outline-none focus:ring-2 focus:ring-customGreen"
          [value]="selectedCategory" 
          (change)="onCategoryChange($any($event.target).value)"
        >
          <option value="All">All Categories</option>
          @for (category of categoryOptions; track $index) {
            <option [value]="category.value">{{ category.label }}</option>
          }
        </select>

        <!-- Search Input -->
        <div class="relative flex-1">
          <input
            type="text"
            placeholder="Search products..."
            class="w-full pl-10 pr-4 py-2 bg-white border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-customGreen"
            [value]="searchText"
            (input)="onSearchChange($any($event.target).value)"
          >
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fa-solid fa-search text-gray-400"></i>
          </div>
        </div>
      </div>
    </div>
    
    <!-- User Icon -->
<!-- User Icon -->
<div class="relative mx-4">
  <button 
    class="flex items-center text-gray-700 hover:text-gray-900"
    (click)="toggleUserDropdown()"
  >
    <i class="fa-solid fa-user-circle text-3xl mr-2"></i>
    <span>{{ user.name }}</span>
    <i class="fa-solid fa-chevron-down ml-2 text-xs"></i>
  </button>
  
  <!-- User Dropdown -->
  @if (isUserDropdownOpen) {
    <div class="absolute top-full right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50 border border-gray-200">
      @if (user.isGuest) {
        <button 
          (click)="openAuthModal('login')"
          class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 w-full text-left"
        >
          Sign In
        </button>
        <button 
          (click)="openAuthModal('signup')"
          class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 w-full text-left"
        >
          Create Account
        </button>
      } @else {
        <button 
          class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 w-full text-left"
        >
          My Profile
        </button>
        <button 
          class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 w-full text-left"
        >
          Order History
        </button>
        <button 
          (click)="logout()"
          class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 w-full text-left"
        >
          Sign Out
        </button>
      }
    </div>
  }
</div>

<!-- Auth Modal -->
@if (isAuthModalOpen) {
  <app-auth-modal
    [initialMode]="authModalMode"
    (close)="closeAuthModal()"
    (login)="handleLogin($event)"
    (signup)="handleSignup($event)"
    (guest)="handleGuest()"
  ></app-auth-modal>
}
      
    <!-- Cart Button -->
    <button 
      class="relative p-2 hover:bg-gray-100 rounded-lg transition-colors"
      (click)="onToggleCart()"
      [disabled]="isCartEmpty"
      [ngClass]="{'opacity-50 cursor-not-allowed': isCartEmpty}"
    >
      <i class="fa-solid fa-cart-shopping text-xl"
        [ngClass]="isCartEmpty ? 'text-gray-400' : 'text-customBlue'"></i>
      
      @if (!isCartEmpty && totalCartItems > 0) {
        <span class="absolute -top-1 -right-1 bg-customBlue text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">
          {{ totalCartItems }}
        </span>
      }
    </button>
  </div>
</header>
