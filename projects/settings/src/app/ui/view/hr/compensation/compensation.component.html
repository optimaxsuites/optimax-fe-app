<p-confirmDialog header="Confirm Deletion" icon="pi pi-exclamation-triangle" styleClass="custom-confirm-dialog"></p-confirmDialog>

<div class="flex gap-4 items-center">
    <i class="pi pi-receipt text-4xl text-customBlue"></i>
    <div>
        <p class="text-customBlue/60">Human Resources</p>
        <p class="text-customBlue font-semibold text-[17px]">Compensation configuration</p>
    </div>
</div>

<div class="flex gap-10 my-4 justify-center items-center text-customBlue">
    <button *ngFor="let tab of tabs" 
    [ngClass]="{
        'border-b-4 border-customBlue font-bold text-customBlue scale-105': tab === tabState,
        'hover:scale-105 hover:text-customBlueHover': true
      }"
    (click)="changeTab(tab)">
{{ tab | titlecase }}
</button>
</div>

<div class="mb-4 mt-3 px-3 flex items-center">
    <p *ngIf="showAddForm" class="text-xl font-semibold text-customBlue capitalize flex-1">
      <span>New</span> {{ tabState }} Structures
    </p>
    <button 
      class="bg-customBlue text-white font-bold p-3 rounded-xl ml-auto" 
      (click)="toogleForm()"
    >
      {{ showAddForm ? "Cancel" : "Create New" }}
    </button>
  </div>
  
  
  <div *ngIf="loading && !showAddForm" class="flex flex-col gap-3 mx-2">
    <div class="p-6 w-full animate-pulse bg-gray-200 rounded-sm"></div>
    <div class="p-6 w-full animate-pulse bg-gray-200 rounded-sm"></div>
    <div class="p-6 w-full animate-pulse bg-gray-200 rounded-sm"></div>
  </div>
  
  <ng-container *ngIf="!loading && !showAddForm ">
    <div *ngIf="paginatedData.length === 0" class="text-center font-bold text-xl text-customBlue">
      No {{ tabState }} available to display.
    </div>
  
    <mat-accordion *ngIf="paginatedData.length > 0 && !showAddForm">
      <mat-expansion-panel *ngFor="let item of paginatedData; let i = index" #panel>
        <mat-expansion-panel-header>
          <mat-panel-title>
            {{ item.name }}
          </mat-panel-title>
          <mat-panel-description  class="action-buttons">
            <button (click)="editCompensation(item, $event)"  class="text-customGreen hover:bg-green-50 p-3 rounded-xl"><i class="fa-solid fa-pen-to-square cursor-pointer text-2xl pr-2 "></i><span *ngIf="panel.expanded" >Edit</span></button>
            <button (click)="confirmCompensationDelete(item, $event)"  class="text-red-500 hover:bg-red-50 p-3 rounded-xl "><i class="fa-solid fa-trash text-2xl pr-2"></i><span *ngIf="panel.expanded">Delete</span></button>
          </mat-panel-description>
        </mat-expansion-panel-header>
        <div>
          <p *ngIf="item.code"><strong>Code:</strong> {{ item.code }}</p>
          <p><strong>Description:</strong> {{ item.description }}</p>
          <p *ngIf="item.isTax"><strong>Tax:</strong> {{ item.isTax }}</p>

        </div>
      </mat-expansion-panel>
    </mat-accordion>
  
    <div *ngIf="hasMoreData && !showAddForm" class="flex items-center justify-center w-full mt-3">
      <button 
        (click)="loadMore()" 
        class="p-3 text-gray-600 font-bold border-2 bg-gray-200 shadow-sm cursor-pointer"
      >
        Load More
      </button>
    </div>
    
    <div *ngIf="!hasMoreData && !isPaginated && !showAddForm" class="flex items-center justify-center w-full mt-3">
      <button 
        (click)="loadLess()" 
        class="p-3 text-gray-600 font-bold border-2 bg-gray-200 shadow-sm cursor-pointer"
      >
        Load Less
      </button>
    </div>
  </ng-container>



<div *ngIf="showAddForm">
    <form [formGroup]="compensationForm" (ngSubmit)="onSubmit()" class="p-4 w-[80%] mx-auto shadow-md rounded-xl text-customBlue bg-white/70">
      <!-- <h2 class="text-2xl font-bold mb-4">Add New Salary Structure</h2> -->
    
      <div class="mb-4">
        <label for="name" class="block text-[14px] font-medium capitalize">{{tabState}} name<span class="ml-1 font-bold text-red-600">*</span></label>
        <input formControlName="name" id="name" class="form-input w-full mt-1 p-2 border border-gray-300 rounded-md editInput" type="text" placeholder="Enter name" />
        <div *ngIf="compensationForm?.get('name')?.invalid && compensationForm.get('name')?.touched" class="text-red-500 text-[14px]">Name is required.</div>
      </div>
    
      <div class="mb-4">
        <label for="description" class="block text-[14px] font-medium">Description</label>
        <textarea formControlName="description" id="Description" class="form-input w-full mt-1 p-2 border border-gray-300 rounded-md" rows="3"  placeholder="Enter Description" ></textarea>
      </div>
  
      <div class="flex items-center gap-5 ">
        <div class="mb-4 w-full" *ngIf="tabState == 'allowances'">
            <label for="code" class="block text-[14px] font-medium capitalize">Code</label>
            <input formControlName="code" id="code" class="form-input w-full mt-1 p-2 border border-gray-300 rounded-md" type="text" placeholder="Enter code" />
        </div>
      <div class="mb-4 w-full" *ngIf="tabState == 'deductions'">
        <label for="isTax" class="block text-[14px] font-medium capitalize">isTax </label>
        <input formControlName="isTax" id="isTax" class="form-input w-full mt-1 p-2 border border-gray-300 rounded-md" type="checkbox" placeholder="Enter isTax" />
    </div>
  </div>
    
      
      
       
    
      <div class="text-right">
        <button type="submit" class="bg-green-500 text-white px-6 py-2 rounded-lg hover:bg-green-700" [disabled]="compensationForm.invalid">Add</button>
      </div>
    </form>
  </div>
  
  
  <p-toast position="top-right" key="tl" />
