<p-card header="{{ viewedClient.client_unique_identifier }}">
  <p-toast position="top-center"></p-toast>
  <!--* left -->
  <ng-template pTemplate="content">
    <div class="p-col-12 p-grid">
      <div class="p-col-10">
        <div class="p-fluid p-formgrid p-grid">
          <div class="p-field p-col-12 p-md-12">
            <i class="pi pi-user-plus p-mr-2"></i>
            <b>Add Visits</b>
          </div>

          <div class="p-field p-col-4">
            <label for="dor"><b>Visit Date: *</b></label>
            <p-calendar
              [monthNavigator]="true"
              [yearNavigator]="true"
              yearRange="2000:{{ curYear }}"
              [maxDate]="maxDate"
              [(ngModel)]="clinicvisit.date_of_first_visit"
              #dor="ngModel"
              inputId="navigators"
              [showIcon]="true"
              showButtonBar="true"
              required
              placeholder="Enter visit date"
              [ngClass]="{
                'ng-dirty':
                  (dor.invalid && submitted) || (dor.dirty && dor.invalid)
              }"
            >
            </p-calendar>
            <small
              *ngIf="(dor.invalid && submitted) || (dor.dirty && dor.invalid)"
              class="p-error"
            >
              Date of registration is required</small
            >
          </div>

          <div class="p-col-8"></div>

          <div class="p-field p-col-4">
            <label for="clinical_stage_id"><b>Clinical Stage</b></label>
            <p-dropdown
              inputId="clinical_stage_id"
              [filter]="true"
              filterBy="name"
              [showClear]="true"
              [options]="clinicalStagesMap"
              [(ngModel)]="clinicvisit.clinical_stages_id"
              optionLabel="name"
              optionValue="clinical_stages_id"
              placeholder="-Select-"
            ></p-dropdown>
          </div>

          <div class="p-field p-col-4">
            <label for="functional_status_id"><b>Functional Status</b></label>
            <p-dropdown
              inputId="functional_status_id"
              [filter]="true"
              filterBy="name"
              [showClear]="true"
              [options]="functionalStatusMap"
              [(ngModel)]="clinicvisit.functional_status_id"
              optionLabel="name"
              optionValue="functional_status_id"
              (onChange)="ontest()"
              placeholder="-Select-"
            ></p-dropdown>
          </div>

          <div class="p-field p-col-4">
            <label for="tb_status_id"><b>TB Status</b></label>
            <p-dropdown
              inputId="tb_status_id"
              [filter]="true"
              filterBy="name"
              [showClear]="true"
              [options]="tBStatusMap"
              [(ngModel)]="clinicvisit.tb_status_id"
              optionLabel="name"
              optionValue="status_id"
              placeholder="-Select-"
            ></p-dropdown>
          </div>

          <div class="p-field p-col-4">
            <label for="pregnancy_id"><b>Pregnancy Status</b></label>
            <p-dropdown
              inputId="pregnancy_id"
              [filter]="true"
              filterBy="name"
              [showClear]="true"
              [options]="pregnancyStatusMap"
              [(ngModel)]="clinicvisit.pregnancy_status_id"
              optionLabel="name"
              optionValue="pregnancy_id"
              placeholder="-Select-"
            ></p-dropdown>
          </div>

          <div class="p-field p-col-4">
            <label for="username"><b>Opportunistic Infections</b></label>
            <p-dropdown
              inputId="clinical_stage_id"
              [filter]="true"
              filterBy="name"
              [showClear]="true"
              [options]="oppInfectionsMap"
              [(ngModel)]="clinicvisit.oppotunistic_infection_id"
              optionLabel="name"
              optionValue="opportunistic_infection_id"
              placeholder="-Select-"
            ></p-dropdown>
          </div>

          <div class="p-field p-col-4"></div>

          <div class="p-field p-col-4">
            <label for="weight"><b>Weight</b></label>
            <p-inputNumber
              [(ngModel)]="clinicvisit.weight"
              inputId="weight"
              maxlength="6"
              suffix=" kg"
              placeholder="Enter weight in kg"
            >
            </p-inputNumber>
          </div>

          <div class="p-field p-col-4">
            <label for="height"><b>Height</b></label>
            <p-inputNumber
              mode="decimal"
              [minFractionDigits]="1"
              [maxFractionDigits]="5"
              [(ngModel)]="clinicvisit.height"
              inputId="height"
              maxlength="6"
              suffix=" m"
              placeholder="Enter height in m"
            >
            </p-inputNumber>
          </div>

          <div class="p-field p-col-4"></div>

          <div class="p-field p-col-12 p-md-12">
            <i class="pi pi-user-plus p-mr-2"></i>
            <b>Blood Pressure</b>
          </div>

          <div class="p-field p-col-4">
            <label for="systolic"><b>Systolic</b></label>
            <p-inputNumber
              [(ngModel)]="clinicvisit.systolic"
              inputId="systolic"
              maxlength="9"
              suffix=" mmHg"
              placeholder="Enter systolic in mmHg"
            >
            </p-inputNumber>
          </div>

          <div class="p-field p-col-4">
            <label for="distolic"><b>Diastolic</b></label>
            <p-inputNumber
              [(ngModel)]="clinicvisit.diastolic"
              inputId="diastolic"
              maxlength="9"
              suffix=" mmHg"
              placeholder="Enter diastolic in mmHg"
            >
            </p-inputNumber>
          </div>

          <div class="p-field p-col-4"></div>

          <div class="p-field-checkbox p-col-12">
            <p-checkbox
              [(ngModel)]="clinicvisit.adversed_reaction_screened"
              binary="true"
              inputId="binadrxary"
            ></p-checkbox>
            <label for="adrx">Adversed Drug Reaction Screened?</label>
          </div>

          <div class="p-field p-col-12 p-md-4">
            <label for="username"><b>Level of Adherence</b></label>
            <p-dropdown
              inputId="clinical_stage_id"
              [filter]="true"
              filterBy="name"
              [showClear]="true"
              [options]="levelofAdherenceMap"
              [(ngModel)]="clinicvisit.adherence_level_id"
              optionLabel="name"
              optionValue="adherence_level_id"
              placeholder="-Select-"
            ></p-dropdown>
          </div>
          <div class="p-field p-col-12">
            <label for="clinicnote"><b>Clinic Note</b></label>
            <textarea
              id="clinicnote"
              pInputText
              required
              rows="3"
              cols="20"
              [(ngModel)]="clinicvisit.clinical_note"
            ></textarea>
          </div>
        </div>
      </div>

      <!--* right -->
      <div class="p-col-2">
        <div class="p-fluid p-formgrid p-grid">
          <div class="p-field p-col-12 p-md-12">
            <i class="fa fa-stethoscope p-mr-2"></i>
            <b>Last five (5) visits</b>
          </div>
          <p-timeline [value]="visitsByClient" align="alternate">
            <ng-template pTemplate="content" let-visit>
              {{ visit.date_of_first_visit | date }}
            </ng-template>
          </p-timeline>
        </div>
      </div>
    </div>
  </ng-template>
  <ng-template pTemplate="footer">
    <div class="p-grid p-nogutter p-justify-between">
      <p-button
        label="Save"
        (onClick)="PostClinicVisit()"
        icon="pi pi-save"
      ></p-button>
    </div>
  </ng-template>
</p-card>
