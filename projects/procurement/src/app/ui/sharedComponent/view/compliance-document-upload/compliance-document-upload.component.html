<div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
  <div class="flex items-center justify-between mb-3">
    <div class="font-semibold text-slate-900">Upload Compliance Document</div>
    <p class="text-xs text-slate-500">PDF/JPG/PNG • Keep files under your API limit</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
    <div>
      <label class="text-xs font-medium text-slate-600">Document Type</label>
      <p-dropdown
        [options]="documentTypes"
        [(ngModel)]="documentType"
        [showClear]="false"
        class="w-full">
      </p-dropdown>
    </div>

    <div>
      <label class="text-xs font-medium text-slate-600">Issued Date</label>
      <input class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-slate-200"
             type="date" [(ngModel)]="issuedDate" />
    </div>

    <div>
      <label class="text-xs font-medium text-slate-600">Expiry Date</label>
      <input class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-slate-200"
             type="date" [(ngModel)]="expiryDate" />
    </div>
  </div>

  <div class="mt-3">
    <p-fileUpload
      mode="basic"
      name="file"
      chooseLabel="Choose File"
      [customUpload]="true"
      (onSelect)="onSelect($event)"
      [auto]="false">
    </p-fileUpload>
  </div>

  <div class="mt-4 flex justify-end">
    <button pButton type="button" label="Upload" class="p-button-sm"
            [disabled]="!file" (click)="submit()"></button>
  </div>
</div>
