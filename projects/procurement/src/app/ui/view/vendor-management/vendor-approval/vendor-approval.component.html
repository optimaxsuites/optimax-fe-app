  [rows]="vendors"
  [actions]="actions"

  [rowsPerPage]="10"
  [rowClickable]="true"
  dataKey="id"
  (rowClick)="reviewVendor($event)"
  (actionClick)="onAction($event)"
></app-table>

<app-large-side-modal
  *ngIf="displayVendorDialog"
  [header]="'Vendor Details'"
  [subheader]="
    'Supplier master data, onboarding submission, AI validation and compliance documents.'
  "
  (close)="displayVendorDialog = false"
>
  <app-vendor-details [vendor]="selectedVendor"></app-vendor-details>
</app-large-side-modal>



<p-dialog
  header="Reject Vendor"
  [(visible)]="rejectDialogVisible"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '32rem' }"
  (onHide)="closeRejectDialog()"
>
  <div class="space-y-4">
    <div class="text-sm text-slate-600">
      You are about to reject this vendor.
    </div>

    <div
      class="rounded-xl border border-slate-200 bg-slate-50 p-3 text-sm text-slate-700"
      *ngIf="selectedVendorForRejection"
    >
      <div>
        <span class="text-slate-500">Vendor:</span>
        <span class="font-medium">
          {{ selectedVendorForRejection.companyProfile.legalName || '—' }}
        </span>
      </div>
      <div>
        <span class="text-slate-500">Status:</span>
        <span class="font-medium">
          {{ selectedVendorForRejection.status || '—' }}
        </span>
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-2">
        Rejection Reason <span class="text-red-500">*</span>
      </label>

      <textarea
        pInputTextarea
        [(ngModel)]="rejectionReason"
        rows="5"
        class="w-full border p-2"
        placeholder="Enter reason for rejection"
      ></textarea>

      <div class="mt-1 text-xs text-slate-500">
        This reason will be saved on the vendor record.
      </div>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <button
        pButton
        type="button"
        label="Cancel"
        class="p-button-text p-button-sm"
        (click)="closeRejectDialog()"
      ></button>

      <button
        pButton
        type="button"
        label="Reject Vendor"
        icon="pi pi-times"
        class="p-button-danger p-button-sm"
        [disabled]="!rejectionReason.trim()"
        (click)="confirmRejectVendor()"
      ></button>
    </div>
  </ng-template>
</p-dialog>
