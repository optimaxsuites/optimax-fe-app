<div class="shift-container">

  <!-- HEADER -->
  <div class="header">
    <div>
      <h2>Shifts</h2>
      <p class="shift-count">{{ shifts.length }} shifts</p>
    </div>
    <button class="add-btn" (click)="createShift()">
      <i class="fa-solid fa-plus"></i> Create Shift
    </button>
  </div>

  <!-- FILTER BAR -->
  <div class="filter-card">
    <input
      type="text"
      placeholder="Search shift..."
      [(ngModel)]="searchText"
    />
    <select [(ngModel)]="shiftTypeFilter">
      <option value="">All Types</option>
      <option value="morning">Morning</option>
      <option value="evening">Evening</option>
      <option value="night">Night</option>
    </select>
    <button class="apply-btn" (click)="applyFilter()">Apply</button>
    <button class="reset-btn" (click)="resetFilter()">Reset</button>
  </div>

  <!-- SHIFT TABLE -->
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Type</th>
          <th>Time</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let shift of filteredShifts">
          <td>
            <span class="color-dot" [style.background]="shift.color"></span>
            {{ shift.name }}
          </td>
          <td>
            <span class="shift-type" [ngClass]="shift.type">{{ shift.type }}</span>
          </td>
          <td>{{ shift.startTime }} - {{ shift.endTime }}</td>
          <td>{{ shift.description }}</td>
          <td class="actions">
            <button class="edit" (click)="editShift(shift)">Edit</button>
            <button class="delete" (click)="deleteShift(shift.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <app-shift-form
  *ngIf="showForm"
  [shift]="selectedShift"
  (closeForm)="closeForm()">
</app-shift-form>
</div>
