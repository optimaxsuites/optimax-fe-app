<!-- In your component.html file -->
<div class="flex h-screen">
  <!-- Full height sidebar -->
  <aside
    class="w-1/6 bg-gradient-to-b from-customBlueHover to-customBlue text-white shadow-lg rounded-xl flex flex-col"
  >
    <div class="p-6 flex-grow">
      <h2 class="text-4xl mt-3 text-white font-bold mb-6">Services</h2>
      <ul class="space-y-3">
        <div
          *ngFor="let service of serviceTypes"
          (click)="selectService(service.name, service.path)"
          [class]="getFilterClass(service.name)"
        >
          <span>{{ service.name }}</span>
          <svg
            *ngIf="selectedService === service.name"
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M5 15l7-7 7 7"
            />
          </svg>
        </div>
      </ul>
    </div>
  </aside>

  <!-- Main content area -->
  <main class="w-5/6 p-6 overflow-auto">
    <router-outlet></router-outlet>
    <!-- <div *ngIf="openRoom">
      <app-room-service
        [selectedRooms]="selectedRooms"
        (back)="navigateToRoom()"
      ></app-room-service>
    </div> -->
  </main>
</div>
