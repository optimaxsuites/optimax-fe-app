<div class="stats-grid" *ngIf="stats; else noData">

  <div class="stat-card present">
    <h3>Present</h3>
    <p>{{ stats.present }}%</p>
  </div>

  <div class="stat-card absent">
    <h3>Absent</h3>
    <p>{{ stats.absent }}%</p>
  </div>

  <div class="stat-card late">
    <h3>Late</h3>
    <p>{{ stats.late }}%</p>
  </div>

  <div class="stat-card leave">
    <h3>On Leave</h3>
    <p>{{ stats.onLeave }}%</p>
  </div>

</div>
<ng-template #noData>
  <p>No data for selected period :P</p>
</ng-template>
