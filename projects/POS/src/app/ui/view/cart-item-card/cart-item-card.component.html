<div 
  *ngIf="item.selectedVariants.length > 0; else noVariantTemplate" 
  class="flex flex-col gap-3"
>
  @for (variant of item.selectedVariants; track $index) {
    <div class="flex justify-between rounded-2xl items-center border p-3">
      <div class="flex flex-col gap-1" (click)="onClick()">
        <span class="text-nowrap text-ellipsis whitespace-nowrap overflow-hidden w-64">
          {{ item.name }} - {{ variant.name }}
        </span>
        <span>₦{{ variant.price }}</span>
      </div>

      <div class="p-3 flex justify-between gap-4 border rounded-xl items-center w-52">
        <i class="fa-solid fa-minus cursor-pointer" (click)="updateItemQuantity(item, -1, variant)"></i>
        <input type="text" [(ngModel)]="variant.selectedQuantity" class="w-10 text-center outline-none" />
        <i class="fa-solid fa-plus cursor-pointer" (click)="updateItemQuantity(item, 1, variant)"></i>
      </div>

      <div class="flex gap-4 items-center">
        <span class="font-semibold">₦{{ (variant.selectedQuantity ?? 0) * variant.price }}</span>
        <!-- <i class="fa-solid fa-trash cursor-pointer" (click)="updateItemQuantity(item, -variant.selectedQuantity, variant)"></i> -->
      </div>
    </div>
  }
</div>

<ng-template #noVariantTemplate>
  <div class="flex justify-between rounded-2xl items-center border p-3">
    <div class="flex flex-col gap-1" (click)="onClick()">
      <span class="text-nowrap text-ellipsis whitespace-nowrap overflow-hidden w-64">
        {{ item.name }}
      </span>
      <span>₦{{ item.effectivePrice }}</span>
    </div>

    <div class="p-3 flex justify-between gap-4 border rounded-xl items-center w-52">
      <i class="fa-solid fa-minus cursor-pointer" (click)="updateItemQuantity(item, -1)"></i>
      <input type="text" [(ngModel)]="item.count" class="w-10 text-center outline-none" />
      <i class="fa-solid fa-plus cursor-pointer" (click)="updateItemQuantity(item, 1)"></i>
    </div>

    <div class="flex gap-4 items-center">
      <span class="font-semibold">₦{{ item.cartPriceTotal }}</span>
      <!-- <i class="fa-solid fa-trash cursor-pointer" (click)="updateItemQuantity(item, -item.count)"></i> -->
    </div>
  </div>
</ng-template>
