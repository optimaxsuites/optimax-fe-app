<div class="attendance-list">

  <div class="header">

    <div class="filter">
      <label>Month:</label>
      <input type="month" [value]="selectedMonth" (change)="onMonthChange($event)" />
    </div>
  </div>

  <div class="table">

    <div class="table-header">
      <span>Date</span>
      <span>Status</span>
      <span>Clock In</span>
      <span>Clock Out</span>
      <span>Hours</span>
    </div>

    <div 
      class="table-row"
      *ngFor="let record of filteredData"
      [ngClass]="record.status.toLowerCase()"
    >
      <span>{{ record.date | date:'MMM d, yyyy' }}</span>
      <span class="status">{{ record.status }}</span>
      <span>{{ record.checkIn || '--' }}</span>
      <span>{{ record.checkOut || '--' }}</span>
      <span>{{ record.hours || 0 }}h</span>
    </div>

    <div class="empty" *ngIf="filteredData.length === 0">
      No attendance records for this month.
    </div>

  </div>
</div>
