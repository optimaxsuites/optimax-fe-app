<div class="max-w-7xl mx-auto p-10 bg-white rounded-2xl shadow-lg">
  <h2 class="text-3xl font-bold text-center text-green-600 mb-6">
    Create Goal
  </h2>

  <form [formGroup]="goalForm" (ngSubmit)="onSubmit()" class="space-y-8">
    <!-- Goal Name Section -->
    <div class="space-y-4">
      <label class="text-lg font-semibold">Goal Name*</label>
      <input
        type="text"
        formControlName="goalName"
        placeholder="Enter goal name"
        class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-200"
      />
      <div
        *ngIf="
          goalForm.get('goalName')?.touched && goalForm.get('goalName')?.invalid
        "
        class="text-red-500 text-sm"
      >
        Goal name is required
      </div>
    </div>

    <!-- Goal Description Section -->
    <div class="space-y-4">
      <label class="text-lg font-semibold">Goal Description*</label>
      <textarea
        formControlName="goalDescription"
        placeholder="Describe the goal"
        class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-200"
      ></textarea>
      <div
        *ngIf="
          goalForm.get('goalDescription')?.touched &&
          goalForm.get('goalDescription')?.invalid
        "
        class="text-red-500 text-sm"
      >
        Goal description is required
      </div>
    </div>

    <!-- Start and End Date -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="text-lg font-semibold">Start Date*</label>
        <input
          type="date"
          formControlName="startDate"
          class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-200"
        />
      </div>

      <div>
        <label class="text-lg font-semibold">End Date*</label>
        <input
          type="date"
          formControlName="endDate"
          class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-200"
        />
      </div>
    </div>

    <!-- Priority, Assigned To, Target and Actual Metrics -->
    <div class="space-y-4">
      <label class="text-lg font-semibold">Priority*</label>
      <select
        formControlName="priority"
        class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-200"
      >
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select>
    </div>

    <div class="space-y-4">
      <label class="text-lg font-semibold">Assigned To*</label>
      <input
        type="text"
        formControlName="assignedTo"
        placeholder="Enter assignee name"
        class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-200"
      />
    </div>

    <div class="space-y-4">
      <label class="text-lg font-semibold">Target Metrics*</label>
      <input
        type="text"
        formControlName="targetMetrics"
        placeholder="Enter target metrics"
        class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-200"
      />
    </div>

    <div class="space-y-4">
      <label class="text-lg font-semibold">Actual Metrics</label>
      <input
        type="text"
        formControlName="actualMetrics"
        placeholder="Enter actual metrics"
        class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-200"
      />
    </div>

    <div class="space-y-4">
      <label class="text-lg font-semibold">Progress Status*</label>
      <select
        formControlName="progressStatus"
        class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-200"
      >
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
      </select>
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-end space-x-6">
      <button
        type="button"
        (click)="onCancel()"
        class="px-5 py-3 border border-gray-300 rounded-md hover:bg-gray-50 transition duration-200"
      >
        Cancel
      </button>
      <button
        type="submit"
        class="px-5 py-3 bg-green-600 text-white rounded-md hover:bg-green-700 transition duration-200"
      >
        Save
      </button>
    </div>
  </form>
</div>
