<!-- Hospitality Admin Shell -->
<div class="min-h-screen bg-gray-50">

    <!-- <div class="bg-white border-b border-gray-100 mb-6">
        <div class="max-w-full px-4 sm:px-6 lg:px-8">
            <app-nav-tab [tabsConfig]="tabsConfig"></app-nav-tab>
        </div>
    </div> -->

    <!-- Page Content -->
    <div class="max-w-full px-4 sm:px-6 lg:px-8 py-4">
        <div class="flex items-center justify-between mb-8">
            <!-- Back Button -->
            <button class="flex items-center gap-2 px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm font-medium text-gray-600 hover:text-customBlue hover:border-customBlue transition-all w-fit" 
                    (click)="goBack()">
                <i class="fa-solid fa-arrow-left text-xs"></i>
                <span>Back</span>
            </button>

            <!-- User Profile Badge -->
            <div class="flex items-center gap-4 bg-white px-5 py-3 rounded-2xl border border-gray-100 transition-all w-fit">
                <div class="w-14 h-14 rounded-2xl bg-blue-50 text-customBlue flex items-center justify-center font-black text-xl border border-blue-100 shadow-inner">
                    {{ currentUser.substring(0, 2) | uppercase }}
                </div>
                <div class="text-right">
                    <p class="text-base font-black text-gray-800 leading-none mb-1">{{ currentUser }}</p>
                    <!-- <p class="text-xs font-black text-customBlue uppercase tracking-widest leading-none">{{ currentRole }}</p> -->
                </div>
            </div>
        </div>
        
        <router-outlet></router-outlet>
    </div>
</div>
