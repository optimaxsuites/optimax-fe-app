<app-checkout-header
  (closeRegisterEvent)="closeRegister()"
></app-checkout-header>

<div class="gap-3 w-full flex justify-between items-center px-10 mt-10">
  <!-- <p class="back" ><i class="fa-solid fa-arrow-left"></i> Back</p> -->

  <div class="w-1/3">
    <app-searchbar></app-searchbar>
  </div>

  <button
    class="p-3 bg-customGreen rounded-xl text-white font-bold"
    (click)="openRequestForm()"
  >
    New refund request
  </button>
</div>

<app-modal
  *ngIf="requestForm"
  (close)="openRequestForm()"
  header="Refund request form"
  class="modal-style"
>
<form
  class="bg-white p-6 rounded-lg shadow-md flex flex-col gap-4 w-full"
  #refundForm="ngForm"
  (ngSubmit)="sendRequest()"
>
<div>
  <label for="receiptId">Receipt Id:</label>

  <input
    type="text"
    name="receiptId"
    id="receiptId"
    [(ngModel)]="refundData.orderId"
    (ngModelChange)="validateReceipt()"
    placeholder="RTY1542"
    required
    class="w-full px-3 py-2 border rounded-md"
  />
</div>

<label *ngIf="orderItems.length">
  <div>Purchase Date:</div>
  <p class="editInput">{{refundData.timestamp}}</p>
</label>

<label>
  <div>Full Name:</div>

  <input
    type="text"
    name="customerName"
    id="customerName"
    [(ngModel)]="refundData.customerName"
    placeholder="Akintola Akinyemi"
    required
    class="w-full px-3 py-2 border rounded-md"
  />
</label>

<label>
  <div>Email:</div>

  <input
    type="email"
    name="email"
    id="email"
    [(ngModel)]="refundData.emailAddress"
    placeholder="akintola.akinyemi@example.com"
    required
    class="w-full px-3 py-2 border rounded-md mb-4"
  />
</label>


@if (orderItems.length > 0) {
  <div class="flex flex-col gap-2">
    <label for="orderItems" class="font-semibold">Purchased Items:</label>
    <div class="flex flex-col flex-wrap gap-2">
      <div *ngFor="let item of orderItems" class="items-center flex">
        <input
          type="checkbox"
          id="item-{{ item.id }}"
          name="orderItems"
          value="{{ item.id }}"
        />
        <label for="item-{{ item.id }}" class="ml-2 cursor-pointer">{{ item.name }}</label>
      </div>
    </div>
  </div>
}

  <p class="font-semibold">Refund Method</p>
  <ng-select 
    [items]="refundMethods" 
    bindLabel="label" 
    bindValue="value" 
    [(ngModel)]="selectedRefundMethod"
    name="refundMethod"
    (ngModelChange)="updateFormFields($event)"
    placeholder="Select Refund Method"
    #refundMethod="ngModel"
    required>
  </ng-select>
  <p *ngIf="refundMethod.invalid && refundMethod.touched" class="text-red-500">Please select a refund method.</p>

  <!-- Bank Transfer Fields -->
  <div *ngIf="selectedRefundMethod === 'bank'">
    <input type="text" placeholder="Bank Name" [(ngModel)]="refundDetails.bankName" name="bankName" required />
    <input type="text" placeholder="Account Number" [(ngModel)]="refundDetails.accountNumber" name="accountNumber" required />
    <input type="text" placeholder="Account Holder" [(ngModel)]="refundDetails.accountHolder" name="accountHolder" required />
  </div>

  <!-- Royalty Top-Up -->
  <div *ngIf="selectedRefundMethod === 'royalty'">
    <input type="text" placeholder="Customer Loyalty ID" [(ngModel)]="refundDetails.loyaltyId" name="loyaltyId" required />
  </div>

  <!-- Exchange -->
  <div *ngIf="selectedRefundMethod === 'exchange'">
    <input type="text" placeholder="New Product" [(ngModel)]="refundDetails.newProduct" name="newProduct" required />
    <input type="number" placeholder="Price Difference" [(ngModel)]="refundDetails.priceDifference" name="priceDifference" required />
  </div>

  <textarea
    name="additionalNotes"
    id="additionalNotes"
    rows="4"
    placeholder="Additional Notes"
    class="w-full px-3 py-2 border rounded-md mb-4"
  ></textarea>

  <button
    type="submit"
    class="w-full bg-customGreen text-white py-2 rounded-md cursor-pointer"
    [disabled]="refundForm.invalid"
  >
    Submit
  </button>
</form>

</app-modal>

<p class="text-3xl font-bold" *ngIf="requests.length === 0">No request here</p>
<div *ngIf="requests.length > 0" class="px-8 mt-10">
  <section class="selectClients">
    <div class="asd">
      <div class="top-products-container">
        <div class="top-products">
          <div class="top-products-table-container">
            <table class="top-products-table w3-table w3-striped">
              <thead>
                <tr class="top-products-table-row">
                  <th class="top-products-table-head col-1">Date</th>
                  <th class="top-products-table-head col-1">Id</th>
                  <th class="top-products-table-head col-1">Customer Name</th>
                  <th class="top-products-table-head col-1">Status</th>
                  <th class="top-products-table-head col-1">Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let request of requests" style="cursor: pointer">
                  <!-- {{ order?.timestamp || date: 'shortTime' }} -->
                  <td>{{ request?.timestamp }}</td>
                  <td>
                    <p
                      [ngClass]="{
                        'text-green-700': request.status === 'Paid'
                      }"
                      class="mb-0 capitalize font-bold text-yellow-600"
                    >
                      {{ request.orderId }}
                    </p>
                  </td>
                  <td class="capitalize">{{ request.customerName }}</td>
                  <td>{{ request.status }}</td>
                  <td>
                    <div class="flex gap-3 text-[16px]">
                      <!-- <i class="fa-solid fa-cart-shopping hover:bg-customGreen/30 p-2 rounded-md" ></i> -->
                      <i
                        class="fa-solid fa-arrow-right hover:bg-customGreen/30 rounded-md p-2"
                        (click)="requestDetails(request)"
                      ></i>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
<p-toast position="top-right" key="tl" />
<!-- <p-toast position="top-right" key="tl" /> -->
