<div class="calendar-container">

  <div class="calendar-card">

    <header>

    <h3>Weekly Shift Calendar</h3>

    <button (click)="openAssignment()" class="add-btn">
        + Assign Shift
    </button>

    </header>

    <!--modal is outside-->
    <app-shift-assignment
        *ngIf="showAssignment"
        (close)="closeAssignment()">
    </app-shift-assignment>

    <div class="calendar-grid">

      <!-- HEADER -->
      <div class="header-cell">Employee</div>

      <div
        class="header-cell"
        *ngFor="let date of weekDates"
      >
        {{ date }}
      </div>

      <!-- ROWS -->
      <ng-container *ngFor="let employee of ['emp-1','emp-2','emp-3']">

        <div class="employee-cell">
          {{ employee }}
        </div>

        <div
          class="day-cell"
          *ngFor="let date of weekDates"
        >

          <div
            class="shift-block"
            *ngFor="let schedule of getEmployeeSchedules(employee, date)"
            [style.background]="getShift(schedule.shiftId)?.color"
          >

            {{ getShift(schedule.shiftId)?.name }}

          </div>

        </div>

      </ng-container>

    </div>
  </div>

</div>
