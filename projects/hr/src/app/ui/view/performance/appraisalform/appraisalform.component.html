<div class="card">
  <app-back-button class="table-item" (click)="goBack()"></app-back-button>

  <form
    [formGroup]="appraisalForm"
    (ngSubmit)="onSubmit()"
    class="space-y-8 flex gap-10 flex-row justify-between px-5 py-3 items-start"
  >
    <!-- Left Column -->
    <div class="w-1/2">
      <!-- Goal Name -->
      <div class="mb-4 mt-3">
        <label class="mb-3 text-lg font-semibold">Employee Name*</label>
        <input
          type="text"
          formControlName="employeeName"
          placeholder="Enter goal name"
          class="w-full px-4 py-3 border border-gray-300 rounded-md transition duration-200"
        />
        <div
          *ngIf="
            appraisalForm.get('goalName')?.touched &&
            appraisalForm.get('goalName')?.invalid
          "
          class="text-red-500 text-sm"
        >
          Employee name is required
        </div>
      </div>

      <!-- Level and Priority -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
        <!-- <div class="">
          <label class="mb-3 text-lg font-semibold">Level*</label>
          <ng-select
            [items]="levelUser"
            bindLabel="option"
            bindValue="option"
            formControlName="levelUser"
            placeholder="Select level"
            class="w-full"
          ></ng-select>
          <div
            *ngIf="
              goalForm.get('levelUser')?.touched &&
              goalForm.get('levelUser')?.invalid
            "
            class="text-red-500 text-sm"
          >
            Level is required
          </div>
        </div> -->

        <div class="">
          <label class="mb-3 text-lg font-semibold">Assessment Cycle*</label>
          <select
            formControlName="assessment"
            class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-200"
          >
            <option value="Annual Review For All 2024">
              Annual Review For All 2024
            </option>
            <option value="Annual Review By HR Department 2024">
              Annual Review By HR Department 2024
            </option>
            <option value="Annual Assesssment 2025">
              Annual Assesssment 2025
            </option>
            <option value="Annual Review For All 2025">
              Annual Review For All 2025
            </option>
            <option value="Annual Review By HR Department 2025">
              Annual Review By HR Department 2025
            </option>
            <option value="Annual Assesssment 2025">
              Annual Assesssment 2025
            </option>
          </select>
        </div>

        <div class="">
          <label class="mb-3 text-lg font-semibold">Period*</label>
          <select
            formControlName="period"
            class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-200"
          >
            <option value="Annual Review">Annual Review</option>
            <option value="Quarterly Review">Quarterly Review'</option>
            <option value="Performance Improvement">
              Performance Improvement
            </option>
          </select>
        </div>
      </div>

      <!-- Dates -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
        <div>
          <label class="mb-3 text-lg font-semibold">Start Date*</label>
          <input
            type="date"
            formControlName="startDate"
            class="w-full px-4 py-3 border border-gray-300 rounded-md transition duration-200"
          />
        </div>
        <!-- <div>
          <label class="mb-3 text-lg font-semibold">End Date*</label>
          <input
            type="date"
            formControlName="endDate"
            class="w-full px-4 py-3 border border-gray-300 rounded-md transition duration-200"
          />
        </div> -->
        <div>
          <label class="mb-3 text-lg font-semibold">Due Date*</label>
          <input
            type="date"
            formControlName="dueDate"
            class="w-full px-4 py-3 border border-gray-300 rounded-md transition duration-200"
          />
        </div>

        <div class="">
          <label class="mb-3 text-lg font-semibold">Evaluator*</label>
          <select
            formControlName="evaluator"
            class="w-full px-4 py-3 border border-gray-300 rounded-md transition duration-200"
          >
            <option value="Pending">Initiated</option>
          </select>
        </div>
      </div>

      <!-- Progress Status -->

      <div class="flex justify-end gap-4 mt-6">
        <button
          type="button"
          (click)="onCancel()"
          class="px-5 py-3 border border-gray-300 rounded-md hover:bg-gray-50 transition duration-200"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="px-5 py-3 bg-green-600 text-white rounded-md hover:bg-green-700 transition duration-200"
        >
          Save
        </button>
        <!-- </div> -->
      </div>

      <!-- Action Buttons -->
    </div>

    <!-- Right Column -->
    <div class="w-1/2">
      <div>
        <label class="mb-3 text-lg font-semibold"
          >Overview & Description*</label
        >
        <p-editor
          formControlName="description"
          placeholder="Overview & Description..."
          class="w-full"
        ></p-editor>
      </div>

      <div class="">
        <label class="my-3 text-lg font-semibold">Department*</label>
        <select
          formControlName="department"
          class="w-full px-4 py-3 border border-gray-300 rounded-md transition duration-200"
        >
          <option value="IT">IT</option>
          <option value="Sales">Sales</option>
        </select>

        <!-- <label class="my-3 text-lg font-semibold">Progress Status*</label>
        <select
          formControlName="progressStatus"
          class="w-full px-4 py-3 border border-gray-300 rounded-md transition duration-200"
        >
          <option value="Pending">Initiated</option>
        </select> -->

        <label class="my-3 text-lg font-semibold">Supervisor*</label>
        <select
          formControlName="supervisor"
          class="w-full px-4 py-3 border border-gray-300 rounded-md transition duration-200"
        >
          <option value="Pending">John doe</option>
        </select>
      </div>
    </div>
  </form>
</div>
