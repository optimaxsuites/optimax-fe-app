<div class="modal-backdrop" (click)="cancel()"></div>

<div class="modal-card">
  <div class="modal-header">
    <h3>New Correction Request</h3>
    <button type="button" class="close-btn" (click)="cancel()">x</button>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-row">
      <div class="form-group">
        <label>Employee ID</label>
        <input type="text" formControlName="employeeId" />
      </div>

      <div class="form-group">
        <label>Employee Name</label>
        <input type="text" formControlName="employeeName" />
      </div>
    </div>

    <div class="form-group">
      <label>Department</label>
      <input type="text" formControlName="department" />
    </div>

    <div class="form-group">
      <label>Date</label>
      <input type="date" formControlName="date" />
    </div>

    <div class="form-group">
      <label>Issue Type</label>
      <select formControlName="issueType">
        <option value="" disabled>Select issue type</option>
        <option *ngFor="let type of issueTypes" [value]="type.value">
          {{ type.label }}
        </option>
      </select>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Requested Clock In</label>
        <input type="time" formControlName="requestedClockIn" />
      </div>

      <div class="form-group">
        <label>Requested Clock Out</label>
        <input type="time" formControlName="requestedClockOut" />
      </div>
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea
        rows="3"
        formControlName="description"
        placeholder="Explain the missing punch or incorrect time">
      </textarea>
    </div>

    <div class="form-group">
      <label>Evidence</label>
      <textarea
        rows="3"
        formControlName="evidence"
        placeholder="Add supporting details, document references, or manager notes">
      </textarea>
    </div>

    <div class="actions">
      <button type="button" class="cancel-btn" (click)="cancel()">Cancel</button>
      <button type="submit" class="submit-btn" [disabled]="form.invalid">
        Submit Request
      </button>
    </div>
  </form>
</div>
