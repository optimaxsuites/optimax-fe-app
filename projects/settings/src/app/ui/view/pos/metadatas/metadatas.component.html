<div class="px-6 bg-gray-50 min-h-screen">
  
  <div class="flex gap-4 items-center mb-6">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-customBlue" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
    </svg>
    <div>
        <p class="text-customBlue/60 text-base">E-Commerce</p>
        <p class="text-customBlue font-semibold text-xl">E-Store Configuration</p>
    </div>
  </div>
  <header class="relative mb-4">
    
    <nav class="border-b border-gray-200">
      <ul class="flex space-x-6 -mb-px text-lg">
        <li>
          <a
            (click)="setActiveTab('categories')"
            [ngClass]="{
              'border-b-4 border-customBlue  text-gray-900 font-bold': activeTab === 'categories',
              'text-gray-700 hover:text-gray-900': activeTab !== 'categories'
            }"
            class="inline-block py-2 px-1 cursor-pointer transition duration-150 ease-in-out"
          >
            Categories
          </a>
        </li>
        <li>
          <a
            (click)="setActiveTab('taxes')"
            [ngClass]="{
              'border-b-4 border-customBlue text-gray-900 font-bold': activeTab === 'taxes',
              'text-gray-700 hover:text-gray-900': activeTab !== 'taxes'
            }"
            class="inline-block py-2 px-1 cursor-pointer transition duration-150 ease-in-out"
          >
            Taxes
          </a>
        </li>
          <li>
          <a
            (click)="setActiveTab('discount')"
            [ngClass]="{
              'border-b-4 border-customBlue text-gray-900 font-bold': activeTab === 'discount',
              'text-gray-700 hover:text-gray-900': activeTab !== 'discount'
            }"
            class="inline-block py-2 px-1 cursor-pointer transition duration-150 ease-in-out"
          >
            Discounts
          </a>
        </li>
          <li>
          <a
            (click)="setActiveTab('supplier')"
            [ngClass]="{
              'border-b-4 border-customBlue text-gray-900 font-bold': activeTab === 'supplier',
              'text-gray-700 hover:text-gray-900': activeTab !== 'supplier'
            }"
            class="inline-block py-2 px-1 cursor-pointer transition duration-150 ease-in-out"
          >
            Suppliers
          </a>
        </li>
         
      </ul>
    </nav>
    <!-- <button class="absolute top-0 right-0 px-4 py-2 bg-customBlue text-white font-medium rounded-md hover:bg-customBlueHover transition duration-150 shadow-md">
      Save Changes
    </button> -->
  </header>


    <div class="mt-2">
    
    <ng-container *ngIf="activeTab === 'categories'">
   
      <div class="p-6 bg-gray-50 min-h-screen">
  <app-category></app-category>
  </div>
    </ng-container>
    <ng-container *ngIf="activeTab === 'taxes'">
      <app-tax></app-tax>
    </ng-container>
      <ng-container *ngIf="activeTab === 'discount'">
      <app-discount></app-discount>
    </ng-container>
      <ng-container *ngIf="activeTab === 'supplier'">
      <app-supplier></app-supplier>
    </ng-container>
    </div>
  </div>
