

<div class="">
    <div class="contain">
      <div class="modal-wrapper p-4" #contentToPrint>
        <div class="header-section">
          <section class="title-section">
            <p class="form-title">{{isEdit ? 'Edit Request for Quotation' : 'New Request for Quotation'}}</p>
          </section>
        </div>
    
        <div class="info-section">
          <section class="first-info-section">
            <div class="first-container">
              <div class="input-container-100">
                <label for="qNo">RFQ No</label>
                <input type="text" name="any" id="qNo" [(ngModel)]="rfqData.qNo" class="editInput" />
              </div>
              <div class="d-flex gap-4 my-4">
                <div class="input-container-50">
                  <label for="qDate">Date</label>
                  <input type="datetime-local" name="any" id="qDate" [(ngModel)]="rfqData.date" class="editInput" />
                </div>
                <div class="input-container-50">
                  <label for="qDueDate">Due Date</label>
                  <input type="datetime-local" name="any" id="qDueDate" [(ngModel)]="rfqData.dueDate" class="editInput" />
                </div>
              </div>
              <div class="input-container-100">
                <label for="projectTitle">Project Title</label>
                <input type="text" name="any" id="projectTitle" [(ngModel)]="rfqData.projectTitle" class="editInput" />
              </div>
              <div class="input-container-100 my-4">
                <label for="category">Category</label>
                <ng-select 
                      bindLabel="name"
                      bindValue="id"
                      placeholder="Select Category">
                      </ng-select>
              </div>
              <div class="input-container-100">
                <label for="projectTitle">Prepared By</label>
                <input type="text" name="any" id="projectTitle" [(ngModel)]="rfqData.preparedBy" class="editInput" />
              </div>
            </div>
          </section>
  
          <hr>
  
        </div>
    
        <div class="">
          <p-toolbar styleClass="mb-4 gap-2">
            <ng-template pTemplate="left">
            </ng-template>
      
            <ng-template pTemplate="right">
              <app-button text="Add New Item" class="btn-navigate" ></app-button>
            </ng-template>
          </p-toolbar>
          <div class="brd-gry">
            <p-table 
            [value]="rfqData.items"
            [paginator]="true" 
            dataKey="id"
            responsiveLayout="stack" 
            [breakpoint]="'960px'"
            styleClass="p-datatable-striped"
            [tableStyle]="{'min-height': 'fit-content', 'max-height': '650px'}"
            [rows]="5"
            >
              <ng-template pTemplate="header" let-columns>
                <tr>
                  <th class="table-item">Item</th>
                  <th class="table-item">Part No</th>
                  <th class="table-item">Unit</th>
                  <th class="table-item">Serial No</th>
                  <th class="table-item">Amount/unit</th>
                  <th class="table-item">Tax Rate</th>
                  <th class="table-item">Tax</th>
                  <th class="table-item">Total</th>
                </tr>
              </ng-template>
              <ng-template pTemplate="body" let-item >
                  <tr [ngClass]="{'table-row': true}">
                    <td class="table-item"><span class="p-column-title"><strong>Item</strong></span>{{ item.name}}</td>
                    <td class="table-item"><span class="p-column-title"><strong>Part No</strong></span>{{ item.partNo }}</td>
                    <td class="table-item"><span class="p-column-title"><strong>Unit</strong></span>{{item.unit}}</td>
                    <td class="table-item"><span class="p-column-title"><strong>Serial No</strong></span>
                      <!-- {{ item.serialNo }} -->
                      <input type="text" name="any" id="projectTitle" [(ngModel)]="rfqData.preparedBy" class="editInput" />
                    </td>
                    <td class="table-item"><span class="p-column-title"><strong>Amount/unit</strong></span>
                      <!-- {{ item.amount }} -->
                      <input type="text" name="any" id="projectTitle" [(ngModel)]="rfqData.preparedBy" class="editInput" />
                    </td>
                    <td class="table-item"><span class="p-column-title"><strong>Tax Rate</strong></span> 
                      <!-- {{ item.taxRate }} -->
                      <input type="text" name="any" id="projectTitle" [(ngModel)]="rfqData.preparedBy" class="editInput" />
                    </td>
                    <td class="table-item"><span class="p-column-title"><strong>Tax</strong></span> 
                      <!-- {{ item.tax }} -->
                      <input type="text" name="any" id="projectTitle" [(ngModel)]="rfqData.preparedBy" class="editInput" />
                    </td>
                    <td class="table-item"><span class="p-column-title"><strong>Total</strong></span> 
                      <!-- {{ item.total }} -->
                      <input type="text" name="any" id="projectTitle" [(ngModel)]="rfqData.preparedBy" class="editInput" />
                    </td>
                    <!-- <div>
                        <p>description</p>
                        <textarea name="" id="">{{item.des}}</textarea>
                    </div> -->
                  </tr> 
                  <tr [ngClass]="{'table-row': false}">
                    <td colspan="8" class="table-item">
                      <p><strong>Description:</strong></p>
                      <textarea class="editInput" rows="3" [(ngModel)]="item.des"></textarea>
                    </td>
                  </tr>                           
              </ng-template>
              <hr>
          </p-table>
          </div>
        </div>
        <div class="btn-wrapper">
          <app-button text="{{ isEdit ? 'Update' : 'Save' }}" (click)="submitForm()" class="btn-save"></app-button>
        </div>
      </div>
    </div>
  </div>
