<div class="p-4">
    <div class="mb-4">
        <label for="itemName">Item Name <span style="color: red;">*</span></label>
        <input id="itemName" type="text" [(ngModel)]="itemData.name" class="editInput" placeholder="Enter item name" />
    </div>

    <div class="mb-4">
        <label for="taxRate">Serial No</label>
        <input id="taxRate" type="text" [(ngModel)]="itemData.serialNo" class="editInput" placeholder="Enter serial no" />
    </div>

    <div class="mb-4">
        <label for="quantity">Quantity <span style="color: red;">*</span></label>
        <input id="quantity" type="number" [(ngModel)]="itemData.qty" class="editInput" placeholder="Enter quantity" />
    </div>

    <div class="mb-4" *ngIf="isQuote">
        <label for="taxRate">Tax Rate <span style="color: red;">*</span></label>
        <input id="taxRate" type="number" [(ngModel)]="itemData.taxRate" class="editInput" placeholder="Enter tax rate" />
    </div>

    <div class="mb-4" *ngIf="isQuote">
        <label for="rate">Rate <span style="color: red;">*</span></label>
        <input id="rate" type="number" [(ngModel)]="itemData.rate" class="editInput" placeholder="Enter rate" (ngModelChange)="onInputChange()" />
    </div>

    <div class="mb-4" *ngIf="isQuote">
        <label for="amount">Amount <span style="color: red;">*</span></label>
        <input id="amount" type="number" [(ngModel)]="itemData.amount" class="editInput" placeholder="Enter amount" readonly />
    </div>

    <div class="mb-4" *ngIf="isQuote">
        <label for="tax">Tax <span style="color: red;">*</span></label>
        <input id="tax" type="number" [(ngModel)]="itemData.tax" class="editInput" placeholder="Enter tax" readonly disabled />
    </div>

    <div class="mb-4" *ngIf="isQuote">
        <label for="total">Total <span style="color: red;">*</span></label>
        <input id="total" type="number" [(ngModel)]="itemData.total" class="editInput" placeholder="Enter total" readonly disabled />
    </div>

    <div class="mb-4">
        <label for="des">Description</label>
        <textarea name="des" id="des" type="text" [(ngModel)]="itemData.description" class="editInput" placeholder="Enter description" ></textarea>
    </div>

    <div class="form-actions mt-4">
        <button type="submit" (click)="addItem()">{{isEdit ? 'Edit Item' : 'Add Item'}}</button>
    </div>
</div>
