<div class="correction-requests-card">

  <div class="header">
    <h3>Correction Requests</h3>
    <button class="add-btn" (click)="openForm()">+</button>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="requests.length === 0">
    <span>Such empty 🥲</span>
    <p>No correction requests yet.</p>
  </div>

  <!-- Requests Table -->
  <app-table
    *ngIf="requests.length > 0"
    [columns]="requestColumns"
    [rows]="requests"
    [actions]="requestActions"
    (actionClick)="handleRequestAction($event)"
  ></app-table>

  <!-- Modal Form -->
  <app-correctionrequestform
    *ngIf="showForm"
    (close)="closeForm()"
    (submitRequest)="addRequest($event)">
  </app-correctionrequestform>

</div>
