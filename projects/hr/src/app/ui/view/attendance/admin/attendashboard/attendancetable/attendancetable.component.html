<!--<p>attendancetable works!</p>-->
<div class="attendance-wrapper">
    <div class="attendance-card">
      <!--<app-attendancesummary [data]="filteredAttendance"></app-attendancesummary>-->
      <app-attendancefilter (filtersChange)="onFiltersChange($event)"></app-attendancefilter>
        <app-table
          [columns]="attendanceColumns"
          [rows]="attendance"
          [actions]="attendanceActions"
          (actionClick)="handleAttendanceAction($event)"
        ></app-table>

<!-- Backdrop -->
<div class="modal-backdrop" *ngIf="editingRecord"></div>

<!-- Modal -->
<div class="modal-card" *ngIf="editingRecord">

  <div class="modal-header">
    <h3>Modify Attendance</h3>
    <button class="close-btn" (click)="cancelEdit()">×</button>
  </div>
  <p class="employee-info">
  {{ editingRecord.employee }} — {{ editingRecord.date }}
</p>

  <div class="form-group">
    <label>Status</label>
    <select [(ngModel)]="editStatus">
      <option value="PRESENT">Present</option>
      <option value="LATE">Late</option>
      <option value="ABSENT">Absent</option>
      <option value="ON_LEAVE">On Leave</option>
    </select>
  </div>

  <div class="form-group">
    <label>Check-In Time</label>
    <input type="time" [(ngModel)]="editCheckIn">
  </div>

  <div class="form-group">
    <label>Reason for Modification</label>
    <textarea
      rows="3"
      [(ngModel)]="editReason"
      required
      #reasonField="ngModel">
    </textarea>

    <span class="error"
      *ngIf="reasonField.invalid && reasonField.touched">
      Reason for modification is required.
    </span>
  </div>

  <div class="actions">
    <button class="cancel-btn" (click)="cancelEdit()">Cancel</button>

    <button
      class="submit-btn"
      (click)="saveModification()"
      [disabled]="!editReason.trim()">
      Save Changes
    </button>
  </div>

</div>
