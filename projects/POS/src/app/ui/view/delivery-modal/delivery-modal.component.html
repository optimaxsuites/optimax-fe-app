<div
  class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50"
  *ngIf="isDeliveryModalOpen"
>
  <div
    class="bg-white rounded-lg shadow-lg p-6 w-full max-w-4xl h-full delivery-modal"
  >
    <h2 class="text-xl font-bold text-gray-800 mb-4">Delivery Information</h2>
    <form>
      <div class="mb-4">
        <label for="deliveryAddress" class="block font-medium text-gray-700">
          Address
        </label>
        <input
          type="text"
          id="deliveryAddress"
          placeholder="Enter delivery address"
          class="w-full mt-1 border border-gray-300 rounded-lg shadow-sm p-2 focus:ring-green-500 focus:border-green-500"
        />
      </div>
      <div class="mb-4">
        <label class="block font-medium text-gray-700 mb-2"
          >Delivery Options</label
        >
        <div class="flex space-x-6">
          <label
            for="standardDelivery"
            class="flex items-center space-x-2 cursor-pointer"
          >
            <input
              type="radio"
              id="standardDelivery"
              name="deliveryOption"
              value="standard"
              class="text-green-600 focus:ring-green-500"
            />
            <span class="text-gray-700">Standard Delivery</span>
          </label>
          <label
            for="expressDelivery"
            class="flex items-center space-x-2 cursor-pointer"
          >
            <input
              type="radio"
              id="expressDelivery"
              name="deliveryOption"
              value="express"
              class="text-green-600 focus:ring-green-500"
            />
            <span class="text-gray-700">Express Delivery</span>
          </label>
          <label
            for="sameDayDelivery"
            class="flex items-center space-x-2 cursor-pointer"
          >
            <input
              type="radio"
              id="sameDayDelivery"
              name="deliveryOption"
              value="sameDay"
              class="text-green-600 focus:ring-green-500"
            />
            <span class="text-gray-700">Same-Day Delivery</span>
          </label>
        </div>
      </div>

      <div class="mb-4">
        <label for="deliveryDate" class="block font-medium text-gray-700">
          Delivery Date
        </label>
        <input
          type="date"
          id="deliveryDate"
          class="w-full mt-1 border border-gray-300 rounded-lg shadow-sm p-2 focus:ring-green-500 focus:border-green-500"
        />
      </div>
      <div class="mb-4">
        <label for="notes" class="block font-medium text-gray-700">
          Additional Notes
        </label>
        <textarea
          id="notes"
          rows="3"
          placeholder="Enter any notes..."
          class="w-full mt-1 border border-gray-300 rounded-lg shadow-sm p-2 focus:ring-green-500 focus:border-green-500"
        ></textarea>
      </div>
      <div class="flex justify-end gap-4">
        <button
          type="button"
          class="px-4 py-2 bg-gray-300 text-gray-800 rounded-lg hover:bg-gray-400"
          (click)="closeDeliveryModal()"
        >
          Cancel
        </button>
        <button
          type="button"
          class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700"
        >
          Save
        </button>
      </div>
    </form>
  </div>
</div>
