<div class="container-fluid">
  <div class="container-header">
    <button class="btn create-invoice-btn" (click)="openDialog()">
      Create New Vendor Category
    </button>
  </div>
  <div *ngIf="vCatList.length > 0">
    <section class="selectClients" *ngFor="let vCat of vCatList">
      <div>
        <button class="newVendor" (click)="openDialog()">
          Create New Vendor
        </button>
        <mat-expansion-panel hideToggle class="con-sec">
          <mat-expansion-panel-header>
            <mat-panel-title>
              <span class="headerText"> {{ vCat.category }} </span>
            </mat-panel-title>
            <div class="headSection">
             
            </div>
          </mat-expansion-panel-header>
        </mat-expansion-panel>
      </div>
    </section>
  </div>
</div>
