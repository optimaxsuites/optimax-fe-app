<div class="sp-shell">

  <div class="sp-head">
    <div class="sp-icon"><i class="fas fa-file-invoice-dollar"></i></div>
    <div>
      <h3 class="sp-title">Payroll Configuration</h3>
      <p class="sp-sub">Configure general payroll settings, statutory deductions, taxation rules, and bank teller payment mappings.</p>
    </div>
  </div>

  <!-- Tab nav -->
  <div class="sp-tabs">
    <button class="sp-tab" [class.active]="activeTab === 'general'" (click)="setActiveTab('general')">
      General Settings
    </button>
    <button class="sp-tab" [class.active]="activeTab === 'taxation'" (click)="setActiveTab('taxation')">
      Statutory &amp; Taxation
    </button>
    <button class="sp-tab" [class.active]="activeTab === 'bankTellerMapping'" (click)="setActiveTab('bankTellerMapping')">
      Bank Template Mapping
    </button>
  </div>

  <app-general           *ngIf="activeTab === 'general'"></app-general>
  <app-taxation          *ngIf="activeTab === 'taxation'"></app-taxation>
  <app-bank-teller-mapping *ngIf="activeTab === 'bankTellerMapping'"></app-bank-teller-mapping>

</div>
