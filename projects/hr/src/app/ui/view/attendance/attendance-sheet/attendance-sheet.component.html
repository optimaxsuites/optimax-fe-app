<!-- attendance-list.component.html -->
<div class="p-6">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-2xl font-semibold">Attendance Sheet</h2>
    <input type="date" [(ngModel)]="selectedDate" (change)="filterEmployees()" class="border p-2 rounded-md" />
  </div>

  <div class="mb-4">
    <input
      type="text"
      [(ngModel)]="searchTerm"
      (input)="filterEmployees()"
      placeholder="Search employee..."
      class="w-full border rounded-lg p-2"
    />
  </div>

  <app-table
    [columns]="attendanceColumns"
    [rows]="filteredEmployees"
    [rowClickable]="true"
    (rowClick)="viewDetails($event)"
  ></app-table>
</div>

<app-large-side-modal *ngIf="viewDetail" (close)="toggleSidebar()">
<app-attendance-details [id]="selectedId"></app-attendance-details>
</app-large-side-modal>
