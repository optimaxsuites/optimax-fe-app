<div class="container-fluid" *ngIf="tableSection">
  <div class="container-header">
    <button class="btn create-invoice-btn" (click)="openForm()">
      Create New Vendor Category
    </button>
  </div>
  <section class="selectClients">
    <div class="asd">
      <div class="top-products-container">
        <div class="top-products">
          <div class="top-products-table-container">
            <table class="top-products-table w3-table w3-striped">
              <thead>
                <tr class="top-products-table-row">
                  <th class="top-products-table-head checkbox"></th>
                  <th class="top-products-table-head col-1">Category</th>
                  <th class="top-products-table-head col-1">Code</th>
                  <th class="top-products-table-head col-1">Description</th>
                  <th class="top-products-table-head col-1">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr
                  class="top-products-table-row"
                  *ngFor="let vCat of vCatList"
                >
                  <td class="top-products-table-data">
                    <input
                      type="checkbox"
                      class="check"
                      (change)="toggleCheckbox(vCat.id)"
                    />
                  </td>
                  <td class="top-products-table-data">
                    {{ vCat.categoryName }}
                  </td>
                  <td class="top-products-table-data">
                    {{ vCat.categoryCode }}
                  </td>
                  <td class="top-products-table-data">
                    {{ vCat.categoryDesc }}
                  </td>

                  <td class="top-products-table-data col-1">
                    <div class="actionDiv">
                      <div class="image-container">
                        <img
                          (click)="viewVendors(vCat.categoryName)"
                          class="actionTags"
                          src="../../../assets/view.svg"
                          alt=""
                        />
                        <span class="tooltip">View</span>
                      </div>
                      <div class="image-container">
                        <img
                          (click)="editCategory(vCat)"
                          class="actionTags"
                          src="../../../assets/Edit.svg"
                          alt=""
                        />
                        <span class="tooltip">Edit</span>
                      </div>

                      <div class="image-container">
                        <img
                          class="actionTags"
                          src="../../../assets/delete (1).svg"
                          alt=""
                          (click)="deleteVCategory(vCat.id)"
                        />
                        <span class="tooltip">Delete</span>
                      </div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<form class="categoryCreation" *ngIf="formSection">
  <div class="first-container01">
    <div class="vendorCategory">
      <span>Name</span>
      <br />
      <input
        class="inputField"
        type="text"
        placeholder=" Name"
        [(ngModel)]="categoryGroup.categoryName"
        [ngModelOptions]="{ standalone: true }"
      />
    </div>
    <div class="vendorCategory">
      <span>Code</span>
      <br />
      <input
        class="inputField"
        type="text"
        placeholder="Code"
        [(ngModel)]="categoryGroup.categoryCode"
        [ngModelOptions]="{ standalone: true }"
      />
    </div>
    <div class="vendorCategory">
      <span>Description</span>
      <br />
      <textarea
        [(ngModel)]="categoryGroup.categoryDesc"
        [ngModelOptions]="{ standalone: true }"
        cols="44"
        rows="9"
        placeholder="Description"
        class="descText"
      ></textarea>
    </div>

    <div class="btn-wrapper">
      <button (click)="saveCategory()" class="saveButton">
        Save & Continue
      </button>
    </div>
  </div>
</form>
