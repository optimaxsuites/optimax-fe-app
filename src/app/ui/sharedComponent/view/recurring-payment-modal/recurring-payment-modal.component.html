<form [formGroup]="form" (ngSubmit)="onSaveClick()" class="recurring-payment-form form">

  <h2>Scheduled Payment</h2>

  <!-- Select type -->
  <div>
    <label>
      <input type="radio" formControlName="type" value="one-time" id="radio"/> One-Time
    </label>
    <label>
      <input type="radio" formControlName="type" value="recurring" id="radio"/> Recurring
    </label>
  </div>

  <!-- Start Date -->
  <div>
    <label>Start Date</label>
    <input type="date" formControlName="startDate" />
    <div *ngIf="form.get('startDate')?.touched && form.get('startDate')?.invalid">
      Start date is required and must be today or in the future.
    </div>
  </div>

  <!-- Frequency (only for recurring) -->
  <div *ngIf="form.get('type')?.value === 'recurring'">
    <label>Frequency</label>
    <select formControlName="frequency">
      <option value="">-- Select --</option>
      <option *ngFor="let freq of frequencies" [value]="freq">{{ freq }}</option>
    </select>
    <div *ngIf="form.get('frequency')?.touched && form.get('frequency')?.invalid">
      Frequency is required for recurring payments.
    </div>
  </div>

  <!-- End condition (recurring only) -->
  <div *ngIf="form.get('type')?.value === 'recurring'">
    <label><strong>End Condition</strong></label>

    <div>
      <label>
        <input type="checkbox" formControlName="noEndDate" /> No end date
      </label>
    </div>

    <div *ngIf="!form.get('noEndDate')?.value">
      <label>End Date</label>
      <input type="date" formControlName="endDate" />
    </div>

    <div>
      <label>Occurrences</label>
      <input type="number" formControlName="occurrences" min="1" />
    </div>
  </div>

  <!-- Reminder -->
  <div>
    <label>
      <input type="checkbox" formControlName="emailReminder" /> Email reminder before each payment
    </label>
  </div>

  <!-- Buttons -->
  <div class="mt-3">
    <button type="submit" class="px-4 py-2 bg-customBlue text-white rounded btn recurring-btn">
      Save
    </button>
    <button type="button" class="px-4 py-2 bg-gray-400 text-white rounded cancel-recurring-btn"
            (click)="onCancelClick()">
      Cancel
    </button>
  </div>
</form>
