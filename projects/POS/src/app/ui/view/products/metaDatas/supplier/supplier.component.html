<div class="modal-header flex justify-between items-center text-gray-700">
    <h2 class="font-semibold pb-0 mb-0">Supplier</h2>
    <div class="flex gap-3">
    <!-- 
      <button
        class="border-2 border-customBlue py-2 px-4 rounded-xl text-xl font-semibold"
        (click)="openAddD = false"
      >
        Cancel
      </button> -->
      <button class="btn create-invoice-btn" (click)="addSupplier()">
        Save
      </button>
    </div>
  </div>

  <div class="mt-5 mb-2 flex flex-col gap-4">
    <div class="detailDiv w-full">
      <label for="e-price">Name</label>
      <input
        class="name editInput"
        type="text"
        id="e-price"
        [(ngModel)]="supplierData.name"
        placeholder="Supplier name"
      />
    </div>

    <div class="detailDiv w-full">
      <label for="email">Email</label>
      <input
        id="email"
        [(ngModel)]="supplierData.email"
        class="name editInput"
        placeholder="Supplier value"
      />
    </div>

    <div class="detailDiv w-full">
      <label for="tel">Phone Number</label>
      <input
        id="tel"
        type="tel"
        [(ngModel)]="supplierData.phoneNumber"
        class="name editInput"
        placeholder="Supplier Phone Number"
      />
    </div>

    <!-- <div  *ngIf="productData.discount.discountType.includes(2)"> -->
    <div  class="detailDiv w-full">
      <label for="contact">Name of Contact Person</label>
      <input
        id="contact"
        type="text"
        [(ngModel)]="supplierData.contactPerson"
        class="name editInput"
        placeholder="Contact Person"
      />
    </div>

    <!-- <div *ngIf="productData.discount.discountType.includes(3)"> -->
    <div class="detailDiv w-full">
      <label for="address">Supplier's Address</label>
      <textarea
        id="address"
        type="text"
        [(ngModel)]="supplierData.address"
        class="name editInput"
        placeholder="Supplier's Address"
      ></textarea>
    </div>

    <hr>

  <div
  *ngFor="let supplier of suppliers"
  class="flex flex-col my-3 px-4 text-gray-700 font-mono"
>
  <div class="flex justify-between items-center">
    <p>{{ supplier.name }}</p>
    <i
      class="fa-solid fa-trash cursor-pointer"
      (click)="removeSupplier(supplier.id)"
    ></i>
  </div>
</div>
  </div>
