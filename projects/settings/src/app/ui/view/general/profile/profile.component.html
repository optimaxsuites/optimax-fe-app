    <div class="flex justify-between items-center p-10">
    
      <button (click)="goBack()" class="bg-gray-200 text-gray-700 font-semibold px-6 py-2 rounded-lg hover:bg-gray-300">
        <!-- ⬅ Back -->
      </button>
  
      <button (click)="toggleEditMode()" class="bg-customBlue text-white font-semibold px-6 py-2 rounded-lg hover:bg-customBlueHover">
        {{ isEditMode ? 'Cancel' : 'Edit' }}
      </button>
    </div>
  
    <form [formGroup]="form" (ngSubmit)="submit()" class="mx-auto bg-white rounded-2xl border border-gray-200 w-full space-y-8 px-4 py-6 p-10">
  
      <section class="bg-white/70 p-8 rounded-2xl border border-gray-200 transition-all duration-300 p-10">
        <div class="flex items-center mb-6">
          <div class="w-10 h-10 border rounded-full flex items-center justify-center mr-4">
            <svg class="w-5 h-5 text-white" fill="none" stroke="gray" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
          </div>
          <h3 class="text-lg font-bold text-gray-800">Contact Information</h3>
        </div>
  
        <div class="grid lg:grid-cols-2 gap-6">

           <div class="space-y-2 ">
            <label class="block text-sm font-semibold text-gray-700">
              Full Name <span class="text-red-500">*</span>
            </label>
            <input type="text" formControlName="fullname" placeholder="Ademola Adetokunbo"
                  class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl
                          focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all duration-200 placeholder-gray-400"
                  [readonly]="!isEditMode"/>
          </div>

           <div class="space-y-2 ">
            <label class="block text-sm font-semibold text-gray-700">
              Username <span class="text-red-500">*</span>
            </label>
            <input type="text" formControlName="username" placeholder="Ademola"
                  class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl
                          focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all duration-200 placeholder-gray-400"
                  [readonly]="true"/>
          </div>

          <div class="space-y-2">
            <label class="block text-sm font-semibold text-gray-700">
              Email Address <span class="text-red-500">*</span>
            </label>
            <input type="email" formControlName="email" placeholder="john@example.com"
                  class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl
                          focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all duration-200 placeholder-gray-400"
                  [readonly]="!isEditMode"/>
          </div>
  
          <div class="space-y-2">
            <label class="block text-sm font-semibold text-gray-700">
              Phone Number <span class="text-red-500">*</span>
            </label>
            <input type="tel" formControlName="phoneNumber" placeholder="+2349011234567"
                  class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl
                          focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all duration-200 placeholder-gray-400"
                  [readonly]="!isEditMode"/>
          </div>
  
          <div class="space-y-2 lg:col-span-2">
            <label class="block text-sm font-semibold text-gray-700">
              Address <span class="text-red-500">*</span>
            </label>
            <input type="text" formControlName="address" placeholder="123 Main Street, Apt 4B"
                  class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl
                          focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all duration-200 placeholder-gray-400"
                  [readonly]="!isEditMode"/>
          </div>
  
          <div class="space-y-2">
            <label class="block text-sm font-semibold text-gray-700">Country <span class="text-red-500">*</span></label>
            <ng-select formControlName="country" [items]="countries" bindLabel="name" bindValue="name"
                      (change)="onCountrySelect($event)" class="ng-select-custom" [disabled]="!isEditMode"></ng-select>
          </div>
  
          <div class="space-y-2">
            <label class="block text-sm font-semibold text-gray-700">State <span class="text-red-500">*</span></label>
            <ng-select formControlName="state" [items]="states" bindLabel="name" bindValue="name"
                      (change)="onStateSelect($event)" class="ng-select-custom" [disabled]="!isEditMode"></ng-select>
          </div>
  
          <div class="space-y-2">
            <label class="block text-sm font-semibold text-gray-700">City <span class="text-red-500">*</span></label>
            <ng-select formControlName="city" [items]="cities" bindLabel="name" bindValue="name"
                      class="ng-select-custom" [disabled]="!isEditMode"></ng-select>
          </div>
  
          <div class="space-y-2">
            <label class="block text-sm font-semibold text-gray-700">Postal Code</label>
            <input type="text" formControlName="postalCode" placeholder="90210"
                  class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl
                          focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all duration-200 placeholder-gray-400"
                  [readonly]="!isEditMode"/>
          </div>
        </div>
      </section>
  
      <section class="bg-white/70 p-8 rounded-2xl border border-gray-200 transition-all duration-300">
      <div class="flex items-center mb-6">
          <div class="w-10 h-10 border rounded-full flex items-center justify-center mr-4">
            <svg class="w-5 h-5 text-white" fill="none" stroke="gray" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
            </svg>
          </div>
          <h3 class="text-lg font-bold text-gray-800">Business Details</h3>
        </div>
      
        <div class="grid lg:grid-cols-4 gap-6">
          <div class="space-y-2">
            <label class="block text-sm font-semibold text-gray-700">
              Industry <span class="text-red-500">*</span>
            </label>
            <ng-select
              formControlName="industry"
              [items]="industries"
              bindLabel="name"
              bindValue="name"
              class="ng-select-custom"
              [disabled]="!isEditMode"
            ></ng-select>
          </div>
        
          <div class="space-y-2">
            <label class="block text-sm font-semibold text-gray-700">
              Company Name <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              formControlName="companyName"
              class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all duration-200 placeholder-gray-400" 
              placeholder="Your Company Ltd."
              [readonly]="!isEditMode"
            />
          </div>

           <div class="space-y-2">
            <label class="block text-sm font-semibold text-gray-700">
              Domain <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              formControlName="companyName"
              class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all duration-200 placeholder-gray-400" 

              placeholder="Your Company Ltd."
              [readonly]="true"
            />
          </div>
          
          <div class="space-y-2">
            <label class="block text-sm font-semibold text-gray-700">
              Client Type <span class="text-red-500">*</span>
            </label>
            <ng-select
              formControlName="clientType"
              [items]="['Company', 'Client', 'Individual', 'Group']"
              class="ng-select-custom"
              [disabled]="!isEditMode"
            ></ng-select>
          </div>
        </div>
        
        <div class="mt-6 space-y-2">
          <label class="block text-sm font-semibold text-gray-700">
            Bio <span class="text-red-500">*</span>
          </label>
          <textarea
            rows="4"
            formControlName="bio"
            class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all duration-200 placeholder-gray-400 resize-none" 
            placeholder="Tell us about yourself and your business goals..."
            [readonly]="!isEditMode"
          ></textarea>
        </div>
        </section>
  
      <section class="bg-white/70 p-8 rounded-2xl border border-gray-200 transition-all duration-300">
        <div class="flex items-center mb-6">
          <div class="w-10 h-10 border rounded-full flex items-center justify-center mr-4">
            <svg class="w-5 h-5 text-white" fill="none" stroke="gray" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
          </div>
          <h3 class="text-lg font-bold text-gray-800">Regional Settings</h3>
        </div>
        
        <div class="grid lg:grid-cols-3 gap-6">
          <div class="space-y-2">
            <label class="block text-sm font-semibold text-gray-700">
              Currency <span class="text-red-500">*</span>
            </label>
            <ng-select
              formControlName="currency"
              [items]="currencies"
              bindLabel="label"
              bindValue="code"
              class="ng-select-custom"
              [disabled]="!isEditMode"
            ></ng-select>
          </div>
          
          <div class="space-y-2">
            <label class="block text-sm font-semibold text-gray-700">
              Language <span class="text-red-500">*</span>
            </label>
            <ng-select
              formControlName="language"
              [items]="languages"
              class="ng-select-custom"
              [disabled]="!isEditMode"
            ></ng-select>
          </div>
  
          <div class="space-y-2">
            <label class="block text-sm font-semibold text-gray-700">
              Time Zone <span class="text-red-500">*</span>
            </label>
            <ng-select
              formControlName="timeZone"
              [items]="timeZones"
              bindLabel="label"
              bindValue="value"
              class="ng-select-custom"
              [disabled]="!isEditMode"
            ></ng-select>
          </div>
        </div>
  
      </section>
  
      <div class="flex justify-center pt-6">
        <button type="submit"
                class="bg-customGreen text-white font-semibold px-8 py-3 rounded-xl transition-all duration-200 transform hover:scale-105 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none flex items-center space-x-2"
                [disabled]="form.invalid || !isEditMode">
          <span>Save Changes</span>
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
          </svg>
        </button>
      </div>
    </form>
