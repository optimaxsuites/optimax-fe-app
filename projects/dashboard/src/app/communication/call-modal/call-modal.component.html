<div
  *ngIf="state.open"
  class="fixed inset-0 z-50 flex items-end justify-center p-4 sm:items-center"
  (click)="callEnded.emit()"
>
  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
  <div
    class="relative bg-gray-900 rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden"
    (click)="$event.stopPropagation()"
  >
    <div class="px-6 pt-8 pb-6 flex flex-col items-center text-center">
      <div class="relative mb-4">
        <img
          *ngIf="contactAvatarUrl"
          [src]="contactAvatarUrl"
          alt=""
          class="w-20 h-20 rounded-full object-cover"
          [ngClass]="{
            'ring-4 ring-emerald-400 ring-offset-2 ring-offset-gray-900':
              state.status === 'connected',
            'animate-pulse': state.status === 'ringing',
          }"
        />
        <div
          *ngIf="!contactAvatarUrl"
          class="w-20 h-20 rounded-full flex items-center justify-center text-white text-[24px] font-bold bg-[#2e6276]"
          [ngClass]="{
            'ring-4 ring-emerald-400 ring-offset-2 ring-offset-gray-900':
              state.status === 'connected',
            'animate-pulse': state.status === 'ringing',
          }"
        >
          {{ state.targetName | slice: 0 : 1 }}
        </div>
        <div
          *ngIf="state.type === 'VIDEO_CALL' && !state.videoOff"
          class="absolute -bottom-1 -right-1 w-7 h-7 rounded-full bg-blue-500 flex items-center justify-center border-2 border-gray-900"
        >
          <svg
            width="12"
            height="12"
            fill="none"
            stroke="white"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.36a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"
            />
          </svg>
        </div>
      </div>

      <h3 class="text-[20px] font-bold text-white mb-1">
        {{ state.targetName }}
      </h3>
      <p
        class="text-[14px] font-medium"
        [ngClass]="{
          'text-yellow-400': state.status === 'ringing',
          'text-emerald-400': state.status === 'connected',
          'text-gray-400': state.status === 'ended',
          'text-red-400': state.status === 'failed',
        }"
      >
        <ng-container [ngSwitch]="state.status">
          <ng-container *ngSwitchCase="'ringing'">
            <span class="inline-flex items-center gap-1.5">
              <span
                class="w-2 h-2 rounded-full bg-yellow-400 animate-ping inline-block"
              ></span
              >Calling…
            </span>
          </ng-container>
          <ng-container *ngSwitchCase="'connected'">{{
            formatCallDuration(state.duration)
          }}</ng-container>
          <ng-container *ngSwitchCase="'ended'">Call ended</ng-container>
          <ng-container *ngSwitchCase="'failed'"
            >Could not connect</ng-container
          >
        </ng-container>
      </p>
    </div>

    <div class="px-6 pb-8 flex items-center justify-center gap-5">
      <!-- Mute -->
      <button
        (click)="muteToggled.emit()"
        class="w-14 h-14 rounded-full flex items-center justify-center transition-all"
        [ngClass]="
          state.muted ? 'bg-white text-gray-900' : 'bg-white/15 text-white'
        "
      >
        <svg
          *ngIf="!state.muted"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"
          />
        </svg>
        <svg
          *ngIf="state.muted"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"
          />
        </svg>
      </button>

      <!-- End call -->
      <button
        (click)="callEnded.emit()"
        class="w-16 h-16 rounded-full bg-red-500 hover:bg-red-600 flex items-center justify-center transition-all shadow-lg"
      >
        <svg width="22" height="22" fill="white" viewBox="0 0 24 24">
          <path
            d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"
          />
        </svg>
      </button>

      <!-- Video toggle -->
      <button
        *ngIf="state.type === 'VIDEO_CALL'"
        (click)="videoToggled.emit()"
        class="w-14 h-14 rounded-full flex items-center justify-center transition-all"
        [ngClass]="
          state.videoOff ? 'bg-white text-gray-900' : 'bg-white/15 text-white'
        "
      >
        <svg
          *ngIf="!state.videoOff"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.36a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"
          />
        </svg>
        <svg
          *ngIf="state.videoOff"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.36a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2zM3 3l18 18"
          />
        </svg>
      </button>

      <!-- Speaker placeholder (voice call) -->
      <button
        *ngIf="state.type === 'CALL'"
        class="w-14 h-14 rounded-full bg-white/15 text-white flex items-center justify-center"
      >
        <svg
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15.536 8.464a5 5 0 010 7.072M12 6v12m0 0l-3-3m3 3l3-3M9 9H5.5A1.5 1.5 0 004 10.5v3A1.5 1.5 0 005.5 15H9l3 3V6L9 9z"
          />
        </svg>
      </button>
    </div>
  </div>
</div>
