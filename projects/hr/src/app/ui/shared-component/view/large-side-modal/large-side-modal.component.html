<div class="modal-backdrop" (click)="closeModal()"></div>
<div
  class="modal-content"
  [style.right.px]="-dragOffset.x"
  [style.top.px]="dragOffset.y"
  (click)="$event.stopPropagation()">
  <div class="modal-topbar">
    <button type="button" class="drag-handle" (mousedown)="beginDrag($event)">
      <span></span>
    </button>
    <button type="button" class="modal-close-btn" (click)="closeModal()" title="Close">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>
  <ng-content></ng-content>
</div>
