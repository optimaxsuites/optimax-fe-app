<form (ngSubmit)="onSave()">
  <h2>Split Bill</h2>

  <!-- Select method -->
  <div>
    <label><input type="radio" [(ngModel)]="method" name="method" value="equal" /> Equal</label>
    <label><input type="radio" [(ngModel)]="method" name="method" value="percentage" /> Percentage</label>
    <label><input type="radio" [(ngModel)]="method" name="method" value="amount" /> Amount</label>
  </div>

  <hr />

  <!-- Participants -->
  <div *ngFor="let p of participants; let i = index" class="mt-2">
    <strong>{{ p.name }}</strong>

    <!-- Equal (auto-calculated) -->
    <span *ngIf="method === 'equal'">
      → {{ totalAmount / participants.length | currency }}
    </span>

    <!-- Percentage -->
    <input *ngIf="method === 'percentage'" type="number"
      [(ngModel)]="participants[i].sharePercent"
      name="percent-{{ i }}"
      min="0" max="100"
      placeholder="% share" /> %

    <!-- Amount -->
    <input *ngIf="method === 'amount'" type="number"
      [(ngModel)]="participants[i].shareAmount"
      name="amount-{{ i }}"
      min="0"
      placeholder="Amount" />
  </div>

  <!-- Validation -->
  <div *ngIf="errorMessage" class="text-red-500 mt-2">
    {{ errorMessage }}
  </div>

  <!-- Actions -->
  <div class="mt-3">
    <button type="submit" class="px-4 py-2 bg-customBlue text-white rounded">Save</button>
    <button type="button" class="px-4 py-2 bg-gray-400 text-white rounded ml-2 cancel-button" (click)="cancel.emit()">Cancel</button>
  </div>
</form>
