<div class="summary-container">
  <div class="summary-card">
    <h2>Monthly Performance</h2>
    <app-monthlysummary 
    [monthlyData]="monthlyFilteredData">
  </app-monthlysummary>
  </div>

  <div class="summary-card">
    <h2>Monthly Attendance</h2>
    <app-monthlyattendancelist
    (filteredDataChange)="monthlyFilteredData = $event">
  </app-monthlyattendancelist>
  </div>
</div>
