<div class="p-4">
    <div class="mb-4">
        <label for="itemName">Item Name <span style="color: red;">*</span></label>
        <input id="itemName" type="text" [(ngModel)]="itemsData.name" class="editInput" placeholder="Enter item name" />
    </div>

    <div class="mb-4">
        <label for="taxRate">Tax Rate <span style="color: red;">*</span></label>
        <input id="taxRate" type="number" [(ngModel)]="itemsData.taxRate" class="editInput" placeholder="Enter tax rate" />
    </div>

    <div class="mb-4">
        <label for="quantity">Quantity <span style="color: red;">*</span></label>
        <input id="quantity" type="number" [(ngModel)]="itemsData.qty" class="editInput" placeholder="Enter quantity" />
    </div>

    <div class="mb-4">
        <label for="rate">Rate <span style="color: red;">*</span></label>
        <input id="rate" type="number" [(ngModel)]="itemsData.rate" class="editInput" placeholder="Enter rate" (ngModelChange)="onInputChange()" />
    </div>

    <div class="mb-4">
        <label for="amount">Amount <span style="color: red;">*</span></label>
        <input id="amount" type="number" [(ngModel)]="itemsData.amount" class="editInput" placeholder="Enter amount" readonly />
    </div>

    <div class="mb-4">
        <label for="tax">Tax <span style="color: red;">*</span></label>
        <input id="tax" type="number" [(ngModel)]="itemsData.tax" class="editInput" placeholder="Enter tax" readonly />
    </div>

    <div class="mb-4">
        <label for="total">Total <span style="color: red;">*</span></label>
        <input id="total" type="number" [(ngModel)]="itemsData.total" class="editInput" placeholder="Enter total" readonly />
    </div>

    <div class="mb-4">
        <label for="des">Description</label>
        <textarea name="des" id="des" type="text" [(ngModel)]="itemsData.description" class="editInput" placeholder="Enter description" ></textarea>
    </div>

    <div class="form-actions mt-4">
        <button type="submit" (click)="addItem()">{{quotationModalComponent.isEdit ? 'Edit Item' : 'Add Item'}}Add Item</button>
    </div>
</div>
