<div>
  <div class="form-group">
    <label for="vacancyTitle">Vacancy Title</label>
    <input type="text" class="editInput" id="vacancyTitle" >
  </div>
  <div class="form-group">
    <label for="vacancyStatus">Vacancy Status</label>
    <ng-select
      [items]='vacancyStatuses'
      bindValue= 'status'
    ></ng-select>
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</div>
