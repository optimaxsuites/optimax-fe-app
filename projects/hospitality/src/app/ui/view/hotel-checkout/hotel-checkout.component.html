<div class="flex h-screen bg-gradient-to-b from-gray-200 to-gray-100">
  <p-toast></p-toast>

  <!-- Main content area -->
  <main
    class="flex-1 p-8 overflow-y-auto"
    [ngClass]="{ hidden: showRoomDetails }"
  >
    <app-hotel-roomlist
      (roomSelected)="handleRoomSelected($event)"
      (bookingFormRequested)="onBookingFormRequested($event)"
    >
    </app-hotel-roomlist>
  </main>

  <!-- Room detail -->
  <div [ngClass]="{ hidden: !showRoomDetails }">
    <app-hotel-roomdetails
      [room]="selectedRoom"
      (back)="onBack()"
      (statusChanged)="onRoomStatusChanged($event)"
    >
    </app-hotel-roomdetails>
  </div>
</div>
