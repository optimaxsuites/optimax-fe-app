<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=stat_minus_1" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<div class="createVendor"  >
    <div class="flex justify-between  ">
    <p class="back pt-4" style="cursor: pointer; " (click)="closeEdit()"><i class="fa-solid fa-arrow-left text-[13px] "></i> Back</p>
    <button  class="p-2 h-[5rem] bg-customGreen rounded-2xl text-white text-[13px]" [disabled]=" !selectedSupplier "  (click) =" saveProduct()">Edit Inventory</button>
  </div>
  <!-- <div  class="fixed top-4 right-4 bg-green-500 text-white p-3 rounded-md shadow-lg transition-opacity duration-500">
    <p> message</p>{{ notificationMessage }}
  </div> -->
   
    <div class="details" id="addInventory">
     
      <div class="w-[60%] shadow bg-gray-50 text-gray-700 flex flex-col  space-y-5 stl p-5 rounded-2xl border" > 
        <p class="text-[14px] text-gray-700 font-semibold pb-0  mb-0 text-center">Add-Inventory</p>
        <hr>
        <div class="field" >
          <label class="text-[13px] font-normal " for="name">Product Name</label>
          <input class="name editInput bg-gray-100 text-[12px] p-2.5 font-normal "  id="name" [value]="activeItem.name" disabled />
        </div>
  
  
        <div  class="field" >
          <label class="text-[13px] font-normal" for="sku">SKU</label>
          <input class="editInput  bg-gray-100  text-[12px] " id="sku" [value]="activeItem.sku" readonly />
        </div>
  
  
          <div class="field">
            <label class="block font-normal text-[13px]">Product Code</label>
            <input class="editInput w-full text-[12px]  bg-gray-100"   id="code" [value]="activeItem.code" readonly />
          </div>
            
        <div class="field">
          <label for="category" class="block font-normal text-[13px] ">Category</label>
          <input class="editInput w-full text-[12px]   bg-gray-100" id="category"   [value]="activeItem.productCategory.name" readonly />
        </div>
    
  
  
          
          <!-- Dropdown1 -->
          
          <div class="flex gap-4"id="dropdown1">
            <!-- Event Category Dropdown -->
            <div class="w-1/2 ">
              <label for="dropdown" class="block font-normal text-[13px]">Change-type <span class="text-red-500">*
  
              </span>  
            
            </label>
            
           
            
            <input class="editInput w-full bg-gray-100 text-[12px] " value="Restock" id="change-type" readonly />

                  

            
          </div>
  
  
  
          
        
  
  
  
  
  
  
          <!-- Dropdown2 -->
          <div class="w-1/2 ">
            <label for="dropdown" class="block font-normal text-[13px]">Source <span class="text-red-500">*</span>
            
              <span 
              *ngIf="hasSelectedSupplier" 
              (click)="removeSelectedSupplier()" 
              title="Delete selected supplier" 
              class="cursor-pointer text-red-600 text-2xl pl-3"
            >
              <i class="fas fa-trash"></i>
            </span>
            
            </label>
               
       
            <!-- <div class="relative flex items-center border rounded-md overflow-hidden bg-gray-100" > -->

            <p-inputGroup class="relative flex items-center border rounded-md overflow-hidden bg-gray-100"  >
              <select
              id="dropdown"
              class="  text-gray-600 bg-gray-100 text-2xl w-full"  
              (change)="changeSelectedSupplier($event)"
              [(ngModel)]="selectedSupplier"
            >
             <option value="" disabled selected>Select a Supplier</option>
            <option *ngFor="let supplier of suppliers" [value]="supplier.supplierName">   {{ supplier.supplierName }}</option>
            </select>
                <p-inputGroupAddon class="bg-customGreen text-white font-2xl px-2 cursor-pointer"    (click)="openModal()">
                  <i class="fas fa-plus px-2"></i>
                </p-inputGroupAddon>
              </p-inputGroup>
    
        </div>
          
        </div>
        
  
  

  
  

  <p class="text-[13px] text-gray-700 font-semibold " id="h1Q">
    Quantity
  </p>
  
  <div class="flex gap-4">
    <div class="field w-1/2">
      <label for="lastQuantity" class="block font-normal text-[13px]">Last Quantity Added</label>
      <input 
        type="number" 
        id="lastQuantity" 
        name="lastQuantity"
        class="editInput w-full bg-gray-100 text-[12px] " id="lastQuantity"
        [(ngModel)] = "activeItem.effectiveQuantity"
        readonly
      />
    </div>
  
    <div class="field w-1/2">
      <label for="currentQuantity" class="block font-normal text-[13px]">Avaliable Quantity</label>
      <input 
        type="number" 
        id="currentQuantity" 
        name="currentQuantity"
        class="editInput w-full bg-gray-100  text-[12px] " id="currentQuantity"
        required
      />
    </div>
  </div>
  

  <div class="flex gap-4">
    <div class="field w-1/2">
      <label for="restockedQuantity" class="block font-normal text-[13px]">Restocked Quantity</label>
      <input 
        type="number" 
        id="restockedQuantity" 
        name="restockedQuantity"
        class="editInput w-full bg-gray-100 text-[12px] " id="restockedQuantity"
        required
      />
    </div>
  
    <div class="field w-1/2">
      <label for="currentQuantity" class="block font-normal text-[13px]">Current Quantity</label>
      <input 
        type="number" 
        id="currentQuantity" 
        name="currentQuantity"
        class="editInput w-full bg-gray-100  text-[12px] " id="currentQuantity2"
        required
      />
    </div>
</div>




  <p class="text-[13px] text-gray-700 font-semibold" id="Pricing">
    Pricing
  </p>
  <div class="flex gap-4">
    <div class="field w-1/2">
      <label for="lastPrice" class="block font-normal text-[13px]">Last Purchase Price</label>
      <input 
        type="number" 
        id="lastPrice" 
        name="lastPrice"
        class="editInput w-full bg-gray-100 text-[12px] " id="lastPrice"
     
        required
   
      />
    </div>  
  
    <div class="field w-1/2">
      <label for="currentPrice" class="block font-normal text-[13px]">Current Purchase Price</label>
      <input 
        type="number" 
        id="currentPrice" 
        name="currentPrice"
        class="editInput w-full bg-gray-100 text-[12px] " id="currentPrice"
        required
      />
    </div>  
  </div>

  




  <!-- New Fields for Selling Price -->
<div class="flex gap-4 ">
  <div class="field w-1/2">
    <label for="lastSellingPrice" class="block font-normal text-[13px]">Last Selling Price</label>
    <input 
      type="number" 
      id="lastSellingPrice" 
      name="lastSellingPrice"
      class="editInput w-full bg-gray-100  text-[12px] " id="lastSellingPrice"
      [(ngModel)] = "activeItem.effectivePrice"
      readonly
    />
  </div>  

  <div class="field w-1/2 relative">
    <label for="currentSellingPrice" class="block font-normal text-[13px]">
        Current Selling Price
    </label>
    <div class="relative">
        <input 
            type="number" 
            id="currentSellingPrice" 
            name="currentSellingPrice"
            class="editInput w-full bg-gray-100  text-[12px] " id="currentSellingPrice"
            required
        />
        <p 
          id="priceChange"
            (click)="openPriceChange = !openPriceChange" class="text-[13px]"
        >
            + Price Change
        </p>
    </div>
</div>

</div>
<!-- Show Base Price, Tax, Effective Price, and Discount When Price Change is Clicked -->
<div class=" flex-col items-center w-full" id="openprice" *ngIf="openPriceChange">
  <div class="flex  w-full">
    <div class="detailDiv w-1/2 mb-6">
      <label class="text-[13px]" for="base-price">Base Price <span style="color: red">*</span></label>
      <input class="name editInput w-full" type="text" id="base-price" formControlName="initialPrice" placeholder="Base Price" />
    </div>
  
    <div class="detailDiv w-1/2">
      <label class="text-[13px]"  for="tax">Tax Percentage (%) <span style="color: red">*</span></label>
      <input class="name editInput w-full" type="text" id="tax" formControlName="tax" placeholder="Tax Percentage" />
    </div>
  </div>  


<!-- Discount Section -->
<div class="detailDiv w-full">
  <label for="discount" class="block whitespace-nowrap text-[13px]">Discount<span style="color: red">*</span></label>
  
  <div class="flex gap-4 items-center mb-6">
    <select id="discount" formControlName="discount" class="editInput w-3/4" >
      <option [value]="0" disabled selected class="">Discount %</option> <!-- Placeholder Option -->
      <option [value]="5">5% Off</option>
      <option [value]="10">10% Off</option>
      <option [value]="15">15% Off</option>
    </select>

    <button class="btn create-invoice-btn w-32 text-center" type="button" (click)="openAddDiscount = true">
      Add
    </button>
  </div>
</div>


  <div class="detailDiv w-full">
    <label for="e-price">Effective Price <span style="color: red">*</span></label>
    <input class="name editInput" type="text" id="e-price" formControlName="effectivePrice" placeholder="Effective Price"  />
  </div>


 



</div>
          <button 
          type="button" 
          class="mt-4 bg-green-500 text-white px-6 py-2 rounded-md font-medium hover:bg-green-700 transition" 
          (click)="saveSelection(activeItem.id)" (click)="saveToLocalStorage()"
        >
          {{ isEditing ? 'Update Branch' : 'Save' }}
        </button>
      
        </div>
   
   
        </div>


</div>
        <app-side-modal *ngIf="isOpen" (close)="closeModal()">
          <h2 class="text-2xl font-bold my-5 text-center">Add New Supplier</h2>
        
          <div class="bg-white shadow-2xl rounded-lg p-6 mt-14">
            <form (ngSubmit)="submitForm()">
              <div class="mb-4">
                <label class="block text-gray-700 text-2xl">Supplier Name</label>
                <input type="text" [(ngModel)]="supplierName" name="supplierName" class="w-full p-3  bg-gray-200"  style="border: 1px solid gray; border-radius: 4px;" required />
              </div>
        
              <div class="mb-4">
                <label class="block text-gray-700 text-2xl">Contact Person</label>
                <input type="text" [(ngModel)]="contactPerson" name="contactPerson" class="w-full p-2  bg-gray-200"  style="border: 1px solid gray; border-radius: 4px;"required />
              </div>
        
              <div class="mb-4">
                <label class="block text-gray-700 text-2xl">Email Address</label>
                <input type="email" [(ngModel)]="email" name="email" class="w-full p-2  bg-gray-200 "  #emailInput="ngModel" style="border: 1px solid gray; border-radius: 4px;" required />
              </div>
        
              <div class="mb-4">
                <label class="block text-gray-700 text-2xl">Phone Number</label>
                <input type="tel" [(ngModel)]="phone" name="phone"     [(ngModel)]="phone" class="w-full p-2  bg-gray-200"style="border: 1px solid gray; border-radius: 4px;" required />
              </div>
        
              <div class="mb-4">
                <label class="block text-gray-700 text-2xl">Business Address</label>
                <input type="text" [(ngModel)]="address" name="address" class="w-full p-2  bg-gray-200" style="border: 1px solid gray; border-radius: 4px;" />
              </div>
        
              <!-- Additional Information -->
              <label class="block text-gray-700 font-medium mb-2 text-2xl">Products/Services Provided</label>
              <textarea [(ngModel)]="products" name="products" class="w-full p-3 bg-gray-200 focus:ring-2 focus:ring-green-400 mb-4" placeholder="List the products or services offered" style="border: 1px solid gray; border-radius: 4px;"></textarea>
        
              <label class="block text-gray-700 font-medium mb-2 text-2xl">Notes</label>
              <textarea [(ngModel)]="notes" name="notes" class="w-full p-3  bg-gray-200 focus:ring-2 focus:ring-green-400 mb-4" placeholder="Any special instructions or comments " style="border: 1px solid gray; border-radius: 4px;"></textarea>
        
              <!-- Terms & Conditions -->
              <!-- <div class="mb-4 flex items-center">
                <input type="checkbox" [(ngModel)]="agreeTerms" name="agreeTerms" class="mr-2" />
                <label for="agreeTerms" class="text-2xl">
                  I agree to the 
                  <a href="/terms-and-conditions" target="_blank" class="text-blue-600 underline">Terms & Conditions</a>
                </label>
              </div> -->
            
        
              <!-- Buttons -->
              <div class="flex justify-end">
                <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">Save</button>
                <button type="button" class="ml-2 text-gray-600" (click)="closeModal()">Cancel</button>
              </div>
            </form>
          </div>
      
        </app-side-modal>
