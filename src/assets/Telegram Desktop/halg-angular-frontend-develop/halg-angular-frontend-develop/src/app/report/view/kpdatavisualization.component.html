<p-toast position="top-center"></p-toast>
<p-sidebar
  [(visible)]="kpquerybuilder"
  [baseZIndex]="0"
  [autoZIndex]="true"
  styleClass="p-sidebar-lg"
  [style]="{ width: '800px', height: '100%' }"
  blockScroll="false"
>
  <p-panel header="Query Attr">
    <ng-template pTemplate="content">
      <div class="p-col-12 p-grid p-fluid">
        <div class="p-field p-col-6">
          <label for="dvtData"><b>Data</b></label>
          <p-dropdown
            [filter]="true"
            filterBy="name"
            [showClear]="true"
            [options]="dvtdata"
            [(ngModel)]="selecteddvtdata"
            optionLabel="name"
            placeholder="-Select-"
            (onChange)="showServiceForms()"
          ></p-dropdown>
        </div>
        <div class="p-field p-col-6">
          <label for="dvtData"><b>Period (days)</b></label>
          <p-dropdown
            [filter]="true"
            filterBy="name"
            [showClear]="true"
            [options]="regperiodmap"
            [(ngModel)]="selectedperiod"
            optionLabel="name"
            placeholder="-Select-"
            (onChange)="showDateBetween()"
          ></p-dropdown>
        </div>
        <div *ngIf="serviceformdisplay" class="p-grid p-col-12">
        <div  class="p-field p-col-6">
        <label for="programs_id"><b>Service Forms</b></label>
        <p-dropdown inputId="programs_id" [options]="clientservices.programsMap" [(ngModel)]="selectedPrograms"
        optionLabel="name" placeholder="-Select-" (onChange)="onProgramsSelection()"
       ></p-dropdown>
       </div>
       <div class="p-field p-col-6">
       <label for="program_id"><b>Service Type </b></label>
      <p-dropdown inputId="program_id" [options]="clientservices.programStageMap"  [(ngModel)]="selectedProgramStage"
      optionLabel="name" placeholder="-Select-" (onChange)="onProgramStageSelection()"></p-dropdown>
</div>
</div>
<div *ngIf="datebetweendisplay" class="p-grid p-col-12">
        <div class="p-field p-col-6">
          <label for="dor"><b>Date From: *</b></label>
          <p-calendar
            [monthNavigator]="true"
            [yearNavigator]="true"
            yearRange="2000:{{ curYear }}"
            [maxDate]="maxDate"
            [(ngModel)]="dateFrom"
            inputId="navigators"
            [showIcon]="true"
            showButtonBar="true"
            required
            placeholder="Date From"
          >
          </p-calendar>
        </div>

        <div class="p-field p-col-6">
          <label for="dor"><b>Date To: *</b></label>
          <p-calendar
            [monthNavigator]="true"
            [yearNavigator]="true"
            yearRange="2000:{{ curYear }}"
            [maxDate]="maxDate"
            [(ngModel)]="dateTo"
            inputId="navigators"
            [showIcon]="true"
            showButtonBar="true"
            required
            placeholder="Date To"
          >
          </p-calendar>
        </div>
      </div>
       
        <div class="p-field p-col-12 p-md-12">
          <label for="firstname1">Heirarchy Units</label>
          <p-tree
            [value]="roots"
            selectionMode="single"
            scrollHeight="600px"
            [contextMenu]="shuc"
            [(selection)]="selectedHeirarchyunit"
            [draggableNodes]="true"
            [droppableNodes]="true"
            draggableScope="self"
            droppableScope="self"
            key="selectedHeirarchyunit.heirarchyunitid"
            (onNodeSelect)="heirarchyOnSelect($event)"
            (onNodeDrop)="moveHeirarchyunit($event)"
            [filter]="true"
            filterMode="strict"
            filterBy="name"
            filterPlaceholder="Search for OU in list"
            indetation="0.5"
            [loading]="loading"
          >
            <ng-template let-node pTemplate="default">
              <b>{{ node.name }}</b>
            </ng-template>
          </p-tree>

          <small>Selected heirarchy units will be displayed here..</small>
        </div>

        <p-button
          pRipple
          type="submit"
          (onClick)="loadData()"
          (click)="kpquerybuilder = false"
          label="Generate"
          class="p-mr-2 p-mb-2"
        ></p-button>
      </div>
    </ng-template>
  </p-panel>
</p-sidebar>

<div class="card">
  
  <div>
    <button
      pButton
      pRipple
      type="button"
      (click)="kpquerybuilder = true"
      icon="pi pi-arrow-right"
      class="p-button-rounded p-mr-2 p-mb-2"
    ></button>
  </div>
  <div class="control-section" style="overflow: auto">
    <ejs-pivotview
      #pivotview
      id="PivotView"
      allowExcelExport="true"
      showGroupingBar="true"
      showFieldList="true"
      allowCalculatedField="true"
      allowExcelExport="true"
      [dataSourceSettings]="dataSourceSettings"
      width="100%"
      height="1000"
      [gridSettings]="gridSettings"
      showToolbar="true"
      [chartSettings]="chartSettings"
      [displayOption]="displayOption"
      [toolbar]="toolbarOptions"
      (toolbarRender)="beforeToolbarRender($event)"
      (saveReport)="saveReport($event)"
      (loadReport)="loadReport($event)"
      (fetchReport)="fetchReport($event)"
      (renameReport)="renameReport($event)"
      (removeReport)="removeReport($event)"
      (newReport)="newReport()"
      allowDrillThrough='true'
      [allowDeferLayoutUpdate]='true'
      allowConditionalFormatting='true'
      allowNumberFormatting='true' 
      allowPdfExport='true'
    >
    </ejs-pivotview>
  </div>
</div>
