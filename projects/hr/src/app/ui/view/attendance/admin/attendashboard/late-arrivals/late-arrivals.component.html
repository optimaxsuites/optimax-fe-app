<!--<p>late-arrivals works!</p>-->
<div class="late-list">
  <h3>Late Arrivals</h3>

  <ng-container *ngIf="lateArrivals.length > 0; else noData">
    <div class="late-item" *ngFor="let user of lateArrivals">
      <span>{{ user.id }}</span>
      <span>{{ user.name }}</span>
      <span>{{ user.time }}</span>
    </div>
  </ng-container>

  <ng-template #noData>
    <p>No data for selected period :P</p>
  </ng-template>
</div>
