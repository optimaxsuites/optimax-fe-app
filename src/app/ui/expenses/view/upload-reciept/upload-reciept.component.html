<app-back-button></app-back-button>
<div class="modal-content">
    <span class="close" (click)="closeModal()">&times;</span>
    <h2>Upload Receipt</h2>
    <div class="upload-container"
        (click)="onFileClick()"
        (drop)="onFileDrop($event)"
        (dragover)="onFileDragOver($event)"
        (dragleave)="onFileDragLeave($event)">
        <input type="file" id="upload-receipt" name="upload-receipt" class="upload-input" (change)="onFileSelect($event)">
        <p>Click or drag file to this area to upload</p>
    </div>
    <button class="submit-button" (click)="submitReceipt()">Submit</button>
</div>
