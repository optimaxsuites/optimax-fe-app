<button (click)="goBack()" class="p-5 text-2xl">
    <i class="fa-solid fa-arrow-left"></i>
  </button>


  
  
<div class="flex  justify-center  w-full ">
    
   <div class="  w-full  max-w-7xl p-6 pl-10 bg-white border border-gray-200 rounded-lg shadow-lg dark:bg-gray-800 dark:border-gray-700 dark:hover:bg-gray-700 mb-10 ml-4 mt-10" *ngIf="productHistory && productHistory.length">
   <h1 class="text-3xl mb-7 mt-3 text-center">Product Information</h1>
   <div class="field mb-4">
    <label class="text-2xl font-medium" for="name">Product Name</label>
    <input class="name editInput bg-gray-100 text-xl " style= " padding: 10px;" id="name" [value]="activeItem.name" readonly />
   </div>

   <div  class="field mb-4">
    <label class="text-2xl" for="sku">SKU</label>
    <input class="editInput  bg-gray-100  text-xl"  style= " padding: 10px;" id="sku" [value]="activeItem.sku" readonly />
  </div>


    <div class="field mb-4">
      <label for="code" class="block font-medium text-2xl">Product Code</label>
      <input class="editInput w-full text-xl  bg-gray-100"  style= " padding: 10px;" id="code" [value]="activeItem.code" readonly />
    </div>
      
  <div class="field mb-4">
    <label for="category" class="block font-medium text-2xl ">Category</label>
    <input class="editInput w-full text-xl  bg-gray-100" id="category"  style= " padding: 10px;"  [value]="activeItem.productCategory.name" readonly />
  </div>



<div class="mt-9" >
<!-- <div *ngIf="supplier"  class="  w-full  max-w-7xl p-6 pl-10 bg-white border border-gray-200 rounded-lg shadow-lg dark:bg-gray-800 dark:border-gray-700 dark:hover:bg-gray-700 mb-10  mt-10"> -->
<h1 class="text-3xl  text-center"> Suppliers Details</h1>
<label for="category" class="block font-medium text-2xl ">Suppliers Name</label>
<input id="category" type="text" class="border rounded-lg p-4 w-full  bg-gray-100  text-xl mb-4" [value]="supplier.supplierName" readonly>
<label for="category" class="block font-medium text-2xl   ">Contact Person </label>
<input id="category" type="text" class="border rounded-lg p-4 w-full  bg-gray-100  text-xl mb-4" [value]="supplier.contactPerson" readonly>
<label for="category" class="block font-medium text-2xl ">Email</label>
<input id="category" type="text" class="border rounded-lg p-4 w-full  bg-gray-100  text-xl mb-4" [value]="supplier.email" readonly>
<label for="category" class="block font-medium text-2xl ">Phone Number </label>
<input id="category" type="text" class="border rounded-lg p-4 w-full  bg-gray-100  text-xl mb-4" [value]="supplier.phone" readonly>
<label for="category" class="block font-medium text-2xl ">Address </label>
<input id="category" type="text" class="border rounded-lg p-4 w-full  bg-gray-100  text-xl mb-4" [value]="supplier.address" readonly>
<label for="category" class="block font-medium text-2xl ">Products </label>
<input id="category" type="text" class="border rounded-lg p-4 w-full  bg-gray-100  text-xl mb-4" [value]="supplier.products" readonly>
<label for="category" class="block font-medium text-2xl ">Date: {{ Date }} , {{Time}} </label>
</div>

<h1 class="text-3xl text-center font-bold mb-6">Pricing and Quantity Information</h1>

    <label class="block font-medium text-2xl mb-2">Available Quantity</label>
    <input type="text" class="border rounded-lg p-4 w-full bg-gray-100 text-xl mb-4" [value]="pricingQuantity[0]?.availableQuantity" readonly>

    <label class="block font-medium text-2xl mb-2">Restocked Quantity</label>
    <input type="text" class="border rounded-lg p-4 w-full bg-gray-100 text-xl mb-4" [value]="pricingQuantity[0]?.restockedQuantity" readonly>

    <label class="block font-medium text-2xl mb-2">Current Quantity</label>
    <input type="text" class="border rounded-lg p-4 w-full bg-gray-100 text-xl mb-4" [value]="pricingQuantity[0]?.currentQuantity" readonly>

    <label class="block font-medium text-2xl mb-2">Current Purchase Price</label>
    <input type="text" class="border rounded-lg p-4 w-full bg-gray-100 text-xl mb-4" [value]="pricingQuantity[0]?.currentPrice" readonly>

    <label class="block font-medium text-2xl mb-2">Current Selling Price</label>
    <input type="text" class="border rounded-lg p-4 w-full bg-gray-100 text-xl mb-4" [value]="pricingQuantity[0]?.currentSellingPrice" readonly>

    <hr class="my-6 border-t border-gray-300">

    <label class="block font-medium text-2xl">Date: {{ Date }} , {{ Time }}</label>


  </div>
  
</div>
