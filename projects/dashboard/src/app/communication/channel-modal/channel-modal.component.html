<div
  *ngIf="state.open"
  class="fixed inset-0 z-50 flex items-center justify-center p-4"
  (click)="closed.emit()"
>
  <div class="absolute inset-0 bg-black/30 backdrop-blur-sm"></div>
  <div
    class="relative bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-between px-8 py-5 border-b border-gray-200">
      <h2 class="text-[18px] font-bold text-gray-900">
        {{ state.mode === 'create' ? 'New Channel' : 'Edit Channel' }}
      </h2>
      <button (click)="closed.emit()" class="panel-close-btn">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="px-8 py-6 flex flex-col gap-5">
      <!-- Name -->
      <div>
        <label class="block text-[13px] font-semibold text-gray-700 mb-1.5">
          Channel Name <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          [value]="state.name"
          (input)="nameChange.emit($any($event.target).value)"
          placeholder="e.g. general, announcements"
          class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-[14px] text-gray-800 outline-none focus:border-[#2e6276]/50 focus:ring-2 focus:ring-[#2e6276]/10"
        />
      </div>

      <!-- Description -->
      <div>
        <label class="block text-[13px] font-semibold text-gray-700 mb-1.5">Description</label>
        <input
          type="text"
          [value]="state.description"
          (input)="descriptionChange.emit($any($event.target).value)"
          placeholder="What's this channel about?"
          class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-[14px] text-gray-800 outline-none focus:border-[#2e6276]/50 focus:ring-2 focus:ring-[#2e6276]/10"
        />
      </div>

      <!-- Type -->
      <div>
        <label class="block text-[13px] font-semibold text-gray-700 mb-1.5">Type</label>
        <div class="flex gap-3">
          <button
            (click)="channelTypeChange.emit('PUBLIC')"
            class="flex-1 flex items-center gap-2 px-4 py-2.5 rounded-xl border text-[13px] font-medium transition-colors"
            [ngClass]="state.channelType === 'PUBLIC' ? 'border-[#2e6276] bg-[#2e6276]/5 text-[#2e6276]' : 'border-gray-200 text-gray-600'"
          >Public</button>
          <button
            (click)="channelTypeChange.emit('PRIVATE')"
            class="flex-1 flex items-center gap-2 px-4 py-2.5 rounded-xl border text-[13px] font-medium transition-colors"
            [ngClass]="state.channelType === 'PRIVATE' ? 'border-[#2e6276] bg-[#2e6276]/5 text-[#2e6276]' : 'border-gray-200 text-gray-600'"
          >Private</button>
        </div>
      </div>

      <div>
        <label class="block text-[13px] font-semibold text-gray-700 mb-1.5">Workspace</label>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <button
            (click)="workspaceModeChange.emit('CHAT')"
            class="flex items-center justify-center px-4 py-2.5 rounded-xl border text-[13px] font-medium transition-colors"
            [ngClass]="state.workspaceMode === 'CHAT' ? 'border-[#2e6276] bg-[#2e6276]/5 text-[#2e6276]' : 'border-gray-200 text-gray-600'"
          >Chat</button>
          <button
            (click)="workspaceModeChange.emit('DOCUMENT_LIBRARY')"
            class="flex items-center justify-center px-4 py-2.5 rounded-xl border text-[13px] font-medium transition-colors"
            [ngClass]="state.workspaceMode === 'DOCUMENT_LIBRARY' ? 'border-[#2e6276] bg-[#2e6276]/5 text-[#2e6276]' : 'border-gray-200 text-gray-600'"
          >Document Library</button>
          <button
            (click)="workspaceModeChange.emit('HYBRID')"
            class="flex items-center justify-center px-4 py-2.5 rounded-xl border text-[13px] font-medium transition-colors"
            [ngClass]="state.workspaceMode === 'HYBRID' ? 'border-[#2e6276] bg-[#2e6276]/5 text-[#2e6276]' : 'border-gray-200 text-gray-600'"
          >Hybrid</button>
        </div>
        <p class="mt-2 text-[12px] text-gray-500">
          Chat keeps a normal conversation channel, Document Library is files-first, and Hybrid supports both files and chat in one channel.
        </p>
      </div>

      <div *ngIf="isDocumentLibraryMode()" class="rounded-2xl border border-[#2e6276]/15 bg-[#2e6276]/[0.03] p-4 flex flex-col gap-3">
        <label class="flex items-start gap-3 cursor-pointer">
          <input
            type="checkbox"
            [checked]="state.allowFolders"
            (change)="allowFoldersChange.emit($any($event.target).checked)"
            class="mt-1"
          />
          <span>
            <strong class="block text-[13px] text-gray-800">Enable folders</strong>
            <small class="block text-[12px] text-gray-500">Allow users to create named folders inside this channel.</small>
          </span>
        </label>
        <label class="flex items-start gap-3 cursor-pointer" [class.opacity-50]="!state.allowFolders">
          <input
            type="checkbox"
            [checked]="state.allowSubfolders"
            [disabled]="!state.allowFolders"
            (change)="allowSubfoldersChange.emit($any($event.target).checked)"
            class="mt-1"
          />
          <span>
            <strong class="block text-[13px] text-gray-800">Enable subfolders</strong>
            <small class="block text-[12px] text-gray-500">Allow nested folders within the document library.</small>
          </span>
        </label>
      </div>

      <!-- Member picker (create mode only) -->
      <div *ngIf="state.mode === 'create' && modalEmployees.length">
        <label class="block text-[13px] font-semibold text-gray-700 mb-2">Add Members (optional)</label>
        <div class="max-h-64 overflow-y-auto border border-gray-200 rounded-xl divide-y divide-gray-100" style="scrollbar-width: thin">
          <button
            *ngFor="let emp of modalEmployees"
            (click)="memberToggled.emit(emp.user!.userId)"
            class="flex items-center gap-3 w-full px-4 py-2.5 hover:bg-gray-50 transition-colors text-left"
            [ngClass]="{ 'bg-[#2e6276]/5': isMemberSelected(emp.user!.userId) }"
          >
            <div
              class="w-7 h-7 rounded-full flex items-center justify-center text-white text-[9px] font-bold flex-shrink-0"
              [style.background]="getEmpAvatarColor(emp)"
            >{{ getEmpInitials(emp) }}</div>
            <div class="flex-1 min-w-0">
              <p class="text-[13px] font-medium text-gray-800 truncate">{{ getEmpName(emp) }}</p>
              <p class="text-[11px] text-gray-400 truncate">{{ emp.jobTitle }}</p>
            </div>
            <svg *ngIf="isMemberSelected(emp.user!.userId)" class="text-[#2e6276] flex-shrink-0" width="14" height="14" fill="currentColor" viewBox="0 0 24 24">
              <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" />
            </svg>
          </button>
        </div>
        <p class="text-[12px] text-gray-400 mt-1.5">{{ state.selectedUserIds.length }} selected</p>
      </div>

      <p *ngIf="state.error" class="text-[13px] text-red-500">{{ state.error }}</p>
    </div>

    <div class="px-8 pb-6 flex gap-3">
      <button
        (click)="closed.emit()"
        class="flex-1 py-2.5 border border-gray-200 text-gray-600 text-[14px] font-medium rounded-xl hover:bg-gray-50"
      >Cancel</button>
      <button
        (click)="saved.emit()"
        [disabled]="state.saving || !state.name.trim()"
        class="flex-1 py-2.5 bg-[#2e6276] text-white text-[14px] font-semibold rounded-xl hover:bg-[#255264] disabled:opacity-50 flex items-center justify-center gap-2"
      >
        <svg *ngIf="state.saving" class="animate-spin" width="14" height="14" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        {{ state.saving ? 'Saving…' : state.mode === 'create' ? 'Create Channel' : 'Save Changes' }}
      </button>
    </div>
  </div>
</div>

<style>
  .panel-close-btn {
    width: 28px; height: 28px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #9ca3af;
    transition: background 0.15s, color 0.15s;
  }
  .panel-close-btn:hover { background: #f3f4f6; color: #374151; }
</style>
