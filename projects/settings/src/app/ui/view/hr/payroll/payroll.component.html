<div class="px-6 bg-gray-50 min-h-screen">
  <div class="flex gap-4 items-center mb-6">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-customBlue" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
    </svg>
    <div>
        <p class="text-customBlue/60 text-base">Human Resources</p>
        <p class="text-customBlue font-semibold text-xl">Payroll Configuration</p>
    </div>
  </div>

  <header class="relative mb-4">
    <nav class="border-b border-gray-200">
      <ul class="flex space-x-6 -mb-px text-lg">
        <li>
          <a
            (click)="setActiveTab('general')"
            [ngClass]="{
              'border-b-4 border-customBlue text-gray-900 font-bold': activeTab === 'general',
              'text-gray-700 hover:text-gray-900': activeTab !== 'general'
            }"
            class="inline-block py-2 px-1 cursor-pointer transition duration-150 ease-in-out no-underline text-inherit"
          >
            General settings
          </a>
        </li>
        <li>
          <a
            (click)="setActiveTab('taxation')"
            [ngClass]="{
              'border-b-4 border-customBlue text-gray-900 font-bold': activeTab === 'taxation',
              'text-gray-700 hover:text-gray-900': activeTab !== 'taxation'
            }"
            class="inline-block py-2 px-1 cursor-pointer transition duration-150 ease-in-out no-underline text-inherit"
          >
            Statutory & Taxation
          </a>
        </li>

         <li>
          <a
            (click)="setActiveTab('bankTellerMapping')"
            [ngClass]="{
              'border-b-4 border-customBlue text-gray-900 font-bold': activeTab === 'taxation',
              'text-gray-700 hover:text-gray-900': activeTab !== 'taxation'
            }"
            class="inline-block py-2 px-1 cursor-pointer transition duration-150 ease-in-out no-underline text-inherit"
          >
            Bank Template Mapping
          </a>
        </li>

      </ul>
    </nav>
  </header>


 <app-general *ngIf="activeTab === 'general'"></app-general>
 <app-taxation *ngIf="activeTab === 'taxation'"></app-taxation>
 <app-bank-teller-mapping *ngIf="activeTab === 'bankTellerMapping'"></app-bank-teller-mapping>


</div>
