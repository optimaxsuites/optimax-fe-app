<div class="max-w-4xl mx-auto p-6   rounded-3xl mt-6">
  
  <h2 class="text-xl font-bold mb-6 text-center text-gray-800">Share Your Store</h2>

  <div class="relative w-full aspect-square rounded-2xl overflow-hidden shadow-md mb-6 bg-gray-50 transition-all duration-300 group"
       [ngStyle]="{'background-color': selectedDesign.bgColorStyle}">
    
    <img *ngIf="selectedDesign.artworkSrc" 
         [src]="selectedDesign.artworkSrc" 
         alt="Background Pattern"
         class="absolute inset-0 w-full h-full object-cover z-0 transition-transform duration-700 group-hover:scale-105">

    <div class="relative z-10 h-full flex flex-col items-center justify-center p-8">
      
      <div class="p-3 bg-white/30 backdrop-blur-md rounded-2xl shadow-sm border border-white/40" *ngIf="qrCodeDataUrl">
        <img [src]="qrCodeDataUrl" alt="QR Code" class="w-[32rem] h-[32rem] rounded-xl"/>
      </div>

      <p *ngIf="error" class="text-white bg-red-500 px-3 py-1 rounded-full text-sm mt-4">{{ error }}</p>
    </div>
  </div>


  <div class="mb-6">
    <p class="text-xs uppercase tracking-wider text-gray-500 mb-3 font-bold ml-1">Select Theme</p>
    
    <div class="flex overflow-x-auto space-x-3 pb-2 scrollbar-hide snap-x px-1">
      <button *ngFor="let design of designs" 
              (click)="selectDesign(design)"
              class="flex-shrink-0 w-16 h-16 rounded-xl border-2 snap-start transition-all duration-200 overflow-hidden relative"
              [ngClass]="selectedDesign.id === design.id ? 'border-cusbg-customBlue scale-110 ring-2 ring-blue-100 shadow-md' : 'border-gray-200 opacity-70 hover:opacity-100'">
        
        <img *ngIf="design.artworkSrc" [src]="design.artworkSrc" class="absolute inset-0 w-full h-full object-cover">
        <div *ngIf="!design.artworkSrc" class="absolute inset-0 w-full h-full" [style.background]="design.bgColorStyle"></div>

      </button>
    </div>
     <p class="text-center text-sm text-gray-600 mt-2">{{selectedDesign.name}}</p>
  </div>

  <div class="grid grid-cols-2 gap-3 mb-6">
    <div class="relative group">
  <button (click)="toggleShareMenu()" 
          class="w-full flex items-center justify-center gap-2 px-4 py-3.5 bg-customBlue text-white rounded-2xl font-bold hover:bg-customBlueHover transition-all shadow-lg shadow-blue-200 active:scale-95">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
    </svg>
    Share
  </button>

  <div *ngIf="showShareMenu" 
       class="absolute bottom-full mb-2 left-0 w-full bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden z-50 animate-in fade-in slide-in-from-bottom-2 duration-200">
    <button (click)="shareTextLink()" class="w-full text-left px-4 py-3 hover:bg-gray-50 flex items-center gap-3 text-gray-700 border-b border-gray-50">
      <span class="text-xl">🔗</span>
      <div class="flex flex-col">
        <span class="font-bold text-sm">Share Link</span>
        <span class="text-xs text-gray-400">Send the store URL</span>
      </div>
    </button>
    <button (click)="shareQRCode()" class="w-full text-left px-4 py-3 hover:bg-gray-50 flex items-center gap-3 text-gray-700">
      <span class="text-xl">🖼️</span>
      <div class="flex flex-col">
        <span class="font-bold text-sm">Share Image</span>
        <span class="text-xs text-gray-400">Send the QR Design</span>
      </div>
    </button>
  </div>
</div>

<div *ngIf="showShareMenu" (click)="toggleShareMenu()" class="fixed inset-0 z-40"></div>

    <button (click)="downloadQRCode()" 
            class="flex items-center justify-center gap-2 px-4 py-3.5 bg-gray-50 border-2 border-gray-200 text-gray-700 rounded-2xl font-bold hover:bg-gray-100 transition-all active:scale-95">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
      </svg>
      Save Image
    </button>
  </div>

  <div class="text-center border-t pt-4">
    <button (click)="regenerateQRCode()" class="flex items-center justify-center mx-auto gap-1 text-sm font-medium text-gray-600 hover:text-customGreen transition-colors">
       <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      Regenerate New Link
    </button>
  </div>
</div>
