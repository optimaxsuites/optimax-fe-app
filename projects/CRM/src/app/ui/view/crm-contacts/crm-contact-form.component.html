<div class="form-dialog">
  <h2 mat-dialog-title>{{ isEdit ? 'Edit Contact' : 'New Contact' }}</h2>

  <mat-dialog-content [formGroup]="form">
    <div class="form-section-label">Basic Info</div>
    <div class="form-row">
      <label class="form-field">First Name *<input formControlName="firstName"></label>
      <label class="form-field">Last Name *<input formControlName="lastName"></label>
    </div>
    <div class="form-row">
      <label class="form-field">Email<input formControlName="email" type="email"></label>
      <label class="form-field">Phone<input formControlName="phone"></label>
    </div>
    <div class="form-row">
      <label class="form-field">WhatsApp<input formControlName="whatsapp"></label>
      <label class="form-field">LinkedIn URL<input formControlName="linkedinUrl"></label>
    </div>

    <div class="form-section-label">Work</div>
    <div class="form-row">
      <label class="form-field">Job Title<input formControlName="jobTitle"></label>
      <label class="form-field">Company Name<input formControlName="companyName"></label>
    </div>
    <div class="form-row">
      <label class="form-field">Contact Type
        <select formControlName="contactType">
          <option *ngFor="let t of typeOptions" [value]="t">{{ t }}</option>
        </select>
      </label>
      <label class="form-field">Lead Source
        <select formControlName="leadSource">
          <option *ngFor="let s of sourceOptions" [value]="s">{{ s }}</option>
        </select>
      </label>
    </div>

    <div class="form-section-label">Location</div>
    <div class="form-row">
      <label class="form-field">City<input formControlName="city"></label>
      <label class="form-field">State<input formControlName="state"></label>
    </div>
    <label class="form-field full-width">Address<textarea formControlName="address" rows="2"></textarea></label>

    <div class="form-section-label">Government IDs</div>
    <div class="form-row">
      <label class="form-field">NIN<input formControlName="nin"></label>
      <label class="form-field">BVN<input formControlName="bvn"></label>
      <label class="form-field">TIN<input formControlName="tin"></label>
    </div>

    <div class="form-section-label">Tags & NDPA</div>
    <label class="form-field full-width">Tags (comma separated)<input formControlName="tags"></label>
    <label class="checkbox-row">
      <input type="checkbox" formControlName="ndpaConsent">
      NDPA 2023 Consent Obtained
    </label>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button class="btn outline" mat-dialog-close>Cancel</button>
    <button class="btn primary" (click)="save()" [disabled]="saving">
      <mat-icon *ngIf="saving">hourglass_empty</mat-icon>
      {{ isEdit ? 'Update' : 'Create' }}
    </button>
  </mat-dialog-actions>
</div>
