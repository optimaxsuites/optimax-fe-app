<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-[60] p-4">
  <div class="bg-white rounded-lg w-full max-w-3xl max-h-[90vh] overflow-hidden flex flex-col">
    <div class="flex-none p-4 border-b border-gray-200">
      <div class="flex items-center space-x-2">
        <div class="relative flex-grow">
          <input type="text" placeholder="Search for a location..." [(ngModel)]="searchQuery"
            (keyup.enter)="searchLocation()" (focus)="showSearchResults = searchResults.length > 0"
            (blur)="hideSearchResultsDelayed()"
            class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="currentColor"
            viewBox="0 0 20 20">
            <path fill-rule="evenodd"
              d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
              clip-rule="evenodd" />
          </svg>
          <button *ngIf="searchQuery" (click)="clearSearch()"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd"
                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                clip-rule="evenodd" />
            </svg>
          </button>
        </div>
        <button (click)="useCurrentLocation()"
          class="flex-none px-2 py-1 rounded-full bg-blue-100 text-blue-700 hover:bg-blue-200 transition-colors"
          title="Use current location">
          <i class="fa-solid fa-location-crosshairs text-lg text-gray-600"></i>

        </button>
      </div>
      <div *ngIf="searchResults.length > 0 && showSearchResults"
        class="absolute left-0 right-0 bg-white border border-gray-300 rounded-lg shadow-xl mt-1 z-[1000] max-h-60 overflow-y-auto">
        <ul class="divide-y divide-gray-200">
          <li *ngFor="let result of searchResults" (mousedown)="selectSearchResult(result)"
            class="p-3 hover:bg-gray-100 cursor-pointer text-sm flex items-start">
            <i class="fa-solid fa-location-dot mt-1 mr-2 text-gray-400"></i>
            <span>{{ result.display_name }}</span>
          </li>
        </ul>
      </div>
    </div>

    <div id="map" class="flex-1 w-full" style="min-height: 400px; height: 400px;"></div>

    <div class="flex-none flex items-center justify-end space-x-3 p-4 border-t border-gray-200">
      <button (click)="confirmLocation()"
        class="px-6 py-2 bg-blue-600 text-white font-medium rounded-full hover:bg-blue-700 transition-colors">
        Done
      </button>
    </div>
  </div>
</div>
