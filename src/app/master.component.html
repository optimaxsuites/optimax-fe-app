<!-- dami just modified this to support the upgraded enterprise header and shell layout. -->
<div
    class="master-container d-flex"
    [class.mobile-sidebar-open]="!sidebarHidden && isMobileViewport()"
>
    <button
        *ngIf="!sidebarHidden && isMobileViewport()"
        type="button"
        class="mobile-sidebar-backdrop"
        (click)="toggleSidebar()"
        aria-label="Close navigation"
    ></button>

    <div
        class="sidebar-container"
        [ngClass]="{
            'min-w-[13%]': !sidebarHidden && !isMobileViewport(),
            'mobile-open': !sidebarHidden && isMobileViewport()
        }"
    >
        <app-sidebar2 [sidebarHidden]="sidebarHidden"   (toggleSidebar)="toggleSidebar()"></app-sidebar2>
      
      
    </div>
  
    <div class="main-container">
        <div class="navbar-container">
            <app-navbar [sidebarHidden]="sidebarHidden" (toggleSidebar)="toggleSidebar()"></app-navbar>
        </div>
        <div class="main">
            <router-outlet></router-outlet>
        </div>
        <app-dashboard-footer></app-dashboard-footer>
    </div>
</div>
