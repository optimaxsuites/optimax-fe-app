    <div class="flex items-center justify-center max-h-screen">
      <form
        [formGroup]="appraisalForm"
        class="space-y-8 flex flex-col gap-10 px-8 py-6 w-full max-w-6xl rounded-md"
        (ngSubmit)="sendAppraisal()"
      >
        <div
          *ngIf="isAppraisalVisible && selectedAppraisal"
          class="p-4 bg-gray-50"
        >
          <div
            *ngIf="selectedAppraisal.instructionText"
            class="mb-4 p-3 bg-blue-100 rounded"
          >
            <h3 class="font-semibold text-customBlue mb-2">Instructions</h3>
            <p class="text-customBlue">
              {{ selectedAppraisal.instructionText }}
            </p>
          </div>
        </div>

        <div class="w-full">
          <div class="mb-3">
            <label class="mb-2 text-lg font-semibold"
              >Employee Name
              <i class="fas fa-asterisk text-red-500 text-sm ml-1"></i
            ></label>
            <ng-select
              [items]="employees"
              formControlName="employeeName"
              bindLabel="name"
              bindValue="id"
              placeholder="Select Employee"
            ></ng-select>
          </div>

          <div class="mb-3">
            <label class="mb-2 text-lg font-semibold"
              >Assessment Cycle
              <i class="fas fa-asterisk text-red-500 text-sm ml-1"></i
            ></label>
            <select
              formControlName="assessment"
              class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-200"
            >
              <option *ngFor="let cycle of assessmentCycles" [value]="cycle">
                {{ cycle }}
              </option>
            </select>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div class="mb-3">
              <label class="mb-2 text-lg font-semibold"
                >Period <i class="fas fa-asterisk text-red-500 text-sm ml-1"></i
              ></label>
              <select
                formControlName="period"
                class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-200"
              >
                <option *ngFor="let period of periods" [value]="period">
                  {{ period }}
                </option>
              </select>
            </div>

            <div class="mb-3">
              <label class="mb-2 text-lg font-semibold"
                >Due Date
                <i class="fas fa-asterisk text-red-500 text-sm ml-1"></i
              ></label>
              <input
                type="date"
                formControlName="dueDate"
                class="w-full px-4 py-3 border border-gray-300 rounded-md transition duration-200"
              />
            </div>
          </div>
          <div class="mt-4 flex justify-end">
            <button
              (click)="sendAppraisal()"
              class="px-5 py-3 bg-green-600 text-[14px] text-white rounded-md hover:bg-green-700 transition duration-200"
            >
              Save Appraisal
            </button>
          </div>
        </div>

        <div
          *ngIf="isAppraisalVisible && selectedAppraisal"
          class="p-4 bg-gray-50"
        >
          <h2 class="text-2xl font-bold mb-4">Appraisal Questions</h2>

          <div
            *ngFor="
              let section of selectedAppraisal.sections;
              let sectionIndex = index
            "
            class="mb-6"
          >
            <h3 class="text-xl font-semibold mb-3">
              Section {{ getSectionLabel(sectionIndex) }}:
              {{ section.sectionTitle }}
            </h3>

            <div
              *ngFor="
                let question of section.questions;
                let questionIndex = index
              "
              class="mb-4"
            >
              <p class="mb-2">
                <strong>{{ questionIndex + 1 }}.</strong> {{ question.text }}
              </p>
              <textarea
                [(ngModel)]="question.answer"
                rows="4"
                class="w-full rounded-md border-gray-300 shadow-sm"
                placeholder="Enter your answer..."
              ></textarea>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
