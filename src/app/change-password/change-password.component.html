   <div class="change-password-container">
  <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Change Password</h2>
  <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()" class="mx-auto bg-white rounded-2xl w-full space-y-6 px-6 py-8">
    <div class="space-y-2">
    <label class="block text-md font-semibold text-gray-700">Current Password</label>
    <input  type="password" formControlName="currentPassword" placeholder="Enter current password"
            class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl
                    focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all duration-200"/>
                    </div>
<div class="space-y-2">

    <label class="block text-md font-semibold text-gray-700">New Password</label>
    <input type="password" formControlName="newPassword" placeholder="Enter new password"
            class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl
                    focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all duration-200"/>
    </div>

    <div class="space-y-2">
    <label class="block text-md font-semibold text-gray-700">Confirm New Password</label>
    <input type="password" formControlName="confirmPassword" placeholder="Confirm new password"
              class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl
                      focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all duration-200">
</div>

<div class="flex justify-center pt-4">
    <button type="submit"
                class="bg-customBlue text-white font-semibold px-6 py-2 rounded-xl hover:bg-customBlueHover"[disabled]="changePasswordForm.invalid">
      Update Password
    </button>
    </div>
  </form>
</div>
