<div class="main h-screen">
    <div class="h-[90%] flex flex-col items-center justify-center text-center bg-white px-6">
    <h1 class="text-[120px] font-extrabold text-[#2EB270] leading-none">404</h1>
    <h2 class="text-3xl font-semibold text-[#2E6276] mb-4">Page Not Found</h2>
    <p class="text-gray-600 max-w-md mb-6">
      Sorry, the page you are looking for doesn’t exist or has been moved.
    </p>
    <a
       (click)="goBack()"
      class="inline-block px-6 py-3 bg-[#2EB270] text-white rounded-xl text-sm font-medium hover:bg-[#24935d] transition"
    >
      Go Back
    </a>
  </div>
  <div class="footer">
    <app-footer></app-footer>
  </div>
</div>
