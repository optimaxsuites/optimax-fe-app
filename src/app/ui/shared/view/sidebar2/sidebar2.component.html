<nav class="sidebar rounded-r-3xl" [ngClass]="sidebarClass">
  <div class="side-bar-header" *ngIf="!sidebarHidden">
    <img src="assets/logo.png" alt="Logo" class="logo" />
  </div>
  <div class="toggle-wrapper" [ngClass]="{
    'max-w-full mx-auto  pl-8 my-3': sidebarHidden,
    'absolute -right-4 top-14 z-[100]': !sidebarHidden
  }">
    <button class="toggle-btn text-xl h-9 w-9 rounded-full text-white" (click)="onToggleSidebar()">
      <i *ngIf="sidebarHidden" class="pi pi-angle-right text-xl"></i>
      <i *ngIf="!sidebarHidden" class="pi pi-angle-left text-xl"></i> 
      <!-- <i *ngIf="!sidebarHidden" class="pi pi-times"></i>  -->
    </button>
  </div>
  <ul id="dashboard-header" class="menu-list">
    <li *ngFor="let item of menuItems | async as menuItems">
      <div class="menu-item w-full" (click)="toggleSubMenu(item, menuItems)">
        <a *ngIf="!item.submenu"
           [routerLink]="item.route"
           (click)="onNavigate()"
           routerLinkActive="active"
           class="menu-link flex gap-6 items-center w-full cursor-pointer"
           [pTooltip]="item.label"
   tooltipPosition="right"
   [tooltipDisabled]="!sidebarHidden"
           [routerLinkActiveOptions]="{ exact: true }">
          <i *ngIf="item.icon" [class]="item.icon"  [ngClass]="{' text-xl': !sidebarHidden, 'w-full mx-auto text-2xl': sidebarHidden}"></i>  
          <span *ngIf="!sidebarHidden">{{ item.label }}</span>
        </a>

        <a 
          class="menu-link flex gap-6 items-center cursor-pointer"
          [pTooltip]="item.label"
          tooltipPosition="right"
          [tooltipDisabled]="!sidebarHidden"
          *ngIf="item.submenu">
          <i *ngIf="item.icon"[ngClass]="{' text-xl': !sidebarHidden, 'w-full mx-auto text-2xl flex gap-1': sidebarHidden}" [class]="item.icon">
          <div *ngIf="sidebarHidden"> &#9662;</div>

          </i>
          <span *ngIf="!sidebarHidden">{{ item.label }} &#9662;</span>

        </a>
      </div>

      <ul class="submenu-list" [ngClass]="{'open': item.open}" *ngIf="item.submenu">
        <ng-container *ngFor="let subItem of item.submenu">
          <li *ngIf="!subItem.isNotSidebarItem">
      
            <a [routerLink]="subItem.route"
               (click)="onNavigate()"
               routerLinkActive="active"
               [routerLinkActiveOptions]="{ exact: true }"
               [pTooltip]="subItem.label"
               tooltipPosition="right"
               [tooltipDisabled]="!sidebarHidden"
               class="submenu-link flex gap-4 items-center">
              <i *ngIf="subItem.icon"[ngClass]="{' text-xl': !sidebarHidden, 'w-full mx-auto text-2xl': sidebarHidden}" [class]="subItem.icon"></i> 
              <span *ngIf="!sidebarHidden">{{ subItem.label }}</span>
            </a>
          </li>
        </ng-container>
      </ul>
    </li>

    <li *ngIf="isSuperUser()" id="side-nav-inventory">
      <div class="menu-item">
        <a 
          [routerLink]="marketplace.route"
          (click)="onNavigate()"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          [pTooltip]="marketplace.label"
          tooltipPosition="right"
          [tooltipDisabled]="!sidebarHidden"
          class="menu-link flex gap-4 items-center">
          <i *ngIf="marketplace.icon"[ngClass]="{' text-xl': !sidebarHidden, 'w-full mx-auto text-2xl': sidebarHidden}"   [class]="marketplace.icon"></i>
          <span *ngIf="!sidebarHidden">{{ marketplace.label }}</span>
        </a>
      </div>
    </li>


    <li *ngIf="showAdminUI" id="side-nav-inventory">
      <div class="menu-item">
        <a 
          [routerLink]="tenant.route"
          (click)="onNavigate()"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          [pTooltip]="tenant.label"
          tooltipPosition="right"
          [tooltipDisabled]="!sidebarHidden"
          class="menu-link flex gap-4 items-center">
          <i *ngIf="tenant.icon"[ngClass]="{' text-xl': !sidebarHidden, 'w-full mx-auto text-2xl': sidebarHidden}"   [class]="tenant.icon"></i>
          <span *ngIf="!sidebarHidden">{{ tenant.label }}</span>
        </a>
      </div>
    </li>
  </ul>
</nav>
