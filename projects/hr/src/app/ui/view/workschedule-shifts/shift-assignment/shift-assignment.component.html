<div class="assignment-container">

  <div class="card">

    <!--<h3>Assign Employee to Shift</h3>-->

    <div class="modal-backdrop" (click)="cancel()"></div>
<div class="modal-container">
  <div class="modal-card">
    <button class="close-btn" (click)="cancel()">×</button>
    <h3>Assign Employee to shift</h3>
        <form [formGroup]="assignmentForm" (ngSubmit)="assignShift()">

      <div class="form-grid">

        <!-- EMPLOYEE -->
        <div class="form-group">
          <label>Employee</label>

          <select formControlName="employeeId">
            <option value="">Select Employee</option>

            <option
              *ngFor="let employee of employees"
              [value]="employee.id"
            >
              {{ employee.name }}
            </option>

          </select>
        </div>

        <!-- SHIFT -->
        <div class="form-group">
          <label>Shift</label>

          <select formControlName="shiftId">
            <option value="">Select Shift</option>

            <option
              *ngFor="let shift of shifts"
              [value]="shift.id"
            >
              {{ shift.name }}
              ({{ shift.startTime }} - {{ shift.endTime }})
            </option>

          </select>
        </div>

        <!-- DATE -->
        <div class="form-group">
          <label>Date</label>
          <input type="date" formControlName="date" />
        </div>

      </div>

      <!-- CONFLICT MESSAGE -->
      <div class="conflict" *ngIf="conflictMessage">
        ⚠ {{ conflictMessage }}
      </div>

      <!-- ACTION BUTTON -->
      <div class="actions">
        <button
          type="submit"
          class="assign-btn"
          [disabled]="assignmentForm.invalid || conflictMessage"
        >
          Assign Shift
        </button>
      </div>
    </form>
  </div>
</div>

    <div
  class="existing-card"
  *ngIf="assignmentForm.value.employeeId && assignmentForm.value.date"
>

  <h4>Existing Assignments ({{ assignmentForm.value.date }})</h4>

  <div
    class="assignment-row"
    *ngFor="let assignment of existingAssignments"
  >

    <span
      class="shift-dot"
      [style.background]="assignment.color"
    ></span>

    <span class="shift-name">
      {{ assignment.name }}
    </span>

    <span class="shift-time">
      {{ assignment.startTime }} – {{ assignment.endTime }}
    </span>
  </div>
    <!-- PLACEHOLDER -->
    <div
    class="empty-placeholder"
    *ngIf="existingAssignments.length === 0"
  >
    No shifts assigned for this date
  </div>

</div>
  </div>
</div>
