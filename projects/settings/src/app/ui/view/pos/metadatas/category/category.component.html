  <div class="">
    <!-- Header -->
    <!-- <div class="flex justify-between items-center h-auto mb-6">
      <h2 class="text-xl font-bold text-gray-800">Categories</h2>
     
    </div> -->

    <!-- Add Category Form -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 py-5 px-4 mb-6">
      <h3 class="text-md font-medium text-gray-700 mb-4 pb-2 border-b">
        Add New Category
      </h3>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        <!-- Category Name -->
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700 mb-1">
            Category Name <span class="text-red-500">*</span>
          </label>
          <input
            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-customBlue focus:border-customBlue"
            [(ngModel)]="productCategory.name" placeholder="Enter category name" id="name" type="text"/>
        </div>

        <!-- Category Expiration Date -->
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700 mb-1">
            Expires On
          </label>
          <input
            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-customBlue focus:border-customBlue"
            [(ngModel)]="productCategory.endDate" placeholder="Set the expiry date" id="name" type="date" />
        </div>

        <!-- Category Code -->
        <div>
          <label for="code" class="block text-sm font-medium text-gray-700 mb-1">
            Category Code <span class="text-red-500">*</span>
          </label>
          <input
            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-customBlue focus:border-customBlue"
            [(ngModel)]="productCategory.code" placeholder="Enter category code" id="code" />
        </div>
      </div>

      <!-- Description -->
      <div class="mb-4">
        <label for="description" class="block text-sm font-medium text-gray-700 mb-1">
          Description
        </label>
        <textarea
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-customBlue focus:border-customBlue"
          rows="3" [(ngModel)]="productCategory.description" placeholder="Enter category description"
          id="description"></textarea>
      </div>

      <!-- Submit Button -->
      <div class="flex justify-end mt-4">
        <button
          class="px-6 py-2 bg-customBlue text-white rounded-lg hover:bg-customBlue transition flex items-center gap-2"
          (click)="addCategory()">
          <i class="fa-solid fa-plus"></i> Add Category
        </button>
      </div>
    </div>

    <!-- Categories List -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 py-5 px-4">
      <h3 class="text-md font-medium text-gray-700 mb-4 pb-2 border-b">
        Existing Categories
      </h3>

      <div *ngIf="categories.length === 0" class="text-center py-4 text-gray-500">
        No categories found. Create your first category above.
      </div>

      <ul *ngIf="categories.length > 0" class="divide-y divide-gray-200">
        <li *ngFor="let category of categories" class="py-3 flex justify-between items-center">
          <div class="flex items-center">
            <div class="h-8 w-8 bg-customBlue/50 text-customBlue rounded-full flex items-center justify-center mr-3">
              <i class="fa-solid fa-folder"></i>
            </div>
            <span class="font-medium text-gray-700">{{ category.name }}</span>
          </div>
          <button class="text-red-500 hover:text-red-700 transition" (click)="removeCategory(category.id)">
            <i class="fa-solid fa-trash"></i>
          </button>
        </li>
      </ul>
    </div>
  </div>
