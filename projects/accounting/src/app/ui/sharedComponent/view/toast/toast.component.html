<div class="fixed top-4 right-4 z-[9999] flex flex-col gap-3 pointer-events-none w-80" [@listAnimation]>
  <div *ngFor="let toast of toasts; trackBy: trackByToast"
       class="pointer-events-auto flex w-full max-w-sm overflow-hidden rounded-xl border-l-4 shadow-lg transition-all duration-300 transform bg-white"
       [ngClass]="getSeverityClasses(toast.severity)">
    
    <div class="flex items-start p-4 w-full">
      <div class="flex-shrink-0">
        <i class="text-2xl" [ngClass]="getIcon(toast.severity) + ' ' + {
          'text-emerald-500': toast.severity === 'success',
          'text-rose-500': toast.severity === 'error',
          'text-amber-500': toast.severity === 'warn',
          'text-sky-500': toast.severity === 'info'
        }"></i>
      </div>
      
      <div class="ml-3 flex-1 pt-0.5">
        <p class="text-sm font-bold uppercase tracking-wide opacity-90" *ngIf="toast.summary">
          {{ toast.summary }}
        </p>
        <p class="mt-1 text-sm font-medium leading-relaxed">
          {{ toast.detail }}
        </p>
      </div>
      
      <div class="ml-4 flex flex-shrink-0">
        <button type="button" 
                (click)="remove(toast)"
                class="inline-flex rounded-md p-1 hover:bg-black/5 transition-colors focus:outline-none">
          <i class="pi pi-times text-lg opacity-60"></i>
        </button>
      </div>
    </div>

    <!-- Progress bar -->
    <div class="absolute bottom-0 left-0 h-1 bg-black/10 transition-all ease-linear"
         [style.width.%]="100"
         [ngStyle]="{'animation': 'progress ' + toast.life + 'ms linear forwards'}">
    </div>
  </div>
</div>

<style>
  @keyframes progress {
    from { width: 100%; }
    to { width: 0%; }
  }
</style>
