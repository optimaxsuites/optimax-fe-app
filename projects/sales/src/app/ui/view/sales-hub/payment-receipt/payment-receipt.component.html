<div class="prc-overlay">
  <div class="prc-container">

    <div class="prc-toolbar prc-no-print">
      <button type="button" class="prc-back" (click)="close()"><i class="fas fa-arrow-left"></i> Back</button>
      <div class="prc-actions">
        <button type="button" class="prc-btn" [disabled]="!receipt" (click)="openEmail()"><i class="fas fa-paper-plane"></i> Email Receipt</button>
        <button type="button" class="prc-btn" [disabled]="!receipt" (click)="printReceipt()"><i class="fas fa-print"></i> Print</button>
        <button type="button" class="prc-btn prc-btn--primary" [disabled]="!receipt || isDownloading" (click)="downloadPDF()">
          <i class="fas" [class.fa-download]="!isDownloading" [class.fa-spinner]="isDownloading" [class.fa-spin]="isDownloading"></i>
          {{ isDownloading ? 'Generating…' : 'Download PDF' }}
        </button>
        <button type="button" class="prc-close" (click)="close()" aria-label="Close"><i class="fas fa-times"></i></button>
      </div>
    </div>

    <div class="prc-state" *ngIf="isLoading"><i class="fas fa-circle-notch fa-spin"></i> Preparing receipt…</div>

    <div class="prc-state" *ngIf="!isLoading && !receipt">
      <i class="fas fa-exclamation-triangle"></i> The receipt for this payment could not be found.
    </div>

    <div class="prc-paper prc-print-area" *ngIf="!isLoading && receipt">
      <app-sales-document elementId="receipt-sheet" [doc]="receipt" [template]="template"></app-sales-document>
    </div>
  </div>
</div>

<app-send-email-modal *ngIf="showEmailModal && receipt"
  title="Send Receipt by Email"
  documentLabel="receipt"
  [documentNumber]="receipt.number"
  [recipientName]="receipt.to.name"
  [sending]="isEmailing"
  [(subject)]="emailSubject"
  [(message)]="emailMessage"
  (send)="sendEmail()"
  (dismiss)="showEmailModal = false">
</app-send-email-modal>
