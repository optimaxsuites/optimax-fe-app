<div class="container-fluid">
  <div class="container-header">
    <h2>Category: {{ categoryFilter }}</h2>
  </div>
  <section class="selectClients">
    <div class="asd">
      <div class="top-products-container">
        <div class="top-products">
          <div class="top-products-table-container">
            <table class="top-products-table w3-table w3-striped">
              <thead>
                <tr class="top-products-table-row">
                  <th class="top-products-table-head checkbox"></th>
                  <th class="top-products-table-head col-1">Name</th>
                  <th class="top-products-table-head col-1">Contact</th>
                  <th class="top-products-table-head col-1">Phone Number</th>
                  <th class="top-products-table-head col-1">Email</th>
                  <th class="top-products-table-head col-1">Category</th>
                  <th class="top-products-table-head col-1">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr
                  class="top-products-table-row"
                  *ngFor="let vendor of filteredVendorList"
                >
                  <td class="top-products-table-data">
                    <input type="checkbox" class="check" />
                  </td>
                  <td class="top-products-table-data">
                    {{ vendor.individualVendorName }}
                  </td>
                  <td class="top-products-table-data">
                    {{ vendor.individualVendorContactPerson }}
                  </td>
                  <td class="top-products-table-data">
                    {{ vendor.individualVendorNumber }}
                  </td>
                  <td class="top-products-table-data">
                    {{ vendor.individualVendorEmail }}
                  </td>
                  <td class="top-products-table-data">
                    {{ vendor.categoryType }}
                  </td>
                  <td class="top-products-table-data col-1">
                    <div class="actionDiv">
                      <div class="image-container">
                        <img
                          (click)="viewVendor(vendor)"
                          class="actionTags"
                          src="../../../assets/view.svg"
                          alt="View"
                        />
                        <span class="tooltip">View</span>
                      </div>
                      <div class="image-container">
                        <img
                          class="actionTags"
                          src="../../../assets/Edit.svg"
                          alt="Edit"
                        />
                        <span class="tooltip">Edit</span>
                      </div>
                      <div class="image-container">
                        <img
                          class="actionTags"
                          src="../../../assets/delete (1).svg"
                          alt="Delete"
                        />
                        <span class="tooltip">Delete</span>
                      </div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
