<div *ngIf="showRecruitmentList">
    <div class="card">
      <p-toolbar styleClass="mb-4 gap-2">
        <ng-template pTemplate="left">
          <!-- <app-button text="Delete" class="btn-delete"></app-button> -->
        </ng-template>
  
        <ng-template pTemplate="right">
            <app-button text="Add New" class="btn-navigate" (click)="openForm()"></app-button>
        </ng-template>
      </p-toolbar>

      <hr>

      <div class="list-card-container">

        <div  class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8 " > 

            <div *ngFor="let job of jobpostings; let i = index" class=" bg-gray-50 transition ease-linear hover:scale-105 hover:border-2 text-customBlue rounded-xl flex flex-col w-[50%] p-2 editInput" >
                <div class="list-card-wrapper">
                    <div class="list-card-right">
                        <h2><strong>{{job.title}}</strong></h2>
                        <p> <i class="pi pi-map-marker table-item me-2 "></i> {{job.location}}</p>
                        <p> <i class="pi pi-clock table-item me-2"></i> {{job.employmentType}}</p>
                        <!-- <p> <i class="pi pi-clock"></i> {{job.category}}</p> -->
                        <p> <i class="pi pi-calendar-clock table-item me-2"></i> {{job.postedDate}}</p>
                        <p> <i class="pi pi-calendar-times table-item me-2"></i> {{job.expiryDate}}</p>
                    </div>
                    <div class="list-card-left">
                        <div class="flex space-x-2 mt-2">
                            <button pButton icon="pi pi-pencil table-item" (click)="editJob(job)" class="p-button-rounded p-button-info" title="Edit"></button>
                            <button pButton icon="pi pi-trash table-item" (click)="deleteJob(i)" class="p-button-rounded p-button-danger" title="Delete"></button>
                        </div>
                    </div>
                </div>
                <!-- <div class="editInput" style="width: 700px; height: 400px; overflow-y: scroll; font-size: 14px;" [innerHTML]="safeHtmlDescriptions[i]"></div> -->
            </div>
        </div>

        <div *ngIf="jobpostings.length == 0" class="input-container-100 nothing">
            <span>
                no Job posting yet
            </span>
        </div>
      </div>
    </div>
</div>

<div *ngIf="showRecruitmentForm">
     <app-recuitment-form [jobData]="activeItem" (back)="close()" (submitFrom)="createJob()" (isEdit)="isEdit"></app-recuitment-form>
</div>
