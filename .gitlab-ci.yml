# ─────────────────────────────────────────────────────────────────────────────
# OptimaX Frontend — GitLab CI/CD
# test branch → build + publish dist + docker build/push + deploy to test server (Docker, manual)
# prod branch → build + publish dist + docker build/push + deploy to prod     (Kubernetes, manual)
# ─────────────────────────────────────────────────────────────────────────────

stages:
  - build
  - publish
  - deploy

default:
  tags:
    - optimax_runner

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

build-frontend:
  stage: build
  image: node:20-alpine
  cache:
    key: "${CI_COMMIT_REF_SLUG}-node"
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run build -- --configuration production
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "test" || $CI_COMMIT_BRANCH == "prod"'

build-and-push:
  stage: build
  image: docker:26
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
                   -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "test" || $CI_COMMIT_BRANCH == "prod"'

publish-dist:
  stage: publish
  image: alpine:3.19
  needs: [build-frontend]
  script:
    - apk add --no-cache curl
    - tar -czf frontend-dist.tar.gz -C dist .
    - |
      curl --fail --silent \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file frontend-dist.tar.gz \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/frontend/${CI_COMMIT_REF_SLUG}/frontend-dist.tar.gz"
  rules:
    - if: '$CI_COMMIT_BRANCH == "test" || $CI_COMMIT_BRANCH == "prod"'

deploy-test:
  stage: deploy
  image: alpine:3.19
  needs: [build-and-push]
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$MOD_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$MOD_DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - |
      ssh "$MOD_DEPLOY_USER@$MOD_DEPLOY_HOST" "
        set -e
        cd $MOD_DEPLOY_PATH
        docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
        docker pull $CI_REGISTRY_IMAGE:test
        docker compose up -d --no-build frontend
        docker image prune -f
      "
  environment:
    name: test
  tags:
    - optimax_runner
  rules:
    - if: '$CI_COMMIT_BRANCH == "test"'
      when: manual

deploy-prod:
  stage: deploy
  image: bitnami/kubectl:latest
  needs: [build-and-push]
  before_script:
    - echo "$KUBECONFIG" > /tmp/kubeconfig.yaml
    - export KUBECONFIG=/tmp/kubeconfig.yaml
  script:
    - kubectl set image deployment/frontend frontend="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -n optimax
    - kubectl rollout status deployment/frontend -n optimax
  environment:
    name: production
  tags:
    - optimax_prod_runner
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: manual
