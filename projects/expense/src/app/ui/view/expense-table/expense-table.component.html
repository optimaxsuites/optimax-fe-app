<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">


<p-confirmDialog header="Confirm Deletion" icon="pi pi-exclamation-triangle" styleClass="custom-confirm-dialog"></p-confirmDialog>
<p-toast></p-toast>
<div class="table-container">
  <div class="container-header">
    <!-- Optionally, add a header or title here -->
  </div>

  <div class="card">
    <p-toolbar styleClass="mb-4 gap-2">
      <ng-template pTemplate="left">
        <app-button text="Delete"  class="btn-delete"></app-button>
      </ng-template>

      <ng-template pTemplate="right">
        <app-button text="Add New" (btnClick)="navigateToForm()"  class="flex items-center gap-2 btn-navigate">
          <span class="material-symbols-outlined">
            add
            </span>
        </app-button>
        <div class="relative inline-block">
          <app-button text="Request" (btnClick)="navigateToexpense()" class="flex items-center gap-2 btn-export">
            <span class="material-symbols-outlined">forum</span>
          </app-button>
        
          <div class="absolute -top-4 -right-1 bg-red-500 text-white text-lg w-8 h-8 flex items-center justify-center rounded-full">
            3
          </div>
        </div>

        
      </ng-template>
    </p-toolbar>

    <div class="search-bar">
      <input 
        type="text" 
        placeholder="Search by Merchant, Amount, or ID" 
        [(ngModel)]="searchTerm"
        (input)="onSearchInputChange()" 
        class="search-input"
      />
    </div>


    <div class="table-container ml-5 mr-5">


      <p-table 
      [value]="filteredExpenses" 
      [paginator]="true" 
      styleClass="p-datatable-striped" 
      [tableStyle]="{'min-height': 'fit-content', 'max-height': '650px'}"
      [rows]="15">
      
      <!-- Header -->
      <ng-template pTemplate="header"  >
        <tr>
          <th style="width: 4rem"><p-tableHeaderCheckbox /></th>
          <th class="table-item">Date</th>
          <th class="table-item">Expense</th>
          <th class="table-item">Merchant</th>
          <th class="table-item">Category</th>
          <th class="table-item">Amount</th>
          <th class="table-item">Status</th>
          <th class="table-item">Actions</th>
        </tr>
      </ng-template>
    
      <!-- Body Rows -->
      <ng-template pTemplate="body" let-expense>
        <tr>
          <td><p-tableCheckbox [value]="expense" /></td>
          <td class="table-item">{{ expense.eventDate }}</td>
          <td class="table-item">{{ expense.name }}</td>
          <td class="table-item">{{ expense.merchant }}</td>
          <td class="table-item">
            <div class="rounded-[50px] w-44 py-2 pl-4" [style.background-color]="generateRandomColor()">
              {{ expense.category }}
            </div>
          </td>
          <td class="table-item">{{ expense.amount }}</td>
          <td class="table-item">
            <span class="status-content">
              <span class="material-symbols-outlined">schedule</span>
              {{ expense.status }}
            </span>
          </td>
          <td class=" table-item">
            <span class="material-icons table-item" (click)="viewExpenseApproval(expense)">visibility</span>
            <span class="material-icons table-item" (click)="editExpense(expense)">edit</span>
            <span class="material-icons table-item" (click)="confirmDelete(expense)">cancel</span>
          </td>
          
        </tr>
      </ng-template>
    
      <!-- Empty Message -->
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="8">
            <div class="empty-background">
              <span class="material-symbols-outlined icon-style">assignment_add</span>
              <div>No expense added yet.</div>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
    
  </div>
  </div>
</div>
