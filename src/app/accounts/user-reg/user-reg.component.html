                    <div class="input-wrapper">
                        <div class="input-width-1">
                            <label for="firstname">First Name</label><br>
                            <!-- <input type="text" id="first-name" name="first-name" required> -->
                            <input type="text" id="firstname" pInputText [(ngModel)]="userInfoData.firstName" />
                        </div>
                    
                        <div class="input-width-1">
                            <label for="lastname">Last Name</label><br>
                            <input type="text" id="lastname" pInputText [(ngModel)]="userInfoData.lastName" />
                        </div>
                    </div>
                    
                    <div class="input-wrapper">
                        <div class="input-width-1">
                            <label for="username">Username</label>
                            <input type="text" id="username" pInputText [(ngModel)]="userInfoData.username" />
                        </div>

                        <div class="input-width-1">
                            <label for="gender">Gender</label> <br>
                            <select id="gender" name="gender" required>
                                    <option value="" disabled selected>Select your gender</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                    <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="btn-wrapper">
                    <div type="submit"></div>
                    <!-- <button (click)="togglePanel2()" type="submit">Next</button> -->
                </div>
            <!-- </div> -->

            <!-- <div class="panel" *ngIf="isOpen2"> -->
                <h1>Contact Information</h1>
                <!-- <span class="d-flex justify-content-between" (click)="togglePanel2()">
                    <h2>Contact Information</h2>
                    <i class="pi" [ngClass]="isOpen2 ? 'pi-chevron-up' : 'pi-chevron-down'" style="font-size: 1em;"></i>
                </span> -->

                <!-- <p-divider></p-divider> -->

                <div class="panel-content" >
                    <div class="input-wrapper">
                        <div class="input-width-1">
                            <label for="email">Email</label>
                            <input type="email" id="email" pInputText [(ngModel)]="userInfoData.email">
                        </div>
                        <div class="input-width-1">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" pattern="[0-9]{10}" pInputText [(ngModel)]="userInfoData.phoneNumber" >
                        </div>
                    </div>

                    <div class="input-wrapper">
                        <div class="input-width-1">
                            <label for="address">Address</label>
                            <input id="address" pInputText [(ngModel)]="userInfoData.address">
                        </div>
                        <div class="input-width-1">
                            <label for="country">Country</label>
                            <select id="country" name="country" pInputText [(ngModel)]="userInfoData.selectedCountry" (change)="onCountryChange()">
                              <option value="" disabled selected>Select your country</option>
                              <option *ngFor="let country of countries" [value]="country.name">{{country.name}}</option>
                            </select>
                          </div>                        
                    </div>

                    <div class="input-wrapper">
                        <div class="input-width-1">
                            <label for="state">State</label>
                            <select id="state" name="state" pInputText [(ngModel)]="userInfoData.selectedState" (change)="onStateChange()">
                              <option value="" disabled selected>Select your state</option>
                              <option *ngFor="let state of states" [value]="state.name">{{state.name}}</option>
                            </select>
                          </div>
                          <div class="input-width-1">
                            <label for="city">City</label>
                            <select id="city" name="city" pInputText [(ngModel)]="userInfoData.selectedCity">
                              <option value="" disabled selected>Select your city</option>
                              <option *ngFor="let city of cities" [value]="city.name">{{city.name}}</option>
                            </select>
                          </div>
                    </div>

                    <div class="input-wrapper">                        
                        <div class="input-width-1">
                            <label for="postal-code">Postal Code</label>
                            <input id="postal-code" id="postal-code" pInputText [(ngModel)]="userInfoData.postalCode">
                        </div>
                    </div>
                </div>

                <div class="btn-wrapper">
                    <!-- <button (click)="togglePanel1()" type="submit">Back</button>
                    <button (click)="togglePanel3()" type="submit">Next</button> -->
                </div>
            <!-- </div> -->

            <!-- <div class="panel" *ngIf="isOpen3"> -->

                <!-- <p-divider></p-divider> -->

                <div class="panel-content" >
                    <div class="input-wrapper">
                        <div class="input-width-1">
                            <label for="occupation">Occupation</label>
                            <input type="text" id="occupation" pInputText [(ngModel)]="userInfoData.occupation">
                        </div>
                        <div class="input-width-1">
                            <label for="company">Company</label>
                            <input type="text" id="company" pInputText [(ngModel)]="userInfoData.company">
                        </div>
                    </div>
                    
                    <label for="bio">Bio</label>
                    <textarea id="bio" rows="4" pInputText [(ngModel)]="userInfoData.bio"></textarea>
                </div>

                <div class="btn-wrapper">
                    <!-- <button (click)="togglePanel2()" type="submit">Back</button> -->
                    <button type="submit">Save</button>
                </div>
            <!-- </div> -->

            
        </div>

</div>
