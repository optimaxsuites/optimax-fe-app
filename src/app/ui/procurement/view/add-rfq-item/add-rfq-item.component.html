<div class="p-4">
    <div class="mb-4">
        <label for="itemName">Item Name <span style="color: red;">*</span></label>
        <input id="itemName" type="text" [(ngModel)]="itemsData.name" class="editInput" placeholder="Enter item name" />
    </div>

    <div class="mb-4">
        <label for="quantity">PartNo <span style="color: red;">*</span></label>
        <input id="quantity" type="number" [(ngModel)]="itemsData.partNo" class="editInput" placeholder="Enter quantity" />
    </div>

    <div class="mb-4">
        <label for="quantity">Unit <span style="color: red;">*</span></label>
        <input id="quantity" type="number" [(ngModel)]="itemsData.unit" class="editInput" placeholder="Enter quantity" />
    </div>

    <div class="mb-4">
        <label for="amount">Budget <span style="color: red;">*</span></label>
        <input id="amount" type="number" [(ngModel)]="itemsData.budget" class="editInput" placeholder="Enter amount" />
    </div>

    <div class="mb-4">
        <label for="des">Description</label>
        <textarea name="des" id="des" type="text" [(ngModel)]="itemsData.description" class="editInput" placeholder="Enter description" ></textarea>
    </div>

    <div class="form-actions mt-4">
        <button type="submit" (click)="onSubmit()">{{rfqFormComponent.isEdit ? 'Edit Item' : 'Add Item'}}</button>
    </div>
</div>
