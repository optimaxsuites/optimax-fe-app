
<p-confirmDialog header="Confirm Deletion" icon="pi pi-exclamation-triangle" styleClass="custom-confirm-dialog"></p-confirmDialog>
<p-toast></p-toast>

<div *ngIf="showCandidate">
  <div class="card">
    <br>
    <div class="flex w-full justify-between ps-3 table-item">
      <div class="w-1/1">
        <ng-select 
          [items]="positions || []"
          class="input-container-100"
          bindLabel="position"
          [multiple]="true"
          placeholder="Filter by position"
          [(ngModel)]="selectedPositions"
          (ngModelChange)="filterCandidatesByPosition()">
        </ng-select>
      </div>

      <div class="search-bar w-[90%]">
        <input 
          type="text" 
          placeholder="Search" 
          class="editInput h-[36px]"
          [(ngModel)]="searchTerm"
          (ngModelChange)="filterCandidates()"
        />
      </div>
    </div>

    <app-table 
      [columns]="candidateColumns" 
      [rows]="filteredCandidates" 
      [actions]="candidateActions"
      [paginator]="true" 
      [rowsPerPage]="15"
      [tableStyle]="{'min-height': 'fit-content', 'max-height': '650px'}"
      [emptyMessage]="'No candidate(s) application yet.'"
      (actionClick)="handleCandidateAction($event)"
      >
    </app-table>
  </div>
</div>


<div *ngIf="showInterviewInvite">
  <app-interview-invite [candidate]="activeItem" (back)="closeInterviewInvite()" (sendInterviewInvite)="sendInvite($event)"></app-interview-invite>
</div>



<app-modal 
  *ngIf="viewModal"
  [header]="'Viewing ' + activeItem.candidateName + ' Information'"
  [title]="'Close'"
  (close)="closeViewModal()">
  
  <div class="view-wrapper p-4">
    <!-- Section for Predefined Fields -->
    <div class="predefined-section">
      <h3 class="section-title">Basic Information</h3>
      <div class="info-grid">
        <div class="info-item">
          <label><strong>Name:</strong></label>
          <span> {{ activeItem.candidateName || 'N/A' }}</span>
        </div>
        <div class="info-item">
          <label><strong>Email:</strong></label>
          <span> {{ activeItem.email || 'N/A' }}</span>
        </div>
        <div class="info-item">
          <label><strong>Position:</strong></label>
          <span> {{ activeItem.position || 'N/A' }}</span>
        </div>
        <div class="info-item">
          <label><strong>Date Applied:</strong></label>
          <span> {{ activeItem.dateApplied || 'N/A' }}</span>
        </div>
      </div>
    </div>

    <hr class="divider">

    <!-- Section for Dynamic Fields -->
    <div class="dynamic-section">
      <h3 class="section-title">Additional Information</h3>
      <div *ngFor="let key of getDynamicKeys()" class="info-item mb-4">
        <label><strong>{{ key | splitAndTitleCase }}:</strong></label>

        <!-- Check if value is a document -->
        <span *ngIf="isDocument(activeItem[key]); else textValue">
          <a [href]="getDocumentUrl(key)" target="_blank" class="file-link ms-2">View Document</a>
          <a [href]="getDocumentUrl(key)" download="{{ activeItem.candidateName}} {{key}}" class="file-link ms-2">Download</a>
        </span>
        
        <!-- Non-file Values -->
        <ng-template #textValue>
          <span> {{ activeItem[key] }}</span>
        </ng-template>
      </div>
    </div>
  </div>
</app-modal>
