<div class="clock-card">

  <div class="time">
    <h2>{{ currentTime | date:'HH:mm:ss' }}</h2>
    <p>{{ currentTime | date:'fullDate' }}</p>
  </div>

  <div class="status">
    <span 
      [class.in]="status === 'CLOCKED_IN'"
      [class.out]="status === 'CLOCKED_OUT'">
      {{ status.replace('_', ' ') }}
    </span>
  </div>

  <div class="actions">

    <p *ngIf="hasCompletedToday" class="completed-warning">
  You have already completed attendance for today.
</p>

  <!-- BEFORE OPENING -->
  <p *ngIf="!isAfterOpening" class="closed-warning">
    It isn’t office hours yet.
  </p>

  <!-- ABSENT -->
  <p *ngIf="isAfterOpening && isAbsentToday" class="absent-warning">
    You have been marked ABSENT for today.
  </p>

  <!-- CLOCK IN (only during office hours) -->
  <button
    *ngIf="status === 'CLOCKED_OUT' 
           && isWithinOfficeHours 
           && !isAbsentToday
           && !hasCompletedToday"
    class="main-btn"
    [disabled]="isGettingLocation"
    (click)="toggleClock()">
    <span *ngIf="!isGettingLocation">Clock In</span>
      <span *ngIf="isGettingLocation" class="location-loading">
        <span class="spinner"></span> Getting location...
      </span>
  </button>

  <!-- CLOCK OUT (allowed anytime after opening) -->
  <button
    *ngIf="status === 'CLOCKED_IN' 
           && isAfterOpening
           && !hasCompletedToday"
    class="main-btn"
    [disabled]="isGettingLocation || !hrEmployeeId"
    (click)="toggleClock()">
    <span *ngIf="!isGettingLocation">Clock Out</span>
    <span *ngIf="isGettingLocation" class="location-loading">
      <span class="spinner">Getting location...</span> 
    </span>
  </button>

</div>

</div>
