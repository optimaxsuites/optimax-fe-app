<p-confirmDialog class="table-item" header="Confirm Deletion" icon="pi pi-exclamation-triangle" styleClass="custom-confirm-dialog"></p-confirmDialog>
<p-toast class="table-item"></p-toast>
<div class="table-item" *ngIf="rfqTable">
    <div class="card">
        <p-toolbar styleClass="mb-4 gap-2">
            <ng-template pTemplate="left">
                <app-button text="Delete" class="btn-delete"></app-button>
            </ng-template>

            <ng-template pTemplate="center">
                <div class="table-item w-[450px]">
                    <input 
                      type="text" 
                      placeholder="Search" 
                      class="editInput h-[36px]"
                      [(ngModel)]="searchTerm"
                      (ngModelChange)="search()"
                    />
                </div>
            </ng-template>
            

            <ng-template pTemplate="right">
                <app-button text="Create" class="btn-navigate" (click)="openForm()"></app-button>
            </ng-template>
        </p-toolbar>

      <!-- Table View -->
        <p-table
            [value]="rfqList" 
            [paginator]="true" 
            styleClass="p-datatable-striped" 
            [tableStyle]="{'min-height': 'fit-content', 'max-height': '650px'}"
            [rows]="15">
            <ng-template pTemplate="header">
            <!-- Table header here -->
                <tr class="">
                    <th style="width: 4rem"><p-tableHeaderCheckbox /></th>
                    <th class="table-item" pSortableColumn="title">Project Title</th>
                    <th class="table-item" pSortableColumn="location">RFQ No</th>
                    <th class="table-item" pSortableColumn="postedDate">Date</th>
                    <th class="table-item" pSortableColumn="expiryDate">Due Date</th>
                    <!-- <th class="table-item" pSortableColumn="expiryDate">Status</th> -->
                    <th class=""></th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-item>
                <tr class="p-table-row">
                    <td><p-tableCheckbox [value]="item" /></td>
                    <td class="table-item">{{ item.projectTitle }}</td>
                    <td class="table-item">{{ item.rfqNo }}</td>
                    <td class="table-item">{{ item.date }}</td>
                    <td class="table-item">{{ item.dueDate }}</td>
                    <td class="table-item">
                        <span [ngClass]="getStatusClass(item.status)">
                          {{ item.status }} 
                        </span>
                    </td>
                    <td class="actions">
                        <i class="pi pi-ellipsis-v table-item"(click)="op.toggle($event)" ></i>
                        <p-overlayPanel #op ngClass="padding: 0;">
                            <div>
                                <li class="table-item-panel" (click)="viewRfq(item)"> <i class="pi pi-eye table-item me-2"></i> View</li>
                                <li class="table-item-panel" (click)="editRfq(item)"> <i class="pi pi-pen-to-square table-item me-2"></i>Edit </li>
                                <li class="table-item-panel" (click)="deleteRfq(item.id)"> <i class="pi pi-trash table-item me-2"></i>Delete</li>
                            </div>
                        </p-overlayPanel>
                    </td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="8" class="text-center table-item py-4"> 
                        No Request for Quotation
                    </td>
                  </tr>
            </ng-template>
        </p-table>
    </div>
</div>

<div class="rfq-form-container" *ngIf="rfqForm">
    <app-rfq-form [rfqData]="activeItem" (back)="close()" [isView]="isView" [isCreate]="isCreate" [isEdit]="isEdit" [isRfq]="true" [isQuote]="false"></app-rfq-form>
</div>
