<div class="bg-white rounded-lg shadow-md p-6">
    <div class="sales-orders-header mb-4">
        <h2 class="text-xl font-semibold text-gray-800">Sales Orders</h2>
    </div>

    <div class="mb-6">
        <label for="search-orders" class="text-sm text-gray-500 mb-2 block">Search Orders</label>
        <div class="relative">
            <i class="fa-solid fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
            <input 
                id="search-orders" 
                type="text" 
                placeholder="Search by order number, customer, or salesperson"
                class="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-customGreen focus:border-customGreen"
                [formControlName]="'search'"
            >
        </div>
    </div>

    <form [formGroup]="filterForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">
        <div class="col-span-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Date Range</label>
            <select [formControlName]="'dateRange'" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                <option *ngFor="let range of dateRanges" [value]="range.value">{{ range.label }}</option>
            </select>
        </div>
        
        <div class="col-span-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Custom Days</label>
            <input type="number" [formControlName]="'customDays'" placeholder="e.g. 7" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
        </div>

        <div class="col-span-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Cashier</label>
            <select [formControlName]="'cashier'" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                <option value="all">All</option>
                </select>
        </div>
        
        <div class="col-span-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Order Status</label>
            <select [formControlName]="'status'" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                <option *ngFor="let s of statuses" [value]="s.value">{{ s.label }}</option>
            </select>
        </div>

        <div class="col-span-1">
    <label class="block text-sm font-medium text-gray-700 mb-2">Delivery Status</label>
    <select [formControlName]="'deliveryStatus'" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
        <option value="all">All</option>
        <option *ngFor="let ds of deliveryStatuses" [value]="ds.value">{{ ds.label }}</option>
    </select>
</div>
        
    </form>

    <div *ngIf="orders.length === 0 && !isLoading" class="text-center py-12 bg-gray-50 rounded-lg border border-dashed border-gray-200">
        <i class="fa-solid fa-box-open text-4xl text-gray-400 mb-3"></i>
        <p class="text-lg font-medium text-gray-600">No orders for today</p>
        <p class="text-sm text-gray-400">Try adjusting your filters or check back later</p>
    </div>
    
    </div>
