<div class="ql-role-switcher">
    <label for="ql-role-switcher-select"><i class="fas fa-user-shield"></i> Viewing as</label>
    <select id="ql-role-switcher-select" [value]="currentRole" (change)="onRoleChange($any($event.target).value)">
        <option value="ADMIN">Admin</option>
        <option value="BRANCH_MANAGER">Branch Manager</option>
    </select>
</div>
<app-nav-tab [tabsConfig]="tabsConfig"></app-nav-tab>
