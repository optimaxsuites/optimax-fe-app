  <div class="imageDiv">
    <div class="flex flex-col justify-center items-center gap-4 pr-28 pt-28">
      <!-- Conditionally show image or icon -->
      <img
        *ngIf="previewImage; else iconTemplate"
        class="w-[450px] h-[400px] object-cover"
        [src]="previewImage"
        alt="product image"
      />
      
      <!-- Icon Template for no image -->
      <ng-template #iconTemplate>
        <div class="w-[450px] h-[400px] flex justify-center items-center bg-gray-200">
          <!-- Font Awesome Icon for the image placeholder -->
          <i class="pi pi-image text-6xl text-gray-500"></i>
        </div>
      </ng-template>
  
      <!-- Upload Label and Input -->
      <label for="image" class= "image rounded-xl btn create-invoice-btn p-3 text-white">Upload Image <span style="color: red">*</span></label>
      <input
        type="file"
        (change)="onImageUpload($event)"
        [(ngModel)]="ingredient.productImages"
        id="image"
        hidden
      />
      
      <!-- Error Handling -->
      <div *ngIf="ingredientForm.get('image')?.invalid && ingredientForm.get('image')?.touched" class="error">
        Image is required.
      </div>
    </div>
  </div>
