<p-toast></p-toast>

<div class="p-col-12">
    <h5>Add Users</h5>
    <div class="card">
        <p-toolbar styleClass="p-mb-4">
            <ng-template pTemplate="left">
                <button pButton pRipple label="Save" icon="pi pi-plus" class="p-mr-2 p-mb-2"
                (click)="addUser()"></button>
                <button pButton pRipple label="Clear" icon="pi pi-trash" class="p-mb-2"></button>
            </ng-template>

            <ng-template pTemplate="right">
                <button pButton pRipple label="Back" (click)="goBack()" icon="pi pi-chevron-left" class="p-button-help p-mb-2"></button>
            </ng-template>
        </p-toolbar>
        </div>

      </div>

      <p-card>
        <ng-template pTemplate="content">

        <div class="p-col-12 p-grid">

        <div class="p-col-6">
        <div class="p-fluid p-formgrid p-grid">



        <div class="p-field p-col-12 p-md-6">
                      <label for="firstname">Firstname</label>
                      <input id="firstname" type="firstname" pInputText 
                      [(ngModel)]="userinfodata.firstname"  aria-describedby="firstname-help"
                       required>
              <!--small id="lastname-help">Enter your firstname.</small-->
                  </div>

        <div class="p-field p-col-12 p-md-6">
                      <label for="lastname">Lastname</label>
                      <input id="lastname" type="lastname" pInputText [(ngModel)]="userinfodata.lastname" aria-describedby="lastname-help"
                       required>
                      <!--small id="lastname-help">Enter your Surname/Lastname.</small-->
                  </div>

        </div>

        <div class="p-fluid p-formgrid p-grid">

          <div class="p-field p-col-6">
                        <label for="othername">Othername</label>
                        <input id="othername" type="othername" pInputText [(ngModel)]="userinfodata.othername" aria-describedby="firstname-help"
                        >
                <!--small id="lastname-help">Enter your othername.</small-->
                    </div>

                    <div class="p-field p-col-6">
                      <label for="phonenum">Phone Number</label>
                      <p-inputMask id="phonenum" [(ngModel)]="userinfodata.phone_number" placeholder="(801) 234-5678" mask="(999) 999-9999"></p-inputMask>
                      </div>


        </div>
        <div class="p-fluid p-formgrid p-grid">

          <div class="p-col-6 p-field">
                        <label for="userrole_id">User Roles</label>
                        <p-dropdown inputId="userrole_id" [options]="userRoleMap" [(ngModel)]="selectedUserRole"
                        optionLabel="name" placeholder="Select" ></p-dropdown>

                    </div>

                    <div class="p-col-6 p-field">
                      <label for="implementing_partners_id">Implementing Partners</label>
                      <p-dropdown inputId="implementing_partners_id" [options]="implementingPartnersMap" [(ngModel)]="selectedImplementingPartners"
                      optionLabel="name" placeholder="Select"></p-dropdown>

                  </div>
          </div>

          <div class="p-fluid p-formgrid p-grid">

            <div class="p-field p-col-12 p-md-12">
                <label for="operational_unit_id">Facility Name</label>
                <input readonly [(ngModel)]="userInformation.facility_name"  type="text" pInputText>
                <button pButton pRipple type="button" type="button"
                class="p-button-text p-mr-2 p-mb-2"
                label="Choose..." (click) = "loadHeirarchyUnits(1,'fac')"></button>
                </div>

        </div>

        <div class="p-fluid p-formgrid p-grid">

          <div class="p-col-4 p-field">
            <label for="status">Status</label> <br>
            <p-toggleButton onLabel="Active" offLabel="Not Active" [style]="{'width': '10em'}" [(ngModel)]="usercreatedata.loginstatus"></p-toggleButton>

      </div>


        <div class="p-col-4 p-field">
          <label for="web">Web Access</label> <br>
          <p-toggleButton onLabel="Yes" offLabel="No" [style]="{'width': '10em'}" [(ngModel)]="userinfodata.web_app_acesss"></p-toggleButton>

    </div>

    <div class="p-col-4 p-field">
      <label for="mobile">Mobile Access</label> <br>
      <p-toggleButton onLabel="Yes" offLabel="No" [style]="{'width': '10em'}" [(ngModel)]="userinfodata.mobile_app_acesss"></p-toggleButton>

</div>





                  </div>


        <div class="p-fluid p-formgrid p-grid">

        <div class="p-field p-col-12">
                    <label for="streetaddress">Contact Address</label>
                    <textarea rows="5" cols="30"  pInputTextarea  [(ngModel)]="userinfodata.contact_address"></textarea>
                </div>
        </div>


       </div>
        <div>
          <p-divider layout="vertical" >

          </p-divider>
        </div>

        <div class="p-col-5">


      <div class="p-fluid p-formgrid p-grid">

        <div class="p-col-6 p-field" >
                      <label for="username">Username</label>
                      <input id="username" type="username" pInputText [(ngModel)]="usercreatedata.username" aria-describedby="username-help"
                      >

                  </div>
                  <div class="p-col-6 p-field">
                    <label for="password">Password</label>
                    <input id="password" type="password" pInputText [(ngModel)]="usercreatedata.password" aria-describedby="password-help" >

                </div>
        </div>

      <div class="p-fluid p-formgrid p-grid">

        <div class="p-col-6 p-field">
                    <label for="retypepassword">Confirm Password</label>
                    <input id="retypepassword" type="password" pInputText [(ngModel)]="usercreatedata.password" aria-describedby="password-help" >

                </div>
                <div class="p-col-6 p-field">
                  <label for="email">Email</label>
                  <input id="email" type="email" pInputText  aria-describedby="email-help"
                  [(ngModel)]="userinfodata.email">
          <!--small id="lastname-help">Enter your email.</small-->
              </div>
        </div>

        <div p-col-6>
          <p-divider align="left" type="dashed" layout="horizontal">
            <div class="p-d-inline-flex p-ai-center">
              <i class="pi pi-user p-mr-2"></i>
              <b>Biometric</b>
          </div>
          </p-divider>
        </div>


        <div class="p-fluid p-formgrid p-grid">

          <div class="p-col-6 p-field">
                      <label for="fingerprintclient">Fingerprint Client</label>
                      <input id="fingerprintclient" pInputText [(ngModel)]="usercreatedata.fingerprintclient" >
  
                  </div>
                  <div class="p-col-6 p-field">
                    <label for="fingerprintmatcher">Fingerprint Matcher</label>
                    <input id="fingerprintmatcher" pInputText  
                    [(ngModel)]="userinfodata.fingerprintmatcher">
            <!--small id="lastname-help">Enter your email.</small-->
                </div>
          </div>

            </div>
        </div>



        </ng-template>



    <p-dialog [(visible)]="facilityDialog" [style]="{width: '650px'}" [maximizable]="true"
header="OU List" [modal]="true" styleClass="p-fluid">
<p-tree [value]="roots" selectionMode="single" scrollHeight="600px" [loading]="loading"
[(selection)]="selectedHeirarchyUnit"
 [filter]="true" filterMode="strict" filterBy="name">
  <ng-template let-node pTemplate="default">
    <b>{{node.name}}</b>
</ng-template>

</p-tree>
<p-footer>
<div class="p-grid p-nogutter p-justify-end">
        <p-button label="Set {{selectedHeirarchyUnit ? selectedHeirarchyUnit.name : ''}}"
        (onClick)="heirarchyOnSet()" icon="pi pi-angle-right" iconPos="right"></p-button>
    </div>
</p-footer>
</p-dialog>
    </p-card>
