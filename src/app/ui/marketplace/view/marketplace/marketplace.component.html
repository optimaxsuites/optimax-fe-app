<div class="p-10">
    <h1 class="text-2xl font-bold mb-4 text-customBlue">Modules Marketplace</h1>
    
    <!-- Search & Filter Section -->
    <div class="flex items-center space-x-4 mb-6">
      <input type="text" placeholder="Search modules..." class="p-2 border rounded w-1/3" />

    </div>
  
    <!-- Module Grid -->
    <div class="grid grid-cols-6 gap-4">
      <div *ngFor="let module of modules" class="p-4 border rounded-lg shadow-md">
        <div class="flex justify-between items-center">
          <h2 class="text-lg font-semibold text-customBlue">{{ module.label }}</h2>
          <!-- <span *ngIf="!module.locked" class="text-red-500 text-sm">Locked 🔒</span> -->
        </div>
        <!-- <p class="text-sm text-gray-600">{{ module.description }}</p> -->
        
        <button 
          *ngIf="module.locked && module.active" 
          (click)="showDialog(module.label)" 
          class="mt-4 bg-gray-500 text-white py-2 px-4 rounded">
          Locked 🔒
        </button>

        <button 
        *ngIf="module.locked && !module.active" 
        disabled
        class="mt-4 bg-gray-300 text-gray-500 py-2 px-4 rounded cursor-not-allowed">
        Coming Soon 
      </button>
  
        <button 
        disabled
          *ngIf="!module.locked" 
          class="mt-4 bg-green-500 text-white py-2 px-4 rounded cursor-not-allowed">
          Installed 
        </button>
      </div>
    </div>
  </div>
  

  <p-dialog [header]="'Unlock ' + label" [modal]="true" [(visible)]="visible" [style]="{ width: '28rem' }">
    <span class="p-text-secondary block mb-5">Please enter the key you received in the subscription confirmation email sent to you</span>
    <div class="flex items-center gap-3 mb-5 w-full">
        <label for="username" class="font-semibold w-[2rem]">Key:</label>
        <p-inputGroup class='flex items-center gap-2 w-full'>

            <input pInputText id="username" class="editInput w-full" (keyup.enter)="unlockModule()" [(ngModel)]='key' autocomplete="off" />
            <p-inputGroupAddon (click)="unlockModule()" class="cursor-pointer"> <i class="fa-solid fa-arrow-right text-xl"></i> </p-inputGroupAddon>

        </p-inputGroup>
    </div>
<!--  
    <div class="flex justify-end gap-2">
        <p-button label="Cancel" severity="secondary" (onClick)="visible = false" />
        <p-button label="Save" (onClick)="visible = false" />
    </div> -->

    <p>Haven't subscribed to {{label}} yet?, proceed to <a [href]="getLink()" target='_blank'>payment</a> page</p>
</p-dialog>
