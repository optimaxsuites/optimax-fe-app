<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=visibility" />

<!--/**********************************************************The Search and Categories Section**********************************************************/-->
<div *ngIf="tableSection" class="flex flex-col w-full gap-14 p-4">
  <div class="gap-3 w-full flex justify-between items-center">
  <ng-select 
    [items]="categories" 
    bindLabel="name" 
    bindValue="id" 
    [(ngModel)]="selectedCategories" 
    [multiple]="true" placeholder="Categories" 
    (change)="filterProductsByCategory()">
  </ng-select>

  <div class="w-1/2">
  <div class="search-container">
    <input type="input" 
    class="Search-input" 
    placeholder="Search..." 
    [(ngModel)]="searchTerm" 
    (ngModelChange)="filterProductsBySearch($event)" />
    <i class="fas fa-search"></i>
  </div>
  </div>
  </div>
  <div>

    <!-- //**********************************************************The Buttons -->
  <p-toolbar styleClass="mb-4 gap-2">
  <ng-template pTemplate="left">
    
  </ng-template>
  <ng-template pTemplate="right"> 
    
    <app-button text="Add Inventory" 
    class="btn-navigate" 
    *ngIf="activeItem" 
    (click)="openEditInventory(activeItem, 'parent')">
    </app-button>

    
  </ng-template> 
  </p-toolbar>

    <!-- //****************************************************************The Table starts here -->
  <p-table [value]="ingredients" [paginator]="true" dataKey="id" responsiveLayout="stack" [breakpoint]="'960px'" styleClass="p-datatable-striped" [tableStyle]="{ 'min-height': 'fit-content', 'max-height': '650px' }" [rows]="15">
    <ng-template pTemplate="header" let-columns>
      <tr>
        <th style="width: 4rem"><p-tableHeaderCheckbox /></th>
        <th class="table-item">SKU</th>
        <th class="table-item">Code</th>
        <th class="table-item">Name</th>
        <th class="table-item">Price</th>
        <th class="table-item">Quantity</th>
        <th class="table-item">Category</th>
        <th class="table-item">Action</th>
      </tr>
    </ng-template>
    

    <ng-template pTemplate="body" let-item let-i="rowIndex">
      <tr (click)="openEditInventory(item, 'child')">
        <td><p-tableCheckbox [value]="item" class="custom-checkbox" /></td>
        <td class="table-item">{{ item.sku }}</td>
        <td class="table-item">{{ item.code }}</td>
        <td class="table-item">{{ item.name }}</td>
        <td class="table-item">{{ item.effectivePrice }}</td>
        <td class="table-item" [ngClass]="getQuantityClass(item.effectiveQuantity)" pTooltip="{{ getTooltipText(item) }}" tooltipPosition="top">
          <div class="quantity-box">
            <span class="quantity-value">{{ item.effectiveQuantity }}</span>
            <span class="quantity-status">{{ item.effectiveQuantity >= 10 ? 'Available' : 'Low Stock' }}</span>
          </div>
        </td>
        <td class="table-item">{{ item.productCategory?.name }}</td>
        <td class="actions table-item">
          <div class="dropdown">
            <span (click)="toggleDropdown2(item, $event)">
              <i class="material-icons">more_vert</i>
            </span>
            <ul class="absolute bg-white border shadow-lg rounded-lg py-2 z-50" *ngIf="item.showMenu">
              <li (click)="openViewProduct(item); closeDropdown(item)" class="flex items-center px-4 py-2 hover:bg-gray-100 cursor-pointer">
                <i class="pi pi-eye pr-2 text-2xl"></i> View History
              </li>
              <li (click)="openEditInventory(item, 'child'); closeDropdown(item)" class="flex items-center px-4 py-2 hover:bg-gray-100 cursor-pointer">
                <i class="pi pi-pen-to-square pr-2 text-2xl"></i> Add Inventory
              </li>
            </ul>
          </div>
        </td>
      </tr>
    </ng-template>

    </p-table>
  </div>
</div>

<!-- //**********************************************************The Edit Inventory Modal**********************************************************/ -->
<div *ngIf="viewInventory">
  <app-view-inventory [activeItem]="activeItem" (edit)="openEditInventory(activeItem, 'child')" (close)="openViewInventory()" [updatedProduct]="activeItem"></app-view-inventory>
</div>

<div *ngIf="editInventory">
  <app-edit-inventory [activeItem]="activeItem" [mode]="mode" (close)="closeEditInventory()" [products]="products"></app-edit-inventory>
</div>
