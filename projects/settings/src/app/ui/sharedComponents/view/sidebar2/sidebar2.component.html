<nav>
    <div class="side-bar-header">
      <img src="assets/logo.png" alt="Logo" />
    </div>
    <ul>
      <li *ngFor="let item of menuItems">
        <div class="menu-item" [class.active]="isSubItemActive(item.route)" (click)="toggleSubMenu(item)">
          <a *ngIf="!item.submenu"
             [routerLink]="item.route"
             [class.active]="isSubItemActive(item.route)">
            <i *ngIf="item.icon" [class]="item.icon"></i> {{ item.label }}
          </a>
          <span *ngIf="item.submenu" [class.open]="item.open">
            <i *ngIf="item.icon" [class]="item.icon"></i> {{ item.label }} &#9662;
          </span>
        </div>
        <ul [ngClass]="{'open': item.open}" *ngIf="item.submenu">
          <li *ngFor="let subItem of item.submenu" [class.section-header]="subItem.isSectionHeader">
            <span *ngIf="subItem.isSectionHeader" class="submenu-section-label">{{ subItem.label }}</span>
            <a *ngIf="!subItem.isSectionHeader"
               [routerLink]="subItem.route"
               [queryParams]="subItem.queryParams"
               [class.active]="isSubItemActive(subItem.route)">
              <i *ngIf="subItem.icon" [class]="subItem.icon"></i>
              {{ subItem.label }}
            </a>
          </li>
        </ul>
      </li>
    </ul>
  </nav>
