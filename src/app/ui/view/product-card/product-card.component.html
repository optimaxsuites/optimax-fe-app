<div
  class="border rounded-xl px-2 pt-3 cursor-pointer h-[25rem] product-card"
  (click)="onAddToCart()"
>
  <img
    src="https://be.optimaxsuites.com/x/api/v2/pos/products/images/{{
      product.productImages[0].imgNo
    }}"
    alt="product image"
    class="w-full h-44 object-contain"
  />
  <div class="flex flex-col w-full mt-4 px-2">
    <!-- <p>Nivea lotion - Even glow</p>
        <p>#5000</p> -->

    <p class="mb-4 text-ellipsis">{{ product.name }}</p>
    <p class="mb-4">₦{{ product.effectivePrice }}</p>
  </div>
</div>
