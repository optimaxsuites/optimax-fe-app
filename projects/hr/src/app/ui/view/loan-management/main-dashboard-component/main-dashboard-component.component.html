<div class="main-dashboard-wrapper">
  <div class="dashboard-toggle">
    <label class="toggle-label">See Dashboards</label>
    <p class="dashboard-copy">Use the buttons below to switch between the advance loan and cooperative loan admin dashboards.</p>
    <div class="dashboard-switch" role="tablist" aria-label="Dashboard selector">
      <button
        type="button"
        class="switch-btn"
        [class.active]="selectedDashboard === 'advance'"
        (click)="onDashboardChange('advance')"
        role="tab"
        [attr.aria-selected]="selectedDashboard === 'advance'">
        Advance Loans Dashboard
      </button>
      <button
        type="button"
        class="switch-btn"
        [class.active]="selectedDashboard === 'cooperative'"
        (click)="onDashboardChange('cooperative')"
        role="tab"
        [attr.aria-selected]="selectedDashboard === 'cooperative'">
        Cooperative Dashboard
      </button>
    </div>
  </div>

  <section class="dashboard-section" *ngIf="selectedDashboard === 'advance'">
    <app-loan-dashboard></app-loan-dashboard>
  </section>

  <section class="dashboard-section" *ngIf="selectedDashboard === 'cooperative'">
    <app-cooperative-dashboard></app-cooperative-dashboard>
  </section>
</div>
