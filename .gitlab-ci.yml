stages:
  - build
  - deploy

default:
  tags:
    - optimax_runner

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

build-and-push:
  stage: build
  image: docker:26
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
                   -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "mod" || $CI_COMMIT_BRANCH == "prod"'

deploy-staging:
  stage: deploy
  image: alpine:3.19
  needs: [build-and-push]
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$MOD_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$MOD_DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - |
      ssh "$MOD_DEPLOY_USER@$MOD_DEPLOY_HOST" "
        set -e
        cd $MOD_DEPLOY_PATH
        docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
        docker pull $CI_REGISTRY_IMAGE:mod
        docker compose up -d --no-build frontend
        docker image prune -f
      "
  environment:
    name: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "mod"'
      when: manual

deploy-prod:
  stage: deploy
  image: bitnami/kubectl:latest
  needs: [build-and-push]
  before_script:
    - echo "$KUBECONFIG" > /tmp/kubeconfig.yaml
    - export KUBECONFIG=/tmp/kubeconfig.yaml
  script:
    - kubectl set image deployment/frontend frontend="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -n optimax
    - kubectl rollout status deployment/frontend -n optimax
  environment:
    name: production
  tags:
    - optimax_prod_runner
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: manual
