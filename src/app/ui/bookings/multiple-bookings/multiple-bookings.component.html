<!-- room-selection-modal.component.html -->
<div
  class="fixed inset-0 bg-gray-100/50 dark:bg-gray-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50"
>
  <div
    class="bg-white dark:bg-gray-800 rounded-lg shadow-xl dark:shadow-gray-900/50 w-full max-w-4xl max-h-[90vh] overflow-y-auto"
  >
    <!-- Header -->
    <div
      class="border-b dark:border-gray-700 p-4 flex justify-between items-center"
    >
      <h3 class="text-xl font-semibold dark:text-white">Select Rooms</h3>
      <button
        (click)="closeModal()"
        class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 transition-colors"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <!-- Room Grid -->
    <div
      class="p-4 sm:p-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6"
    >
      <div
        *ngFor="let room of rooms"
        class="border dark:border-gray-700 rounded-lg overflow-hidden hover:shadow-md dark:hover:shadow-gray-900/50 transition-shadow bg-white dark:bg-gray-700"
      >
        <img
          [src]="room.imageUrl"
          alt="Room"
          class="w-full h-40 sm:h-48 object-cover"
        />

        <div class="p-4">
          <div class="flex justify-between items-start mb-2">
            <h4 class="font-bold text-lg dark:text-white">{{ room.name }}</h4>
            <span class="font-semibold text-blue-600 dark:text-blue-400"
              >₦{{ room.price }}/night</span
            >
          </div>

          <p class="text-gray-600 dark:text-gray-300 text-sm mb-4">
            {{ room.description }}
          </p>

          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2">
              <button
                (click)="decrementRoom(room)"
                [disabled]="getSelectedCount(room) === 0"
                class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-200 dark:bg-gray-600 dark:text-white disabled:opacity-50 transition-colors"
              >
                -
              </button>
              <span class="w-8 text-center dark:text-white">{{
                getSelectedCount(room)
              }}</span>
              <button
                (click)="incrementRoom(room)"
                class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-200 dark:bg-gray-600 dark:text-white disabled:opacity-50 transition-colors"
              >
                +
              </button>
            </div>

            <span class="text-sm text-gray-500 dark:text-gray-400">
              <!-- Max: {{ room.maxGuests }} guests -->
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer with summary -->
    <div class="border-t dark:border-gray-700 p-4 bg-gray-50 dark:bg-gray-700">
      <div
        class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4"
      >
        <div>
          <h4 class="font-medium dark:text-white">Selected Rooms</h4>
          <ul class="text-sm text-gray-600 dark:text-gray-300">
            <li *ngFor="let item of selectedRoomsSummary">
              {{ item.count }} × {{ item.name }} (₦{{ item.totalPrice }})
            </li>
          </ul>
        </div>

        <div class="text-right">
          <p class="text-sm text-gray-600 dark:text-gray-300">
            Total Rooms: {{ totalSelectedRooms }}
          </p>
          <p class="text-lg font-bold dark:text-white">₦{{ totalPrice }}</p>
        </div>
      </div>

      <button
        (click)="confirmSelection()"
        [disabled]="totalSelectedRooms === 0"
        class="mt-4 w-full py-2 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 dark:bg-blue-700 dark:hover:bg-blue-800 disabled:bg-gray-400 dark:disabled:bg-gray-600 transition-colors"
      >
        Confirm Rooms
      </button>
    </div>
  </div>
</div>
