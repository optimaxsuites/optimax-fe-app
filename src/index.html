<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="./assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <script src="assets/env.js"></script>
  <script src="//cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    eruda.init();
    // Diagnostic: capture-phase listeners registered before Zone.js loads so
    // they are native (unpatched) and fire regardless of Angular zone state.
    document.addEventListener('touchstart', function(e) {
      var t = e.target; console.log('[DIAG] touchstart → ' + t.tagName + '#' + (t.id||'') + ' .' + ((t.className||'').toString().slice(0,25)));
    }, { passive: true, capture: true });
    document.addEventListener('touchend', function(e) {
      var t = e.target; console.log('[DIAG] touchend → ' + t.tagName + '#' + (t.id||''));
    }, { passive: true, capture: true });
    document.addEventListener('click', function(e) {
      var t = e.target; console.log('[DIAG] click → ' + t.tagName + '#' + (t.id||'') + ' .' + ((t.className||'').toString().slice(0,25)));
    }, { capture: true });
  </script>
</head>
