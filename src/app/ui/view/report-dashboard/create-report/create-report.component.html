<div class="create-report-container">
  <h2>Create Report</h2>
  <form [formGroup]="reportForm" (ngSubmit)="onSubmit()">
    <!-- Report Name -->
    <div class="form-group">
      <label for="reportName">Report Name</label>
      <input
        type="text"
        id="reportName"
        formControlName="reportName"
        class="form-control"
        placeholder="Enter report name"
      />
      <div
        *ngIf="
          reportForm.get('reportName')!.invalid &&
          reportForm.get('reportName')!.touched
        "
        class="error"
      >
        Report Name is required.
      </div>
    </div>

    <!-- Report Type -->
    <div class="form-group">
      <label for="reportType">Report Type</label>
      <select id="reportType" formControlName="reportType" class="form-control">
        <option value="">Select Report Type</option>
        <option *ngFor="let type of reportTypes" [value]="type.value">
          {{ type.label }}
        </option>
      </select>
      <div
        *ngIf="
          reportForm.get('reportType')!.invalid &&
          reportForm.get('reportType')!.touched
        "
        class="error"
      >
        Report Type is required.
      </div>
    </div>

    <!-- Report Duration -->
    <div class="form-group">
      <label for="reportDuration">Duration of Report</label>
      <select
        id="reportDuration"
        formControlName="reportDuration"
        class="form-control"
      >
        <option value="">Select Duration</option>
        <option value="last24">Last 24 Hours</option>
        <option value="lastWeek">Last Week</option>
        <option value="lastMonth">Last Month</option>
        <option value="custom">Custom</option>
      </select>
      <div
        *ngIf="
          reportForm.get('reportDuration')!.invalid &&
          reportForm.get('reportDuration')!.touched
        "
        class="error"
      >
        Duration is required.
      </div>
    </div>

    <!-- Custom Date Range (visible only if 'custom' is selected) -->
    <div
      class="form-group"
      *ngIf="reportForm.get('reportDuration')!.value === 'custom'"
    >
      <label for="startDate">Start Date</label>
      <input
        type="date"
        id="startDate"
        formControlName="startDate"
        class="form-control"
      />
      <div
        *ngIf="
          reportForm.get('startDate')!.invalid &&
          reportForm.get('startDate')!.touched
        "
        class="error"
      >
        Start Date is required.
      </div>
    </div>

    <div
      class="form-group"
      *ngIf="reportForm.get('reportDuration')!.value === 'custom'"
    >
      <label for="endDate">End Date</label>
      <input
        type="date"
        id="endDate"
        formControlName="endDate"
        class="form-control"
      />
      <div
        *ngIf="
          reportForm.get('endDate')!.invalid &&
          reportForm.get('endDate')!.touched
        "
        class="error"
      >
        End Date is required.
      </div>
    </div>

    <!-- Data Source (Excel File Import) -->
    <div class="form-group">
      <label for="dataFile">Data Source (Excel File Import)</label>
      <input
        type="file"
        id="dataFile"
        (change)="onFileChange($event)"
        accept=".xlsx, .xls"
        class="form-control-file"
      />
    </div>

    <!-- Additional Information -->
    <div class="form-group">
      <label for="additionalInfo">Additional Information</label>
      <textarea
        id="additionalInfo"
        formControlName="additionalInfo"
        class="form-control"
        placeholder="Enter any additional details"
      ></textarea>
    </div>

    <!-- Submit Button -->
    <button
      type="submit"
      class="btn btn-primary"
      [disabled]="reportForm.invalid"
    >
      Create Report
    </button>
  </form>
</div>
