<!-- Tab Navigation -->
<div class="dashboard-tabs">
  <button
    class="tab-btn"
    [class.active]="activeTab === 'dashboard'"
    (click)="activeTab = 'dashboard'">
    <i class="pi pi-chart-bar"></i> Dashboard
  </button>
  <button
    class="tab-btn"
    [class.active]="activeTab === 'reports'"
    (click)="activeTab = 'reports'">
    <i class="pi pi-file-pdf"></i> Reports
  </button>
</div>

<!-- Dashboard View -->
<div class="dashboard-grid" *ngIf="activeTab === 'dashboard'">
    <app-adminexport
  [data]="filteredAttendance"
  [filters]="currentFilters">
</app-adminexport>
    <app-office-hours></app-office-hours>
<!--<div class="stats-section">
    <app-stats-cards [stats]="statsData"></app-stats-cards>
</div>-->
<div class="dashboard-middle">
    <app-heatmap [departments]="heatmapData"></app-heatmap>
    <app-late-arrivals [lateArrivals]="lateArrivalsData"></app-late-arrivals>
</div>
<div>
    <app-attendancesummary [data]="filteredAttendance"></app-attendancesummary>
</div>
<div>

    <app-attendancetable (dataChange)="onDataChange($event)"></app-attendancetable>
</div>
<div>
 
</div>
</div>

<!-- Reports View -->
<div *ngIf="activeTab === 'reports'" class="reports-view">
  <app-attendance-reports></app-attendance-reports>
</div>
