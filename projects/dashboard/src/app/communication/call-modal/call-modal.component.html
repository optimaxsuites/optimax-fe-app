<div *ngIf="state.open" class="fixed inset-0 z-[100]">

  <!-- ══════════════════════════════════════════════════════════════
       HIDDEN AUDIO IFRAME  –  always present while connected so
       Jitsi stays live even during the voice-call card view.
       1×1 px off-screen; we control mic/video via toggle buttons.
       ══════════════════════════════════════════════════════════════ -->
  <iframe
    *ngIf="state.status === 'connected' && trustedIframeUrl && state.type === 'CALL'"
    [src]="trustedIframeUrl"
    allow="camera; microphone; fullscreen; display-capture"
    style="position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;border:none;overflow:hidden;"
    title="call-audio"
  ></iframe>

  <!-- ══════════════════════════════════════════════════════════════
       VOICE CALL  ·  WhatsApp-style overlay card
       Shows for the entire duration of a CALL (audio only).
       Also shows while a VIDEO_CALL is still ringing.
       ══════════════════════════════════════════════════════════════ -->
  <ng-container *ngIf="state.type === 'CALL' || state.status !== 'connected'">

    <!-- Blurred dark backdrop -->
    <div class="absolute inset-0 bg-black/75 backdrop-blur-md"
         (click)="callEnded.emit()"></div>

    <!-- Card -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2
                w-72 rounded-[2rem] overflow-hidden shadow-2xl
                bg-gradient-to-b from-[#1e2040] to-[#111122]"
         (click)="$event.stopPropagation()">

      <!-- ── Avatar zone ──────────────────────────────────────────── -->
      <div class="flex flex-col items-center pt-10 pb-5 px-6
                  bg-gradient-to-b from-[#2a2d56] to-[#1e2040]">

        <div class="relative mb-4">
          <img *ngIf="contactAvatarUrl"
               [src]="contactAvatarUrl" alt=""
               class="w-24 h-24 rounded-full object-cover border-[3px]"
               [ngClass]="{
                 'border-emerald-400 shadow-[0_0_0_6px_rgba(52,211,153,0.2)]': state.status === 'connected',
                 'border-white/20 animate-pulse': state.status === 'ringing'
               }"/>
          <div *ngIf="!contactAvatarUrl"
               class="w-24 h-24 rounded-full flex items-center justify-center
                      text-[2rem] font-bold text-white bg-[#2e6276] border-[3px]"
               [ngClass]="{
                 'border-emerald-400 shadow-[0_0_0_6px_rgba(52,211,153,0.2)]': state.status === 'connected',
                 'border-white/20 animate-pulse': state.status === 'ringing'
               }">
            {{ state.targetName | slice:0:1 }}
          </div>

          <!-- Call-type badge -->
          <div class="absolute -bottom-1 -right-1 w-8 h-8 rounded-full
                      flex items-center justify-center border-2 border-[#1e2040]"
               [class]="state.type === 'VIDEO_CALL' ? 'bg-blue-500' : 'bg-emerald-500'">
            <svg *ngIf="state.type === 'CALL'" width="14" height="14" fill="white" viewBox="0 0 24 24">
              <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.27-.27.67-.36
                       1-.24 1.1.45 2.3.69 3.6.69.55 0 1 .45 1 1V20c0 .55-.45
                       1-1 1C3.61 21 0 17.39 0 12 0 5.93 4.93 1 11 1c.55 0 1
                       .45 1 1v3.5c0 .55-.45 1-1 1-1.32 0-2.58.22-3.76.64-.32.11
                       -.67.03-.94-.25L6.6 10.8z"/>
            </svg>
            <svg *ngIf="state.type === 'VIDEO_CALL'" width="14" height="14" fill="none" stroke="white" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                    d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.36a1 1 0 01-1.447.894L15 14
                       M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
          </div>
        </div>

        <!-- Name -->
        <h3 class="text-xl font-bold text-white tracking-tight mb-1">{{ state.targetName }}</h3>

        <!-- Status line -->
        <p class="text-sm font-medium"
           [ngClass]="{
             'text-yellow-400': state.status === 'ringing',
             'text-emerald-400': state.status === 'connected',
             'text-gray-400':   state.status === 'ended',
             'text-red-400':    state.status === 'failed'
           }">
          <ng-container [ngSwitch]="state.status">
            <span *ngSwitchCase="'ringing'" class="inline-flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-yellow-400 animate-ping"></span>
              {{ state.type === 'VIDEO_CALL' ? 'Connecting video…' : 'Calling…' }}
            </span>
            <span *ngSwitchCase="'connected'">{{ formatCallDuration(state.duration) }}</span>
            <span *ngSwitchCase="'ended'">Call ended</span>
            <span *ngSwitchCase="'failed'">Could not connect</span>
          </ng-container>
        </p>
      </div>

      <!-- ── Controls ─────────────────────────────────────────────── -->
      <div class="flex items-center justify-center gap-5 py-6 px-6 bg-[#111122]">

        <!-- Mute (only while connected) -->
        <button *ngIf="state.status === 'connected'"
                (click)="muteToggled.emit()"
                class="w-14 h-14 rounded-full flex items-center justify-center
                       transition-all duration-200"
                [ngClass]="state.muted
                  ? 'bg-white text-gray-900 shadow-lg'
                  : 'bg-white/10 text-white hover:bg-white/20'">
          <svg *ngIf="!state.muted" width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4
                     m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
          </svg>
          <svg *ngIf="state.muted" width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707
                     C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
          </svg>
        </button>
        <div *ngIf="state.status !== 'connected'" class="w-14 h-14"></div>

        <!-- End call -->
        <button (click)="callEnded.emit()"
                class="w-16 h-16 rounded-full bg-red-500 hover:bg-red-600
                       flex items-center justify-center transition-all
                       shadow-lg shadow-red-500/40 active:scale-95">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="white">
            <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.12-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"
                  transform="scale(-1,1) translate(-24,0)"/>
          </svg>
        </button>

        <!-- Video spacer (no toggle for audio-only call) -->
        <div class="w-14 h-14"></div>

      </div>
    </div><!-- /card -->
  </ng-container>

  <!-- ══════════════════════════════════════════════════════════════
       VIDEO CALL  ·  connected — full-screen Jitsi iframe behind
       our custom overlay controls.
       ══════════════════════════════════════════════════════════════ -->
  <ng-container *ngIf="state.type === 'VIDEO_CALL' && state.status === 'connected'">

    <!-- Jitsi iframe — fills full viewport, z-index 0 -->
    <iframe
      *ngIf="trustedIframeUrl"
      [src]="trustedIframeUrl"
      allow="camera; microphone; fullscreen; display-capture"
      class="absolute inset-0 w-full h-full border-none bg-black"
      title="video-call"
    ></iframe>

    <!-- Top gradient: name + timer (pointer-events:none so clicks pass to iframe) -->
    <div class="absolute top-0 left-0 right-0 px-5 py-4
                bg-gradient-to-b from-black/70 to-transparent
                flex items-start pointer-events-none" style="z-index:10">
      <div>
        <p class="text-white font-semibold text-base leading-tight drop-shadow">{{ state.targetName }}</p>
        <p class="text-emerald-400 text-sm font-medium drop-shadow">{{ formatCallDuration(state.duration) }}</p>
      </div>
    </div>

    <!-- Bottom gradient: controls (pointer-events active for buttons only) -->
    <div class="absolute bottom-0 left-0 right-0 pb-8 pt-16
                bg-gradient-to-t from-black/70 to-transparent
                flex items-center justify-center gap-7" style="z-index:10"
         (click)="$event.stopPropagation()">

      <!-- Mute mic -->
      <button (click)="muteToggled.emit()"
              class="w-14 h-14 rounded-full flex items-center justify-center
                     transition-all duration-200 backdrop-blur-sm"
              [ngClass]="state.muted
                ? 'bg-white text-gray-900 shadow-lg'
                : 'bg-black/50 text-white border border-white/25 hover:bg-black/70'">
        <svg *ngIf="!state.muted" width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4
                   m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
        </svg>
        <svg *ngIf="state.muted" width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707
                   C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
        </svg>
      </button>

      <!-- End call -->
      <button (click)="callEnded.emit()"
              class="w-[4.5rem] h-[4.5rem] rounded-full bg-red-500 hover:bg-red-600
                     flex items-center justify-center shadow-xl shadow-red-500/50
                     transition-all duration-200 active:scale-95">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="white">
          <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.12-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"
                transform="scale(-1,1) translate(-24,0)"/>
        </svg>
      </button>

      <!-- Camera toggle -->
      <button (click)="videoToggled.emit()"
              class="w-14 h-14 rounded-full flex items-center justify-center
                     transition-all duration-200 backdrop-blur-sm"
              [ngClass]="state.videoOff
                ? 'bg-white text-gray-900 shadow-lg'
                : 'bg-black/50 text-white border border-white/25 hover:bg-black/70'">
        <svg *ngIf="!state.videoOff" width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.36a1 1 0 01-1.447.894L15 14
                   M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
        </svg>
        <svg *ngIf="state.videoOff" width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.36a1 1 0 01-1.447.894L15 14
                   M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2zM3 3l18 18"/>
        </svg>
      </button>

    </div>
  </ng-container>

</div>
