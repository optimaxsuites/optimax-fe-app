<div class="expense-approval-container">
  <h1 class="title">Expense Approval</h1>

  <div class="expense-details">
    <div class="detail-row">
      <label class="detail-label">Merchant:</label>
      <span class="detail-value">{{ expense?.merchant }}</span>
    </div>
    <div class="detail-row">
      <label class="detail-label">Amount:</label>
      <span class="detail-value">{{ expense?.amount }}</span>
    </div>
    <div class="detail-row">
      <label class="detail-label">Expense Date:</label>
      <span class="detail-value">{{ expense?.date }}</span>
    </div>
    <div class="detail-row">
      <label class="detail-label">Category:</label>
      <span class="detail-value">{{ expense?.category }}</span>
    </div>
    <div class="detail-row">
      <label class="detail-label">Status:</label>
      <!-- <span class="detail-value" [ngClass]="{
        'status-approved': expense?.status === 'Approved',
        'status-rejected': expense?.status === 'Rejected'
      }">
        {{ expense?.status }}
      </span> -->
    </div>
    <div class="detail-row">
      <label class="detail-label">Comments:</label>
      <span class="detail-value">{{ expense?.comment }}</span>
    </div>

    <!-- File Attachments Section -->
    <div *ngIf="expense?.receiptFileName || expense?.invoiceFileName">
      <div class="detail-row">
        <label class="detail-label">Attachments:</label>
        <div class="detail-value">
          <div *ngIf="expense?.receiptFileName">
            <a (click)="downloadFile(expense?.receiptFileName)">Receipt: {{ expense?.receiptFileName }}</a>
          </div>
          <div *ngIf="expense?.invoiceFileName">
            <a (click)="downloadFile(expense?.invoiceFileName)">Invoice: {{ expense?.invoiceFileName }}</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="action-buttons">
    <div class="primary-actions">
      <button class="btn btn-approve" (click)="approveExpense()" [disabled]="expense?.status === 'Approved'">Approve</button>
      <button class="btn btn-reject" (click)="rejectExpense()" [disabled]="expense?.status === 'Rejected'">Reject</button>
    </div>

    <div class="dropdown">
      <button class="btn btn-more" (click)="toggleDropdown()">More Actions &#x25BC;</button>
      <ul class="dropdown-content" [class.show]="dropdownOpen">
        <li (click)="editExpense()">Edit</li>
        <li (click)="downloadExpense()">Download</li>
        <li (click)="emailExpense()">Email</li>
        <li (click)="exportExpense()">Export as PDF</li>
      </ul>
    </div>
  </div>
</div>
