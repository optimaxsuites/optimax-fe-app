<!-- Tabs Section (Using reconciliation-kanban styling) -->
<div class="tabs-section">
  <!-- Loop through tabsConfig to render tabs -->
  <ng-container *ngFor="let tab of tabsConfig">
    <div *ngIf="!tab.role || tab.role === user_role" class="relative">
      <button class="tab-btn" [class.active]="selectedTab === tab.name" (click)="selectTab(tab)">
        <i *ngIf="tab.icon" [class]="tab.icon + ' tab-icon'"></i>
        {{ tab.name }}
        <span *ngIf="tab.hasDropdown">▼</span>
      </button>

      <div class="absolute bg-white p-3 gap-3 shadow-sm text-left"
        *ngIf="tab.hasDropdown && selectedDropdownTab == tab.name && isDropdownOpen">
        <button *ngFor="let option of tab.dropdownOptions" class="pb-3"
          (click)="selectDropdownOption(tab.name, option)">
          {{ option.label }}
        </button>
      </div>
    </div>
  </ng-container>
</div>

<div class="tab-content">
  <!-- Loop through tabsConfig to render tab content -->
  <div *ngFor="let tab of tabsConfig">
    <!-- Render content for the selected tab -->
    <div *ngIf="selectedTab === tab.name">
      <ng-container *ngComponentOutlet="tab.component"></ng-container>

      <!-- Render dropdown content if the tab has dropdown options -->
      <div *ngIf="tab.hasDropdown">
        <div *ngFor="let option of tab.dropdownOptions">
          <div *ngIf="selectedSetting === option.action">
            <ng-container *ngComponentOutlet="getComponentForOption(option.action)"></ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
