<nav class="rounded-r-2xl" [ngClass]="sidebarClass">
  <div class="side-bar-header" *ngIf="!sidebarHidden">
    <img src="assets/logo.png" alt="Logo" />
  </div>

  <ul>
    <li *ngFor="let item of menuItems">
      <div class="menu-item w-full" (click)="toggleSubMenu(item)">
        <a *ngIf="!item.submenu"
           [routerLink]="item.route"
           routerLinkActive="active"
           class="flex gap-2 items-center w-full"
           [pTooltip]="item.label"
   tooltipPosition="right"
   [tooltipDisabled]="!sidebarHidden"
           [routerLinkActiveOptions]="{ exact: true }">
          <i *ngIf="item.icon" [class]="item.icon" [ngClass]="{'w-full mx-auto text-3xl pl-2': sidebarHidden}"></i>  
          <span *ngIf="!sidebarHidden">{{ item.label }}</span>
        </a>

        <span 
          class="flex gap-2 items-center"
          [pTooltip]="item.label"
          tooltipPosition="right"
          [tooltipDisabled]="!sidebarHidden"
          *ngIf="item.submenu">
          <i *ngIf="item.icon" [ngClass]="{'w-full mx-auto text-3xl pl-2': sidebarHidden}" [class]="item.icon"></i>
          <span *ngIf="!sidebarHidden">{{ item.label }} &#9662;</span>
        </span>
      </div>

      <ul [ngClass]="{'open': item.open}" *ngIf="item.submenu">
        <li *ngFor="let subItem of item.submenu">
          <a [routerLink]="subItem.route"
             routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: true }"
             [pTooltip]="subItem.label"
   tooltipPosition="right"
   [tooltipDisabled]="!sidebarHidden"
             class="flex gap-2 items-center">
            <i *ngIf="subItem.icon" [ngClass]="{'w-full mx-auto text-3xl pl-2': sidebarHidden}" [class]="subItem.icon"></i> 
            <span *ngIf="!sidebarHidden">{{ subItem.label }}</span>
          </a>
        </li>
      </ul>
    </li>

    <li>
      <div class="menu-item">
        <a 
          [routerLink]="marketplace.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          [pTooltip]="marketplace.label"
          tooltipPosition="right"
          [tooltipDisabled]="!sidebarHidden"
          class="flex gap-2 items-center">
          <i *ngIf="marketplace.icon" [ngClass]="{'w-full mx-auto text-3xl pl-2': sidebarHidden}"  [class]="marketplace.icon"></i>
          <span *ngIf="!sidebarHidden">{{ marketplace.label }}</span>
        </a>
      </div>
    </li>
  </ul>
</nav>
