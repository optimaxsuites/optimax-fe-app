<header class="w-full">
  <nav>
    <div class="flex items-center px-4 py-3 relative">
      <!-- Hamburger Menu for mobile-->
      <button
        class="px-5 py-3 hover:bg-gray-100 rounded-lg border md:hidden block border-gray-400 transition-colors"
        (click)="onToggleMenu()">
        <i class="fa-solid fa-bars text-xl text-gray-700"></i>
      </button>

      <!-- Logo (centered on mobile, left on desktop) -->
      <div class="h-full md:h-[20%] md:w-[9%] w-[24%]">
        <img src="./../../../../assets/Logo-green.png" alt="Logo" />
      </div>
      
      <!-- Cart Icon for Mobile -->
      <div class="md:hidden ml-auto">
        <button
          class="transition-colors p-3 relative hover:bg-gray-100 rounded-lg border border-gray-400"
          (click)="onToggleCart()"
          [disabled]="isCartEmpty"
          [ngClass]="{
            'opacity-100 cursor-not-allowed': isCartEmpty,
            'hover:bg-[#2EB270]/10': !isCartEmpty
          }"
        >
          <i class="fa-solid fa-cart-shopping text-lg" 
            [ngClass]="isCartEmpty ? 'text-gray-400' : 'text-[#2EB270]'"></i>
          
          <!-- Cart Badge -->
          @if (!isCartEmpty) {
            <span class="absolute -top-1 -right-1 bg-[#2EB270] text-white text-xs rounded-full h-5 w-5 flex items-center justify-center font-bold">
              {{ cartItemCount }}
            </span>
          }
        </button>
      </div>
    </div>
  </nav>
</header>
