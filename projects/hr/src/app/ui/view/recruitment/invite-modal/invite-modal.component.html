<p-dialog [(visible)]="visible" [header]="header" [modal]="true" (onHide)="close.emit()" [style]="{width: 'auto', height: 'auto', 'max-width': '90vw','min-width': '50vw', 'max-height': '90vh', 'min-height': '35vh', overflow: 'auto'}" >
  
  <!-- Step 1: Template Selection -->
  <div *ngIf="!isStepTwo" class="flex flex-col gap-4">
    <div>
      <label class="block mb-2 font-semibold">Select a Template</label>
      <p-dropdown [options]="templates" [(ngModel)]="selectedInviteTemplate" 
                  optionLabel="name" placeholder="Choose a template..." styleClass="w-full">
      </p-dropdown>
    </div>
    <div class="flex justify-end gap-2">
      <button class="btn-secondary" (click)="close.emit()">Cancel</button>
      <button class="btn-primary" [disabled]="!selectedInviteTemplate" (click)="goToPreview()">Next</button>
    </div>
  </div>

  <!-- Step 2: Configuration & Preview -->
  <div *ngIf="isStepTwo" class="flex flex-col gap-4">
    <div class="max-h-[60vh] overflow-y-auto pr-2">
      <!-- Required Fields from Template -->
      <div *ngIf="selectedInviteTemplate?.customPlaceholders?.length" class="mb-4">
        <h3 class="font-semibold mb-2">Required Information</h3>
        <div class="grid grid-cols-2 gap-3">
          <div *ngFor="let field of selectedInviteTemplate.customPlaceholders">
            <label class="text-sm text-gray-600">{{ field.label }}</label>
            <input type="text" [(ngModel)]="manualPlaceholderValues[field.key]" class="w-full p-2 border rounded" />
          </div>
        </div>
      </div>

      <!-- Panel Management -->
      <div class="mb-4">
        <div class="flex justify-between items-center mb-2">
          <h3 class="font-semibold">Interview Panel</h3>
          <button class="text-blue-600 text-sm" (click)="addPanelMember()">+ Add Member</button>
        </div>
        <div *ngFor="let member of interviewInviteSetup.panelMembers; let i = index" class="grid grid-cols-3 gap-2 mb-2 items-end">
          <select [(ngModel)]="member.id" (ngModelChange)="onPanelUserSelected(i, $event)" class="p-2 border rounded">
            <option value="">Select Interviewer</option>
            <option *ngFor="let user of availablePanelUsers" [value]="user.id">{{ user.label }}</option>
          </select>
          <input type="text" [(ngModel)]="member.role" placeholder="Role (e.g. Lead)" class="p-2 border rounded" />
          <button (click)="removePanelMember(i)" [disabled]="interviewInviteSetup.panelMembers.length === 1" class="text-red-500">Remove</button>
        </div>
      </div>

      <!-- Preview -->
      <div class="p-4 bg-gray-50 rounded border">
        <h4 class="font-bold border-b pb-2 mb-2">{{ resolveFinalContent(selectedInviteTemplate?.subject) }}</h4>
        <div [innerHTML]="resolveFinalContent(selectedInviteTemplate?.body)"></div>
      </div>
    </div>

    <div class="flex justify-end gap-2 border-t pt-4">
      <button class="btn-secondary" (click)="isStepTwo = false">Back</button>
      <button class="btn-primary" (click)="sendFinalMail()" [disabled]="sendLoading">
        {{ sendLoading ? 'Sending...' : 'Send Invitation' }}
      </button>
    </div>
  </div>
</p-dialog>
