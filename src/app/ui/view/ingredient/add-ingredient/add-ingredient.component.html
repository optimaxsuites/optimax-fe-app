<div class="form-footer">
    <p class="back" (click)="navigateToPrevious()">
      <i class="fa-solid fa-arrow-left"></i> Back
    </p>
    <button   (click)="onSubmit()">Add Ingredient</button>
  </div>
  
  

  <div class="form-container ">
    <h2 class="text-2xl font-semibold mb-4 text-gray-800">Add Ingredient</h2>

    <!-- Use ngModel for two-way data binding -->
    <form (ngSubmit)="onSubmit()" novalidate [formGroup]="ingredientForm" class="space-y-4">
        <!-- Ingredient Name -->
        <div>
            <label for="default-input" class="block mb-2 text-xl font-medium text-gray-900 dark:text-white text-left">Ingredient Name</label>
            <input formControlName="ingredientName" type="text" id="default-input" class="bg-gray-50 border py-3 border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" />
        </div>

        <!-- SKU -->
        <div>
            <label for="sku" class="block mb-2 text-xl font-medium text-gray-900 dark:text-white text-left">SKU</label>
            <input type="text" id="sku" formControlName="sku" name="sku" class="bg-gray-50 border py-3 border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" required />
        </div>

        <!-- Code -->
        <div>
            <label for="code"class="block mb-2 text-xl font-medium text-gray-900 dark:text-white text-left">Code</label>
            <input id="code" type="text" formControlName="code" name="code" class="bg-gray-50 border py-3 border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" />
        </div>

        <!-- Category -->
        <div class="space-y-3">
            <label for="category" class="block mb-2 text-xl font-medium text-gray-900 dark:text-white text-left">Category</label>
            <select id="category" formControlName="category" name="category" class="bg-gray-50 border py-3 border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full  text-xl p-2.5" required>
                <option value="">Select Category</option>
                <option value="Dairy">Dairy</option>
                <option value="Vegetables">Vegetables</option>
                <option value="Spices">Spices</option>
                <option value="Fruits">Fruits</option>
                <option value="Grains">Grains</option>
                <option value="Proteins">Proteins</option>
                <option value="Seafood">Seafood</option>
            </select>
        </div>

       <!-- Description -->
       <div >
        <label for="description" class="block mb-2 text-xl font-medium text-gray-900 dark:text-white text-left">Description</label>
        <textarea id="description" formControlName="description" name="description" rows="3" class="bg-gray-50 border py-3 border-gray-300 text-gray-900 text-xl rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white"></textarea>
      </div>

      <!-- Purchase Price -->
      <div class="mb-8">
        <label for="purchase-price" class="block mb-2 text-xl font-medium text-gray-900 dark:text-white text-left">Purchase Price</label>
        <input type="text" id="purchase-price" formControlName="purchasePrice" (input)="formatNumber($event)" placeholder="Enter price (e.g., 1,000)" required class="bg-gray-50 border py-3 border-gray-300 text-gray-900 text-xl rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
      </div>

      <!-- Selling Price -->
      <div class="mb-6">
        <label for="selling-price" class="block mb-2 text-xl font-medium text-gray-900 dark:text-white text-left">Selling Price</label>
        <input type="text" id="selling-price" formControlName="sellingPrice" name="sellingPrice" placeholder="Enter Selling price (e.g., 1,500)" pattern="^\d{1,3}(,\d{3})*(\.\d+)?$" title="Enter a valid number like 7,500" required class="bg-gray-50 border py-3 border-gray-300 text-gray-900 text-xl rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
      </div>

      <!-- Current Stock -->
      <div class="mb-6">
        <label for="current-stock" class="block mb-2 text-xl font-medium text-gray-900 dark:text-white text-left">Current Stock</label>
        <input type="text" id="current-stock" formControlName="currentStock" (input)="formatNumber($event)" placeholder="Enter stock (e.g., 1,000)" required class="bg-gray-50 border py-2 border-gray-300 text-gray-900 text-xl rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
      </div>

      <!-- Restock Quantity -->
      <div class="mb-6">
        <label for="restock-quantity" class="block mb-2 text-xl font-medium text-gray-900 dark:text-white text-left">Restock Quantity</label>
        <input type="number" id="restock-quantity" formControlName="restockQuantity" name="restockQuantity" placeholder="Enter restock quantity" min="1" required class="bg-gray-50 border py-2 border-gray-300 text-gray-900 text-xl rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
      </div>

      <!-- Reorder Threshold -->
      <div class="mb-6">
        <label for="reorder-threshold" class="block mb-2 text-xl font-medium text-gray-900 dark:text-white text-left">Reorder Threshold</label>
        <input type="text" id="reorder-threshold" formControlName="reorderThreshold" (input)="formatNumber($event)" placeholder="Enter threshold (e.g., 1,000)" class="bg-gray-50 border py-2 border-gray-300 text-gray-900 text-xl rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
      </div>

      <!-- Measurement Unit -->
      <div class="mb-6">
        <label for="measurement-unit" class="block mb-2 text-xl font-medium text-gray-900 dark:text-white text-left">Measurement Unit</label>
        <select id="measurement-unit" formControlName="measurementUnit" name="measurementUnit" required class="bg-gray-50 border py-2 border-gray-300 text-gray-900 text-xl rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
          <option value="">Select Unit</option>
          <option value="kg">kg</option>
          <option value="g">g</option>
          <option value="liters">liters</option>
          <option value="ml">ml</option>
          <option value="pieces">pieces</option>
          <option value="units">units</option>
          <option value="bags">bags</option>
          <option value="cartons">cartons</option>
        </select>
      </div>
      

  
      <!-- Supplier Name -->
      <div>
        <label for="supplier-name" class="block mb-2 font-medium text-gray-800 dark:text-white text-left">Supplier Name</label>
        <input type="text" id="supplier-name" formControlName="supplier" class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
    </div>

    <!-- Supplier Contact -->
    <div>
        <label for="supplier-contact" class="block mb-2 font-medium text-gray-800 dark:text-white text-left">Supplier Contact</label>
        <input type="text" id="supplier-contact" formControlName="supplierContact" class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
    </div>

    <!-- Expiration Date -->
    <div>
        <label for="expiration-date" class="block mb-2 font-medium text-gray-800 dark:text-white text-left">Expiration Date</label>
        <input type="date" id="expiration-date" formControlName="expirationDate" class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
    </div>

    <!-- Branch -->
    <div>
        <label for="branch" class="block mb-2 font-medium text-gray-800 dark:text-white text-left">Branch</label>
        <select id="branch" formControlName="branch" class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required>
            <option value="">Select Branch</option>
            <option value="Main Branch">Main Branch</option>
            <option value="Secondary Branch">Secondary Branch</option>
        </select>
    </div>

    <!-- Storage Requirements -->
    <div>
        <label for="storage-requirements" class="block mb-2 font-medium text-gray-800 dark:text-white text-left">Storage Requirements</label>
        <textarea id="storage-requirements" formControlName="storageRequirement" rows="3" class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white"></textarea>
    </div>
