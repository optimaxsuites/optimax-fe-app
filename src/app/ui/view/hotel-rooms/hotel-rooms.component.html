<div
  class="fixed inset-0 z-50 overflow-y-auto bg-black bg-opacity-50 flex items-center justify-center"
>
  <!-- Modal Animation Container -->
  <div
    class="relative transform transition-all ease-in-out duration-300 scale-100"
  >
    <!-- Modal Content -->
    <div
      class="bg-white rounded-xl shadow-2xl w-full max-w-6xl max-h-[90vh] overflow-y-auto"
    >
      <!-- Modal Header -->
      <div
        class="px-6 py-4 bg-indigo-600 text-white flex justify-between items-center sticky top-0 z-10"
      >
        <h2 class="text-2xl font-bold">Create New Room</h2>
        <button
          (click)="closeRoomModal()"
          class="text-white hover:text-gray-200 focus:outline-none transition-colors"
        >
          <i class="pi pi-times text-xl"></i>
        </button>
      </div>

      <!-- Form Content -->
      <div class="p-6 bg-gray-50">
        <form [formGroup]="roomForm" (ngSubmit)="onSubmit()" class="space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Room Number -->
            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700"
                >Room Number*</label
              >
              <input
                type="number"
                formControlName="number"
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-customGreen focus:border-customGreen"
                placeholder="Enter room number"
                min="100"
                max="9999"
              />
              <div
                *ngIf="
                  roomForm.get('number')?.invalid &&
                  roomForm.get('number')?.touched
                "
                class="text-red-500 text-sm"
              >
                Room number must be between 100-9999
              </div>
            </div>

            <!-- Room Type -->
            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700"
                >Room Type*</label
              >
              <input
                type="text"
                formControlName="type"
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-customGreen focus:border-customGreen"
                placeholder="Enter room type"
              />
              <div
                *ngIf="
                  roomForm.get('type')?.invalid && roomForm.get('type')?.touched
                "
                class="text-red-500 text-sm"
              >
                Room type is required
              </div>
            </div>

            <!-- Status -->
            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700"
                >Status*</label
              >
              <select
                formControlName="status"
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-customGreen focus:border-customGreen"
              >
                <option *ngFor="let status of roomStatuses" [value]="status">
                  {{ status | titlecase }}
                </option>
              </select>
            </div>

            <!-- Floor -->
            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700"
                >Floor*</label
              >
              <input
                type="number"
                formControlName="floor"
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-customGreen focus:border-customGreen"
                placeholder="Enter floor number"
                min="1"
                max="99"
              />
              <div
                *ngIf="
                  roomForm.get('floor')?.invalid &&
                  roomForm.get('floor')?.touched
                "
                class="text-red-500 text-sm"
              >
                Floor must be between 1-99
              </div>
            </div>

            <!-- Rate -->
            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700"
                >Nightly Rate*</label
              >
              <input
                type="number"
                formControlName="rate"
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-customGreen focus:border-customGreen"
                placeholder="Enter nightly rate"
                min="1000"
                step="0.01"
              />
              <div
                *ngIf="
                  roomForm.get('rate')?.invalid && roomForm.get('rate')?.touched
                "
                class="text-red-500 text-sm"
              >
                Rate must be at least 1000
              </div>
            </div>

            <!-- Beds -->
            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700"
                >Number of Beds*</label
              >
              <input
                type="number"
                formControlName="beds"
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-customGreen focus:border-customGreen"
                placeholder="Enter number of beds"
                min="1"
                max="10"
              />
              <div
                *ngIf="
                  roomForm.get('beds')?.invalid && roomForm.get('beds')?.touched
                "
                class="text-red-500 text-sm"
              >
                Must be between 1-10 beds
              </div>
            </div>

            <!-- Max Occupancy -->
            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700"
                >Max Occupancy*</label
              >
              <input
                type="number"
                formControlName="maxOccupancy"
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-customGreen focus:border-customGreen"
                placeholder="Enter max occupancy"
                min="1"
                max="10"
              />
              <div
                *ngIf="
                  roomForm.get('maxOccupancy')?.invalid &&
                  roomForm.get('maxOccupancy')?.touched
                "
                class="text-red-500 text-sm"
              >
                Must be between 1-10 guests
              </div>
            </div>

            <!-- Description -->
            <div class="space-y-2 md:col-span-2">
              <label class="block text-sm font-medium text-gray-700"
                >Description</label
              >
              <textarea
                formControlName="description"
                rows="3"
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-customGreen focus:border-customGreen"
                placeholder="Enter room description"
              ></textarea>
            </div>

            <!-- Amenities -->
            <div class="space-y-2 md:col-span-2">
              <label class="block text-sm font-medium text-gray-700"
                >Amenities</label
              >
              <div class="flex gap-2">
                <input
                  type="text"
                  [(ngModel)]="newAmenity"
                  (keyup.enter)="addAmenity()"
                  [ngModelOptions]="{ standalone: true }"
                  class="w-1/2 px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-customGreen focus:border-customGreen"
                  placeholder="Type an amenity and press Enter"
                />
                <button
                  type="button"
                  (click)="addAmenity()"
                  class="px-4 py-2 bg-customGreen text-white rounded-md hover:bg-customGreenHover focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-customGreen"
                >
                  Add
                </button>
              </div>

              <!-- List of selected amenities -->
              <div class="flex flex-wrap gap-2 mt-2">
                <span
                  *ngFor="let amenity of selectedAmenities; let i = index"
                  class="inline-flex items-center px-3 py-1 rounded-full bg-indigo-100 text-indigo-800"
                >
                  {{ amenity }}
                  <button
                    type="button"
                    (click)="removeAmenity(i)"
                    class="ml-1.5 inline-flex text-indigo-600 hover:text-indigo-900 focus:outline-none"
                  >
                    <svg
                      class="h-4 w-4"
                      fill="currentColor"
                      viewBox="0 0 20 20"
                    >
                      <path
                        fill-rule="evenodd"
                        d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                        clip-rule="evenodd"
                      ></path>
                    </svg>
                  </button>
                </span>
              </div>
            </div>
          </div>

          <div class="flex justify-end gap-4 pt-6">
            <button
              type="button"
              (click)="closeRoomModal()"
              class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-customGreen hover:bg-customGreenHover focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-customGreen"
            >
              Create Room
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
