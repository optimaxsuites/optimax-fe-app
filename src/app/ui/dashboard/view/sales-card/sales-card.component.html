  <div class="container-sales">
    <div *ngFor="let item of data; let i = index" 
      class='sales bg-{{i+1}}'>
        <div class="text">
          <p class='sales-no'>{{item.salesno}}</p>
        <p class='sales-tittle'>{{item.title}}</p>
        </div>
        <div class="img">
          <i class={{item.icon}}></i>
        </div>
    </div>

</div>
