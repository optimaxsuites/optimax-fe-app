<p-toast position="top-center"></p-toast>
<p-confirmDialog
      styleClass="p-toast-message-custom"
      rejectButtonStyleClass="p-button-text"
    ></p-confirmDialog>
<p-card>
    <ng-template pTemplate="title">
        <b>{{ptitle}}</b>
    </ng-template>
  
        <p-timeline [value]="hts_registration_track_order" layout="horizontal" align="bottom">
            <ng-template pTemplate="marker" let-track>
               {{pp(track.fsdi)}}
                <span class="custom-marker p-shadow-2" [ngStyle]="{'background-color': enrolled ? '#607D8B' : '#FF9800'}">
                    <i class="{{enrolled ? 'pi pi-check' : 'pi pi-times'}}"></i>
                </span>
            </ng-template>
            
            <ng-template pTemplate="content" let-track>
                {{track.name}}
            </ng-template>
        </p-timeline>
   

    <ng-template pTemplate="content">
        <div class="p-fluid p-formgrid p-grid p-col-12">
            <div class="p-field p-col-4">
                <label for="date_of_report"><b>Client Activity/Report Date*</b></label>
                <p-calendar [monthNavigator]="true" [yearNavigator]="true" yearRange="2000:2030"
                [(ngModel)]= "dateOfEnrolment" required
                            inputId="navigators" [showIcon]="true" showButtonBar="true" 
                            dateFormat="dd/mm/yy" #dor="ngModel" [ngClass]="{'ng-dirty': (dor.invalid) || (dor.dirty && dor.invalid)}">
                </p-calendar>
                <!--small *ngIf="(dor.invalid) || (dor.dirty && dor.invalid)" class="p-error">
                Client activity/report date is required</small-->
                </div>

<div class="p-col-12" *ngIf="formRendered">
    <formio [form]="customServiceForm" (submit)="confirmBeforeAdding($event)"></formio>
  </div>

  </div>
  </ng-template>


  </p-card>
