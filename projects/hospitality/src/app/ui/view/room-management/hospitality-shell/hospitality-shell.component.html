<!-- Hospitality Admin Shell -->
<div class="min-h-screen bg-gray-50">

    <!-- Top Navigation Bar -->
    <div class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6">
            <!-- Brand Header -->
            <div class="flex items-center justify-between py-4 border-b border-gray-100">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-customBlue rounded-lg flex items-center justify-center">
                        <i class="fa-solid fa-hotel text-white text-sm"></i>
                    </div>
                    <div>
                        <h1 class="text-base font-bold text-gray-800">Hospitality Admin</h1>
                        <p class="text-xs text-gray-400">Rooms Management Panel</p>
                    </div>
                </div>
                <!-- <div class="flex items-center gap-2 text-xs text-gray-400">
                    <i class="fa-solid fa-shield-halved text-customGreen"></i>
                    <span>Admin Access</span>
                </div> -->
            </div>

            <!-- Nav Tabs -->
            <nav class="flex items-center gap-1 overflow-x-auto py-1">
                <a *ngFor="let item of navItems" [routerLink]="item.route"
                    class="flex items-center gap-2 px-4 py-3 text-sm font-medium rounded-t-lg transition-all whitespace-nowrap border-b-2 -mb-px"
                    [ngClass]="isActive(item.route)
            ? 'border-customBlue text-customBlue bg-customBlue/5'
            : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'">
                    <i [class]="item.icon" class="text-sm"></i>
                    {{ item.label }}
                </a>
            </nav>
        </div>
    </div>

    <!-- Page Content -->
    <div class="max-w-7xl mx-auto">
        <router-outlet></router-outlet>
    </div>
</div>
