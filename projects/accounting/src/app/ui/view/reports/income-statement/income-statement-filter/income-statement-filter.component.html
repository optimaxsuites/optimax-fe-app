<!-- income-statement-filter.component.html -->
<button class="filter-btn" (click)="openFilterModal()">
  <i class="fa fa-filter"></i> Filters
</button>

<div class="modal-overlay" *ngIf="showFilterModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Filter Options</h3>
      <button class="btn cancel-btn" (click)="closeFilterModal()">&times;</button>
    </div>
    
    <form [formGroup]="filterForm" class="modal-body">
      <div class="form-section">
        <h2>Report Type</h2>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" formControlName="reportType" id="Actual" value="Actual">
            <span class="radio-label">Actual</span>
          </label>
          
          <label class="radio-option">
            <input type="radio" formControlName="reportType" id="Budget" value="Budget">
            <span class="radio-label">Budget</span>
          </label>
          
          <label class="radio-option">
            <input type="radio" formControlName="reportType" id="Actual vs Budget" value="Actual vs Budget">
            <span class="radio-label">Actual vs Budget</span>
          </label>
          
          <label class="radio-option">
            <input type="radio" formControlName="reportType" id="Actual vs Previous Year" value="Actual vs Previous Year">
            <span class="radio-label">Actual vs Previous Year</span>
          </label>
        </div>
      </div>

      <div class="form-section">
        <h4>Entity</h4>
        <select formControlName="entity" id="reportTypeActual" class="form-select">
          <option value="All Locations">All Locations</option>
          <option value="Location 1">Location 1</option>
          <option value="Location 2">Location 2</option>
          <option value="Location 3">Location 3</option>
        </select>
      </div>

      <div class="form-section">
        <h4>Period</h4>
        <select formControlName="period" id="period" class="form-select">
          <option value="This Month">This Month</option>
          <option value="Last Month">Last Month</option>
          <option value="This Quarter">This Quarter</option>
          <option value="This Year">This Year</option>
          <option value="Custom Range">Custom Range</option>
        </select>
      </div>

      <div class="form-section">
        <h4>Display Options</h4>
        <div class="checkbox-group">
          <label class="checkbox-option">
            <input type="checkbox" formControlName="showPercentages" id="showPercentages">
            <span class="checkbox-label">Show Percentages</span>
          </label>
          
          <label class="checkbox-option">
            <input type="checkbox" formControlName="showVariance" id="showVariance">
            <span class="checkbox-label">Show Variance</span>
          </label>
          
          <label class="checkbox-option">
            <input type="checkbox" formControlName="includeForecasts" id="includeForecasts">
            <span class="checkbox-label">Include Forecasts</span>
          </label>
        </div>
      </div>
    </form>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="resetFilters()">
        Reset
      </button>
      <button type="button" class="btn apply-btn" (click)="applyFilters()">
        Apply Filters
      </button>
    </div>
  </div>
</div>
