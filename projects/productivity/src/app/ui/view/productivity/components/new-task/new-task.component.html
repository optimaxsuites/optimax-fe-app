


  <div
    class="bg-white p-8 rounded-lg shadow-lg w-[450px]  overscroll-auto"
  >
    <h2 class="text-2xl font-bold mb-6 text-center">Create New Task</h2>

    <div class="space-y-6 text-lg w-[400px] p-10 ">
      <div class="flex flex-row gap-4 items-center">
        <label class="font-medium w-40">Task Name</label>
        <div class="w-full">
          <input
            [(ngModel)]="task.name"
            class="w-full p-3 border-2 border-gray-300 rounded-lg bg-gray-100 text-gray-800 text-lg"
            type="text"
            placeholder="Enter Task Title"
          />
          <p *ngIf="errors.name" class="text-red-500 text-sm">
            {{ errors.name }}
          </p>
        </div>
      </div>

      <!-- <div class="grid grid-cols-2 gap-4 items-start"> -->
      <div class="flex flex-row gap-4 items-center">
        <label class="font-medium w-40">Owner</label>
        <div class="w-full relative">
          <input
            type="text"
            [(ngModel)]="searchQuery"
            (input)="filterUsers()"
            placeholder="Search users..."
            class="w-full p-3 border-2 border-gray-300 rounded-lg bg-gray-100 text-gray-800 text-lg"
          />
          <ul
            *ngIf="searchQuery && filteredUsers.length"
            class="absolute w-full bg-white border rounded shadow-md mt-1"
          >
            <li
              *ngFor="let user of filteredUsers"
              (click)="addUser(user.email)"
              class="p-3 cursor-pointer hover:bg-gray-200 text-lg"
            >
              {{ user.email }}
            </li>
          </ul>
          <p *ngIf="errors.selectedUsers" class="text-red-500 text-sm">
            {{ errors.selectedUsers }}
          </p>
        </div>
      </div>

      <div
        *ngIf="task?.selectedUsers?.length"
        class="flex flex-wrap p-3 w-96 ml-36 border-2 border-slate-200 rounded-lg bg-gray-100"
      >
        <span
          *ngFor="let email of task.selectedUsers"
          class="bg-white px-3 py-2 rounded-lg text-lg border border-gray-300 shadow-md flex items-center space-x-2"
        >
          <img
            src="../../../../../../assets/images/head.PNG"
            class="w-12 h-12 rounded-full"
            alt=""
          />
          <span>{{ email }}</span>
        </span>
      </div>

      <div class="flex flex-row gap-4 items-center">
        <label class="font-medium w-40">Status</label>
        <div class="w-full">
          <select
            [(ngModel)]="task.status"
            class="w-full p-3 border-2 border-gray-300 rounded-lg bg-gray-100 text-gray-800 text-lg"
          >
            <option value="">Select Status</option>
            <option>Not Started</option>
            <option>In Progress</option>
            <option>Completed</option>
          </select>
          <p *ngIf="errors.status" class="text-red-500 text-sm">
            {{ errors.status }}
          </p>
        </div>
      </div>

      <div class="flex flex-row gap-4 items-center">
        <label class="font-medium w-40">Due Date</label>
        <div class="w-full">
          <input
            type="date"
            [(ngModel)]="task.dueDate"
            class="w-full p-3 border-2 border-gray-300 rounded-lg bg-gray-100 text-lg"
          />
          <p *ngIf="errors.dueDate" class="text-red-500 text-sm">
            {{ errors.dueDate }}
          </p>
        </div>
      </div>

      <div class="flex flex-row gap-4 items-center">
        <label class="font-medium w-40">Priority</label>
        <div class="w-full">
          <select
            [(ngModel)]="task.priority"
            class="w-full p-3 border-2 border-gray-300 rounded-lg bg-gray-100 text-gray-800 text-lg"
          >
            <option value="">Select Priority</option>
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
          </select>
          <p *ngIf="errors.priority" class="text-red-500 text-sm">
            {{ errors.priority }}
          </p>
        </div>
      </div>

      <div class="flex flex-row gap-4 items-center">
        <label class="font-medium w-40">Timeline</label>
        <div class="w-full flex space-x-3">
          <div class="flex flex-col w-full">
            <input
              type="date"
              [(ngModel)]="task.startDate"
              class="w-full p-3 border-2 border-gray-300 rounded-lg bg-gray-100 text-lg"
            />
            <p *ngIf="errors.timeline" class="text-red-500 text-sm">
              {{ errors.timeline }}
            </p>
          </div>

          <div class="flex flex-col w-full">
            <input
              type="date"
              [(ngModel)]="task.endDate"
              class="w-full p-3 border-2 border-gray-300 rounded-lg bg-gray-100 text-lg"
            />

            <p *ngIf="errors.timelinetwo" class="text-red-500 text-sm">
              {{ errors.timelinetwo }}
            </p>
          </div>
        </div>
      </div>

      <div class="flex flex-row gap-4 items-center">
        <label class="font-medium w-40">Budget</label>
        <div class="w-full">
          <input
            type="number"
            [(ngModel)]="task.effortEstimation"
            class="w-full p-3 border-2 border-gray-300 rounded-lg bg-gray-100 text-lg"
          />
          <p *ngIf="errors.effortEstimation" class="text-red-500 text-sm">
            {{ errors.effortEstimation }}
          </p>
        </div>
      </div>
    </div>

    <div class="flex justify-between items-center mt-6 px-10">
      <button
        (click)="closeModal()"
        class="text-gray-600 p-3 rounded-lg text-lg hover:bg-gray-300 transition"
      >
        Cancel
      </button>
      <button
        (click)="createTask()"
        class="bg-green-600 text-white px-6 py-3 rounded-lg text-lg hover:bg-green-700 transition"
      >
        Create Task
      </button>
    </div>
  </div>
<!-- </div> -->
