<p-toast class="table-item"></p-toast>
<div class="card">
  <app-back-button class="table-item" (click)="goBack()"></app-back-button>

  <div class="invite-main">
    <div>
      <h3 class="remove-mb mb-3"><strong>Job Posting Form</strong></h3>
      <!-- <p class="note">All fields are required</p><br> -->


      <div class="input-container-100 flex-item justify-center table-item">
        <div class="input-container-50 space-y-2 ">
          <!-- Job Title -->
          <label for="jobTitle">Job Title: <span style="color: red;">*</span></label>
          <input type="text" id="jobTitle" placeholder="Job Title" class="editInput h-[36px]" name="jobTitle" [(ngModel)]="jobData.jobTitle" required>
          
          <!-- Job Category -->
          <label for="jobCategory">Category: <span style="color: red;">*</span></label>
          <ng-select 
            bindLabel="name"
            bindValue="id"
            placeholder="Select Category"
            [(ngModel)]="jobData.jobCategory"
            [items]="jobCategories">
          </ng-select>
          
          <!-- Job Type -->
          <label for="jobType">Job Type: <span style="color: red;">*</span></label>
          <ng-select 
            bindLabel="name"
            bindValue="id"
            placeholder="Select Job Type"
            [(ngModel)]="jobData.jobType"
            [items]="jobTypes">
          </ng-select>
          
          <!-- Job Location -->
          <label for="jobLocation">Location:</label>
          <input type="text" id="jobLocation" placeholder="Location" class="editInput h-[36px]" name="jobLocation" [(ngModel)]="jobData.location" required>
          
          <!-- Experience -->
          <label for="experience">Experience:</label>
          <ng-select 
            bindLabel="name"
            bindValue="id"
            placeholder="Select Experience Year"
            [(ngModel)]="jobData.jobVacancyExperience"
            [items]="jobExperienceLevels">
          </ng-select>
          
          <!-- Qualification -->
          <label for="qualification">Qualification:</label>
          <ng-select 
            bindLabel="name"
            bindValue="id"
            placeholder="Select Qualification"
            [(ngModel)]="jobData.qualifications"
            [items]="jobQualification">
          </ng-select>
          
          <!-- specification -->
          <label for="specification">Specification:</label>
          <ng-select 
            bindLabel="name"
            bindValue="id"
            placeholder="Select Specification"
            [(ngModel)]="jobData.jobVacancySpecification"
            [items]="jobSpecifications">
          </ng-select>
          
          <div class="input-container-100 d-flex gap-2">
            <div class="input-container-50 space-y-2">
              <!-- Posted Date -->
              <label for="postedDate">Posted Date:</label>
              <!-- <input type="datetime-local" id="postedDate" class="editInput h-[36px] mb-4" name="postedDate" [ngModel]="jobData.jobPostedDate | date: 'dd-MM-yyyy HH:mm'" disabled required> -->
              <input 
              type="datetime-local" 
              id="postedDate" 
              class="editInput h-[36px] mb-4" 
              name="postedDate" 
              [value]="formatToDatetimeLocal(jobData.jobPostedDate!)" 
              disabled 
              required>
            </div>
            <div class="input-container-50 space-y-2">
              <!-- Expiry Date -->
              <label for="expiryDate">Expiry Date: <span style="color: red;">*</span></label>
              <!-- <input type="datetime-local" id="expiryDate" class="editInput h-[36px] mb-4" name="expiryDate" [(ngModel)]="jobData.jobExpiryDate"  required> -->
              <input 
              type="datetime-local" 
              id="expiryDate" 
              class="editInput h-[36px] mb-4" 
              name="expiryDate" 
              [(ngModel)]="jobExpiryDateInput" 
              (ngModelChange)="onExpiryDateChange($event)" 
              required>
            </div>
          </div>

          <div>
            <div class="" *ngIf="customFieldList && customFieldList.length > 0">
              <hr>
              <h4><strong>Customised input field(s)</strong></h4>
              <div class="card list-card-wrapper p-4 m-2" *ngFor="let item of customFieldList">
                <div class="list-card-right">
                  <span>{{ item.label }} - {{ item.type }} - {{ item.required ? 'Required' : 'Optional' }}</span>
                </div>
              </div>
            </div>
            
            <!-- <hr> -->
            <div class="btn-wrapper" >
              <button class="add-btn" (click)="toggleSideModal()">
                <i class="fas fa-plus me-2"></i>{{ jobData.jobVacancyCustomFields?.length! > 0 ? 'Edit Customize Input' : 'Add Customize Input' }}
              </button>
            </div>
          </div>
        </div>
        <div class="input-container-50">
          <label for="">Overview & Description: <span style="color: red;">*</span></label>
          <p-editor [(ngModel)]="jobData.companyOverview" placeholder="Overview & Description..."  [style]="{ height: '100vh' }" />
        </div>
      </div>
      <div class="btn-wrapper">
        <app-button (click)="onSubmitForm()" text="{{ isEdit ? 'Update' : 'Create' }}" type="submit" class="btn-navigate"></app-button>
      </div>
    </div>
  </div>
</div>


<app-side-modal *ngIf="openSideModal" (close)="openSideModal = false">
  <div class="modal-header flex justify-between items-center text-gray-700">
    <h2 class="font-semibold pb-0 mb-0">Add Customise Input</h2>
    <div class="flex gap-3">
      <button class="border-2 border-customBlue py-2 px-4 rounded-xl text-xl font-semibold" (click)="openSideModal = false">Cancel</button>
    </div>
  </div>
<br>

  <div class="input-container-100 d-flex gap-2 table-item">
    <div class="input-container-50 space-y-2 ">
      <!-- Posted Date -->
      <label for="postedDate">Label:</label>
      <input type="text" id="" class="editInput h-[36px] mb-4" name="" placeholder="Enter Label" [(ngModel)]="customField.label"  required>
    </div>
    <div class="input-container-50 space-y-2">
      <!-- Expiry Date -->
      <label for="expiryDate">Type:</label>
      <ng-select 
        [items]="customType"
        bindLabel="label"
        bindValue="value"
        placeholder="Select Input Type"
       [(ngModel)]="customField.type">
      </ng-select>
    </div> 
  </div>
  <div class="flex gap-3 items-center">
    <input type="checkbox" [(ngModel)]="customField.required" class=" h-7 w-7 accent-customGreen border border-gray-300 rounded-md" />
    <label for="" class="block text-[13px] font-medium cursor-pointer">Required</label>
  </div>
  <div class="btn-container-btn">
    <app-button text="{{editIndex !== null ? 'Update Input' : 'Add Input'}}" class="btn-navigate" (click)="addOrUpdateCustomField()"></app-button>
  </div>
  <div class="show-added-customisedInputs table-item editInputDashed text-center">
    <ul>
      <li *ngIf="customFieldList.length == 0">
        <span>Add Customized Field(s)</span>
      </li>
      <li *ngFor="let input of customFieldList; let i = index">
        <div class="editInput p-4 m-2 flex justify-between w-full items-center table-item">
          <div>
            <span>{{ input.label }} - {{ input.type }} - {{ input.required ? 'Required' : 'Optional' }}</span>
          </div>
          <!-- <div class="ist-card-left"> -->
            <div class="">
              <button pButton icon="pi pi-pencil" (click)="onEditCustomInput(i)" class="icon-edit" title="Edit"></button>
              <button pButton icon="pi pi-trash" (click)="onDeleteCustomiseInput(i)" class="icon-delete" title="Delete"></button>
            </div>
          <!-- </div> -->
        </div>
      </li>
    </ul>
  </div>
  <div class="btn-container">
    <app-button text="Save" class="btn-navigate" (click)="saveCustomiseInputs()"></app-button>
  </div>
  <div></div>
</app-side-modal>
