<div class="p-4 mb-6 border rounded-xl bg-blue-50">
  <label class="font-semibold text-customBlue">Apply same Paystack Key to all branches</label>

  <div class="flex gap-4 mt-2">
    <input
      type="text"
      [(ngModel)]="newBranch.key"
      class="w-full border border-gray-300 rounded-md p-2"
      placeholder="pk_live_xxxxxxxxxxxxx"
    />

    <button
      class="px-4 py-2 bg-customBlue text-white rounded-md disabled:bg-customBlueHover disabled:cursor-not-allowed"
      (click)="applyKeyToAll()"
      [disabled]="loading || newBranch.key.trim() === ''"
    >
      Apply to All
    </button>
  </div>
</div>


<mat-accordion>
  @for(branch of branches; track branch.id){
  <mat-expansion-panel #panel>
    <mat-expansion-panel-header>
      <mat-panel-title class="capitalize">
        {{ branch.name }}
      </mat-panel-title>
      <mat-panel-description class="action-buttons">
        <button
          (click)="editBranch(branch, $event)"
          class="text-customGreen hover:bg-green-50 p-3 rounded-xl"
        >
          <i class="fa-solid fa-pen-to-square cursor-pointer text-2xl pr-2"></i>
          <span *ngIf="panel.expanded">{{
            branch.isEditing ? "Save Changes" : "Edit"
          }}</span>
        </button>

      </mat-panel-description>
    </mat-expansion-panel-header>

    <div class="p-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Name and Phone Number -->
        <div>
          <div class="mb-4">
            <label class="block text-customBlue font-semibold mb-1">Paystack key</label>
            @if(branch.isEditing){
            <input
              type="text"
              class="w-full border border-gray-300 rounded-md p-2"
              [(ngModel)]="newBranch.key"
            />
            } @else {
            <p class="w-full border border-gray-300 rounded-md p-2">{{ branch.key }}</p>
            }
          </div>

 
        </div>

    
      </div>
    </div>
  </mat-expansion-panel>
  } @empty {
  <div class="p-6 text-center text-gray-500">
    No branches found.
  </div>
  }
</mat-accordion>
