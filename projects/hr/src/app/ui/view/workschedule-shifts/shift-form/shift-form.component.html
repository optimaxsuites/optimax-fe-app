<div class="form-overlay">

  <div class="form-card">

    <!-- HEADER -->
    <div class="form-header">
      <h3>{{ isEditMode ? 'Edit Shift' : 'Create Shift' }}</h3>
      <button class="close-btn" (click)="close()">✕</button>
    </div>

    <!-- FORM -->
    <form [formGroup]="shiftForm" (ngSubmit)="saveShift()">

      <div class="form-grid">

        <!-- SHIFT NAME -->
        <div class="form-group">
          <label class="required-label">Shift Name</label>
          <input type="text" formControlName="name" placeholder="Morning Shift"/>
        </div>

        <!--SHIFT TYPE-->
        <!--<div class="form-group">
        <label>Shift Type</label>
        <select formControlName="type">
          <option value="morning">Morning</option>
          <option value="evening">Evening</option>
          <option value="night">Night</option>
          <option value="custom">Custom</option>
        </select>
        </div> -->

        <div class="form-group">
          <label>Shift Type</label>

          <input
            type="text"
            [value]="detectedShiftType | titlecase"
            readonly
          />
        </div>

        <!-- DEPARTMENT -->
        <!--<div class="form-group">
          <label>Department</label>
          <input type="text" formControlName="department" placeholder="Engineering"/>
        </div>-->

        <!-- START TIME -->
        <div class="form-group">
          <label class="required-label">Start Time</label>
          <input type="time" formControlName="startTime"/>
        </div>

        <!-- END TIME -->
        <div class="form-group">
          <label class="required-label">End Time</label>
          <input type="time" formControlName="endTime"/>
        </div>

        <div
          class="error"
          *ngIf="
            shiftForm.errors?.['invalidShiftTime']
          "
        >
          End time must be after start time
          for morning and evening shifts.
        </div>

        <!-- BREAK TIME -->
        <!--<div class="form-group">
          <label>Break Time (minutes)</label>
          <input type="number" formControlName="breakTime" placeholder="60"/>
        </div>-->

        <!-- COLOR -->
        <div class="form-group">
          <label class="required-label">Shift Color</label>
         <!-- <input type="color" formControlName="color"/> -->
          <div class="color-picker">
            <div
              *ngFor="let c of colorOptions"
              class="color-block"
              [style.background]="c"
              [class.selected]="shiftForm.value.color === c"
              (click)="selectColor(c)"
            ><span class="tick" *ngIf="shiftForm.value.color === c">✔</span>
          </div>            
          </div>
        </div>

      </div>

      <!-- DESCRIPTION -->
      <div class="form-group full-width">
        <label class="required-label">Description</label>
        <textarea
          rows="3"
          formControlName="description"
          placeholder="Optional shift description"
        ></textarea>
      </div>

      <!-- ACTION BUTTONS -->
      <div class="form-actions">

        <button type="button" class="cancel-btn" (click)="close()">
          Cancel
        </button>

        <button
          type="submit"
          class="save-btn"
          [disabled]="shiftForm.invalid"
        >
          {{ isEditMode ? 'Update Shift' : 'Create Shift' }}
        </button>

      </div>

    </form>

  </div>

</div>
