<div class='flex justify-between items-center px-5'>
   
    
    <img src="../../../assets/Logo-green.png" alt=""  class="hidden md:block h-28">

    

      <nav>
        <ul class="flex gap-12 list-none">
          <li><a [routerLink]="navigationLink.getLink('checkoutOrderLink')">Orders</a></li>
          <li><a href="">Close Register</a></li>
          <li><a href="">Payins/Payouts</a></li>
          <li><a [routerLink]="navigationLink.getLink('checkoutLink')">Checkout</a></li>
        </ul>
      </nav>

 
      <div>
        <div (click)="op.toggle($event)" class="profile">
                <img src='assets/profile.jpg' alt=""  class='profile-img' />
                <p class="capitalize mb-0">{{ userRegData.username }}</p>
        </div>
        <p-overlayPanel #op>
          <div class="panel-container">
            <div class="profile-name">
              <h3 class="name-2">{{
                userRegData.username
            }}</h3>
              <h5 class="my-2"><strong>ID: </strong>{{userRegData.accountId}}</h5>
            </div>
              <p-divider></p-divider>
              <div>
                <h4 routerLink="/settings" class="settings"><i class="pi pi-cog"></i>Settings</h4>
                <h4 (click)="logout()" class="logout"><i class="pi pi-sign-out"></i> Sign Out</h4>
              </div>
            </div>
        </p-overlayPanel>
    </div>
 
<div class="md:hidden" >
  <button class="hamburger-icon" (click)="onToggleSidebar()">
  &#9776;
  </button>
</div>
</div>
