<div class="border-2 rounded-3xl m-5">
  <p-toolbar styleClass="mb-4 gap-2">
    <ng-template pTemplate="left">
      <div class="flex flex-col gap-0">
        <p class="text-gray-700 text-[20px] font-semibold">
          Payslips — {{ employeeInfo?.firstName || employeeInfo?.name || 'Employee' }} {{ employeeInfo?.lastName || '' }}
        </p>
        <p class="text-xs text-gray-400">{{ payslips.length }} payslip(s) found</p>
      </div>
    </ng-template>
    <ng-template pTemplate="right">
      <div class="flex items-center gap-3">
        <div *ngIf="loading" class="text-sm text-gray-400 flex items-center gap-2">
          <i class="fas fa-spinner fa-spin"></i> Loading…
        </div>
      </div>
    </ng-template>
  </p-toolbar>

  <div class="flex w-full justify-between gap-4 px-3">
    <div class="flex gap-4 w-1/2">
      <div class="w-full">
        <ng-select
          [items]="monthNames"
          placeholder="Filter by month"
          [(ngModel)]="selectedMonth"
          (ngModelChange)="filterBySelectedMonth()">
        </ng-select>
      </div>
      <div class="w-full">
        <ng-select
          [items]="years"
          placeholder="Filter by year"
          [(ngModel)]="selectedYear"
          (ngModelChange)="filterBySelectedYear()">
        </ng-select>
      </div>
    </div>
    <div class="search-bar w-[70%]">
      <input
        type="text"
        placeholder="Search by period…"
        [(ngModel)]="searchTerm"
        (ngModelChange)="filterPayroll()"
        class="editInput w-full bg-gray-50 outline-none"
      />
    </div>
  </div>

  <app-table
    [columns]="payslipColumns"
    [rows]="filteredPayslips"
    [actions]="payslipActions"
    [paginator]="true"
    [rowsPerPage]="10"
    [rowClickable]="true"
    [tableStyle]="{'min-height': 'fit-content', 'max-height': '1000px'}"
    [emptyMessage]="loading ? 'Loading payslips…' : 'No payslips found for this employee'"
    (rowClick)="viewPayrollDetails($event)"
    (actionClick)="handlePayslipAction($event)">
  </app-table>
</div>

<app-large-side-modal *ngIf="viewSlip" (close)="viewSlip = false">
  <app-payslip-view [payslip]="activeSlip"></app-payslip-view>
</app-large-side-modal>
