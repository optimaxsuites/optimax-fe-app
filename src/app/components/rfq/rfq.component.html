<div class="container-fluid">
  <div class="container-header">
    <button routerLink="/purchase/rfq-modal" class="btn create-invoice-btn">
      Create New Rfq <i class="fas fa-plus"></i>
    </button>
  </div>
  <div class="bottom-containesr">
    <div class="top-products-container">
      <div class="top-products">
        <div class="top-products-table-container">
          <table class="top-products-table w3-table w3-striped">
            <thead>
              <tr class="top-products-table-row">
                <th class="top-products-table-head">RFQ No</th>
                <th class="top-products-table-head">RFQ Name</th>
                <th class="top-products-table-head">RFQ Date</th>
                <th class="top-products-table-head">RFQ Expiry Date</th>
                <th class="top-products-table-head">Prepared By</th>
                <th class="top-products-table-d">Position</th>
                <th class="top-products-table-head">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr
                class="top-products-table-row"
                [style.color]="rfq.fontColor"
                *ngFor="let rfq of rfqList"
              >
                <td class="top-products-table-data">{{ rfq.rfqNo }}</td>
                <td class="top-products-table-data">{{ rfq.dateIssued }}</td>
                <td class="top-products-table-data">{{ rfq.expiryDate }}</td>
                <td class="top-products-table-data">{{ rfq.rfqName }}</td>

                <td class="top-products-table-data">{{ rfq.position }}</td>
                <td class="top-products-table-data">{{ rfq.preparedBy }}</td>

                <td class="top-products-table-data col-1">
                  <div class="actionDiv">
                    <div class="image-container">
                      <img
                        (click)="viewRfq(rfq.id)"
                        class="actionTags"
                        src="../../../assets/Edit.svg"
                        alt=""
                      />
                      <span class="tooltip">View</span>
                    </div>
                    <div class="image-container">
                      <img
                        (click)="duplicateRfq(rfq)"
                        class="actionTags"
                        src="../../../assets/duplicate.svg"
                        alt=""
                      />
                      <span class="tooltip">Duplicate</span>
                    </div>
                    <div class="image-container">
                      <img
                        (click)="deleteRfq(rfq.id)"
                        class="actionTags"
                        src="../../../assets/delete (1).svg"
                        alt=""
                      />
                      <span class="tooltip">delete</span>
                    </div>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
