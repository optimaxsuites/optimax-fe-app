<div class="card rounded-2xl">
  <app-back-button class="table-item" (click)="goBack()"></app-back-button>

  <form
    [formGroup]="goalForm"
    (ngSubmit)="onSubmit()"
    class="space-y-8 flex gap-10 flex-row justify-between px-5 py-3 items-start"
  >
    <!-- Left Column -->
    <div class="w-1/2">
      <!-- Goal Name -->
      <div class=" mb-4 mt-3">
        <label class="mb-3 text-lg font-semibold">Goal Name*</label>
        <input
          type="text"
          formControlName="goalName"
          placeholder="Enter goal name"
          class="w-full px-4 py-3 border border-gray-300 rounded-md transition duration-200"
        />
        <div
          *ngIf="
            goalForm.get('goalName')?.touched &&
            goalForm.get('goalName')?.invalid
          "
          class="text-red-500 text-sm"
        >
          Goal name is required
        </div>
      </div>

      <!-- Level and Priority -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
        <!-- <div class="">
          <label class="mb-3 text-lg font-semibold">Level*</label>
          <ng-select
            [items]="levelUser"
            bindLabel="option"
            bindValue="option"
            formControlName="levelUser"
            placeholder="Select level"
            class="w-full"
          ></ng-select>
          <div
            *ngIf="
              goalForm.get('levelUser')?.touched &&
              goalForm.get('levelUser')?.invalid
            "
            class="text-red-500 text-sm"
          >
            Level is required
          </div>
        </div> -->

        <div class="">
          <label class="mb-3 text-lg font-semibold">Level*</label>
          <select
            formControlName="priority"
            class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-200"
          >
            <option value="Critical">Individual</option>
          </select>
        </div>

        <div class="">
          <label class="mb-3 text-lg font-semibold">Priority*</label>
          <select
            formControlName="priority"
            class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-200"
          >
            <option value="Critical">Critical</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
          </select>
        </div>
      </div>

      <!-- Dates -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
        <div>
          <label class="mb-3 text-lg font-semibold">Start Date*</label>
          <input
            type="date"
            formControlName="startDate"
            class="w-full px-4 py-3 border border-gray-300 rounded-md transition duration-200"
          />
        </div>
        <div>
          <label class="mb-3 text-lg font-semibold">End Date*</label>
          <input
            type="date"
            formControlName="endDate"
            class="w-full px-4 py-3 border border-gray-300 rounded-md transition duration-200"
          />
        </div>
      </div>

      <!-- Admin Only Controls -->
      <div *ngIf="userRole === 'admin'" class="">
        <div>
          <label class="mb-3 text-lg font-semibold">Evaluators*</label>
          <ng-select
            [items]="evaluator"
            [multiple]="true"
            bindLabel="option"
            bindValue="option"
            formControlName="evaluator"
            placeholder="Select evaluator"
            class="w-full"
          ></ng-select>
        </div>

        <div>
          <label class="mb-3 text-lg font-semibold">Level*</label>
          <ng-select
            [items]="level"
            bindLabel="option"
            bindValue="option"
            formControlName="level"
            placeholder="Select level"
            class="w-full"
          ></ng-select>
        </div>
      </div>

      <!-- Assigned To -->
      <div class="">
        <label class="mb-3 text-lg font-semibold">Assigned To*</label>
        <input
          type="text"
          formControlName="assignedTo"
          placeholder="Enter assignee name"
          class="w-full px-4 py-3 border border-gray-300 rounded-md transition duration-200"
        />
      </div>

      <!-- Progress Status -->
      <div class="">
        <label class="my-3 text-lg font-semibold">Progress Status*</label>
        <select
          formControlName="progressStatus"
          class="w-full px-4 py-3 border border-gray-300 rounded-md transition duration-200"
        >
          <option value="Pending">Pending</option>
        </select>
      </div>

      <!-- Action Buttons -->
      <div class="flex justify-end mt-6 space-x-6">
        <button
          type="button"
          (click)="onCancel()"
          class="px-5 py-3 border border-gray-300 rounded-md hover:bg-gray-50 transition duration-200"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="px-5 py-3 bg-green-600 text-white rounded-md hover:bg-green-700 transition duration-200"
        >
          Save
        </button>
      </div>
    </div>

    <!-- Right Column -->
    <div class="w-1/2">
      <div>
        <label class="mb-3 text-lg font-semibold">Overview & Description*</label>
        <p-editor
          formControlName="goalDescription"
          placeholder="Overview & Description..."
          class="w-full"
        ></p-editor>
      </div>

      <div class="mt-3">
        <label class="mb-3 text-lg font-semibold">Metrics*</label>
        <div class="flex items-center">
          <input
            type="text"
            #metricInput
            (input)="onInputChange($event)"
            class="flex-grow px-4 py-3 border border-gray-300 rounded-md transition duration-200"
            placeholder="Enter metric"
          />
          <span
            class="text-customGreen cursor-pointer text-lg font-semibold ml-2 bg-green-100 px-3 py-2 rounded-md hover:bg-green-200 transition duration-200"
            (click)="addMetrics(metricInput)"
          >
            + Add Metric
          </span>
        </div>
        <ul class="flex flex-col space-y-4 p-2">
          <li
            *ngFor="let metric of metricsArray"
            class="flex justify-between items-center p-3 border border-gray-210 rounded-md"
          >
            <span class="text-gray-800 text-lg">{{ metric.name }}</span>
            <button
              type="button"
              class="text-red-500 hover:text-red-700 transition duration-200"
              (click)="OnDelete(metric)"
            >
              Delete
            </button>
          </li>
        </ul>
      </div>
    </div>
  </form>
</div>
