<div class="clock-card">
  <div class="attendance-main-content">
    <div class="clock-icon-container">
      <i class="pi pi-clock" aria-hidden="true"></i>
    </div>
    <div class="time-info">
      <div class="time">{{ currentTime | date:'HH:mm:ss' }}</div>
      <div class="date">{{ currentTime | date:'fullDate' }}</div>
      <div class="status">
        <span
          [class.in]="status === 'CLOCKED_IN'"
          [class.out]="status === 'CLOCKED_OUT' && !hasCompletedToday"
          [class.complete]="status === 'CLOCKED_OUT' && hasCompletedToday">
          {{ status === 'CLOCKED_OUT' && hasCompletedToday ? 'COMPLETED' : status.replace('_', ' ') }}
        </span>
      </div>
      <div class="location-badge" *ngIf="currentLocation">
        <i class="fa-solid fa-location-dot"></i>
        <span>{{ currentLocation }}</span>
      </div>
    </div>
  </div>

    [disabled]="isAbsentToday">

  </div>-->
  <div class="actions">

    <p *ngIf="hasCompletedToday" class="completed-warning">
  You have already completed attendance for today.
</p>

  <!-- CLOCK IN -->
  <button
    *ngIf="status === 'CLOCKED_OUT' && !hasCompletedToday"
    class="main-btn"
    [disabled]="isGettingLocation"
    (click)="toggleClock()">
    Clock In
  </button>

  <!-- CLOCK OUT -->
  <button
    *ngIf="status === 'CLOCKED_IN'"
    class="main-btn"
    [disabled]="isGettingLocation"
    (click)="toggleClock()">
    Clock Out
  </button>

</div>
</div>
