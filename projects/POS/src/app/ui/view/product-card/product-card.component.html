<div
  class="border rounded-xl p-2 cursor-pointer h-[20rem] product-card relative"
  (click)="onAddToCart()"
  [class.inCart]="amountOfProductInCart"
>
  @if (amountOfProductInCart) {

  <div class="product-quantity absolute">{{ amountOfProductInCart }}</div>
  }
  <!-- TODO: Is it alright to load images like this? -->
  <img
    [src]="product.imageUrl$"
    alt="product image"
    class="w-full h-2/3 object-cover rounded-xl"
  />
  <div class="flex flex-col w-full mt-4 px-2 h-[10rem]">
    <!-- <p>Nivea lotion - Even glow</p>
        <p>#5000</p> -->

    <p class=" text-ellipsis  h-10">{{ product.name }}</p>
    <p class="h-8">{{ product.sellingPrice | currency: '₦' }}</p>
  </div>
</div>
