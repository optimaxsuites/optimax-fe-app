  <div class="form-container ">
    <h2 class="text-2xl font-semibold mb-4 text-gray-800">Add Ingredient</h2>

    <!-- Use ngModel for two-way data binding -->
    <form (ngSubmit)="onSubmit()" novalidate [formGroup]="ingredientForm" >
        <!-- Ingredient Name -->
        <div class="form">
            <label for="default-input" class="block mb-2 text-[13px]  text-gray-900 dark:text-white text-left">Ingredient Name</label>
            <input formControlName="ingredientName" type="text" id="default-input" class="bg-gray-50 border  border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full " />
        </div>

       <!-- SKU -->

    <input
      type="text"
      id="sku"

    </button>
  </div>

        <!-- Category -->
        <div class="form">
            <label for="category" class="block mb-2 text-[13px]  text-gray-900 dark:text-white text-left">Category</label>
            <select id="category" formControlName="category" name="category" class="bg-gray-50 border  border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full  text-xl" required>
                <option value="">Select Category</option>
                <option value="Dairy">Dairy</option>
                <option value="Vegetables">Vegetables</option>
                <option value="Spices">Spices</option>
                <option value="Fruits">Fruits</option>
                <option value="Grains">Grains</option>
                <option value="Proteins">Proteins</option>
                <option value="Seafood">Seafood</option>
            </select>
        </div>

       <!-- Description -->
       <div class="form">
        <label for="description" class="block mb-2 text-[13px] text-gray-900 dark:text-white text-left">Description</label>
        <textarea id="description" formControlName="description" name="description" rows="3" class="bg-gray-50 border  border-gray-300 text-gray-900 text-xl rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full  dark:bg-gray-700 dark:border-gray-600 dark:text-white"></textarea>
      </div>

      <!-- Purchase Price -->
      <div class="form">
        <label for="purchase-price" class="block mb-2 text-[13px] text-gray-900 dark:text-white text-left">Purchase Price</label>
        <input type="text" id="purchase-price" formControlName="purchasePrice" (input)="formatNumber($event)" placeholder="Enter price (e.g., 1,000)" required class="bg-gray-50 border  border-gray-300 text-gray-900 text-xl rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full  dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
      </div>

      <div class="w-full ">

          <div *ngIf="!selectedSupplier" class=" absolute text-gray-600 text-[14px] p-2">

        </div>
    
          <select

            (change)="changeSelectedSupplier($event)"

            >

          </select>

    <div class="form">
        <label for="branch" class="block mb-2 text-[13px] text-gray-800 dark:text-white text-left">Branch</label>

    <div class="form">

        <textarea id="storage-requirements" formControlName="storageRequirement" rows="3" class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg  focus:ring-blue-500 focus:border-blue-500 block w-full  dark:bg-gray-700 dark:border-gray-600 dark:text-white"></textarea>
    </div>

   



    <app-side-modal *ngIf="isOpen" (close)="closeModal()">
      <h2 class="text-2xl font-semibold my-5 text-center bg-gray-50">Add New Supplier</h2>
    
      <div >
        <form (ngSubmit)="submitForm()" class="p-4">
          <div class="mb-4 ">
            <label class="block text-left text-gray-700 text-[13px]">Supplier Name</label>
            
            <input 
              type="text" 
              [(ngModel)]="supplierName" 
              #supplierNameInput="ngModel" 
              name="supplierName" 
              class="border border-gray-300 rounded-lg p-3 w-full bg-gray-100 text-gray-800"
              required
            />
            <!-- Error Message (Only Shows if Input is Empty) -->
            <p *ngIf="supplierNameInput.invalid && supplierNameInput.touched" class="text-red-500 text-sm mt-1">
              Supplier Name is required.
            </p>
          </div>
          
          <div class="mb-4">
            <label class="block text-gray-700 text-[13px] text-left">Contact Person</label>
          
            <input 
              type="text" 
              [(ngModel)]="contactPerson" 
              #contactPersonInput="ngModel" 
              name="contactPerson" 
              class="border border-gray-300 rounded-lg p-3 w-full bg-gray-100 text-gray-800"  
              required
            />
          
            <!-- Error Message (Only Shows if Input is Empty) -->
            <p *ngIf="contactPersonInput.invalid && contactPersonInput.touched" class="text-red-500 text-sm mt-1">
              Contact Person is required.
            </p>
          </div>
          
    
          <div class="mb-4">
            <label class="block text-gray-700 text-[13px] text-left">Email Address</label>
          
            <input
              type="email"
              [(ngModel)]="email"
              name="email"
              #emailInput="ngModel"
              class="border border-gray-300 rounded-lg p-3 w-full bg-gray-100 text-gray-800" 
              [ngClass]="{'border-red-500': emailInput.invalid && emailInput.dirty}"
              required
              email
            />
          
            <!-- Error Messages -->
            <div *ngIf="emailInput.invalid && emailInput.dirty" class="text-red-500 text-sm">
              <p *ngIf="emailInput.errors?.['required']">This field is required.</p>
              <p *ngIf="emailInput.errors?.['email']">Please enter a valid email address.</p>
            </div>
          </div>
          
    
          <div class="mb-4">
            <label class="block text-gray-700 text-[13px] text-left">Phone Number</label>
            
            <div class="flex items-center border border-gray-300 rounded-lg bg-gray-100">
              <!-- Country Code Selector -->
              <select
                [(ngModel)]="selectedCountryCode"
                name="countryCode"
                class="bg-gray-200 p-3 border-r outline-none text-gray-700"
              >
                <option *ngFor="let country of countryCodes" [value]="country.code">
                  {{ country.name }} ({{ country.code }})
                </option>
              </select>
          
              <!-- Phone Number Input -->
              <input
                type="tel"
                [(ngModel)]="phone"
                name="phone"
                #phoneInput="ngModel"
                class="p-3 w-full bg-gray-100 text-gray-800 outline-none"
                [pattern]="phonePattern"
                [ngClass]="{'border-red-500': phoneInput.invalid && phoneInput.dirty}"
                required
              />
            </div>
          
            <!-- Error Message -->
            <p *ngIf="phoneInput.invalid && phoneInput.dirty" class="text-red-500 text-sm">
              Enter a valid phone number (e.g., +234 or +1).
            </p>
          </div>
          
    
          <div class="mb-4">
            <label class="block text-gray-700 text-[13px] text-left">Business Address</label>
            <input type="text" [(ngModel)]="address" name="address" class="border border-gray-300 rounded-lg p-3 w-full bg-gray-100 text-gray-800"  />
          </div>
    
         
    
          <!-- Terms & Conditions -->
          <!-- <div class="mb-4 flex items-center">
            <input type="checkbox" [(ngModel)]="agreeTerms" name="agreeTerms" class="mr-2" />
            <label for="agreeTerms" class="text-2xl">
              I agree to the 
              <a href="/terms-and-conditions" target="_blank" class="text-blue-600 underline">Terms & Conditions</a>
            </label>
          </div> -->
        
    
          <!-- Buttons -->
          <div class="flex justify-end mt-5" >
            <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">Save</button>
            <button type="button" class="ml-2 text-gray-600" (click)="closeModal()">Cancel</button>
          </div>
        </form>
      </div>
  
    </app-side-modal>
