<div class="summary-card">
  <div class="summary-item">
    <span>Hours Worked</span>
    <strong>{{ summary.hoursWorked }}h</strong>
  </div>

  <div class="summary-item">
    <span>Expected Hours</span>
    <strong>{{ summary.expectedHours }}h</strong>
  </div>

  <div class="summary-item late">
    <span>Late Minutes</span>
    <strong>{{ summary.lateMinutes }}m</strong>
  </div>

  <div class="summary-item overtime">
    <span>Overtime</span>
    <strong>{{ summary.overtime }}h</strong>
  </div>
</div>
