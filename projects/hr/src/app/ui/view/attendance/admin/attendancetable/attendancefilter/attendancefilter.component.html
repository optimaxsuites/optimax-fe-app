<!--<p>attendancefilter works!</p>-->
<div class="filters">

  <!--Date range-->
  <input type="date" [(ngModel)]="filters.dateFrom" >
  <input type="date" [(ngModel)]="filters.dateTo" >

  <!-- ID dropdown -->
  <input type="text" placeholder="ID" [(ngModel)]="filters.id">

  <!-- Employee dropdown -->
  <input type="text" placeholder="Employee Name" [(ngModel)]="filters.employee">

  <!-- Department -->
  <select [(ngModel)]="filters.department">
    <option value="">All Departments</option>
    <option *ngFor="let dept of departments" [value]="dept">
      {{ dept }}
    </option>
  </select>

  <!-- Status -->
  <select [(ngModel)]="filters.status">
    <option value="">All Status</option>
    <option value="PRESENT">Present</option>
    <option value="ABSENT">Absent</option>
    <option value="LATE">Late</option>
  </select>

  <div class="buttonslol">
    <button type="button" class="apply-btn" (click)="applyFilters()">Apply</button>
    <button type="button" class="reset-btn" (click)="resetFilters()">Reset</button>
  </div>

  
</div>
