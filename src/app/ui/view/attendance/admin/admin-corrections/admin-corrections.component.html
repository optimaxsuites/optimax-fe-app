<div class="admin-corrections-card">
  <h2>Correction Requests</h2>

  <table>
    <thead>
      <tr>
        <th>Employee</th>
        <th>Date</th>
        <th>Issue</th>
        <th>Status</th>
        <th>Details</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let req of requests">
        <td>{{ req.employeeName || 'Employee' }}</td>
        <td>{{ req.date }}</td>
        <td>{{ req.issueType }}</td>
        <td>{{ req.status }}</td>
        <td>Details: {{ req.description }}</td>

        <td>
          <button 
            *ngIf="req.status === 'PENDING'" 
            (click)="approve(req)">
            Approve
          </button>



          <div *ngIf="req.status === 'PENDING'" class="reject-box">
            <input 
              type="text" 
              placeholder="Reason for rejection"
              [(ngModel)]="rejectReason[req.id]" />
            <button (click)="reject(req)">Reject</button>
          </div>
        </td>
      </tr>
                <!-- Empty State -->
  <div class="empty-state" *ngIf="requests.length === 0">
    <span>Such empty 🥲</span>
    <p>No correction requests here.</p>
  </div>
    </tbody>
  </table>
</div>
