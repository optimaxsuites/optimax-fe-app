<div
  class="bg-white p-6 rounded-2xl shadow-lg max-w-2xl mx-auto h-full min-h-fit"
  style="min-height: fit-content"
>
  <!-- Close Button -->
  <button
    (click)="closeModal()"
    class="absolute top-4 right-4 text-red-500 hover:text-red-700 focus:outline-none text-2xl"
    aria-label="Close modal"
  >
    Close
  </button>

  <h2 class="text-xl font-semibold text-center mb-4">Import Excel File</h2>

  <!-- Download Template Button -->
  <div class="flex justify-center mb-4 mt-10">
    <button
      class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition"
      (click)="downloadTemplate()"
    >
      Download Template
    </button>
  </div>

  <!-- File Upload Input -->
  <div class="text-center mt-20">
    <label for="excelFileInput" class="block text-xl font-medium mb-2">
      Upload Excel File
    </label>
    <input
      id="excelFileInput"
      type="file"
      accept=".xls, .xlsx"
      class="block w-full border border-gray-300 rounded-lg p-2 focus:ring-green-500 focus:border-green-500"
      (change)="onFileSelected($event)"
    />
  </div>

  @for (p of parsedProductArray; track $index) {
  <p-card class="bg-white shadow-md rounded-lg overflow-hiddens">
    <!-- <ng-template pTemplate="header">
      <img
        [src]="
          'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTWN8hLKJungcUipWLReON9fse4yZcyB0rzNw&s'
        "
        alt="{{ p.name }}"
        class="w-full h-48 object-cover"
      />
    </ng-template> -->
    <div class="flex">
      <label for="image" class="btn create-invoice-btn p-4"
        ><img
          [src]="
            'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTWN8hLKJungcUipWLReON9fse4yZcyB0rzNw&s'
          "
          alt="{{ p.name }}"
          class="w-1/3 h-auto object-cover"
        />
        <span style="color: red">*</span></label
      >
      <input
        type="file"
        (change)="onImageUpload($event)"
        [(ngModel)]="p.productImages"
        id="image"
        hidden
      />
      <div class="p-4">
        <h2 class="text-xl font-semibold mb-2">{{ p.name }}</h2>
        <p class="text-gray-600">SKU: {{ p.sku }}</p>
      </div>
    </div>
  </p-card>
  }
</div>
