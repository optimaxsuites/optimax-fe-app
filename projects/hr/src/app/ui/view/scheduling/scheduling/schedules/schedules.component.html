<div class="p-6">
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-2xl font-bold">Employee Scheduling</h1>

    <div class="flex gap-2">
      <button 
        class="px-4 py-2 rounded-lg bg-blue-600 text-white" 
        (click)="viewMode = 'calendar'">Calendar</button>
      <button 
        class="px-4 py-2 rounded-lg bg-gray-200" 
        (click)="viewMode = 'table'">Table</button>
      <button 
        class="px-4 py-2 rounded-lg bg-green-600 text-white"
        (click)="openAddSchedule()">+ Add Schedule</button>
    </div>
  </div>

  <div *ngIf="viewMode === 'calendar'">
    <!-- calendar component here -->
  </div>

  <div *ngIf="viewMode === 'table'">
    <!-- table component here -->
  </div>
</div>
