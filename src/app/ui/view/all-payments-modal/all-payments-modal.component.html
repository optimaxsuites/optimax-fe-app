@if(isModalOpen){

  <app-modal class="bg-white dark:bg-gray-800 rounded-lg shadow-lg py-26 w-96 text-white" (close)="closeModal()">

   <div class="py-10">
  <h2 class="text-xl font-semibold text-gray-900 dark:text-white text-center mb-20">
    Payment Options
  </h2>

  <div class="mt-4 space-y-5">
    <label *ngFor="let payment of paymentOptions" class="flex items-center text-center w-full bg-gray-100 hover:bg-gray-200 cursor-pointer py-5 rounded text-2xl px-4 relative">
      <input type="checkbox" class="absolute left-3 top-6 transform -translate-y-1/2 w-5 h-5"
             [checked]="selectedPaymentsToGo.includes(payment.value)"
             (change)="togglePayment(payment.value)">
      <span class="text-gray-700 font-semibold ml-10">{{ payment.label }}</span>
    </label>
  </div>

  <div class="mt-6 flex justify-end">
    <button (click)="confirmPayment()" class="bg-customBlue hover:bg-customBlueHover text-white px-6 py-3 rounded">
      Proceed to Payment
    </button>
  </div>
</div>

  </app-modal>

}
