<div class="bg-gray-50" style="height: calc(100vh - 57px); display: flex; overflow: hidden;">

  <!-- LEFT SIDEBAR — locked, only session list scrolls internally -->
  <aside class="w-72 bg-white border-r border-gray-200 flex flex-col shrink-0" style="height: 100%;">

    <!-- New Chat button — always visible at top -->
    <div class="p-3 border-b border-gray-100 shrink-0">
      <button
        (click)="newChat()"
        class="w-full text-xs px-3 py-2 border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50 transition text-left"
      >+ New Chat</button>
    </div>

    <!-- Session list — only this scrolls, no scrollbar visible -->
    <div class="flex-1 p-2 space-y-1 hide-scrollbar" style="overflow-y: auto;">
      <button
        *ngFor="let session of chatSessions"
        (click)="selectSession(session.id)"
        class="w-full text-left px-3 py-2 rounded-lg text-xs transition truncate"
        [ngClass]="session.id === activeChatId ? 'bg-gray-100 text-gray-900 font-medium' : 'text-gray-500 hover:bg-gray-50'"
      >{{ session.title }}</button>
    </div>
  </aside>

  <!-- CENTER: AI Chat — header pinned top, input pinned bottom, messages scroll in between -->
  <main class="flex-1 flex flex-col bg-white" style="height: 100%; overflow: hidden;">

    <!-- Chat Header — always visible -->
    <div class="flex items-center gap-3 px-5 py-3 border-b border-gray-100 shrink-0">
      <div class="w-8 h-8 rounded-full bg-customBlue/15 flex items-center justify-center shrink-0">
        <svg class="w-4 h-4 text-customBlue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17H3a2 2 0 01-2-2V5a2 2 0 012-2h16a2 2 0 012 2v10a2 2 0 01-2 2h-2"/>
        </svg>
      </div>
      <div>
        <p class="text-sm font-semibold text-gray-800">AI Assistant</p>
        <p class="text-xs text-gray-400">{{ activeSession?.title || 'New Chat' }}</p>
      </div>
      <div class="ml-auto w-2 h-2 rounded-full bg-green-500"></div>
    </div>

    <!-- Messages — flex-1 so it fills space, scrolls up as new messages come in, no scrollbar -->
    <div
      class="flex-1 hide-scrollbar"
      style="overflow-y: auto; display: flex; flex-direction: column; padding: 20px 15%; gap: 16px;"
      #chatContainer
    >
      <!-- Spacer pushes messages to bottom when few messages exist -->
      <div class="flex-1"></div>

      <div *ngFor="let msg of activeMessages">
        <!-- AI -->
        <div *ngIf="msg.sender === 'ai'" class="flex items-start gap-2.5">
          <div class="w-7 h-7 rounded-full bg-gray-100 flex items-center justify-center shrink-0 mt-0.5">
            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17H3a2 2 0 01-2-2V5a2 2 0 012-2h16a2 2 0 012 2v10a2 2 0 01-2 2h-2"/>
            </svg>
          </div>
          <div class="max-w-[75%]">
            <div class="bg-gray-100 rounded-2xl rounded-tl-sm px-4 py-2.5 text-sm text-gray-700 leading-relaxed whitespace-pre-line">{{ msg.text }}</div>
            <p class="text-[11px] text-gray-400 mt-1 ml-1">{{ msg.time }}</p>
          </div>
        </div>

        <!-- User -->
        <div *ngIf="msg.sender === 'user'" class="flex justify-end">
          <div class="max-w-[75%]">
            <div class="bg-customBlue rounded-2xl rounded-tr-sm px-4 py-2.5 text-sm text-white leading-relaxed">{{ msg.text }}</div>
            <p class="text-[11px] text-gray-400 mt-1 text-right mr-1">{{ msg.time }}</p>
          </div>
        </div>
      </div>

      <!-- Typing indicator -->
      <div *ngIf="aiTyping" class="flex items-start gap-2.5">
        <div class="w-7 h-7 rounded-full bg-gray-100 flex items-center justify-center shrink-0">
          <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17H3a2 2 0 01-2-2V5a2 2 0 012-2h16a2 2 0 012 2v10a2 2 0 01-2 2h-2"/>
          </svg>
        </div>
        <div class="bg-gray-100 rounded-2xl rounded-tl-sm px-4 py-3">
          <div class="flex gap-1">
            <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0ms"></span>
            <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 150ms"></span>
            <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 300ms"></span>
          </div>
        </div>
      </div>

      <!-- Empty state — centred when no messages -->
      <div *ngIf="activeMessages.length === 0 && !aiTyping" class="flex flex-col items-center justify-center py-20 text-gray-400">
        <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center mb-3">
          <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17H3a2 2 0 01-2-2V5a2 2 0 012-2h16a2 2 0 012 2v10a2 2 0 01-2 2h-2"/>
          </svg>
        </div>
        <p class="text-sm">Start a new conversation</p>
      </div>
    </div>

    <!-- Suggestions + Input — always pinned at bottom, never moves -->
    <div class="shrink-0 border-t border-gray-100 bg-white">
      <div class="px-[15%] pt-3 pb-2 flex flex-wrap gap-2">
        <button
          *ngFor="let s of aiSuggestions"
          (click)="sendMessage(s)"
          class="px-3 py-1.5 bg-gray-100 text-gray-600 rounded-full text-xs hover:bg-purple-50 hover:text-customBlue transition"
        >{{ s }}</button>
      </div>

      <div class="px-[15%] pb-5 pt-2">
        <div class="flex items-center gap-2">
          <input
            type="text"
            [(ngModel)]="newChatMessage"
            placeholder="Type a message..."
            (keyup.enter)="sendMessage(newChatMessage)"
            class="flex-1 bg-gray-100 rounded-full px-4 py-2.5 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-300"
          />
          <button
            (click)="sendMessage(newChatMessage)"
            class="w-9 h-9 rounded-full bg-customBlue hover:bg-customBlueHover flex items-center justify-center transition shrink-0"
          >
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

  </main>

</div>
