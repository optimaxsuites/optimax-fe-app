<div class="attendance-wrapper">
    <div class="attendance-card">
      <!--<app-attendancesummary [data]="filteredAttendance"></app-attendancesummary>-->
      <app-attendancefilter (filtersChange)="onFiltersChange($event)"></app-attendancefilter>
        <table class="attendance-table">
  <thead> 
    
    <tr>
      <th>ID</th>
      <th>Employee</th>
      <th>Department</th>
      <th>Date</th>
      <th>In</th>
      <th>Out</th>
      <th>Status</th>
      <th>Hours</th>
      <th>Actions</th>
    </tr>
  </thead>
 
  <tbody>
  <tr *ngFor="let record of attendance">
    <td>{{ record.id }}</td>
    <td>{{ record.employee }}</td>
    <td>{{ record.department }}</td>
    <td>{{ record.date || '-'}}</td>
    <td>{{ record.checkIn || '-' }}</td>
    <td>{{ record.checkOut || '-' }}</td>

    <td>
      <span class="status"
            [ngClass]="{
              'present': record.status === 'PRESENT',
              'late': record.status === 'LATE',
              'absent': record.status === 'ABSENT'
            }">
        {{ record.status }}
      </span>
    </td>

    <td>{{ record.hours }}</td>

    <td class="actions">
        <button class="view-btn">View</button> <!--(click)=""-->
    </td>

  </tr>

    <!--<tr *ngFor="let record of attendance$ | async">
      <td>{{ record.employee }}</td>
      <td>{{ record.department }}</td>
      <td>{{ record.checkIn }}</td>
      <td>{{ record.checkOut }}</td>

      <td>
        <span class="status" [ngClass]="record.status.toLowerCase()">
          {{ record.status }}
        </span>
      </td>

      <td>{{ record.hours }}</td>

      
    <td class="actions">
      <button class="correct-btn" (click)="manualCorrection(record)">Correct</button>
    </td>
    </tr>-->
  </tbody>
</table>

    </div>
</div>
