<div class="space-y-6">

  <p-table 
    [value]="template.columns || []" 
    styleClass="p-datatable-sm"
    class="block border border-gray-100 rounded-lg overflow-hidden">

    <!-- HEADER -->
    <ng-template pTemplate="header">
      <tr class="bg-gray-50/50">
        <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase border-b">
          Bank Column
        </th>
        <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase border-b">
          System Field
        </th>
        <th class="w-[50px] border-b"></th>
      </tr>
    </ng-template>

    <!-- BODY -->
    <ng-template pTemplate="body" let-col let-i="rowIndex">
      <tr class="hover:bg-gray-50/80 transition-colors">

        <!-- COLUMN NAME -->
        <td class="px-3 py-2 border-b border-gray-100">
          <input
            type="text"
            pInputText
            [(ngModel)]="col.header"
            placeholder="Enter column name"
            class="w-full p-inputtext-sm border-transparent bg-transparent hover:border-gray-300 focus:bg-white editInput"
          />
        </td>

        <!-- FIELD SELECT -->
        <td class="px-3 py-2 border-b border-gray-100">
          <p-dropdown
            [options]="systemFields"
            [(ngModel)]="col.field"
            optionLabel="label"
            optionValue="value"
            placeholder="Select Field"
            appendTo="body"
            class="w-full"
          ></p-dropdown>
        </td>

        <!-- DELETE -->
        <td class="text-center border-b">
          <button
            type="button"
            (click)="removeColumn(i)"
            class="text-red-500 hover:text-red-700"
          >
            <i class="pi pi-trash"></i>
          </button>
        </td>

      </tr>
    </ng-template>

  </p-table>

  <!-- ACTIONS -->
  <div class="flex justify-between items-center pt-2">

    <button
      pButton
      label="Add Column"
      icon="pi pi-plus"
      (click)="addColumn()"
      class="bg-gray-100 px-4 py-2 rounded-md text-sm"
    ></button>

    <button
      pButton
      label="Save Template"
      icon="pi pi-check"
      (click)="saveTemplate()"
      class="bg-customBlue px-6 py-3 text-white text-sm rounded-md"
    ></button>

  </div>

</div>
