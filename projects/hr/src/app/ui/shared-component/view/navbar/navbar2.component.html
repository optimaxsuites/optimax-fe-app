<div class="header">

  <div class="items hamburger" >
    <button class="hamburger-icon" (click)="onToggleSidebar()">
      <i class="pi pi-bars"></i>
    </button>
  </div>

  <div class="header-center">
    <div class="searchbar-container">
      <img src="/assets/Logo-green.png" alt="" width="15%" />
    </div>
  </div>

  <div class="header-end">
    <div class="dashboard-navbar-menu">
      <button
        type="button"
        class="dashboard-menu-toggle"
        aria-label="Open dashboard menu"
        [attr.aria-expanded]="isDashboardMenuOpen"
        (click)="toggleDashboardMenu($event)">
        <i class="fas fa-caret-down" [class.open]="isDashboardMenuOpen"></i>
      </button>
      <div class="dashboard-menu" *ngIf="isDashboardMenuOpen">
        <button type="button" class="dashboard-menu-item active" (click)="switchDashboard('advance')">
          Manage Advanced Loans
        </button>
        <button type="button" class="dashboard-menu-item" (click)="switchDashboard('cooperative')">
          Manage Cooperative Loans
        </button>
      </div>
    </div>
    <div (click)="op.toggle($event)" class="items profile-item">
      <div class="profile-img-container">
        <img src="/assets/profile.jpg" alt="" class="profile-img" />
      </div>
      <div class="profile-name">
        <p class="name">{{ userRegData.username }}</p>
      </div>
    </div>
    <p-overlayPanel #op>
      <div class="panel-container">
        <div class="profile-name">
          <h3 class="name-2">{{ userRegData.username }}</h3>
          <h5 class="my-2"><strong>ID: </strong>{{ userRegData.accountId }}</h5>
        </div>
        <p-divider></p-divider>
        <div>
          <a routerLink="/settings" class="settings">
            <i class="pi pi-cog"></i>Settings
          </a>
          <h4 (click)="logout()" class="logout">
            <i class="pi pi-sign-out"></i> Sign Out
          </h4>
        </div>
      </div>
    </p-overlayPanel>
  </div>

  <!-- <div class="items hamburger" >
      <button class="hamburger-icon" (click)="onToggleSidebar()">
      &#9776;
      </button>
    </div> -->
</div>
