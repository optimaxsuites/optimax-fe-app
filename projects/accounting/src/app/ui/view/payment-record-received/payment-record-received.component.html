<section class="dialogContainer">
  <mat-dialog-content>
    <section class="formSection">
      <article>
        <span>Payment Method</span>

        <form class="example-form">
          <mat-form-field class="formClass">
            <mat-label>Payment Method</mat-label>
            <input
              type="text"
              placeholder="Payment Method"
              aria-label="Payment Method"
              matInput
              [formControl]="paymentMethodControl"
              [matAutocomplete]="paymentMethodAuto"
            />
            <mat-autocomplete #paymentMethodAuto="matAutocomplete">
              <mat-option
                *ngFor="let paymentMethod of filteredPayments | async"
                [value]="paymentMethod"
              >
                {{ paymentMethod }}
              </mat-option>
            </mat-autocomplete>
          </mat-form-field>
        </form>
      </article>

      <article>
        <span>Deposited To</span>

        <form class="example-form">
          <mat-form-field class="formClass">
            <mat-label>Select Payment Account</mat-label>
            <input
              type="text"
              placeholder="Select Payment Account"
              aria-label="Select Payment Account"
              matInput
              [formControl]="myControl"
              [matAutocomplete]="auto"
            />
            <mat-autocomplete #auto="matAutocomplete">
              <mat-option
                *ngFor="let paymentMethod of filteredPayments | async"
                [value]="paymentMethod"
              >
                {{ paymentMethod }}
              </mat-option>
              <button class="btn btn-light">Add New</button>
            </mat-autocomplete>
          </mat-form-field>
        </form>
      </article>

      <article>
        <span>Amount Received</span>

        <form class="example-form">
          <mat-form-field class="example-full-width">
            <input matInput placeholder="NGN" type="number" />
          </mat-form-field>
        </form>
      </article>

      <article>
        <span>Transaction Charge</span>

        <form class="example-form">
          <mat-form-field class="example-full-width">
            <input matInput placeholder="NGN" type="number" />
          </mat-form-field>
        </form>
      </article>
    </section>
  </mat-dialog-content>
  <mat-dialog-actions class="dialogFooter">
    <button mat-button (click)="onNoClick()">Cancel</button>
    <button mat-button [mat-dialog-close]="data.invoiceNo" cdkFocusInitial>
      Save and Continue
    </button>
  </mat-dialog-actions>
</section>
