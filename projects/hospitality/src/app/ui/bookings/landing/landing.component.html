<div class="landing-page">
  <!-- Hero Section -->
  <div class="hero-section">
    <!-- Background Image with Overlay -->
    <img
      src="https://images.unsplash.com/photo-1618773928121-c32242e63f39?auto=format&fit=crop&q=80&w=2000"
      alt="Luxury Hotel"
      class="hero-background"
    >
    <div class="hero-overlay"></div>

    <!-- Header/Logo -->
    <header class="header">
      <div class="logo">
        <span class="logo-text">
          Optimax<span class="logo-highlight">Hospitality</span>
        </span>
      </div>
    </header>

    <!-- Hero Content -->
    <div class="hero-content">
      <h1 class="hero-title">Find Your Perfect Stay</h1>
      <p class="hero-subtitle">
        Discover luxury accommodations tailored to your needs.
        <br> Book your ideal room with ease.
      </p>

      <button class="cta-button" (click)="bookNow()">
        <i class="fa-solid fa-calendar-days"></i>
        Book a Room
      </button>
    </div>

    <!-- Features Section -->
    <div class="hero-footer">
      <div class="feature">
        <i class="fa-solid fa-star"></i>
        <span>Premium Rooms</span>
      </div>
      <div class="feature">
        <i class="fa-solid fa-lock"></i>
        <span>Secure Booking</span>
      </div>
      <div class="feature">
        <i class="fa-solid fa-headset"></i>
        <span>24/7 Support</span>
      </div>
    </div>
  </div>
</div>
