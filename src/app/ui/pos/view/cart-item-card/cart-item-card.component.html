<div class="flex justify-between rounded-2xl items-center border p-3">
    <div class="flex flex-col  gap-1">
        <span>Product name</span>
        <span>#100.00</span>
    </div>

    <div class="p-3 flex justify-between gap-4 border rounded-xl items-center ">
        <i class="fa-solid fa-minus cursor-pointer" (click)="decreaseCount()"></i>
        <!-- <span>{{count}}</span> -->
         <input type="text" name="count" id="count" [value]="count" class="w-10 text-center outline-none"/>
        <i class="fa-solid fa-plus cursor-pointer" (click)="increaseCount()"></i>
    </div>

    <span>#100.00</span>
</div>
