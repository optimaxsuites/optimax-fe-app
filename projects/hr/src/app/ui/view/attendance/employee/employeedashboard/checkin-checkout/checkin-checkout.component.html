<div class="clock-card">

  <div class="time">
    <h2>{{ currentTime | date:'HH:mm:ss' }}</h2>
    <p>{{ currentTime | date:'fullDate' }}</p>
  </div>

  <div class="status">
    <span 
      [class.in]="status === 'CLOCKED_IN'"
      [class.out]="status === 'CLOCKED_OUT'">
      {{ status.replace('_', ' ') }}
    </span>
  </div>

  <div class="actions">
    <button class="main-btn" (click)="toggleClock()">
      {{ status === 'CLOCKED_OUT' ? 'Clock In' : 'Clock Out' }}
    </button>
  </div>

</div>
