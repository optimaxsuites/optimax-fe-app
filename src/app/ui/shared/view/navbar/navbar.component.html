<!-- damilola worked on this: redesigned enterprise header with profile image, bell tray, and unread badges. -->
<header class="app-header">
  <div class="app-header__left">
    <button type="button" class="menu-toggle" (click)="onToggleSidebar()">
      <i class="pi pi-bars"></i> 
    </button>

    <div class="brand-block">
      <p class="brand-kicker">Enterprise workspace</p>
      <h1>OptimaX</h1>
    </div>
  </div> 
  <div class="app-header__right">
    <div class="header-bell-wrap">
      <button
        type="button"
        class="header-icon"
        (click)="openNotifications(); notificationsPanel.toggle($event)"
      >
        <i class="fas fa-bell"></i>
        <span *ngIf="unreadBellCount" class="header-badge">
          {{ unreadBellCount > 99 ? '99+' : unreadBellCount }}
        </span>
      </button>

      <p-overlayPanel #notificationsPanel styleClass="header-overlay-panel">
        <div class="notification-panel">
          <div class="notification-panel__header">
            <div>
              <p>Notifications</p>
              <span>Messages, channels, routines, and module updates</span>
            </div>
            <div class="notification-panel__actions" *ngIf="notifications.length">
              <button type="button" class="notification-header-action" *ngIf="unreadNotificationItems.length"
                (click)="openUnreadNotificationsDialog(); notificationsPanel.hide()">
                Unread
              </button>
              <button type="button" class="notification-header-action notification-header-action--danger"
                (click)="clearAllNotifications(); notificationsPanel.hide()">
                Clear all
              </button>
            </div>
          </div>

          <div *ngIf="!notifications.length" class="notification-empty">
            No notifications yet.
          </div>

          <button
            type="button"
            *ngFor="let item of latestNotifications"
            class="notification-item"
            [class.notification-item--unread]="!item.read"
            (click)="openNotification(item); notificationsPanel.hide()"
          >
            <div class="notification-item__avatar">
              <img *ngIf="item.avatarUrl" [src]="item.avatarUrl" [alt]="item.title" />
              <span *ngIf="!item.avatarUrl">{{ (item.title || 'U').charAt(0) }}</span>
            </div>
            <div class="notification-item__body">
              <div class="notification-item__meta">
                <div class="notification-item__title">
                  <span *ngIf="!item.read" class="notification-unread-dot"></span>
                  <strong>{{ displayNotificationText(item.title, 'New update') }}</strong>
                </div>
                <span>{{ item.createdAt | date: 'shortTime' }}</span>
              </div>
              <p>{{ displayNotificationText(item.body, 'A new update is available.') }}</p>
              <time *ngIf="item.contextLabel">{{ displayNotificationText(item.contextLabel, '') }}</time>
            </div>
          </button>

          <button
            *ngIf="notifications.length > 5"
            type="button"
            class="notification-view-all"
            (click)="viewAllNotifications(); notificationsPanel.hide()"
          >
            View all updates
          </button>
        </div>
      </p-overlayPanel>
    </div>

    <button
      type="button"
      class="profile-trigger"
      (click)="profilePanel.toggle($event)"
    >
      <div class="profile-avatar">
        <img
          *ngIf="headerProfile.imageUrl; else initialsAvatar"
          [src]="headerProfile.imageUrl"
          [alt]="headerProfile.name"
        />
        <ng-template #initialsAvatar>
          <span>{{ headerProfile.initials }}</span>
        </ng-template>
      </div>
      <div class="profile-copy">
        <strong>{{ headerProfile.username || headerProfile.name }}</strong>
        <span>{{ headerProfile.accountId ? 'ID ' + headerProfile.accountId : 'Account active' }}</span>
      </div>
      <i class="pi pi-angle-down"></i>
    </button>

    <p-overlayPanel #profilePanel styleClass="header-overlay-panel">
      <div class="profile-panel">
        <div class="profile-panel__identity">
          <div class="profile-avatar profile-avatar--large">
            <img
              *ngIf="headerProfile.imageUrl; else panelInitialsAvatar"
              [src]="headerProfile.imageUrl"
              [alt]="headerProfile.name"
            />
            <ng-template #panelInitialsAvatar>
              <span>{{ headerProfile.initials }}</span>
            </ng-template>
          </div>
          <div>
            <h3>{{ headerProfile.name }}</h3>
            <p>{{ headerProfile.username }}</p>
            <span *ngIf="headerProfile.accountId">Account ID: {{ headerProfile.accountId }}</span>
          </div>
        </div>
        <p-divider></p-divider>
        <button type="button" class="panel-action" routerLink="/settings">
          <i class="pi pi-cog"></i>
          <span>Settings</span>
        </button>
        <button type="button" class="panel-action panel-action--danger" (click)="logout()">
          <i class="pi pi-sign-out"></i>
          <span>Sign out</span>
        </button>
      </div>
    </p-overlayPanel>
  </div>
</header>

<p-dialog
  header="Unread Notifications"
  [(visible)]="showUnreadNotificationsDialog"
  [modal]="true"
  [dismissableMask]="true"
  [style]="{ width: 'min(42rem, 96vw)' }"
  styleClass="unread-notifications-dialog"
  (onHide)="closeUnreadNotificationsDialog()"
>
  <div class="unread-dialog-shell">
    <div class="unread-dialog-actions" *ngIf="notifications.length">
      <button type="button" class="notification-header-action notification-header-action--danger"
        (click)="clearAllNotifications()">
        Clear all
      </button>
    </div>

    <div *ngIf="!unreadNotificationItems.length" class="notification-empty">
      No unread notifications.
    </div>

    <button
      type="button"
      *ngFor="let item of unreadNotificationItems"
      class="notification-item notification-item--unread notification-item--dialog"
      (click)="openNotification(item); closeUnreadNotificationsDialog()"
    >
      <div class="notification-item__avatar">
        <img *ngIf="item.avatarUrl" [src]="item.avatarUrl" [alt]="item.title" />
        <span *ngIf="!item.avatarUrl">{{ (item.title || 'U').charAt(0) }}</span>
      </div>
      <div class="notification-item__body">
        <div class="notification-item__meta">
          <div class="notification-item__title">
            <span class="notification-unread-dot"></span>
            <strong>{{ displayNotificationText(item.title, 'New update') }}</strong>
          </div>
          <span>{{ item.createdAt | date: 'short' }}</span>
        </div>
        <p>{{ displayNotificationText(item.body, 'A new update is available.') }}</p>
        <time *ngIf="item.contextLabel">{{ displayNotificationText(item.contextLabel, '') }}</time>
      </div>
    </button>  
  </div>
</p-dialog>
