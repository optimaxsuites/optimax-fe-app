<div *ngIf="visible" class="srd-backdrop" (click)="close()">
  <div class="srd-card" (click)="$event.stopPropagation()">

    <div class="srd-header">
      <span class="srd-title">🔔 Set Reminder</span>
      <button type="button" class="srd-close" (click)="close()">✕</button>
    </div>

    <p class="srd-preview">{{ messageText }}</p>

    <div *ngIf="saved" class="srd-success">
      ✅ Reminder set! We'll alert you {{ leadMinutes }} min before.
    </div>

    <ng-container *ngIf="!saved">
      <div class="srd-field">
        <label class="srd-label">Meeting time</label>
        <input
          type="text"
          class="srd-input"
          [(ngModel)]="timeString"
          placeholder="e.g. 3:30 PM"
          (keydown.enter)="confirm()"
        />
      </div>

      <div class="srd-field">
        <label class="srd-label">Notify me</label>
        <div class="srd-lead-btns">
          <button *ngFor="let m of [1, 2, 5, 10]"
                  type="button"
                  class="srd-lead-btn"
                  [class.active]="leadMinutes === m"
                  (click)="leadMinutes = m">
            {{ m }} min before
          </button>
        </div>
      </div>

      <p *ngIf="error" class="srd-error">{{ error }}</p>

      <div class="srd-footer">
        <button type="button" class="srd-btn-cancel" (click)="close()">Cancel</button>
        <button type="button" class="srd-btn-confirm" (click)="confirm()">Set Reminder</button>
      </div>
    </ng-container>

  </div>
</div>
