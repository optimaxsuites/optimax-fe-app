<div class="flex justify-between rounded-2xl items-center border p-3">
   
        <div class="flex flex-col  gap-1" (click)="onClick()">
            <span class="text-wrap">{{item.name}}</span>
            <span>₦{{item.price}}</span>
        </div>
    
   

    <div class="p-3 flex justify-between gap-4 border rounded-xl items-center ">
        <i class="fa-solid fa-minus cursor-pointer" (click)="decreaseCount()"></i>
        <!-- <span>{{count}}</span> -->
         <input type="text"  name="count" id="count" [(ngModel)]="item.count" class="w-10 text-center outline-none" (ngModelChange)="onCountChange($event)"/>
        <i class="fa-solid fa-plus cursor-pointer" (click)="increaseCount()"></i>
    </div>

    <div class="flex gap-4 items-center">

        <div class="flex flex-col  gap-1" (click)="onClick()">
             <span class=" font-semibold" >₦{{item.cartPriceTotal}}</span>
            <span *ngIf="item.discount > 0" [class.text-red-500]="item.discount > 0">-₦{{item.discount}}</span>
        </div>
    <i  *ngIf="showDelete"  class="fa-solid fa-trash  cursor-pointer" (click)="onDelete()" ></i>

    </div>
</div>
