<div class="correction-requests-card">

  <div class="header">
    <h3>Correction Requests</h3>
    <button class="add-btn" (click)="openForm()">+</button>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="requests.length === 0">
    <span>Such empty 🥲</span>
    <p>No correction requests yet.</p>
  </div>

  <!-- Requests Table -->
  <table *ngIf="requests.length > 0">
    <thead>
      <tr>
        <th>Date</th>
        <th>Issue Type</th>
        <th>Status</th>
        <th>Details</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let req of requests">
        <td>{{ req.date | date:'mediumDate' }}</td>
        <td>{{ getIssueLabel(req.issueType) }}</td>
        <td>
          <span class="status" [ngClass]="req.status.toLowerCase()">
            {{ req.status }}
          </span>
        </td>
        <td>
          {{ req.description }}

          <div *ngIf="req.status === 'REJECTED'" class="rejection-reason">
            Rejection Reason: {{ req.rejectionReason }}
          </div>          
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Modal Form -->
  <app-correctionrequestform
    *ngIf="showForm"
    (close)="closeForm()"
    (submitRequest)="addRequest($event)">
  </app-correctionrequestform>

</div>
