<link
  href="https://fonts.googleapis.com/icon?family=Material+Icons"
  rel="stylesheet"
/>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=visibility"
/>


<!-- Search and Categories Section -->
<div *ngIf="tableSection" class="flex flex-col w-full  p-4">
  <div class="gap-3 w-full flex justify-between items-center">
    <ng-select
    [items]="measurementUnits"
    [(ngModel)]="selectedMeasurementUnit"
    (ngModelChange)="filterIngredientsByMeasurementUnit($event)"
    placeholder="Select MeasurementUnit"
  ></ng-select>  
  
  
  
<div class="w-1/3 flex justify-end">
  <div class="search-container ">
    <input
      type="text"
      class="Search-input"
      placeholder="Search by Name..."
      [(ngModel)]="searchTerm"
      (ngModelChange)="filterIngredientsBySearch()" 
    />
    <i class="fas fa-search"></i>
  </div>
</div>

  
  </div>
 

  <p-toolbar styleClass=" gap-2 justify-end" class="mb-8 mt-28">
    <ng-template pTemplate="right">
      <app-button 
        text="Add Ingredient" 
        class="btn-navigate "
        (click)="navigateToAddIngredient()">
      </app-button>

      <!-- <app-button 
      text="  Delete" 
      class="btn-navigate "
      (click)="  deleteSelectedIngredients()">
    </app-button> -->
    </ng-template>
  </p-toolbar>


  <p-table    [value]="filteredIngredients" [paginator]="true" dataKey="id" responsiveLayout="stack" [breakpoint]="'960px'" styleClass="p-datatable-striped" [tableStyle]="{ 'min-height': 'fit-content', 'max-height': '650px' }" [rows]="15">
    <ng-template pTemplate="header" let-columns>
      <tr>
        <th style="width: 4rem"><p-tableHeaderCheckbox /></th>
        <th class="table-item">SKU</th>
        <th class="table-item">Code</th>
        <th class="table-item">Name</th>
        <th class="table-item">Price</th>
        <th class="table-item">Quantity</th>
        <th class="table-item">MeasurementUnit</th>
        <th class="table-item">Action</th>
      </tr>
    </ng-template>
    

    <ng-template pTemplate="body" let-item let-i="rowIndex">
      <tr >
        <td><p-tableCheckbox [value]="item" class="custom-checkbox" /></td>
        <td class="table-item">{{ item.sku }}</td>
        <td class="table-item">{{ item.code }}</td>
        <td class="table-item">{{ item.name }}</td>
        <td class="table-item">{{ item.purchasePrice }}</td>
        <td class="table-item">{{ item.currentStock }}</td>
        <td class="table-item">{{ item.measurementUnit }}</td>

        <td class="actions  relative table-item ">
          <div class="dropdown relative">
              <span (click)="toggleDropdown2(item, $event)">
              <i class="material-icons cursor-pointer">more_vert</i>
            </span>
            <ul class="absolute bg-white border shadow-lg rounded-lg py-2 z-50" *ngIf="item.showMenu">
              <li  class="flex items-center px-4 py-2 hover:bg-gray-100 cursor-pointer"  (click)="navigateToViewIngredient(item)">
                <i class="pi pi-eye pr-2 text-2xl "  > </i> View
              </li>
              <li class="flex items-center px-4 py-2 hover:bg-gray-100 cursor-pointer"  (click)="navigateToEditIngredient(item)">
                <i class="pi pi-pen-to-square pr-2 text-2xl"></i> Edit 
              </li>
              <li class="flex items-center px-4 py-2 hover:bg-gray-100 cursor-pointer"  (click)="deleteIngredient(item)">
                <i class="pi pi-trash pr-2 text-2xl"  ></i> Delete 
              </li>
            </ul>
          </div>
        </td>
      </tr>
    </ng-template>
    </p-table>

</div>
