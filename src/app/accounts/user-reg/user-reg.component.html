

<div class="xll">
    <div class="user-info-nav">
        <span class="nav-item" (click)="togglePanel1()">
            <h4>Personal Details</h4>
            <!-- <i class="pi" [ngClass]="isOpen1 ? 'pi-chevron-up' : 'pi-chevron-down'" style="font-size: 1em;"></i> -->
        </span>

        <br>

        <span class="nav-item" (click)="togglePanel2()">
            <h4>Contact Information</h4>
            <!-- <i class="pi" [ngClass]="isOpen2 ? 'pi-chevron-up' : 'pi-chevron-down'" style="font-size: 1em;"></i> -->
        </span>

        <br>

        <span class="nav-item" (click)="togglePanel3()">
            <h4>Other Details</h4>
            <!-- <i class="pi" [ngClass]="isOpen3 ? 'pi-chevron-up' : 'pi-chevron-down'" style="font-size: 1em;"></i> -->
        </span>

    </div>

    
    <div class="user-info-container">
        <div class="user-info-form">
            <div class="panel" *ngIf="isOpen1">
                <h1>Personal Details</h1>
                <!-- <span class="d-flex justify-content-between" (click)="togglePanel1()">
                    <h2>Personal Details</h2>
                    <i class="pi" [ngClass]="isOpen1 ? 'pi-chevron-up' : 'pi-chevron-down'" style="font-size: 1em;"></i>
                </span> -->

                <!-- <p-divider></p-divider> -->

                <div class="panel-content" >
                    <div class="input-wrapper">
                        <div class="input-width-1">
                            <label for="first-name">First Name</label><br>
                            <input type="text" id="first-name" name="first-name" required>
                        </div>
                    
                        <div class="input-width-1">
                            <label for="last-name">Last Name</label><br>
                            <input type="text" id="last-name" name="last-name" required>
                        </div>
                    </div>
                    
                    <div class="input-wrapper">
                        <div class="input-width-1">
                            <label for="user-name">Username</label>
                            <input type="text" id="user-name" name="user-name" required>
                        </div>

                        <div class="input-width-1">
                            <label for="gender">Gender</label>
                            <select id="gender" name="gender" required>
                                <option value="" disabled selected>Select your gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="btn-wrapper">
                    <div type="submit"></div>
                    <button (click)="togglePanel2()" type="submit">Next</button>
                </div>
            </div>

            <div class="panel" *ngIf="isOpen2">
                <h1>Contact Information</h1>
                <!-- <span class="d-flex justify-content-between" (click)="togglePanel2()">
                    <h2>Contact Information</h2>
                    <i class="pi" [ngClass]="isOpen2 ? 'pi-chevron-up' : 'pi-chevron-down'" style="font-size: 1em;"></i>
                </span> -->

                <!-- <p-divider></p-divider> -->

                <div class="panel-content" >
                    <div class="input-wrapper">
                        <div class="input-width-1">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="input-width-1">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required>
                        </div>
                    </div>

                    <div class="input-wrapper">
                        <div class="input-width-1">
                            <label for="address">Address</label>
                            <input id="address" name="address" required>
                        </div>
                        <div class="input-width-1">
                            <label for="state">State</label>
                            <input id="state" name="state" required>
                        </div>
                    </div>

                    <div class="input-wrapper">
                        <div class="input-width-1">
                            <label for="country">Country</label>
                            <input id="country" name="country" required>
                        </div>
                        <div class="input-width-1">
                            <label for="postal-code">Postal Code</label>
                            <input id="postal-code" name="postal-code" required>
                        </div>
                    </div>
                </div>

                <div class="btn-wrapper">
                    <button (click)="togglePanel1()" type="submit">Back</button>
                    <button (click)="togglePanel3()" type="submit">Next</button>
                </div>
            </div>

            <div class="panel" *ngIf="isOpen3">
                <h1>Other Details</h1>
                <!-- <span class="d-flex justify-content-between" (click)="togglePanel3()">
                    <h2>Other Details</h2>
                    <i class="pi" [ngClass]="isOpen3 ? 'pi-chevron-up' : 'pi-chevron-down'" style="font-size: 1em;"></i>
                </span> -->

                <!-- <p-divider></p-divider> -->

                <div class="panel-content" >
                    <div class="input-wrapper">
                        <div class="input-width-1">
                            <label for="occupation">Occupation</label>
                            <input type="text" id="occupation" name="occupation" required>
                        </div>
                        <div class="input-width-1">
                            <label for="company">Company</label>
                            <input type="text" id="company" name="company">
                        </div>
                    </div>
                    
                    <label for="bio">Bio</label>
                    <textarea id="bio" name="bio" rows="4"></textarea>
                </div>

                <div class="btn-wrapper">
                    <button (click)="togglePanel2()" type="submit">Back</button>
                    <button type="submit">Save</button>
                </div>
            </div>

            
        </div>
        
    </div>
</div>
