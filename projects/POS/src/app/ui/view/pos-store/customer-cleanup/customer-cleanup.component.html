<div class="p-6 bg-gray-50 min-h-screen">
    <p-toast></p-toast>
    <p-confirmDialog [style]="{width: '50vw'}"></p-confirmDialog>

    <div class="max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Customer Database Cleanup</h1>
                <p class="text-gray-600">Manage and remove duplicate POS customer records.</p>
            </div>
            <div class="flex gap-3">
                <button pButton label="Refresh List" icon="pi pi-refresh" (click)="loadCustomers()"
                    [disabled]="loading || deleting" class="p-button-outlined">
                </button>
                <button pButton label="DELETE ALL CUSTOMERS" icon="pi pi-trash" class="p-button-danger"
                    (click)="confirmDeleteAll()" [loading]="deleting" [disabled]="customers.length === 0 || loading">
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <p-card header="Total Customers" styleClass="text-center shadow-sm">
                <div class="text-4xl font-bold text-blue-600">{{ totalCustomers }}</div>
            </p-card>
            <!-- Add more stats if needed -->
        </div>

        <p-card>
            <app-table [rows]="customers" [loading]="loading" [paginator]="true" [rowsPerPage]="10"
                [rowsPerPageOptions]="[10, 25, 50, 100]" [wrapperClass]="'p-datatable-sm p-datatable-striped'" [colSpanOverride]="6">
                <ng-template appTableHeader>
                    <tr>
                        <th style="width: 80px">ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone Number</th>
                        <th>Loyalty Points</th>
                        <th style="width: 100px">Actions</th>
                    </tr>
                </ng-template>
                <ng-template appTableBody let-customer>
                    <td>{{ customer.id }}</td>
                    <td class="font-medium">{{ customer.name }}</td>
                    <td>{{ customer.email || '-' }}</td>
                    <td>{{ customer.phoneNumber || '-' }}</td>
                    <td>
                        <p-tag [value]="customer.loyaltyPoints"
                            [severity]="customer.loyaltyPoints > 0 ? 'success' : 'info'"></p-tag>
                    </td>
                    <td>
                        <button pButton icon="pi pi-trash"
                            class="p-button-rounded p-button-text p-button-danger p-button-sm"
                            (click)="deleteSingleCustomer(customer)" [disabled]="deleting">
                        </button>
                    </td>
                </ng-template>
                <ng-template appTableEmpty>
                    <tr>
                        <td colspan="6" class="text-center p-4">No customers found. Database is clean! ✨</td>
                    </tr>
                </ng-template>
            </app-table>
        </p-card>
    </div>
</div>
