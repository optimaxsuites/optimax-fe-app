<div class='table-container'>
    <div class="container-header">
        <!-- <button (click)="navigateToForm()" class=" btn create-invoice-btn">Create New Proforma Invoice <i class="fas fa-plus"></i></button> -->
    </div>
    <div class="">
      <p-toolbar styleClass="mb-4 gap-2">
        <ng-template pTemplate="left">
          <app-button text="Delete" class="btn-delete" ></app-button>
        </ng-template>

        <ng-template pTemplate="right">
          <app-button text="Add New" (btnClick)="navigateToForm()" class="btn-navigate" ></app-button>
          <app-button text="Import"  class="btn-export" ></app-button>
        </ng-template>
    </p-toolbar>
      <p-table
        [paginator]="true"
        [(selection)]="selectedItems"
        dataKey="id"
        styleClass="p-datatable-striped"
        [tableStyle]="{'min-height': 'fit-content', 'max-height': '650px'}"
        [rows]="15"
        >
          <ng-template pTemplate="header" class="header">
            <tr class="table-item">
              <th style="width: 4rem"><p-tableHeaderCheckbox /></th>
              <th>Date/Time</th>
              <th>Project Title</th>
              <th>Proforma Invoice No</th>
              <th>Client Name</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-item let-i="rowIndex">
              <tr class="table-item">
                <td>
                  <p-tableCheckbox [value]="item" />
                </td>
                <td >{{ item.dateAndTime }}</td>
                <td >{{ item.projectTitle }}</td>
                <td >{{ item.pInvoiceNo}}</td>
                <td >{{item.clientName}}</td>
                <td > ₦{{ item.amount }}</td>
                <td >{{item.status}}</td>
                <td class="action">
                  <i (click)="viewItem(item.id)" class="pi pi-eye" style="font-size: 1.1em"></i>
                  <i (click)="editItem(item.id)" class="pi pi-pen-to-square" style="font-size: 1.1em"></i>
                  <i (click)="deleteItem(item.id)" class="pi pi-times-circle" style="font-size: 1.1em"></i>
                </td>
              </tr>
          </ng-template>
      </p-table>
    </div>
</div>
