<div class="relative">
  <button 
    class="flex items-center gap-2 px-4 py-2 border rounded-md bg-white shadow-sm hover:bg-gray-50 transition-colors"
    (click)="toggleDropdown()">
    {{ selectedModule }} 
    <span class="transform transition-transform" [class.rotate-180]="dropdownOpen">▼</span>
  </button>

  <ul *ngIf="dropdownOpen" 
      class="absolute mt-2 w-48 bg-white border rounded-md shadow-lg z-50 divide-y divide-gray-100">
    <li *ngFor="let m of modules"
        (click)="selectModule(m)"
        class="px-4 py-3 hover:bg-blue-50 cursor-pointer text-gray-700 transition-colors flex items-center gap-2"
        [class.text-blue-600]="selectedModule === m.name">
      <span class="flex-1">{{ m.name }}</span>
      <span *ngIf="selectedModule === m.name" class="text-blue-600">✓</span>
    </li>
  </ul>
</div>
