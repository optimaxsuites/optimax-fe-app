<div class="card rounded-2xl">
  <app-back-button class="table-item" (click)="goBack()"></app-back-button>

  <form
    [formGroup]="goalForm"
    (ngSubmit)="onSubmit()"
    class="space-y-8 flex mb-5 justify-between items-start px-14 py-12 outline-none"
  >
    <div class="w-[48%]">
      <div class="space-y-4 mb-4 mt-3">
        <label class="text-lg font-semibold">Goal Name*</label>
        <input
          type="text"
          formControlName="goalName"
          placeholder="Enter goal name"
          class="w-full px-4 py-3 border border-gray-300 rounded-md  transition duration-200"
        />
        <div
          *ngIf="
            goalForm.get('goalName')?.touched &&
            goalForm.get('goalName')?.invalid
          "
          class="text-red-500 text-sm"
        >
          Goal name is required
        </div>
      </div>

      <div class="space-y-4 mb-4">
        <label class="text-lg font-semibold">Employee Name*</label>
        <input
          type="text"
          formControlName="employeeName"
          placeholder="Enter employee name"
          class="w-full px-4 py-3 border border-gray-300 rounded-md  transition duration-200"
        />
        <div
          *ngIf="
            goalForm.get('employeeName')?.touched &&
            goalForm.get('employeeName')?.invalid
          "
          class="text-red-500 text-sm"
        >
          Employee name is required
        </div>
      </div>

      <!-- Goal Description Section -->
      <!-- <div class="space-y-4">
          <label class="text-lg font-semibold">Goal Description*</label>
          <textarea
            formControlName="goalDescription"
            placeholder="Describe the goal"
            class="w-full px-4 py-3 border border-gray-300 rounded-md  transition duration-200"
          ></textarea>
          <div
            *ngIf="
              goalForm.get('goalDescription')?.touched &&
              goalForm.get('goalDescription')?.invalid
            "
            class="text-red-500 text-sm"
          >
            Goal description is required
          </div>
        </div> -->

      <!-- Start and End Date -->
      <div class="grid grid-cols-1 mb-4 md:grid-cols-2 gap-6">
        <div>
          <label class="text-lg font-semibold">Evaluators*</label>
          <ng-select
            name="evaluator"
            [items]="evaluator"
            [multiple]="true"
            bindLabel="option"
            bindValue="option"
            formControlName="level"
            placeholder="select evaluator"
          ></ng-select>
        </div>

        <div>
          <label class="text-lg font-semibold">Level*</label>
          <ng-select
            name="level"
            [items]="level"
            bindLabel="option"
            bindValue="option"
            formControlName="level"
            placeholder="select Individual"
          ></ng-select>
        </div>

        <div>
          <label class="text-lg font-semibold">Start Date*</label>
          <input
            type="date"
            formControlName="startDate"
            class="w-full px-4 py-3 border border-gray-300 rounded-md  transition duration-200"
          />
        </div>

        <div>
          <label class="text-lg font-semibold">End Date*</label>
          <input
            type="date"
            formControlName="endDate"
            class="w-full px-4 py-3 border border-gray-300 rounded-md  transition duration-200"
          />
        </div>
      </div>

      <!-- Priority, Assigned To, Target and Actual Metrics -->
      <div class="space-y-4 mb-4">
        <label class="text-lg font-semibold">Priority*</label>
        <select
          formControlName="priority"
          class="w-full px-4 py-3 border border-gray-300 rounded-md  transition duration-200"
        >
          <option value="Low">Critical</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>
      </div>

      <div class="space-y-4 mb-4">
        <label class="text-lg font-semibold">Assigned To*</label>
        <input
          type="text"
          formControlName="assignedTo"
          placeholder="Enter assignee name"
          class="w-full px-4 py-3 border border-gray-300 rounded-md  transition duration-200"
        />
      </div>

      <div class="space-y-4 mb-4">
        <label class="text-lg font-semibold">Progress Status*</label>
        <select
          formControlName="progressStatus"
          class="w-full px-4 py-3 border border-gray-300 rounded-md  transition duration-200"
        >
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Not Archieved">Not Completed</option>
          <option value="On Hold">On Hold</option>
          <option value="Completed">Completed</option>
        </select>
      </div>

      <!-- Action Buttons -->
      <div class="flex justify-end mt-4 space-x-6">
        <button
          type="button"
          (click)="onCancel()"
          class="px-5 py-3 border border-gray-300 rounded-md hover:bg-gray-50 transition duration-200"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="px-5 py-3 bg-green-600 text-white rounded-md hover:bg-green-700 transition duration-200"
        >
          Save
        </button>
      </div>
    </div>

    <div class="w-[48%] flex flex-col gap-3">
      <div class="">
        <label for=""
          >Overview & Description: <span style="color: red">*</span></label
        >
        <p-editor
          formControlName="goalDescription"
          placeholder="Overview & Description..."
        />
      </div>
      <div class="space-y-4">
        <label for="" class="text-lg font-semibold"
          >Metrics: <span style="color: red">*</span></label
        >
        <div class="flex items-center">
          <input
            type="text"
            #metricInput
            (input)="onInputChange($event)"
            class="flex-grow px-4 py-3 border border-gray-300 rounded-md  transition duration-200"
            placeholder="Enter metric"
          />
          <span
            class="text-customGreen cursor-pointer text-lg font-semibold ml-2 bg-green-100 px-3 py-2 rounded-md hover:bg-green-200 transition duration-200"
            (click)="addMetrics(metricInput)"
          >
            + Add Metric
          </span>
        </div>

        <ul class="flex flex-col p-2 space-y-12">
          <li
            *ngFor="let metric of metricsArray"
            class="flex justify-between items-center p-3 border border-gray-200 rounded-md"
          >
            <span class="text-gray-800 text-lg">{{ metric.name }}</span>
            <button
              class="text-red-500 hover:text-red-700 transition duration-200"
              (click)="OnDelete(metric)"
            >
              Delete
            </button>
          </li>
        </ul>
      </div>
    </div>
  </form>
</div>
