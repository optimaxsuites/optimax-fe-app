<div class="top-products">
  <div class="top-products-table-container">
    <table class="top-products-table w3-table w3-striped">
      <thead>
        <tr class="top-products-table-row">
          <th class="top-products-table-head">#</th>
          <th class="top-products-table-head">Product Name</th>
          <th class="top-products-table-head">Total Qty Sold</th>
          <th class="top-products-table-head">Total Revenue</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="isLoading">
          <td colspan="4" style="text-align:center;padding:1rem;">Loading...</td>
        </tr>
        <tr *ngIf="!isLoading && tableData.length === 0">
          <td colspan="4" style="text-align:center;padding:1rem;color:#888;">No sales data yet.</td>
        </tr>
        <tr class="top-products-table-row" *ngFor="let item of tableData; let i = index">
          <td class="top-products-table-data">{{ i + 1 }}</td>
          <td class="top-products-table-data">{{ item.productName }}</td>
          <td class="top-products-table-data">{{ item.totalQuantity | number }}</td>
          <td class="top-products-table-data">₦{{ item.totalRevenue | number: '1.2-2' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
