<div class="summary-section">
  <div class="summary-header">
    <div class="table-input-container">
      <label for="tableNumber">Table No:</label>
      <input 
        type="number" 
        id="tableNumber"
        [(ngModel)]="currentTable" 
        min="1" 
        max="100"
        class="table-input"
        (change)="onTableNumberChange()"
        placeholder="Enter table number">
    </div>
    <h3>Order No: {{ orderNo }}</h3>
  </div>

  <div *ngIf="orderItems.length === 0" class="empty-order">
    <p>No items added yet</p>
    <p>Add items from the menu</p>
  </div>

  <div *ngFor="let item of orderItems; let i = index" class="order-summary-item">
    <div class="item-name">{{ item.name }}</div>
    <div class="qty-controls"> 
      <button (click)="changeQtySingle(item.id, -1)">-</button>
      <span>{{ item.qty }}</span>
      <button (click)="changeQtySingle(item.id, 1)">+</button>
    </div>
    <div class="price">₦{{ item.total | number:'1.0-0' }}</div>
    <button class="delete-btn" (click)="removeItemFromOrder(i)" title="Remove item">
      🗑️
    </button>
  </div>

  <div class="order-note" *ngIf="orderItems.length > 0">
    <label for="note">Add Note:</label>
    <textarea id="note" [(ngModel)]="orderNote" placeholder="Enter special instructions..."></textarea>
  </div>

  <div class="total" *ngIf="orderItems.length > 0">
    <strong>Total</strong>
    <span>₦{{ total | number:'1.0-0' }}</span>
  </div>

  <div class="actions" *ngIf="orderItems.length > 0">
    <button class="send-btn" (click)="sendToKitchenNew()">Send to Kitchen</button>
    <button class="cancel-btn" (click)="goToOverview()">Cancel Order</button>
  </div>

  <div class="actions" *ngIf="orderItems.length === 0">
    <button class="cancel-btn" (click)="goToOverview()">Back to Orders</button>
  </div>
</div>
      </div>
    </div>

  </div>

  <div *ngIf="activePage === 'chef'" class="chef-page">
    <h2>Kitchen Orders</h2>

    <div class="chef-container">
      <div class="order-list">
        <div *ngFor="let o of activeChefOrders" 
             class="order-card" 
             [class.selected]="selectedOrder === o"
             (click)="selectOrder(o)">
          <div class="order-card-header">
            <h3>Table {{ o.table }}</h3>
            <span class="badge" [ngClass]="o.status.toLowerCase()">{{ o.status }}</span>
          </div>
          <p class="order-number">Order {{ o.orderNo }}</p>
          <p class="order-items">{{ formatOrderItems(o) }}</p>
          <p class="order-time" *ngIf="o.createdAt">Created: {{ o.createdAt | date:'short' }}</p>
          <p class="order-note" *ngIf="o.note">Note: {{ o.note }}</p>
          <p class="payment-status" [class.paid]="o.status === 'PAID'" [class.unpaid]="o.status === 'UNPAID'">
            {{ o.status === 'PAID' ? '✅ Paid' : '⏳ Waiting for Payment' }}
          </p>
        </div>

        <div *ngIf="activeChefOrders.length === 0" class="no-orders">
          <p>No active orders in the kitchen</p>
        </div>
      </div>

      <div class="order-details" *ngIf="selectedOrder">
        <div class="order-details-header">
          <h3>Table {{ selectedOrder.table }} - Order {{ selectedOrder.orderNo }}</h3>
          <span class="badge" [ngClass]="selectedOrder.status.toLowerCase()">{{ selectedOrder.status }}</span>
        </div>

        <div class="payment-alert" [class.unpaid]="selectedOrder.status === 'UNPAID'" [class.preparing]="selectedOrder.status === 'PREPARING'" [class.ready]="selectedOrder.status === 'READY'">
          <p *ngIf="selectedOrder.status === 'UNPAID'">
            ⚠️ This order is waiting to be processed. You can start cooking.
          </p>
          <p *ngIf="selectedOrder.status === 'PREPARING'">
            🍳 Order is being prepared. Mark as ready when done.
          </p>
          <p *ngIf="selectedOrder.status === 'READY'">
            ✅ Order is ready! Waiting for cashier to process payment.
          </p>
          <p *ngIf="selectedOrder.status === 'PAID'">
            💰 Order has been paid. Ready for final confirmation.
          </p>
        </div>

        <div class="order-items-list">
          <h4>Order Items:</h4>
          <ul>
            <li *ngFor="let item of selectedOrder.items" class="order-item-detail">
              <span class="item-name">{{ item.name }}</span>
              <span class="item-qty">× {{ item.qty }}</span>
              <span class="item-price">₦{{ item.total | number:'1.0-0' }}</span>
            </li>
          </ul>
        </div>

        <div class="order-info">
          <p><strong>Status:</strong> {{ selectedOrder.status }}</p>
          <p *ngIf="selectedOrder.note"><strong>Note:</strong> {{ selectedOrder.note }}</p>
          <p *ngIf="selectedOrder.createdAt"><strong>Created:</strong> {{ selectedOrder.createdAt | date:'medium' }}</p>
        </div>

        <div class="chef-actions">
          <button class="btn-processing" 
                  (click)="updateOrderByChef(selectedOrder, 'PREPARING')"
                  [disabled]="selectedOrder.status === 'READY' || selectedOrder.status === 'CONFIRMED'">
            🍳 Start Cooking
          </button>
          <button class="btn-ready" 
                  (click)="updateOrderByChef(selectedOrder, 'READY')"
                  [disabled]="selectedOrder.status !== 'PREPARING'">
            ✅ Mark Ready
          </button>
          <button class="btn-completed" 
                  (click)="updateOrderByChef(selectedOrder, 'CONFIRMED')"
                  [disabled]="selectedOrder.status !== 'PAID'">
            🎉 Mark Confirmed
          </button>
          <button class="btn-clear" (click)="selectedOrder = undefined">Close</button>
        </div>
      </div>
    </div>
  </div>

          <p><strong>Customer Note:</strong> {{ selectedOrder.note }}</p>

        <div class="invoice-actions">
          <button class="btn-success" 
                  (click)="updateCashierStatus('PAID')"
                  [disabled]="selectedOrder.status !== 'READY'">
            💳 Mark as Paid
          </button>
          <button class="btn-danger" (click)="updateCashierStatus('CANCELLED')">
            ❌ Cancel Order
          </button>
          <button class="btn-print" (click)="printInvoice()">

          </button>
          <button class="btn-clear" (click)="selectedOrder = undefined">
            Close

      <div *ngIf="!selectedOrder && activeCashierOrders.length > 0" class="select-order-prompt">

  </div>
