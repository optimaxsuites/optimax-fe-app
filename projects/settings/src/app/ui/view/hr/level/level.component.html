
<div class="flex gap-4 items-center">
    <i class="pi pi-receipt text-4xl text-customBlue"></i>
    <div>
        <p class="text-customBlue/60">Human Resources</p>
        <p class="text-customBlue font-semibold text-[17px]">Level configuration</p>
    </div>
</div>
<hr>

<div class="mb-4 mt-3 px-3 flex justify-between items-center ">
  <p class="text-xl font-semibold text-customBlue"><span *ngIf="showAddForm">New</span> Level Structures</p>
  <button class="bg-customBlue text-white font-bold p-3 rounded-xl"  (click)="toogleForm()">{{showAddForm ? "Cancel" : "Create New"}}</button>
</div>

<ng-container *ngIf="!showAddForm && !levelStructure || levelStructure.length === 0; else showLevels">
  <div *ngIf="loading && !showAddForm" class="flex flex-col gap-3 mx-2">
    <div class="p-6 w-full animate-pulse bg-gray-200 rounded-sm"></div>
    <div class="p-6 w-full animate-pulse bg-gray-200 rounded-sm"></div>
    <div class="p-6 w-full animate-pulse bg-gray-200 rounded-sm"></div>

  </div>
  <div *ngIf="!loading && !showAddForm" class="text-center font-bold  text-xl text-customBlue">
    <p>No levels available to display.</p>
  </div>
</ng-container>


<ng-template #showLevels>
  <mat-accordion *ngIf="!showAddForm">
    <mat-expansion-panel *ngFor="let level of levelStructure; let i = index" #panel>
      <mat-expansion-panel-header>
        <mat-panel-title>
          <p class="text-gray-600 font-bold text-[14px] capitalize">{{ level.name }}</p>
        </mat-panel-title>
        <mat-panel-description class="action-buttons">
          <button 
            (click)="editSalary(level, i , $event)" 
            class="text-customGreen hover:bg-green-50 p-3 rounded-xl">
            <i class="fa-solid fa-pen-to-square cursor-pointer text-2xl pr-2"></i>
            <span *ngIf="panel.expanded">Edit</span>
          </button>
          <button 
            (click)="confirmSalaryDelete(level, i , $event)" 
            class="text-red-500 hover:bg-red-50 p-3 rounded-xl">
            <i class="fa-solid fa-trash text-2xl pr-2"></i>
            <span *ngIf="panel.expanded">Delete</span>
          </button>
        </mat-panel-description>
      </mat-expansion-panel-header>
      <div class="text-gray-700 flex flex-col gap-2">
        <p><strong>Code:</strong> {{ level.code }}</p>
      </div>
      <div class="text-gray-700 flex flex-col gap-2">
        <p><strong>Description:</strong> {{ level.description }}</p>
      </div>
    </mat-expansion-panel>
  </mat-accordion>
</ng-template>

  

<div *ngIf="showAddForm">
  <form [formGroup]="levelForm" (ngSubmit)="onSubmit()" class="p-4 w-[80%] mx-auto shadow-md rounded-xl text-customBlue bg-white/70">
  
    <div class="mb-4">
      <label for="level" class="block text-[14px] font-medium capitalize">Level <span class="ml-1 font-bold text-red-600">*</span></label>
      <input formControlName="level" id="level" class="form-input w-full mt-1 p-2 border border-gray-300 rounded-md" type="text" placeholder="Enter Level" />
      <div *ngIf="levelForm.get('level')?.invalid && levelForm.get('level')?.touched" class="text-red-500 text-[14px]">Level is required.</div>
    </div>

    <div class="mb-4">
      <label for="code" class="block text-[14px] font-medium capitalize">Code <span class="ml-1 font-bold text-red-600">*</span></label>
      <input formControlName="code" id="code" class="form-input w-full mt-1 p-2 border border-gray-300 rounded-md" type="text" placeholder="Enter Code" />
      <div *ngIf="levelForm.get('code')?.invalid && levelForm.get('code')?.touched" class="text-red-500 text-[14px]">Code is required.</div>
    </div>
  
    <div class="mb-4">
      <label for="description" class="block text-[14px] font-medium">Description <span class="ml-1 font-bold text-red-600">*</span></label>
      <textarea formControlName="description" id="Description" class="form-input w-full mt-1 p-2 border border-gray-300 rounded-md"  placeholder="Enter Description" ></textarea>
      <div *ngIf="levelForm.get('description')?.invalid && levelForm.get('description')?.touched" class="text-red-500 text-[14px]">Description is required.</div>
    </div>
  
    
  
    <div class="text-right">
      <button type="submit" class="bg-green-500 text-white px-6 py-2 rounded-lg hover:bg-green-700" [disabled]="levelForm.invalid">Add</button>
    </div>
  </form>
</div>
