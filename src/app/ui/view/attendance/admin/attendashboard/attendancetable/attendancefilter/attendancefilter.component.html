<div class="filters-container">
  <div class="filters-row">
    <!-- Search Input -->
    <input
      type="text"
      placeholder="Search employee or ID..."
      [(ngModel)]="searchQuery"
      (ngModelChange)="onSearchChange($event)"
      class="search-input">

    <!-- Department Dropdown -->
    <select [(ngModel)]="filters.department" class="filter-select">
      <option value="">All Departments</option>
      <option *ngFor="let dept of departments" [value]="dept">
        {{ dept }}
      </option>
    </select>

    <!-- Branch Dropdown -->
    <select [(ngModel)]="filters.branch" class="filter-select">
      <option value="">All Branches</option>
      <option *ngFor="let branch of branches" [value]="branch.id">
        🏢 {{ branch.name }}
      </option>
    </select>

    <!-- Status Dropdown -->
    <select [(ngModel)]="filters.status" class="filter-select">
      <option value="">All Status</option>
      <option value="PRESENT">Present</option>
      <option value="ABSENT">Absent</option>
      <option value="LATE">Late</option>
    </select>

    <!-- Correction Request Dropdown -->
    <select [(ngModel)]="filters.correctionStatus" class="filter-select">
      <option value="">All Requests</option>
      <option value="HAS_PENDING">📋 Pending</option>
      <option value="HAS_APPROVED">✅ Approved</option>
      <option value="HAS_REJECTED">❌ Rejected</option>
      <option value="NO_REQUEST">No Request</option>
    </select>

    <!-- Date Dropdown -->
    <div class="date-dropdown">
      <button class="date-toggle" (click)="toggleDatePicker()">
        {{ getDateRangeLabel() }}
      </button>
      <div class="date-picker-popover" *ngIf="showDatePicker">
        <div class="date-input-group">
          <label>From</label>
          <input type="date" [(ngModel)]="filters.dateFrom">
        </div>
        <div class="date-input-group">
          <label>To</label>
          <input type="date" [(ngModel)]="filters.dateTo">
        </div>
      </div>
    </div>

    <!-- Buttons -->
    <div class="filters-buttons">
      <button type="button" class="reset-btn" (click)="resetFilters()" [disabled]="getActiveFilterCount() === 0">Reset</button>
      <button type="button"
              class="apply-btn"
              [class.applying]="isApplying"
              [disabled]="isApplying"
              (click)="applyFilters()">
        <i [class]="isApplying ? 'fa-solid fa-spinner fa-spin' : 'fa-solid fa-sliders'"></i>
        <span *ngIf="getActiveFilterCount() > 0" class="filter-badge">{{ getActiveFilterCount() }}</span>
        Apply
      </button>
    </div>
  </div>
</div>
