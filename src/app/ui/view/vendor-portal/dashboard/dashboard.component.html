  <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-6">

  <div *ngFor="let card of statCards"
       class="relative overflow-hidden rounded-2xl border border-gray-200 bg-gray-50 p-6 transition hover:shadow-lg">

    <!-- Background Chart -->
    <div class="absolute bottom-0 left-0 w-full h-24 opacity-30 pointer-events-none">
      <apx-chart
        [series]="card.series"
        [chart]="sparkChart"
        [stroke]="sparkStroke"
        [tooltip]="sparkTooltip">
      </apx-chart>
    </div>

    <!-- Content -->
    <div class="relative z-10">
      <h2 class="text-3xl font-bold text-gray-800">
        {{ card.value }}
      </h2>

      <p class="text-gray-500 mt-1 text-sm">
        {{ card.label }}
      </p>

      <p class="mt-3 text-sm font-semibold"
         [ngClass]="card.trendColor">
         {{ card.trend }}
      </p>
    </div>

  </div>

</div>
  <div class="flex gap-6">

  <!-- Quotation Trend Chart -->
  <div class="bg-white p-6 rounded-2xl shadow flex flex-col">
    <h3 class="text-lg font-semibold mb-4">Quotation Trend</h3>

    <div class="flex-1">
<apx-chart
  [series]="lineSeries"
  [chart]="lineChart"
  [xaxis]="lineXAxis"
  [stroke]="lineStroke"
  [fill]="fill"
  [grid]="grid"
  [markers]="markers"
  [tooltip]="tooltip"
  [dataLabels]="lineDataLabels">
</apx-chart>
    </div>
  </div>

  <!-- RFQ Status Chart -->
  <div class="bg-white p-6 rounded-2xl shadow flex flex-col">
    <h3 class="text-lg font-semibold mb-4">RFQ Status</h3>

<apx-chart
  [series]="pieSeries"
  [chart]="pieChart"
  [labels]="pieLabels"
  [legend]="pieLegend"
  [plotOptions]="piePlotOptions"
  [stroke]="pieStroke"
  [dataLabels]="pieDataLabels"
  [fill]="pieFill"
  [states]="pieStates">
</apx-chart>

  </div>

</div>




  <!-- Tables -->
  <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">

    <div class="bg-white rounded-2xl shadow">
      <div class="p-5 border-b font-semibold">Recent RFQs</div>
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-gray-500">
          <tr>
            <th class="p-3 text-left">RFQ</th>
            <th class="p-3 text-left">Deadline</th>
            <th class="p-3 text-left">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let rfq of rfqs" class="border-t hover:bg-gray-50">
            <td class="p-3 font-medium">{{rfq.title}}</td>
            <td class="p-3">{{rfq.deadline}}</td>
            <td class="p-3">
              <span class="px-3 py-1 rounded-full text-xs"
                [ngClass]="{
                  'bg-green-100 text-green-600': rfq.status==='OPEN',
                  'bg-gray-200 text-gray-600': rfq.status==='CLOSED',
                  'bg-blue-100 text-blue-600': rfq.status==='AWARDED'
                }">
                {{rfq.status}}
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="bg-white rounded-2xl shadow">
      <div class="p-5 border-b font-semibold">Pending LPO Actions</div>
      <div class="divide-y">
        <div *ngFor="let lpo of lpos" class="p-5 flex justify-between items-center">
          <div>
            <p class="font-semibold">{{lpo.id}}</p>
            <p class="text-gray-500 text-sm">Issued {{lpo.date}}</p>
          </div>
          <div class="space-x-2">
            <button class="px-4 py-1 bg-green-600 text-white rounded-lg">Accept</button>
            <button class="px-4 py-1 bg-red-600 text-white rounded-lg">Reject</button>
          </div>
        </div>
      </div>
    </div>

  </div>

</div>
