  <div class="master-container d-flex" >
  <nav class="bg-customBlueHover/20 py-16 pl-2 pr-14 rounded-r-xl">

    <ul class="flex flex-col gap-[20px]">
      <li *ngFor="let item of menuItems" >
        <div  (click)="toggleSubMenu(item)" class="text-customBlue cursor-pointer hover:text-customBlueHover font-semibold">
          <a 
             [routerLink]="item.route"
             routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: false }"
             [ngClass]="{ 'active-link': isRouteActive(item.route) }"
            >
         {{ item.label }}
          </a>
  
        </div>

      </li>
    </ul>
  </nav>

    <div class="main-container">
        <div class="main">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
