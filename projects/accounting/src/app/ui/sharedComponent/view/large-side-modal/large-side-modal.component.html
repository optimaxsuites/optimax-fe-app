<div class="fixed inset-0 z-50 flex justify-end">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-gray-900/60 backdrop-blur-md" (click)="closeModal()"></div>
  
  <!-- Panel -->
  <div class="relative w-full max-w-2xl bg-white h-full shadow-2xl flex flex-col animate-in slide-in-from-right duration-500">
    
    <!-- Header -->
    <div class="px-8 py-8 border-b border-gray-100 flex items-center justify-between sticky top-0 bg-white z-10">
      <div>
        <h2 class="text-3xl font-black text-gray-900 tracking-tight leading-none">{{ title }}</h2>
        <p *ngIf="subtitle" class="text-sm text-gray-400 font-bold uppercase tracking-widest mt-3 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-customBlue"></span>
          {{ subtitle }}
        </p>
      </div>
      <button (click)="closeModal()" class="p-3 hover:bg-gray-100 rounded-2xl transition-all hover:rotate-90">
        <i class="pi pi-times text-2xl text-gray-400"></i>
      </button>
    </div>

    <!-- Body -->
    <div class="flex-1 overflow-y-auto p-10">
      <ng-content></ng-content>
    </div>

    <!-- Footer Slot -->
    <div class="px-8 py-8 border-t border-gray-100 bg-gray-50/50 sticky bottom-0">
      <ng-content select="[footer]"></ng-content>
    </div>
  </div>
</div>
