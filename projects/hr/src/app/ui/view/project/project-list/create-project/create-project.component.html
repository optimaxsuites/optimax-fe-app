<div class=" mx-auto p-6 mt-2">
    <h2 class="text-2xl font-semibold text-gray-800 mb-6 flex items-center gap-2">
      <i class="pi pi-briefcase text-green-500"></i> Create New Project
    </h2>
  
    <form (ngSubmit)="createProject()" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Project Name</label>
          <input type="text" pInputText [(ngModel)]="newProject.name" name="name" class="w-full" required />
        </div>
  
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
          <p-dropdown
            [options]="['Pending', 'Ongoing', 'Completed']"
            [(ngModel)]="newProject.status"
            name="status"
            class="w-full"
          ></p-dropdown>
        </div>
      </div>
  
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea pInputTextarea [(ngModel)]="newProject.description" name="description" rows="3" class="w-full" required></textarea>
      </div>
  
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
          <input type="date" pInputText [(ngModel)]="newProject.startDate" name="startDate" class="w-full" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">End Date</label>
          <input type="date" pInputText [(ngModel)]="newProject.endDate" name="endDate" class="w-full" />
        </div>
      </div>
  
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Assigned Team Members (comma-separated)</label>
        <input
          type="text"
          pInputText
          [(ngModel)]="assignedMembers"
          name="assignedMembers"
          placeholder="e.g. Rolayo Awe, Temi Awe"
          class="w-full"
        />
      </div>
  
      <!-- Task Management -->
      <div class="border pt-6 px-2 bg-white rounded-2xl">
        <h3 class="text-lg font-semibold mb-3 flex items-center gap-2">
          <i class="pi pi-list-check text-blue-500"></i> Tasks
        </h3>
  
        <div class="flex flex-col md:flex-row gap-2 mb-3">
          <input
            type="text"
            pInputText
            [(ngModel)]="newTask.title"
            name="taskTitle"
            placeholder="Task title"
            class="flex-1"
          />
          <input
            type="text"
            pInputText
            [(ngModel)]="newTask.description"
            name="taskDesc"
            placeholder="Description"
            class="flex-1"
          />
          <div class="flex items-center">
            <p-checkbox [(ngModel)]="newTask.milestone" binary="true" name="milestone"></p-checkbox>
            <!-- <span class="ml-1 text-sm text-gray-600">Milestone</span> -->
          </div>
          <button
            pButton
            type="button"
            icon="pi pi-plus"
            label="Add Task"
            class="p-button-success"
            (click)="addTask()"
          ></button>
        </div>
  
        <!-- Task List -->
        <div *ngIf="newProject.tasks?.length; else noTasks">
          <div
            *ngFor="let task of newProject.tasks"
            class="flex justify-between items-center bg-gray-50 rounded-lg p-2 mb-2 border"
          >
            <div>
              <p class="font-medium text-gray-800">{{ task.title }}</p>
              <p class="text-sm text-gray-500">{{ task.description }}</p>
              <!-- <span
                *ngIf="task.milestone"
                class="inline-block text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded mt-1"
              >
                Milestone
              </span> -->
            </div>
            <button
              pButton
              icon="pi pi-trash"
              class="p-button-text "
              (click)="removeTask(task.id)"
            ></button>
          </div>
        </div>
  
        <ng-template #noTasks>
          <p class="text-sm text-gray-500 italic">No tasks added yet.</p>
        </ng-template>
      </div>
  
      <button
        pButton
        type="submit"
        label="Create Project"
        icon="pi pi-check"
        class="w-full p-button-success mt-4"
      ></button>
    </form>
  </div>
