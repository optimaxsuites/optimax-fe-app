<div class="card p-4">
  <div class="flex justify-content-between align-items-center mb-4">
    <h2>Chart of Accounts</h2>
    <div class="flex gap-2">
      <button pButton icon="pi pi-file" label="Run Report" class="p-button-secondary"></button>
      <button pButton icon="pi pi-plus" label="New" class="p-button-primary"></button>
    </div>
  </div>

  <p-card>
    <div class="mb-3 flex justify-content-between">
      <span class="p-input-icon-left">
        <i class="pi pi-search"></i>
        <input pInputText type="text" (input)="applyFilter($event)" placeholder="Search accounts..." />
      </span>
      <p-paginator [rows]="rows" [totalRecords]="accounts?.length" 
                  (onPageChange)="onPageChange($event)" 
                  [rowsPerPageOptions]="[10, 25, 50]"
                  styleClass="p-paginator-sm"></p-paginator>
    </div>

    <p-table [value]="paginatedAccounts" 
             [(selection)]="selectedAccounts" 
             dataKey="code" 
             [tableStyle]="{'min-width': '50rem'}"
             styleClass="p-datatable-gridlines"
             [paginator]="false">
      <ng-template pTemplate="header">
        <tr class="font-bold uppercase">
          <th style="width: 4rem; border-right: 1px solid #dee2e6"><p-tableHeaderCheckbox /></th>
          <th pSortableColumn="code" style="border-right: 1px solid #dee2e6">
            Code <p-sortIcon field="code"></p-sortIcon>
          </th>
          <th pSortableColumn="name" style="border-right: 1px solid #dee2e6">
            Name <p-sortIcon field="name"></p-sortIcon>
          </th>
          <th pSortableColumn="type" style="border-right: 1px solid #dee2e6">
            Account Type <p-sortIcon field="type"></p-sortIcon>
          </th>
          <th style="border-right: 1px solid #dee2e6">Details</th>
          <th pSortableColumn="balance" style="border-right: 1px solid #dee2e6">
            Balance <p-sortIcon field="balance"></p-sortIcon>
          </th>
          <th pSortableColumn="bankBalance" style="border-right: 1px solid #dee2e6">
            Bank Balance <p-sortIcon field="bankBalance"></p-sortIcon>
          </th>
          <th>Action</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-account>
        <tr [ngClass]="{'bg-gray-50': account.type === 'Header'}">
          <td style="border-right: 1px solid #dee2e6">
            <p-tableCheckbox [value]="account" />
          </td>
          <td style="border-right: 1px solid #dee2e6">{{account.code}}</td>
          <td style="border-right: 1px solid #dee2e6">{{account.name}}</td>
          <td style="border-right: 1px solid #dee2e6">{{account.type}}</td>
          <td style="border-right: 1px solid #dee2e6">{{account.details}}</td>
          <td style="border-right: 1px solid #dee2e6; font-weight: 500">{{account.balance | currency:'NGN':'symbol-narrow'}}</td>
          <td style="border-right: 1px solid #dee2e6; font-weight: 500">{{account.bankBalance | currency:'NGN':'symbol-narrow'}}</td>
          <td>
            <button pButton class="p-button-rounded p-button-text p-button-sm" 
                    style="border: 1px solid #dee2e6">
              View Register
            </button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>

  <div class="actions mt-4">
    <button pButton label="Add Account" icon="pi pi-plus" class="p-button-success mr-2"></button>
    <button pButton label="Delete Selected" icon="pi pi-trash" class="p-button-danger" 
            [disabled]="!selectedAccounts || selectedAccounts.length === 0"></button>
  </div>
</div>
